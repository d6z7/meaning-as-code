# The claims layer — WHICH spans are normative, and nothing else.
#
# WHAT FORCED THIS FILE. The first compile of `protocol/` produced 15 pages that were verbatim,
# checkable, and unreadable to anyone who was not in the conversation. Measured on the connectors
# page: 6 entries, 24 spans, and the sentence that says what a connector IS sat in entry 3 of 6
# under a heading about a brief being overturned. Every span was weighted equally because the only
# structure the compiler had was TIME, and time is not a semantic.
#
# `sdk/project/knowledge.py` had already named the missing piece:
#
#     Judgement about WHICH statements are normative belongs in a separate claims layer, so that
#     extraction and interpretation never blur.
#
# THIS IS THAT LAYER, and it carries no prose of its own by construction. A claim is an ADDRESS and
# a ROLE. It cannot reword the span it points at, so `VERBATIM OR NOTHING` survives the addition of
# structure: `mac_wiki.py` lifts THE SAME BYTES to the top of the page, with the same `q` anchor and
# the same verifiable line range, and both gates check them exactly as they check the body.
#
# WHY IT IS NOT IN THE ENTRIES. `protocol/README.md`: "Entries are never edited, only superseded by
# later ones that say so." Marking a span normative a week later is an edit to the raw record. So
# the mark lives beside the record and points into it, and the record stays append-only.
#
# ROLES — a closed vocabulary of two:
#   rule      this span still governs; it is the thing to read first
#   boundary  this span states a limit that is still open; it is the thing to read second
# A third role for "measurement" was considered and refused: every EVIDENCE section is a
# measurement, so the role would mark nearly everything and therefore mark nothing.
#
# RATIFICATION. `2026-09-12/008` records the estate's law — "Status PROPOSED, not accepted —
# ratification is the operator's act". Every claim below was proposed by an agent and none has been
# ratified, so every one renders on its page as UNRATIFIED and the count is printed in the verdict.
# Set `ratified: true` per claim when the operator signs one off.
#
# COVERAGE IS A DENOMINATOR, not a target. `python3 tools/mac_wiki.py --check` prints
# "N normative span(s) marked over K of M entry(ies)". A page with no claim says so on its face
# rather than passing itself off as compiled knowledge.


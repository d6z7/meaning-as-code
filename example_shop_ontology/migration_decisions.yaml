# migration_decisions.yaml — the judgements behind this bundle's move to the column standard.
# RATIFIED 2026-09-29 by the modeller from the descriptors and the concepts' own definitions; every
# entry says why. `exclude` is a ratified narrowing: the concept does not serve the column. Read by
# tools/mac_migrate_concepts.py --decisions; kept so the migration is reproducible and arguable.
Category.category_id:
  role: key
  identity: canonical
  because: the canonical key
Category.name:
  role: dimension
  because: the category's name; not measured 1:1 with the key, so no label_of
Category.parent_id:
  role: key
  identity: reference
  because: the parent category (a self-reference)
Product.sku:
  role: key
  identity: canonical
  because: the canonical key
Product.name:
  role: dimension
  because: the product's name
Product.category_id:
  role: key
  identity: reference
  because: names a Category
Product.list_price:
  role: measure
  measure:
    type: intensive
    unit: currency (account currency)
  because: 'a per-unit level: meaningful as an average, never a total'
ProductBundle.bundle_code:
  role: key
  identity: canonical
  because: the bundle's code, as the concept declares
ProductBundle.product:
  role: key
  identity: reference
  because: a member product (sku); the row is (bundle_code, product)
ProductBundle.label:
  role: dimension
  because: the bundle's label
ProductBundle.featured:
  role: dimension
  because: a flag a question can filter on
Customer.customer_id:
  role: key
  identity: canonical
  because: the canonical key
Customer.email:
  role: dimension
  because: a contact detail; identifying, but no finding measures it, so no never_axis is claimed
Customer.created_at:
  role: dimension
  because: 'when the record was created: an axis, not THE reporting date of anything'
Order.placed_at:
  role: period
  because: THE reporting date of an order; the lifecycle timestamps are read as state, not as periods
Order.paid_at:
  role: dimension
  because: lifecycle timestamp; order.state.from_timestamps reads it
Order.shipped_at:
  role: dimension
  because: lifecycle timestamp
Order.delivered_at:
  role: dimension
  because: lifecycle timestamp
Order.gross_amount:
  role: measure
  measure:
    type: flow
    unit: currency (account currency)
  because: the order's amount, summable over time
Revenue.order_id:
  role: key
  identity: reference
  because: the measure names an order; Order owns the canonical key
Revenue.customer_id:
  role: key
  identity: reference
  because: names a Customer
Revenue.status:
  role: dimension
  because: the paid_only rule reads the state
Revenue.gross_amount:
  role: measure
  measure:
    type: flow
    unit: currency (account currency)
  because: the amount revenue is computed from
Revenue.placed_at:
  role: period
  because: THE reporting date
Revenue.paid_at:
  role: dimension
  because: revenue.paid_only binds it
Revenue.shipped_at:
  role: dimension
  because: lifecycle timestamp
Revenue.delivered_at:
  role: dimension
  because: lifecycle timestamp
OrderStatus.status:
  role: key
  identity: canonical
  because: the status code IS the enumeration's identity
OrderStatus.order_id:
  role: key
  identity: reference
  because: the order carrying the status
OrderStatus.customer_id:
  exclude: true
  because: the enumeration serves its codes and the order they label, nothing else of the row
OrderStatus.placed_at:
  exclude: true
  because: the enumeration serves its codes and the order they label, nothing else of the row
OrderStatus.paid_at:
  exclude: true
  because: the enumeration serves its codes and the order they label, nothing else of the row
OrderStatus.shipped_at:
  exclude: true
  because: the enumeration serves its codes and the order they label, nothing else of the row
OrderStatus.delivered_at:
  exclude: true
  because: the enumeration serves its codes and the order they label, nothing else of the row
OrderStatus.gross_amount:
  exclude: true
  because: an amount on an enumeration folds nowhere; Revenue owns it
ShippingCarrier.code:
  role: key
  identity: canonical
  because: 'the carrier code is the identity (kind: code)'
ShippingCarrier.label:
  role: dimension
  because: the carrier's label; not measured 1:1, so no label_of is claimed

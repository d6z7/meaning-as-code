# SHOP (example) > order > OrderStatus
# Synthetic example — illustrates the `enumeration` class (closed value set). Not real data.

metadata:
  concept: OrderStatus
  source: SHOP
  version: '1.0'
  schema_version: '0.1.6'
  status: production
  owner: example-team
  confidence: C

concept:
  name: OrderStatus
  label: Order Status
  class: enumeration              # the controlled vocabulary of order lifecycle states
  definition: >
    The set of states an Order can be in. This is the value vocabulary that the Order lifecycle moves
    through (see order.yaml > lifecycle); here it is enumerated as a closed code list with meanings.
  semantics:
    purpose: >
      Gives the lifecycle states stable codes + meanings so reports and filters use one agreed vocabulary
      ("count delivered orders") rather than ad-hoc string matching.

values:
  closure: closed                 # these six are the complete set of states
  closure_why: >
    The shop defines exactly these six states; a seventh would be a process change, not an undocumented
    value. Terminal branches (RETURNED, CANCELLED) included.
  items:
    - { code: PLACED,    label: Placed,    meaning: "Created, not yet paid",                     phase: CHECKOUT,   confidence: C }
    - { code: PAID,      label: Paid,      meaning: "Payment captured",                          phase: CHECKOUT,   confidence: C }
    - { code: SHIPPED,   label: Shipped,   meaning: "Handed to carrier",                         phase: FULFILMENT, confidence: C }
    - { code: DELIVERED, label: Delivered, meaning: "Received by customer (happy-path terminal)", phase: FULFILMENT, confidence: C }
    - { code: RETURNED,  label: Returned,  meaning: "Returned after delivery",                   phase: CLOSED,     confidence: C }
    - { code: CANCELLED, label: Cancelled, meaning: "Cancelled before shipping",                 phase: CLOSED,     confidence: C }

grounding:
  kind: sql_table
  table: orders
  schema: shop_warehouse
  grounds_column: status         # the discriminator column carrying the code (if materialised)

governance:
  last_reviewed: 2026-06-05
  change_log:
    - { date: 2026-06-05, change: "Created as a synthetic example for the framework article.", change_type: CREATION, by: example-team }

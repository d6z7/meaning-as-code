# mac.project.yaml — declares the two-plane layout (see ../reference_manual/data_plane.md).
# Data plane (how the data is made) vs ontology plane (what it means); the ontology may reference
# data/datasets/ (the seam) and nothing else of the data plane.
# The container identity. The console addresses a container as {data_domain}/{dataset} and reads
# both from here; without them `POST /open` refuses the bundle outright. `spec_version` is the
# format contract a host validates on Open.
spec_version: mac.container/1

metadata:
  project: example/shop
  data_domain: example
  dataset: shop
  label: Shop (example)

planes:
  data: data
  ontology: ontology
descriptors: data/datasets      # produced relations the ontology binds to (the seam)
transforms: data/transforms     # the pipelines: source -> dataset (how the data is made)
sources: data/sources           # observed raw-input schema-of-record (what comes in)

# The escape hatch, used honestly rather than to widen coverage. vocabulary.yaml is this example's
# APPLICATION vocabulary: the framework owns the resolver, the field_roles slot and the gate, while
# the application owns its terms. MAC deliberately does not define its shape — so it is declared out
# of scope with the reason, rather than left invisible to the enumeration.
conformance:
  out_of_scope:
    - path: vocabulary.yaml
      reason: >-
        Application-owned vocabulary, not framework mac.*. The v0.1.7 mechanism this example exists
        to demonstrate: MAC owns the slot and the gate; the domain owns its terms. No MAC definition
        applies, and inventing one would make the framework own what it deliberately delegates.

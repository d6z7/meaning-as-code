# PLAN — the strategic goal, decomposed so capacity can be pointed at it without asking.
# Read by .claude/skills/tactics/plan.py. Update when anything lands.

goal: >
  TWO PROGRAMMES, in this order. (1) CONSOLIDATION, nearly landed: meaning-as-code becomes one
  public product repo — the declarations plus the mac-sdk modules it builds — carrying zero instance
  specifics, with data sources reached through connectors so the ontology stays generic.
  (2) TESTING, now in flight and steered by TESTING.md: every claim this estate makes is classified
  by where its expectation comes from, carries its denominator, and routes its red to a named desk.
  The lighthouse is TESTING.md §7; the overview is mac-platform/docs/08-SPEC-testing-surface.md.

items:
  - id: consolidate
    what: SDK into the framework repo; vendored grammar fork deleted
    state: done
    landed: develop @ 066dab6

  - id: cleanse
    what: no instance specifics in MAC; four detector registers externalised
    state: done
    landed: develop @ 066dab6
    evidence: check_mac_public 0 leaks, floor 300 -> 0

  - id: spec
    what: connector plugin architecture, PROPOSED
    state: done
    landed: develop @ 6d07081

  - id: A0

table:
  name: ride_events_raw
  schema: transit_raw
  type: table
  description: >
    One row per boarding event as delivered by the fare system. Line is carried as a free-text
    label, and duration in seconds — both normalised by the rides pipeline.

columns:
  - { name: event_id,       type: string,  role: primary_key }
  - { name: line_label,     type: string,  role: value }
  - { name: boarded_at,     type: string,  role: value }
  - { name: duration_secs,  type: integer, role: value }


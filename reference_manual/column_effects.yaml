# column_effects.yaml — WHAT EACH KEY OF THE COLUMN BLOCK ACTUALLY DOES, machine-readably.
#
# The column standard is documented on column_declaration.md (the shape, and who reads each
# answer) with column_rulings.md on the authored judgements — and each states
# a key's EFFECT in prose: "refuses", "reds", "load refuses", "CLARIFY", "zero, disclosed". Prose is
# exactly where this estate has lost declarations before: `grounding.note` carried ruling language in
# 12 of 21 concepts while the runtime happily planned GROUP BY ZipCode.
#
# So the effect is declared here, on three axes a machine can read:
#
#   plane    WHEN the effect happens — `load` (the declaration is accepted or refused), `check`
#            (a gate reds against measured data), `answer` (a question gets a different outcome).
#   outcomes WHICH mac.outcome_class terms the key can produce. Membership is the framework
#            vocabulary's; this file never restates what a term means.
#   status   whether anything READS it: `enforced` (projected by ColumnSpec into a home the runtime
#            reads), `designed` (in the manual, and a LOAD ERROR if authored — see the ColumnSpec
#            docstring: 19 such flags failed the declared-but-unread gate, so the standard grows one
#            flag at a time, each arriving with its consumer), `measured` (never authored at all).
#
# `reader` carries the evidence for `status`, and "none" is a legitimate value — the whole point is
# that it be countable. A key whose status is `enforced` with reader "none" is a defect this file
# makes visible rather than a claim it makes quietly.
#
# CONSUMED BY tools/gen_column_bench.py, which renders column_bench.html from it. --check gates
# that every key in column_specification.md's "Every key" table appears here and vice versa, and
# that every `outcomes` term is a declared mac.outcome_class member.

metadata:
  of: the column specification
  schema_version: 0.1.19
  companions: [column_declaration.md, column_rulings.md, ../mac_vocabulary.yaml]
  measured_at: '2026-10-07'
  # The enforced set was read off mac-platform's ColumnSpec model fields, not asserted:
  # name, roles{identity,axis,aggregate,period_binding,extremum}, counts, register, rulings.
  # Everything else is extra="forbid".
  enforced_evidence: mac-platform/packages/mac-runtime/src/mac_runtime/ontology/models.py::ColumnSpec

# ===========================================================================
# The two modes the bench renders, and why there are two.
#
# A picture of the designed standard would be a brochure: 23 of its 28 keys refuse to load today.
# A picture of only what is enforced would answer a question nobody asked — the operator asked for
# ALL configuration possibilities and their effects. So both, switchable, and the switch is the
# frontier: the same toggle in TODAY produces a load error where in DESIGNED it changes an answer.
# ===========================================================================
modes:
  today:
    label: As the runtime is today
    blurb: >-
      A designed-but-unread flag is a LOAD ERROR, by design. ColumnSpec forbids unknown keys, so
      authoring one fails the bundle rather than doing nothing — which is the only way a reader can
      tell the difference. What the answer plane then shows is what really happens: usually a clean,
      valid, meaningless success.
  designed:
    label: As the standard is designed
    blurb: >-
      Every key honoured as the reference manual specifies it. This is the target, not the state.
      Each flag reaches it by arriving with its consumer and its test, one at a time.

# ===========================================================================
# THE KEYS. Order follows column_specification.md's eight sections.
# `legal` names a mac.* namespace where one governs the value; it never restates the terms.
# ===========================================================================
keys:

  - key: roles
    block: root
    plane: [load, answer]
    outcomes: [COMMIT, BLOCK]
    status: enforced
    reader: "ontology/models.ColumnRoles; Grounding.offers(column, use) — every planner step asks it"
    effect: >-
      The one required key: a map from each USE a question may make of this column to that use's
      own terms. An empty map is a statement — the column is loaded and offered to no question,
      which is what `role: housekeeping` said. An ABSENT `roles` is a column nobody classified,
      and a different finding.
    frontier_note: >-
      IT REPLACES THE SCALAR `role` AND THE `query_use` TABLE BOTH, retired together 2026-10-07.
      The scalar held one of five values and the table mapped each value to the uses it served, so
      a column could serve only what its one role name served — and measured on contoso5, 21 of
      112 columns are a join key you also group by. The table had to grant or deny `axis` to every
      `key` alike, and did: it denied it, which is how 21 columns lost their axis-ness.

  - key: roles.identity
    block: roles
    plane: [load, answer]
    outcomes: [COMMIT, REFUSE]
    status: enforced
    reader: "Grounding.cell_key + concept.identity.canonical_key — 22 runtime read sites"
    effect: >-
      `canonical` — this column alone identifies an instance, and is what COUNT(DISTINCT) counts.
      `composite` — this column WITH its siblings does, and the set carrying it IS the key, in
      declaration order, which reaches the SQL. `reference` — it identifies a row in ANOTHER
      concept, so it is a join target and never part of this concept's grain.
    frontier_note: >-
      `part` is the retired spelling of `composite`, refused by name since 2026-10-07 so an
      unmigrated bundle is told where the term went rather than that it has a typo.

  - key: roles.axis
    block: roles
    plane: [load, answer]
    outcomes: [COMMIT, REFUSE]
    status: enforced
    reader: "planner/grounded_columns.axis_columns; column_facts.axis — the fold law's lookup key"
    effect: >-
      `time` or `categorical`: a question may GROUP BY or FILTER ON this column, and the term is
      which row of the fold law a fold across it resolves against. The kind IS the permission —
      a column offered as an axis always has a kind, and a column claiming none is never consulted.
    frontier_note: >-
      MEASURED ON ALL 70 of contoso5's axis columns 2026-10-07: every declared kind agrees with the
      column's declared TYPE family (temporal -> time, everything else -> categorical). 39 were
      authored by hand; the other 31 were derived from that type when `role: dimension`/`period`
      stopped carrying the permission implicitly. The agreement is a measurement, not a convention,
      and is the obvious next gate.

  - key: roles.aggregate
    block: roles
    plane: [load, answer]
    outcomes: [COMMIT, REFUSE]
    status: enforced
    reader: "column_facts.measure_type/unit; planner/plan._check_additivity — 3 runtime read sites"
    effect: >-
      A question may FOLD this column, and the qualifier says on what terms — `type` (the fold
      law's row), `unit` (what the number is in; two different units may not be combined) and
      `canonical` (which of several is THE one). A fold the law does not permit is refused, naming
      the axis it crossed.
    frontier_note: >-
      PER COLUMN, NOT PER CONCEPT. `concept.semantics.{measure_type,unit}` said it once for the
      whole concept, which GrossRevenue (`gross_amount` flow, `unit_price` intensive) could only
      misreport — and did: `SUM(unit_price)` planned instead of refusing until the narrowing was
      taught to rewrite the declaration and not just the projection (2026-10-07).

  - key: roles.period_binding
    block: roles
    plane: [load, answer]
    outcomes: [COMMIT]
    status: enforced
    reader: "planner/plan period binding; Grounding.offering('period_binding')"
    effect: >-
      THE reporting date, when a relation carries several. A bare flag — this use has no parameter.
      "Sales in March" cannot silently pick the delivery date instead of the order date.

  - key: roles.extremum
    block: roles
    plane: [answer]
    outcomes: [COMMIT, ASK]
    status: enforced
    reader: "planner/plan._OPERATION_NEEDS -> MIN/MAX; Grounding.offering('extremum')"
    effect: >-
      `[min]`, `[max]` or both: this column's earliest or latest value may be ASKED FOR. Not a
      fold — an extremum PICKS a value that exists rather than combining several, so it answers to
      no additivity cell and is meaningful on a column no law would let anyone SUM. Where several
      columns of a concept admit it and the question names none, the planner ASKS which.

  - key: counts
    block: root
    plane: [answer]
    outcomes: [COMMIT]
    status: enforced
    reader: "the count route; disclosed in the answer"
    effect: >-
      A count of this CONCEPT counts THIS column, not the canonical one — how a concept says "a
      count of me is not a count of my rows". Store has 74 rows, one per trading period, and 67
      stores; `location_code` carries `counts` and the answer discloses which column it counted.

  - key: register
    block: root
    plane: [load, answer]
    outcomes: [COMMIT, ASK]
    status: enforced
    reader: "resolver/registers + resolver/register_match — name -> code resolution; ColumnSpec.value_register"
    effect: >-
      WHERE THIS COLUMN'S VALUES COME FROM — a lookup path. A question naming a member by word
      ("Spain", "Contoso Audio") resolves it against the register to the exact value the column
      holds, through the resolution ladder, instead of probing the warehouse for a match.
    frontier_note: >-
      A TOP-LEVEL KEY, not a ruling, though `rulings.register` is spelled the same word: this one
      says WHERE the values come from, the ruling says WHICH of a thing's names this column is.
      Added to this register 2026-10-07 — it was a live key with a named reader and no entry, so
      the manual's "complete surface" could not be complete.

  - key: roles.aggregate.additivity
    block: roles
    plane: [load, answer]
    outcomes: [COMMIT, REFUSE]
    status: enforced
    reader: "parser._column_measure -> semantics.additivity — 8 runtime read sites"
    effect: >-
      THE PER-AXIS OVERRIDE, and the one thing on a column that a law already answers. Folding is
      decided by `measure_type x axis` in mac_vocabulary.yaml; an entry here states the effect for
      one named axis directly. Authoring it means authoring both the premise and the conclusion,
      which is how a `target` measure once declared `geography: additive` and had its value summed
      across models for weeks.
    frontier_note: >-
      ADMITTED, AND BETTER LEFT UNWRITTEN. It stays because a measured exception to the law has
      nowhere else to live; the law covers every case contoso5 declares, which authors none.

  - key: references
    block: root
    plane: [load]
    outcomes: []
    status: designed
    reader: none
    effect: >-
      Names the concept this column's values point at. Whether every value is PRESENT over there is
      a separate measurement — a declared reference says the relationship is intended, not that it
      holds, and a reference with no parent relation in the delivery is recorded AS dangling.
    frontier_note: >-
      `identity: reference` loads; `references:` next to it does not. ColumnSpec has no such field,
      so the pointer's target cannot yet be declared on the column that carries it.

  - key: domain.closure
    block: domain
    plane: [answer]
    outcomes: [COMMIT, ASK, REFUSE]
    status: designed
    reader: none
    effect: >-
      `closed` says the register states every member, so a word outside it is answerable without
      touching the warehouse. `open` sends an unrecognised word down the resolution ladder. It never
      restates the list — that lives in the register.
    frontier_note: >-
      Unstated means OPEN. Defaulting to closed would refuse real values on the strength of a
      list nobody promised was complete.

  - key: domain.complete_for
    block: domain
    plane: [answer]
    outcomes: [COMMIT, REFUSE]
    status: designed
    reader: none
    effect: >-
      The single bit that separates "complete for this delivery" from "complete for the world".
      `data`: the members are the ones DELIVERED, so 'sales in Japan' answers zero, disclosed.
      `world`: the members ARE the kind, so a third gender is not a member and refuses.
    frontier_note: >-
      Without it, 'sales in Asia' and 'gender Q' get the same answer, and only one of them
      deserves it. Country and Gender have the SAME closure and opposite answers.

  - key: domain.warranty
    block: domain
    plane: [load, check]
    outcomes: []
    status: designed
    reader: none
    effect: >-
      `derived`: a rule makes the members, so a new load CANNOT add one. `monitored`: they were
      observed, so a scheduled check reconciles them. There is no third value — a closed set nobody
      watches is a refusal backed by a stale sample.
    frontier_note: >-
      age_band_5y is `derived` (a CASE expression in the transform); Country is `monitored`
      (observed from the served plane). Same closure, different warranty, different watchdog.

  - key: domain.register
    block: domain
    plane: [load]
    outcomes: []
    status: designed
    reader: none
    effect: The register file whose rows ARE the members. One register per dimension.

  - key: domain.members
    block: domain
    plane: [load]
    outcomes: []
    status: designed
    reader: none
    effect: >-
      The inline form, for a domain small enough that a file would be ceremony — fifteen age bands,
      not five hundred countries.

  - key: resolution.search
    block: resolution
    plane: [answer]
    outcomes: [COMMIT, ASK]
    status: designed
    reader: none
    effect: The columns of the register a typed word is compared to, in order.

  - key: resolution.display
    block: resolution
    plane: [answer]
    outcomes: [COMMIT]
    status: designed
    reader: none
    effect: >-
      A person asked for 'Germany' and must be shown 'Germany', not DE. The answer groups on the
      code and prints the label.

  - key: resolution.strategy
    block: resolution
    plane: [answer]
    outcomes: [COMMIT, ASK]
    status: designed
    reader: none
    effect: >-
      The ladder, in order: exact, then normalized, then prefix, then fuzzy, then ask. Narrowed only
      where a column needs it — dropping `fuzzy` on a code column stops a near-miss being answered
      as a hit.

  - key: resolution.fuzzy_floor
    block: resolution
    plane: [answer]
    outcomes: [ASK, REFUSE]
    status: designed
    reader: none
    effect: >-
      The similarity below which a candidate is not worth showing. Too low and the engine offers
      noise as a suggestion; too high and it refuses a typo it could have caught.

  - key: resolution.on_miss
    block: resolution
    plane: [answer]
    outcomes: [COMMIT, ASK, REFUSE]
    status: designed
    reader: none
    effect: >-
      DERIVED, not set. open -> ask with candidates; closed + data -> zero, disclosed; closed +
      world -> refuse. Authoring it directly is how a closure and its consequence drift apart.

  - key: resolution.candidates
    block: resolution
    plane: [answer]
    outcomes: [ASK]
    status: designed
    reader: none
    effect: >-
      An ASK with no candidates is a dead end; `suppress` is for a column where listing members
      would itself leak something.

  - key: placement.fact_join
    block: placement
    plane: [answer]
    outcomes: [COMMIT]
    status: designed
    reader: none
    effect: >-
      The fact carries this identity itself, so a predicate lands on the fact and the dimension is
      never joined. A plan difference, not an answer difference — until the join it skips is the one
      that fans the grain out.

  - key: rulings.scoped_by
    block: rulings
    plane: [answer, check]
    outcomes: [COMMIT, ASK, REFUSE]
    status: enforced
    reader: "planner/contract_guards.py:361 — synthesises the composite_key_guard binding (code_column + scope_columns)"
    effect: >-
      This column's values are unique only WITHIN the named one, so it may not be grouped or
      filtered alone. 'CO' is Corse, Como and Colorado; GROUP BY State merges three unrelated
      regions into one plausible-looking row.
    frontier_note: >-
      Declared in TWO homes by the manual: column_specification.md's key table puts `scoped_by`
      under `placement`, column_rulings.md documents it as §3 of `rulings`. One key, two spellings,
      which is the shape of every drift this standard exists to end.

  - key: absence.nulls
    block: absence
    plane: [answer]
    outcomes: [COMMIT]
    status: designed
    reader: none
    effect: >-
      Per column, because that is where nulls happen. 'no status event recorded — NOT operating' is
      a different fact from 'not applicable', and an answer that treats them alike is wrong in a
      way no count betrays.

  - key: absence.sentinels
    block: absence
    plane: [answer, check]
    outcomes: [COMMIT, REFUSE]
    status: designed
    reader: none
    effect: >-
      The '--' that is not a country. Declared per column and per source: it appears on the store
      side's CountryCode and not on the customer side's Country, which a flat block could not say.

  - key: rulings.label_of
    block: rulings
    plane: [answer, check]
    outcomes: [COMMIT]
    status: enforced
    reader: "planner/sql.py:1292 — groups on the code, shows the label, and discloses both"
    effect: >-
      Two names for one thing, not two things. The named column stays canonical and this one supplies
      the words. Without it, 'by brand' and 'by manufacturer' return the same cut under different
      labels with nothing relating them — and GROUP BY both yields 11 rows where a reader expects 121.
    frontier_note: >-
      1:1 gets you to the door; only a person can say the two names denote one thing. Contoso and
      Contoso, Ltd are one company in two registers. Fabrikam Group and Contoso are two companies.

  - key: rulings.register
    block: rulings
    plane: [load, answer]
    outcomes: [COMMIT]
    status: enforced
    reader: "planner/sql.py:1304 as `ruling.naming_register` — which of the thing's names was shown"
    effect: >-
      Which naming register the label belongs to, so an answer can say WHICH name it showed —
      'Contoso' the common name, 'Contoso, Ltd' the legal one, 'GB' the code.

  - key: rulings.finer_than
    block: rulings
    plane: [answer, check]
    outcomes: [COMMIT, ASK]
    status: enforced
    reader: "planner/sql.py:1307 — the level used is named in the disclosure"
    effect: >-
      Both columns stay legal axes; the ruling lets an answer DISCLOSE which level it used and lets
      an ambiguous question offer both. pairs == finer_distinct is the whole test — higher, and a
      child has two parents and the roll-up double-counts.
    frontier_note: >-
      Mistaking `scoped_by` for this one is the expensive error: it merges unrelated members and
      nothing in the result betrays it.

  - key: rulings.sort
    block: rulings
    plane: [answer]
    outcomes: [COMMIT]
    status: enforced
    reader: "planner/sql.py column_sort -> the ORDER BY this column contributes"
    effect: >-
      The order this column's values are presented in when the question states none. `asc` is
      alphanumeric and is the reading for a NAME, `desc` largest-first for a MAGNITUDE, `none` means
      never an ordering key. PER COLUMN, never per concept: one breakdown legitimately wants brand
      asc, country_code asc and net_amount desc at once, which no concept-level flag can express.
    frontier_note: >-
      THE ONE RULING WITH NO MEASUREMENT CONSTELLATION, and that is the point rather than a gap: SQL
      guarantees no row order without ORDER BY, so nothing in the data can establish the order a
      reader expects — only a person can say it. Measured 2026-10-02 on an 88-row breakdown: the
      grader compared approved rows against the capture's first 50, WHICH 50 depended on unordered
      output, and the question passed and failed on alternate runs with the data unchanged. A column
      declaring nothing falls to query_grammar.yaml#projection.default_ordering, which reads the
      column's declared type family; `Intent.ordering` outranks both.

  - key: rulings.never_axis
    block: rulings
    plane: [load, answer]
    outcomes: [BLOCK]
    status: enforced
    reader: "planner/grounded_columns._ruled_never_axis -> _axis_denied — a Refusal citing the evidence"
    effect: >-
      A legitimate dimension that must not be an axis, for a reason outside the data. The refusal
      cites the measurement: GROUP BY ZipCode plans, executes, and returns 29 193 rows that each
      describe one person.
    frontier_note: >-
      column_rulings.md marks this key IMPLEMENTED, and a refusal does fire — but on
      `field_roles[col] == "attribute"`, the role spelling `housekeeping` replaced, not on this
      ruling. `rulings.never_axis` has 0 readers in platform src and is a load error if authored.
      The ruling is enforced under a name its own vocabulary no longer defines.

  - key: rulings.evidence
    block: rulings
    plane: [load, check]
    outcomes: []
    status: enforced
    reader: "planner/plan.py:1471 — the refusal quotes the finding this ruling rests on"
    effect: >-
      Required with never_axis, and the reason the key is worth having: a prohibition without a
      measurement is a preference. It is what the refusal quotes back.
    frontier_note: >-
      never_axis without evidence is a LOAD refusal in the designed standard — the one place the
      standard refuses an AUTHOR rather than a question.

  - key: disclose
    block: root
    plane: [answer]
    outcomes: [COMMIT]
    status: designed
    reader: none
    effect: >-
      The ONLY free-text key in the block, and it earns its place because it reaches the reader of
      an ANSWER, which prose in a YAML file never does.
    frontier_note: >-
      There is deliberately no `note`. Measured on contoso: `grounding.note` carried ruling
      language — never, must not, display-only, because — in 12 of 21 concepts. customer.yaml's
      1 044-character note stated a measured privacy ruling in a field nothing reads, while the
      runtime planned GROUP BY ZipCode. A block designed to end that must not ship a slot that
      restarts it.

  - key: discriminates
    block: root
    plane: [answer]
    outcomes: [COMMIT]
    status: designed
    reader: none
    effect: >-
      Marks the column a perspective, status or measure type is read from — the column that says
      WHICH KIND of row this is on a tall relation.

  - key: storage_role
    block: measured
    required: never
    default: null
    legal: mac.dataset.column.role
    decides: the physical shape of the column in its relation
    plane: [check]
    outcomes: []
    status: measured
    reader: "data/datasets/<relation>.yaml — written by the profile and reference planes"
    effect: >-
      The OTHER role every column carries. `column_role` says what a QUERY may do; `storage_role`
      says what SHAPE it is. You never author this one: the profile plane counts distincts and
      nulls, the reference plane measures inclusion against candidate parents.
    frontier_note: >-
      If you are hand-writing a storage_role, something upstream failed.

# ===========================================================================
# THE BENCH — real columns, real measured cardinalities, and the outcome each configuration
# produces for a real question.
#
# NUMBERS ARE NEVER TYPED HERE. `{ZipCode.distinct}` and `{rows}` are substituted by
# gen_column_bench.py from the bundle's own profile plane (data/profiles/<relation>.yaml), so a
# number in the rendered page is a measurement with a timestamp, not a remembered figure. A
# placeholder naming a column the profile does not carry is a generator error, not a blank.
#
# A `measured:` block carries the facts the profile does NOT hold — a pair count, a collision count —
# each with the `source` that recorded it, because a claim like "40 of 563 codes collide" is evidence
# and must say where it came from.
#
# CASE SEMANTICS, which the page implements and does not embellish:
#   * `when` is a map of key -> value; null means unset. A case matches when every entry matches.
#   * first matching case wins, so order the specific before the general.
#   * `mode: designed` limits a case to the designed plane.
#   * IN `today` MODE the page derives the outcome instead of reading a case: setting any key whose
#     status is `designed` is a LOAD ERROR, because ColumnSpec forbids it. Nothing declares that per
#     column — it follows from `keys[].status`, which is the point of keeping status machine-readable.
#
# EVERY `toggles[].key` AND EVERY `when:` KEY IS ONE OF THE 34 KEYS ABOVE, and check_parity's
# `bench <Concept>.<Column>: toggles '<k>', not a declared key` is what holds it there. Re-addressed
# 2026-10-07 when the column declaration changed: `placement.scoped_by` -> `rulings.scoped_by`,
# `role` -> `roles.axis`, `identity` -> `roles.identity`, and `measure.{type,unit}` ->
# `roles.aggregate` — 17 findings, 0 after. A bench naming a key the standard retired is a page
# arguing from a surface nothing admits, which is the drift it was built to expose one floor down.
#
# `offers:` REPLACES THE PER-COLUMN `role:`. A column no longer holds ONE of five role names; it
# holds a SET of the roles it offers, which is what `roles:` is a map of, and `offers` is the
# spelling check_column_planes.py reads a bundle with (`offers=sorted(rl)`). The old names are
# derivable from it and not the other way round: `ColumnSpec.role` is a read-only property whose
# precedence reproduces all 112 of contoso5's authored `role` values exactly (109 of 112 without its
# canonical-column-of-an-axis branch), and `models._ROLE_OFFERS` is the inverse — the only surviving
# copy of the retired `mac.concept.column.role#query_use` table.
#
# NO `identity_kind:` ON A CONCEPT. All three carried one (`fk_name`, `fk_name`, `composite`) and
# nothing rendered it. `mac.concept.identity` is not in mac_vocabulary.yaml any more:
# `mac.concept.column.identity` is "THE ONLY HOME — there is no concept-level identity block", so
# what a concept is keyed on is READ OFF its columns — one `canonical`, or `composite` on every
# column of the tuple — and a second statement of it could only drift. The two-plane census measures
# identity from the bundle instead of reading it here.
# ===========================================================================
bench:
  - concept: Customer
    relation: dim_contoso_customer
    columns:

      - column: ZipCode
        offers: [axis]
        headline: A legitimate dimension that names individuals
        reads: >-
          {ZipCode.distinct} distinct values over {rows} rows. Nothing in that ratio is illegal, and
          nothing in it is safe.
        measured:
          - claim: "29 193 of {ZipCode.distinct} postcodes are held by exactly one customer"
            source: DQ-CUSTOMER-02
        toggles:
          - key: rulings.never_axis
            values: [null, privacy, grain, derived]
          - key: rulings.evidence
            values: [null, DQ-CUSTOMER-02]
        questions:
          - ask: customers by postcode
            cases:
              - when: {rulings.never_axis: null}
                outcome: COMMIT
                plan: GROUP BY c.ZipCode
                result: "{ZipCode.distinct} rows"
                note: >-
                  Plans, executes, returns. 29 193 of those rows describe one person each. The
                  ontology's own measurement forbids this and nothing connected the two.
              - when: {rulings.never_axis: privacy, rulings.evidence: null}
                mode: designed
                outcome: LOAD_ERROR
                note: >-
                  never_axis without evidence is refused at load. A prohibition without a
                  measurement is a preference, and the refusal would have nothing to cite.
              - when: {rulings.evidence: null}
                mode: designed
                outcome: LOAD_ERROR
                note: never_axis without evidence is refused at load, whatever the reason code.
              - when: {rulings.never_axis: privacy}
                mode: designed
                outcome: BLOCK
                reason_code: POLICY_DENIED
                result: >-
                  Customer.ZipCode is declared never_axis: privacy — DQ-CUSTOMER-02 measured that
                  29 193 of {ZipCode.distinct} postcodes are held by exactly one customer, so
                  grouping on it names individuals. Customer can be grouped by: Continent, Country,
                  Gender, State, age_band_5y.
                note: The refusal cites the measurement. That is the whole difference.
              - when: {rulings.never_axis: grain}
                mode: designed
                outcome: BLOCK
                reason_code: POLICY_DENIED
                result: >-
                  Grouping here would report at a grain the relation does not hold — the reason code
                  changes, the refusal is the same shape, and it still cites its evidence.
              - when: {rulings.never_axis: derived}
                mode: designed
                outcome: BLOCK
                reason_code: POLICY_DENIED
                result: >-
                  The column is a derived convenience, not a fact to partition by. Same shape,
                  different reason a reader can act on.
          - ask: customers in 98052
            cases:
              - when: {}
                outcome: COMMIT
                plan: WHERE c.ZipCode = '98052'
                note: >-
                  never_axis forbids the AXIS, not the filter. A postcode is a legitimate thing to
                  ask about; it is grouping BY one that hands out a list of people.

      - column: CountryFull
        offers: [axis]
        headline: Two names for one thing — or two things
        reads: >-
          {CountryFull.distinct} distinct, beside Country's {Country.distinct}. Equal counts get you
          to the door and no further.
        measured:
          - claim: "{Country.distinct} distinct Country, {CountryFull.distinct} distinct CountryFull, and the same number of distinct pairs — 1:1"
            source: column_rulings.md §1, measured over dim_contoso_customer
        toggles:
          - key: rulings.label_of
            values: [null, Country]
          - key: rulings.register
            values: [common, legal, long, short, code]
        questions:
          - ask: customers by country name
            cases:
              - when: {rulings.label_of: null}
                outcome: COMMIT
                plan: GROUP BY c.CountryFull
                result: "{CountryFull.distinct} rows"
                note: >-
                  The same cut as 'by country', under different labels, with nothing saying they are
                  the same cut. Two answers to one question.
              - when: {rulings.label_of: Country}
                mode: designed
                outcome: COMMIT
                plan: GROUP BY c.Country
                result: "{Country.distinct} rows, labelled from CountryFull"
                disclose: grouped by Country, shown as CountryFull
                note: >-
                  Grouped on the canonical column, displayed in the words the question used. The
                  register says WHICH name that is.
          - ask: revenue by country and country name
            cases:
              - when: {rulings.label_of: null}
                outcome: COMMIT
                plan: GROUP BY c.Country, c.CountryFull
                result: "{Country.distinct} rows"
                note: >-
                  A reader expecting a cross product expects {Country.distinct} squared. Getting
                  {Country.distinct} reads as a data bug, and it is not one.
              - when: {rulings.label_of: Country}
                mode: designed
                outcome: COMMIT
                plan: GROUP BY c.Country
                result: "{Country.distinct} rows"
                disclose: one axis — CountryFull names Country rather than crossing it
          - ask: customers in Germany
            cases:
              - when: {rulings.label_of: Country}
                mode: designed
                outcome: COMMIT
                plan: WHERE c.Country = 'DE'
                note: The label resolves to the canonical value; the predicate lands on the code.
              - when: {}
                outcome: COMMIT
                plan: WHERE c.CountryFull = 'Germany'
                note: >-
                  Works — on this column. The same question phrased 'in DE' lands on a different
                  column with nothing relating the two.

      - column: State
        offers: [axis]
        headline: A code that is only unique inside its parent
        reads: >-
          {State.distinct} distinct codes over {rows} rows — bigger than Country, smaller than City.
          Cardinality alone cannot tell this from a hierarchy.
        measured:
          - claim: "40 of {State.distinct} state codes are carried by more than one country; 0 collide within a country"
            source: column_rulings.md §3, measured over dim_contoso_customer
          - claim: "'CO' is Corse (FR, 37), Como (IT, 64) and Colorado (US, 709)"
            source: column_rulings.md §3
        toggles:
          # RE-ADDRESSED 2026-10-07. The manual's key table put this under `placement` while
          # column_rulings.md documented it as §3 of `rulings` — one key, two spellings, which the
          # key entry's own frontier_note calls "the shape of every drift this standard exists to
          # end". `rulings.scoped_by` is the live and only home, and it is ENFORCED:
          # planner/contract_guards.py:361 synthesises the `composite_key_guard` binding
          # (code_column + scope_columns) from it. The cases below stay `mode: designed` because the
          # enforced guard REFUSES (composite_key_guard -> POLICY_DENIED) rather than adding the
          # scope column or asking which parent was meant — the designed behaviour they describe.
          - key: rulings.scoped_by
            values: [null, Country]
        questions:
          - ask: customers by state
            cases:
              - when: {rulings.scoped_by: null}
                outcome: COMMIT
                plan: GROUP BY c.State
                result: "{State.distinct} rows"
                note: >-
                  One row labelled CO totalling 810 customers, merging Corse, Como and Colorado. The
                  query succeeds, the row count is plausible, the number is meaningless.
              - when: {rulings.scoped_by: Country}
                mode: designed
                outcome: COMMIT
                plan: GROUP BY c.Country, c.State
                result: 603 rows
                disclose: Country added — State is scoped by it
          - ask: customers in CO
            cases:
              - when: {rulings.scoped_by: null}
                outcome: COMMIT
                plan: WHERE c.State = 'CO'
                result: 810 customers
                note: French, Italian and American customers in one number nobody asked for.
              - when: {rulings.scoped_by: Country}
                mode: designed
                outcome: ASK
                result: >-
                  'CO' is carried by 3 countries — Corse (FR), Como (IT), Colorado (US). Which did
                  you mean?
                note: The scope is missing, so the engine asks instead of picking one.
          - ask: customers in Colorado
            cases:
              - when: {rulings.scoped_by: Country}
                mode: designed
                outcome: COMMIT
                plan: WHERE c.Country = 'US' AND c.State = 'CO'
                result: 709
                note: The scope is inferred from the label. Asking in words the ladder can resolve needs no clarification.
              - when: {}
                outcome: COMMIT
                plan: WHERE c.StateFull = 'Colorado'
                result: 709
                note: Right answer, different column, and nothing says the two columns are one axis.

      - column: Gender
        offers: [axis]
        headline: A closed set whose members ARE the kind
        reads: "{Gender.distinct} distinct, {Gender.nulls} nulls."
        toggles:
          - key: domain.closure
            values: [open, closed]
          - key: domain.complete_for
            values: [data, world]
          - key: domain.warranty
            values: [null, derived, monitored]
        questions:
          - ask: customers with gender Q
            cases:
              - when: {domain.closure: open}
                outcome: ASK
                result: "No match for 'Q'. Did you mean: female, male?"
                note: >-
                  The default. An unstated domain must not be treated as complete, so the ladder runs
                  and the engine asks rather than refusing a value that might be real.
              - when: {domain.closure: closed, domain.complete_for: world, domain.warranty: null}
                mode: designed
                outcome: LOAD_ERROR
                note: >-
                  A closed domain must say how the closure is kept true. There is no third value: a
                  closed set nobody watches is a refusal backed by a stale sample.
              - when: {domain.closure: closed, domain.complete_for: world}
                mode: designed
                outcome: REFUSE
                result: "'Q' is not a member of Gender. The members are the kind: female, male."
                note: Answered from the register alone — no probe, no warehouse.
              - when: {domain.closure: closed, domain.complete_for: data, domain.warranty: null}
                mode: designed
                outcome: LOAD_ERROR
                note: A closed domain must declare its warranty — derived or monitored.
              - when: {domain.closure: closed, domain.complete_for: data}
                mode: designed
                outcome: COMMIT
                result: "0, disclosed"
                disclose: "'Q' is not among the genders in this delivery — zero rows, not zero customers"
                note: >-
                  The same closure as `world` and the opposite answer. That single bit is the whole
                  reason complete_for exists.
          - ask: customers by gender
            cases:
              - when: {}
                outcome: COMMIT
                plan: GROUP BY c.Gender
                result: "{Gender.distinct} rows"
                note: Legal under every configuration. Closure decides what happens to a word that MISSES, not whether the axis is allowed.

      - column: Country
        offers: [axis]
        headline: A closed set that is complete for the DELIVERY, not the world
        reads: "{Country.distinct} distinct, {Country.nulls} nulls — the eight countries delivered."
        toggles:
          - key: domain.closure
            values: [open, closed]
          - key: domain.complete_for
            values: [data, world]
          - key: resolution.display
            values: [null, label]
          - key: placement.fact_join
            values: [null, Country]
        questions:
          - ask: sales in Japan
            cases:
              - when: {domain.closure: closed, domain.complete_for: world}
                mode: designed
                outcome: REFUSE
                result: "'Japan' is not a member of Country."
                note: >-
                  WRONG, and instructively so. Japan is a country; it is not in this delivery. Declaring
                  `world` here refuses a real word and tells the reader their question was invalid.
              - when: {domain.closure: closed, domain.complete_for: data}
                mode: designed
                outcome: COMMIT
                result: "0, disclosed"
                disclose: Japan is a country; it is not in this delivery. Zero rows, not zero sales.
                note: Right. The eight are the ones delivered, and the answer says so.
              - when: {domain.closure: open}
                outcome: ASK
                result: "No match for 'Japan'. Did you mean: Australia, Canada, France, Germany, Italy?"
                note: >-
                  The default, and it costs a probe plus a clarification for a word the register could
                  have settled without either.
          - ask: sales by country
            cases:
              - when: {resolution.display: label, placement.fact_join: Country}
                mode: designed
                outcome: COMMIT
                plan: GROUP BY f.Country
                result: "{Country.distinct} rows, shown as Germany / France / …"
                disclose: filtered on the fact — no customer join walked
                note: "Both keys at once: the label the reader asked in, and the join the plan did not need."
              - when: {placement.fact_join: Country}
                mode: designed
                outcome: COMMIT
                plan: GROUP BY f.Country
                result: "{Country.distinct} rows, shown as DE / FR / …"
                note: The fact carries the identity, so the dimension is never joined. Same numbers, one less join.
              - when: {resolution.display: label}
                mode: designed
                outcome: COMMIT
                plan: GROUP BY c.Country
                result: "{Country.distinct} rows, shown as Germany / France / …"
                note: A person asked for Germany and is shown Germany, not DE.
              - when: {}
                outcome: COMMIT
                plan: JOIN dim_contoso_customer c USING (CustomerKey) GROUP BY c.Country
                result: "{Country.distinct} rows, shown as DE / FR / …"
                note: Correct, joined, and printed in codes.

      - column: age_band_5y
        offers: [axis]
        headline: A derived column that must announce itself
        reads: "{age_band_5y.distinct} distinct — fifteen bands a transform made."
        toggles:
          - key: domain.warranty
            values: [null, derived, monitored]
          - key: disclose
            values: [null, "banded to 5 years, as of 2025-12-31"]
        questions:
          - ask: customers by age band
            cases:
              - when: {disclose: null}
                outcome: COMMIT
                plan: GROUP BY c.age_band_5y
                result: "{age_band_5y.distinct} rows"
                note: >-
                  A reader sees a band labelled 40 and does not learn it is a five-year bucket fixed
                  at a date. Nothing is wrong and nothing is stated.
              - when: {}
                mode: designed
                outcome: COMMIT
                plan: GROUP BY c.age_band_5y
                result: "{age_band_5y.distinct} rows"
                disclose: banded to 5 years, as of 2025-12-31
                note: >-
                  One line, quoted into every answer that touches the column. The only free-text key
                  in the block, and it earns its place by reaching the reader.
          - ask: can a sixteenth band appear
            cases:
              - when: {domain.warranty: derived}
                mode: designed
                outcome: COMMIT
                result: "No — a CASE expression in the transform makes the members, so a new load cannot add one."
                note: No watchdog needed. The rule that makes the members is the warranty.
              - when: {domain.warranty: monitored}
                mode: designed
                outcome: COMMIT
                result: "Only if a scheduled check says so — the members were observed, so they decay."
                note: Correct for an observed set; wrong here, and it buys a reconciliation nobody needs.
              - when: {}
                outcome: COMMIT
                result: Unanswerable from declarations. The closure is unstated, so nothing promises anything.

      - column: StartDT
        offers: []
        headline: A perfect-looking date axis that means nothing to the business
        reads: >-
          {StartDT.distinct} distinct dates from {StartDT.min} to {StartDT.max}. Shaped exactly like
          a date dimension. It is when the ROW was written.
        toggles:
          # RE-ADDRESSED 2026-10-07 from the retired scalar `role: dimension|housekeeping`. The two
          # states are unchanged and are now stated where the permission lives: a column offered as
          # an axis carries the KIND, and a column offered to no question carries `roles: {}`. The
          # axis term is authored FULLY QUALIFIED — the bare `time` fails schema validation, whose
          # pattern is `^mac\.concept\.axis\.(categorical|time)$`.
          - key: roles.axis
            values: [null, mac.concept.axis.time]
        questions:
          - ask: sales by start date
            cases:
              - when: {roles.axis: null}
                outcome: BLOCK
                reason_code: POLICY_DENIED
                result: >-
                  Customer.StartDT is pipeline bookkeeping, not business vocabulary — an SCD-2
                  validity window. Customer can be grouped by: Continent, Country, Gender, State,
                  age_band_5y.
                note: >-
                  THE ONE GUARDRAIL IN THIS WHOLE BLOCK THAT FIRES TODAY, and it fires two
                  projections away from the declaration. Re-measured 2026-10-07: `roles: {}` makes
                  `ColumnSpec.role` derive `housekeeping` (its last branch — "a column offered to no
                  question is housekeeping"), parser.py:634 projects that word into `field_roles`,
                  and `plan._axis_denied` refuses on `field_roles[column] == "housekeeping"` — never
                  on the absent `axis` role. `housekeeping` occurs 24 times in mac-platform's
                  packages, so the earlier reading here ("it fires on the spelling `attribute`;
                  `housekeeping` occurs 0 times in platform src") is retired with the scalar: BOTH
                  words are branched on, `attribute` as the explicitly retired one.
              - when: {roles.axis: mac.concept.axis.time}
                outcome: COMMIT
                plan: GROUP BY c.StartDT
                result: "{StartDT.distinct} rows"
                note: >-
                  Sales grouped by when a customer record was loaded. Valid SQL, a plausible row
                  count, and a meaningless question answered as though it were a good one.

      - column: CustomerKey
        offers: [identity]
        headline: The column COUNT(DISTINCT) counts
        reads: >-
          {CustomerKey.distinct} distinct over {rows} rows — distinct EQUALS the row count, which is
          what makes it the identity rather than a very selective dimension.
        toggles:
          # RE-ADDRESSED 2026-10-07 from the flat `identity:` key, and `part` is the retired
          # spelling of `composite` — refused BY NAME since that date, with the refusal naming where
          # the term went, so an unmigrated bundle is told it moved rather than that it has a typo
          # (ColumnRoles' identity validator). The three terms are a closed `enum` and are authored
          # BARE, unlike `axis` and `aggregate.type`, which are fully qualified.
          - key: roles.identity
            values: [null, canonical, composite, reference]
        questions:
          - ask: how many customers
            cases:
              - when: {roles.identity: canonical}
                outcome: COMMIT
                plan: SELECT count(DISTINCT c.CustomerKey)
                result: "{CustomerKey.distinct}"
                disclose: counted distinct CustomerKey
                note: >-
                  ENFORCED TODAY. `roles: {identity: canonical}` is projected into the identity the
                  count route already reads — `roles.identity`'s reader above names 22 runtime read
                  sites — so the column states it once, as an authoring surface and not a second
                  home, and no internal duplicate can drift from it.
              - when: {roles.identity: composite}
                outcome: REFUSE
                result: >-
                  CustomerKey is one column of a composite identity and identifies nothing alone.
                  Counting it would return a set where a row was expected.
              - when: {roles.identity: reference}
                outcome: REFUSE
                result: "Customer declares no canonical identity — CustomerKey points at another concept."
                note: >-
                  The row names a row in ANOTHER concept, so it is a join target and never part of
                  this concept's grain. It is not what an unstated identity falls back to — that is
                  the case below, and the two were one answer while the concept-level identity block
                  existed.
              # DELETED 2026-10-07 — `when: {identity: null}` -> `LOAD_ERROR`, "A canonical column
              # whose concept declares no identity kind is refused at load, not guessed. Enforced
              # today." IT DEMONSTRATED THAT THE CONCEPT-LEVEL `identity.kind` WAS REQUIRED, so a
              # column claiming canonical over a concept that named no kind failed the bundle. The
              # case is gone because the premise is: `mac.concept.identity` is no longer in
              # mac_vocabulary.yaml, `mac.concept.column.identity` is "THE ONLY HOME — there is no
              # concept-level identity block", `roles.identity` is required only "iff claimed", and
              # `ColumnSpec.roles` defaults to an empty `ColumnRoles()`. An unstated identity now
              # LOADS, and its consequence moved to the answer plane — which is the case below.
              - when: {roles.identity: null}
                outcome: REFUSE
                result: >-
                  Customer declares no identity at all — no canonical column and no composite tuple —
                  so there is nothing for COUNT(DISTINCT) to count.
                note: >-
                  `roles: {}` is a POSITIVE statement: the column is typed, loaded, and offered to no
                  question. So the refusal is an answer-plane refusal and not a load error, which is
                  the one behaviour on this column that 2026-10-07 changed. An ABSENT `roles:` is the
                  other finding — a column nobody classified — and this bench cannot show it, because
                  a toggle can only set a key, never unsay the map that carries it.

  - concept: Product
    relation: dim_contoso_product
    columns:

      - column: SubCategoryName
        offers: [axis]
        headline: A level, not a collision — and telling them apart is the expensive part
        reads: >-
          {SubCategoryName.distinct} distinct, rolling up into CategoryName's
          {CategoryName.distinct}.
        measured:
          - claim: "{SubCategoryName.distinct} distinct pairs over {SubCategoryName.distinct} subcategories — every subcategory has exactly ONE parent"
            source: column_rulings.md §2, measured over dim_contoso_product
        toggles:
          - key: rulings.finer_than
            values: [null, CategoryName]
        questions:
          - ask: sales by subcategory
            cases:
              - when: {rulings.finer_than: CategoryName}
                mode: designed
                outcome: COMMIT
                plan: GROUP BY p.SubCategoryName
                result: "{SubCategoryName.distinct} rows"
                disclose: "the finer of two levels; rolls up into {CategoryName.distinct} categories"
              - when: {}
                outcome: COMMIT
                plan: GROUP BY p.SubCategoryName
                result: "{SubCategoryName.distinct} rows"
                note: >-
                  Correct, and a reader cannot tell whether these {SubCategoryName.distinct} sum to
                  the {CategoryName.distinct} they would get by category.
          - ask: sales by product line
            cases:
              - when: {rulings.finer_than: CategoryName}
                mode: designed
                outcome: ASK
                result: "Which level — category ({CategoryName.distinct}) or subcategory ({SubCategoryName.distinct})?"
                note: The ruling is what lets the engine know there are two levels to offer.
              - when: {}
                outcome: ASK
                result: "No axis named 'product line'."
                note: An ASK either way — but one of them names the choice and the other names the failure.

      - column: Manufacturer
        offers: [axis]
        headline: The 1:1 that only a person can rule on
        reads: "{Manufacturer.distinct} distinct, beside Brand's {Brand.distinct}."
        measured:
          - claim: "{Brand.distinct} distinct Brand, {Manufacturer.distinct} distinct Manufacturer, {Manufacturer.distinct} distinct pairs"
            source: column_rulings.md §1, measured over dim_contoso_product
        toggles:
          - key: rulings.label_of
            values: [null, Brand]
          - key: rulings.register
            values: [common, legal, long, short, code]
        questions:
          - ask: revenue by manufacturer
            cases:
              - when: {rulings.label_of: Brand, rulings.register: legal}
                mode: designed
                outcome: COMMIT
                plan: SELECT p.Brand AS "Manufacturer", SUM(l.NetPrice) GROUP BY p.Brand
                result: "{Brand.distinct} rows — Contoso, Ltd · Fabrikam, Inc. · …"
                disclose: grouped by Brand, shown as Manufacturer (legal register)
                note: >-
                  A question asked in these words is answered in them, never refused. 'Contoso' is what
                  the world calls it; 'Contoso, Ltd' is what the register calls it.
              - when: {rulings.label_of: Brand}
                mode: designed
                outcome: COMMIT
                plan: GROUP BY p.Brand
                result: "{Brand.distinct} rows"
                disclose: grouped by Brand, shown as Manufacturer (common register)
                note: >-
                  The register is wrong here — these ARE the legal names. Nothing breaks; the answer
                  just claims the wrong thing about which name it showed.
              - when: {}
                outcome: COMMIT
                plan: GROUP BY p.Manufacturer
                result: "{Manufacturer.distinct} rows"
                note: >-
                  Identical numbers to 'by brand', different labels, nothing relating them. And
                  GROUP BY both gives {Brand.distinct} where a reader expects
                  {Brand.distinct} squared.

  - concept: OrderLine
    relation: orderrows
    columns:

      - column: NetPrice
        offers: [aggregate]
        headline: One column, five declarable types, ten universal folds
        reads: "{NetPrice.distinct} distinct values over {rows} rows — a numeric payload, never an axis."
        derives: measure_matrix
        derives_note: >-
          This panel computes nothing of its own. The legal fold per axis comes from
          mac_vocabulary.yaml#concept.column.measure_type, where additivity is stated ONCE over
          mac.concept.axis — five types × two kinds = ten universal cells, each naming a
          mac.concept.aggregation_effect term. An applied ontology references those members; it never
          re-encodes the matrix, and neither does this page.
        toggles:
          # RE-ADDRESSED 2026-10-07 from `measure.type` / `measure.unit`, which were two keys. They
          # are ONE key now: `roles.aggregate` is the role's QUALIFIER MAP — "the qualifier IS the
          # value, so a role cannot be claimed without it" — and `type`/`unit`/`canonical` are its
          # sub-keys, not keys of the column. So the bench can no longer cross them: the five types
          # are five values of one toggle, and the unit's effect (whether the number is reported in
          # something or arrives bare) is shown ONCE rather than against each type, because it is
          # the same disclosure difference in all five rows of the law.
          #
          # PER COLUMN, NOT PER CONCEPT, which is the substance of the move: `concept.semantics.
          # {measure_type,unit}` said it once for the whole concept, which GrossRevenue
          # (`gross_amount` flow, `unit_price` intensive) could only misreport — and did.
          - key: roles.aggregate
            values:
              - {type: mac.concept.column.measure_type.flow, unit: USD}
              - {type: mac.concept.column.measure_type.stock, unit: USD}
              - {type: mac.concept.column.measure_type.intensive, unit: USD}
              - {type: mac.concept.column.measure_type.precomputed, unit: USD}
              - {type: mac.concept.column.measure_type.target, unit: USD}
              - {type: mac.concept.column.measure_type.flow}
          # THE PER-AXIS OVERRIDE, authored as the map the manual declares — `{<axis>:
          # mac.concept.aggregation_effect.<term>}`, both sides fully qualified. The flat
          # `"time: additive"` spelling it replaces stated the premise and the conclusion in one
          # string, which is the shape a `target` measure once used to declare `geography: additive`
          # and have its value summed across models for weeks.
          - key: roles.aggregate.additivity
            values:
              - null
              - {mac.concept.axis.time: mac.concept.aggregation_effect.additive}
              - {mac.concept.axis.time: mac.concept.aggregation_effect.average}
              - {mac.concept.axis.time: mac.concept.aggregation_effect.none}
        questions:
          - ask: total NetPrice for 2024
            axis: time
            fold: SUM
          - ask: NetPrice by category
            axis: categorical
            fold: SUM
          - ask: average NetPrice per line
            axis: categorical
            fold: AVG

# ===========================================================================
# THE PERMISSION LAW — what a query may DO with a column, as a closed grid.
#
# THE OPERATOR'S DECOMPOSITION, 2026-09-27, and the reason this section exists: "where a query may
# use it" was carried as ONE permission, and the vocabulary's own words force it into THREE.
# `mac.concept.column.roles.identity` says: "Filtered on an exact value a register resolved to,
# joined on, and what COUNT(DISTINCT) counts — never matched against a label and never aggregated,
# an identifier that is summed being a number nobody asked for." That is not one permission granted
# or withheld — it is `resolve: no` beside `filter: yes`, in a single sentence.
#
# RE-ADDRESSED 2026-10-07 FROM ROLE NAMES TO ROLES OFFERED, which is the whole substance of the
# column change. The law was 5 ROLE NAMES x 3 operations — key · dimension · measure · period ·
# housekeeping, one row, and a column held exactly one of them. So the grid had to grant or deny
# every operation to every `key` alike, and did: it denied the axis. Measured on contoso5
# 2026-10-07, 21 of its 112 columns are a join key you also group by, 18 of them a reference key
# that is also a legitimate axis — one role name, two different sets of permitted uses, and the
# table had to pick one.
#
# SO THE ROWS ARE THE FIVE ROLES A COLUMN MAY OFFER, and a column holds a SET of them: its
# permissions are the UNION of its rows. That is what makes those 21 expressible —
# `roles: {identity: reference, axis: mac.concept.axis.categorical}` reads two rows, not one — and
# it is why the law is per role OFFERED and not per role NAME.
#
# THREE OPERATIONS ARE NOW GRANTED BY A ROLE'S OWN NAME rather than looked up in a table: a column
# may be GROUPED iff it offers `axis`, FOLDED iff it offers `aggregate`, and asked for an EXTREMUM
# iff it offers `extremum`. That is `Grounding.offers` in full — `{identity: r.identity is not None,
# axis: r.axis is not None, aggregate: r.aggregate is not None, period_binding: bool(...),
# extremum: bool(...)}` and nothing else, with no projection standing between the declaration and
# the gate. Those three cells are the law itself and are marked `yes` as a definition; the content
# of this grid is the OFF-diagonal — what a role does NOT grant, and why.
#
# THE OLD FIVE ROWS MAP ONTO THE NEW FIVE EXACTLY, and the mapping is not a reading of this file:
# it is `ontology/models._ROLE_OFFERS`, "the only surviving copy of the retired
# `mac.concept.column.role#query_use` table (recovered from mac_vocabulary.yaml@b54851e before the
# block was deleted 2026-10-07)" — key -> (identity), dimension -> (axis, extremum),
# measure -> (aggregate, extremum), period -> (axis, extremum, period_binding), housekeeping -> ().
# Every refusal reason the old rows recorded is carried below to the role that inherits it. TWO
# CELLS CHANGED VALUE, both because a permission the old table granted IMPLICITLY is now declared:
#   period.group was `undeclared` — "the vocabulary says nothing, and the planner does allow it".
#     It is declared now, as `axis`: binding the reporting period is not grouping by it, and a
#     period column a question may also slice by carries `axis: mac.concept.axis.time` beside the
#     flag. `roles.axis`'s own entry carries the measurement — 31 of contoso5's 70 axis columns got
#     that term when `role: dimension`/`period` stopped carrying the permission implicitly.
#   extremum was folded into `dimension` and `measure` by _ROLE_OFFERS, so every dimension could be
#     asked for a MIN whether or not anyone said so. It is its own role now, so the `axis` and
#     `aggregate` rows grant it `no` and a column that admits it says `extremum: [min, max]`. A
#     column that admits NONE can now say so, which is what makes the ASK ("which column did you
#     mean?") answerable from declarations.
#
# THE SIXTH ROW IS NOT A ROLE. `roles: {}` is the heir of the `housekeeping` row — a POSITIVE
# statement that the column is typed, loaded, and offered to no question — and it is kept as a row
# because the refusal reasons it records are still the ones a reader needs. A MISSING `roles:` is a
# different thing: a column nobody classified, which is a finding and not a state.
#
# THE FOUR RULINGS REMAIN AN OVERRIDE LAYER on top — 4 rows that do not extend the table but MODIFY
# the row a role already gave. That is structurally the same shape as the fold plane one floor down:
# a base table of cells, and a small set of preemptions that override it and never re-tabulate it
# (mac_runtime/foldplane/law.py G1-G5). A ruling is a guard over the role table. They override
# `resolve`/`filter`/`group` only, which is why their rows are three cells wide: none of the four
# speaks to a fold or an extremum. `rulings.sort` is the fifth ruling and is deliberately absent —
# it decides the ORDER values are presented in, not whether an operation is permitted, so it
# overrides no cell.
#
# THE CELL VOCABULARY IS NOT BINARY, which the decomposition exposed. Six values, closed:
#   yes         permitted outright
#   no          refused
#   redirected  permitted, but it lands on ANOTHER column (group on the target, display here)
#   not_alone   permitted only with a companion column travelling alongside
#   obliged     permitted, and the answer owes a disclosure or the ruling owes evidence
#   undeclared  NOT A VALUE — a hole. Nothing in the vocabulary says, and it is recorded as a
#               finding rather than guessed. `verified_by` may still show what the runtime does.
#
# `verified_by` IS MEASURED, NOT TYPED, AND RE-ADDRESSING THE ROWS IS WHAT MAKES IT DISAGREE —
# which is the point of measuring it. gen_grammar_map.py extracts the tuples the planner actually
# branches on and checks the `group` and `filter` columns against them. Measured 2026-10-07:
#   group    READS THE ROLE, and the cell agrees. `planner/grounded_columns.axis_columns` is
#            `grounding.offering("axis")` minus the columns a `never_axis` ruling denies — the new
#            address, asked of the column.
#   filter   STILL READS THE RETIRED SCALAR. `planner/sql.py:1437` and `:1466` place a predicate
#            only where `anchor_fr[col]` is in `("dimension", "key")` — `field_roles`, which
#            parser.py:634 PROJECTS from the derived `ColumnSpec.role`. The permission holds; its
#            address does not, so a verifier reading this grid over role names finds nothing and
#            reports every `filter` cell as a disagreement until that tuple asks
#            `Grounding.offers(col, "axis")` / `("identity")` instead. The disagreement is the
#            finding, and papering over it by keeping the rows spelled in retired names would hide
#            exactly the drift this file exists to surface.
#   resolve  HAS NO ROLE-READER AT ALL, unchanged: measured 2026-09-27, `resolver/` consults
#            `field_roles` twice and BOTH times for its keys (which columns exist), never for its
#            values. Resolution is gated by REGISTERS, not by role — so that whole column is law
#            stated in prose and read by nothing.
# ===========================================================================
permissions:
  authored_by: operator
  authored_on: '2026-09-27'
  readdressed_on: '2026-10-07'
  operations:
    - id: resolve
      asks: match a user's word to this column
      gated_by: registers, not roles — measured, see the section header
    - id: filter
      asks: constrain an exact value
      gated_by: >-
        the planner's predicate tuple, still spelled in the retired role names —
        sql.py:1437 and :1466, `anchor_fr[col] in ("dimension", "key")`
    - id: group
      asks: be an axis
      gated_by: 'the `axis` role — grounded_columns.axis_columns = grounding.offering("axis")'
    - id: fold
      asks: combine several rows into one number
      gated_by: >-
        the `aggregate` role, and then the fold law for HOW — measure_type x axis ->
        aggregation_effect, stated once in mac_vocabulary.yaml and never restated here
    - id: extremum
      asks: name the earliest or latest value this column holds
      gated_by: 'the `extremum` role — planner/plan._OPERATION_NEEDS -> MIN/MAX'

  values: ['yes', 'no', redirected, not_alone, obliged, undeclared]

  # ONE ROW PER ROLE A COLUMN MAY OFFER, plus the empty map. A column's permissions are the UNION
  # of the rows it offers, which is the one thing the five role NAMES could not express.
  roles:
    identity:
      resolve: {v: 'no', why: "never matched against a label — a name resolves TO it through a register"}
      filter:  {v: 'yes', why: "the query filters or joins on the exact value a register resolved to"}
      group:   {v: 'no', why: "it is what COUNT(DISTINCT) counts, not what you count BY. A column that is ALSO an axis says so in the same map and is grouped on THAT grant — 21 of contoso5's 112 columns, which the single role name could not say"}
      fold:    {v: 'no', why: "an identifier that is summed is a number nobody asked for (mac.concept.column.roles.identity)"}
      extremum: {v: 'no', why: "the retired table granted `key` nothing but identity (models._ROLE_OFFERS); a MIN over a surrogate orders the keyspace, not the world"}
    axis:
      resolve: {v: 'yes', why: "via the ladder — exact, normalized, prefix, fuzzy, then ask"}
      filter:  {v: 'yes', why: "WHERE Gender = 'female' is legitimate"}
      group:   {v: 'yes', why: "GROUP BY Gender is legitimate — this IS the axis, and the term (time | categorical) is also the fold law's lookup key, which is why the role carries a term and not a boolean"}
      fold:    {v: 'no', why: "an axis is what a fold crosses, not what it folds"}
      extremum: {v: 'no', why: "a date axis admits MIN/MAX while remaining non-aggregatable, and it says so in `extremum` — _ROLE_OFFERS granted every dimension one implicitly, so no column could decline it"}
    aggregate:
      resolve: {v: 'no', why: "a numeric payload carries no name to match"}
      filter:  {v: 'no', why: "a threshold on a measure is a HAVING over the aggregate, not a WHERE over the column"}
      group:   {v: 'no', why: "folded as the law allows; never an axis"}
      fold:    {v: 'yes', why: "and HOW is not this grid's to say: measure_type x axis -> aggregation_effect. A `precomputed` or `target` column offers this role and folds on NO axis at all — every cell of its row is `none` — and that is the measure type's ruling, not this one's"}
      extremum: {v: 'no', why: "not a fold, so not reached through this role: an extremum PICKS a value that exists instead of combining several, and is meaningful on a column no law would let anyone SUM"}
    period_binding:
      resolve: {v: undeclared, why: "the vocabulary says nothing about matching a word to the period column, and the role is a bare flag with no parameter to match against"}
      filter:  {v: 'yes', why: "it is what a question's period binds to, through its OWN reader — the planner looks the period column up by this role and binds Intent.period, never through the generic predicate tuple"}
      group:   {v: 'no', why: "WAS `undeclared` — 'the vocabulary says nothing, and the planner does allow it'. Binding the reporting period is not grouping by it; a period column a question may also slice by carries `axis: mac.concept.axis.time` beside this flag, and that is where the permission is now declared"}
      fold:    {v: 'no', why: "a reporting date is not a quantity"}
      extremum: {v: 'no', why: "'when did we first sell in Spain' is the extremum role's own question and is declared as `extremum`, not inferred from the period binding"}
    extremum:
      resolve: {v: 'no', why: "min and max are an operation over the column, not words a question resolves against it"}
      filter:  {v: 'no', why: "the role grants a PICK, not a predicate — a column a question also constrains declares `axis` beside it"}
      group:   {v: 'no', why: "same: the axis is a separate grant, and a column may admit an extremum while being no axis at all"}
      fold:    {v: 'no', why: "NOT A FOLD, and that is why it is a role of its own rather than a corner of `aggregate` — it answers to no additivity cell"}
      extremum: {v: 'yes', why: "`[min]`, `[max]` or both. Where several columns of a concept admit it and the question names none, the planner ASKS which — the ladder names the population back, which only a declared role can enumerate"}
    '{}':
      resolve: {v: 'no', why: "not business vocabulary, so it is not offered to a question"}
      filter:  {v: 'no', why: "not filtered on; its absence from an answer is correct rather than a gap"}
      group:   {v: 'no', why: "grouping sales by a load stamp is meaningless. ENFORCED TODAY, and not through this map: ColumnSpec.role derives `housekeeping` from an empty `roles`, parser.py:634 projects that word into field_roles, and plan._axis_denied refuses on it with POLICY_DENIED"}
      fold:    {v: 'no', why: "offered to nothing is offered to nothing — the empty map is the whole statement"}
      extremum: {v: 'no', why: "same. An ABSENT `roles:` is the other finding: a column nobody classified, which is not this row"}

  # THE OVERRIDE LAYER. Three cells wide, because a ruling modifies what a role already granted and
  # none of these four speaks to a fold or an extremum.
  rulings:
    label_of:
      resolve: {v: 'yes', why: "a question asked in these words is answered in them, never refused"}
      filter:  {v: redirected, target: the named column, why: "the predicate lands on the canonical column"}
      group:   {v: redirected, target: the named column, why: "group on the target, display here"}
    finer_than:
      resolve: {v: 'yes', why: "both levels stay legitimate axes"}
      filter:  {v: 'yes'}
      group:   {v: obliged, owes: disclosure, why: "an answer must DISCLOSE which level it used"}
    scoped_by:
      resolve: {v: not_alone, why: "'CO' is Corse, Como and Colorado — the word does not identify"}
      filter:  {v: not_alone, why: "the scope column must travel with the code"}
      group:   {v: not_alone, why: "GROUP BY State alone merges three unrelated regions into one plausible row"}
    never_axis:
      resolve: {v: 'yes', why: "a postcode is a legitimate thing to ask about"}
      filter:  {v: 'yes', why: "never_axis forbids the AXIS, not the filter"}
      group:   {v: 'no', owes: evidence, why: "grouping on it names individuals — and the refusal must cite the measurement. The one ruling in this layer that overrides a cell TODAY: axis_columns drops a never_axis column and plan._axis_denied refuses it first, before either role spelling is consulted"}

# mac_shapes.yaml — the framework's BUILT-IN constraint shapes (the "shapes" / constraint layer of MAC).
#
# Shapes are constraints expressed as DATA, run by tools/check_shapes.py. These built-ins are the
# universal MAC invariants — true for ANY conformant ontology regardless of domain, so they ship with
# the framework. Applications supply additional, domain- or dialect-specific shapes via
# `--shapes`. Each shape: id · target · [where] · severity · constraint{kind, …}. Constraint kinds:
#   required   — count(path) >= min (default 1)
#   in         — every value at path ∈ a closed set
#   subset_of  — set(left) ⊆ union(right paths)   ← the RELATIONAL kind JSON-Schema can't express
#
# CANONICAL (2026-06-17): rule-binds-grounded is now THE binding-integrity check for every MAC ontology,
# resolving `binds` against the single-homed Physical layer (the grounded table's `tables/<t>.yaml`
# columns) — NOT against columns a concept restates in its own grounding. Applications conform to this one
# definition; dialect-local binding validators (e.g. an application's own check_rule_binds.py + an app-shape variant
# that resolved against declared grounding.sources columns) are deprecated in its favour. A `binds` that
# names a field the grounded table does not actually expose is a real gap — surfaced here, not hidden.
shapes:
  # FIVE, NOT SEVEN — and this file was the layer the 2026-10-05 shrink MISSED. `reference` was
  # renamed `entity` and `meta` dropped in mac.schema.json, mac_vocabulary.yaml and mac-runtime's
  # ConceptClass on the same day; these values stayed at seven. A bundle writing `class: meta` then
  # PASSED this shape and FAILED the loader — the shape said conformant about a file that cannot be
  # read, which is worse than no shape. Keep this list identical to mac_vocabulary.yaml#concept.class.
  - id: concept-class-closed
    description: a concept's class must be one of the closed five-class vocabulary
    target: concept
    severity: error
    constraint:
      kind: in
      path: concept.class
      values: [measure, event, enumeration, grouping, entity]

  # v0.1.16: the footgun-preventer now demands the DERIVATION INPUTS, not the derived answer. A measure
  # says what it IS and what its axes ARE; mac_vocabulary.yaml#concept.column.measure_type says what that implies. The
  # old shape required the concept to write the implication out, which let it author both the premise
  # and the conclusion — and a target-inventory measure duly declared `Target` while writing `geography: additive`,
  # producing a wrong value anchor that stood for weeks. The SUM is still prevented; it is now prevented
  # by a fact that cannot be contradicted because nobody writes it twice.
  # v0.1.19: ON THE COLUMN, where the quantity is. The concept-level slot said what KIND of
  # quantity the concept is; the column that carries the number says it per column, and a concept
  # may carry several that fold by different laws — `GrossRevenue` grounds `gross_amount` (flow)
  # and `unit_price` (intensive), which one slot could only misreport. The shape is unchanged in
  # what it prevents: a measure whose fold law cannot be looked up.
  - id: measure-declares-type
    description: a measure concept must declare a column measure_type — additivity derives from it
    target: concept
    where: { concept.class: measure }
    severity: error
    constraint:
      kind: required
      path: grounding.sources[].columns{}.roles.aggregate.type

  # v0.1.18: the UNIT is what makes an operation decidable. Two measures may be compared or
  # subtracted only if their units are equal; a ratio is always defined and yields unit_a/unit_b.
  # Without it, legality has to be declared per PAIR — which is how <dataset> ended up with hand-written
  # "never confuse X with Y" clauses, four of the seven naming a foil with no basis at all.
  # MEASURED at introduction: 9 of 19 measures across three bundles declared a unit; 10 did not.
  - id: measure-declares-unit
    description: a measure concept must declare a column unit — operations are decided by it
    target: concept
    where: { concept.class: measure }
    severity: error
    constraint:
      kind: required
      path: grounding.sources[].columns{}.roles.aggregate.unit

  # THE AXIS IS PER COLUMN, AND ALWAYS WAS. `concept.semantics.axis_kinds` was a map keyed by
  # COLUMN name sitting on the concept, and the fold law looked it up by a lowercased CONCEPT name:
  # 47 entries across 37 concepts, not one of which could ever match (measured 2026-10-02). The
  # requirement is the same — a measure must name at least one axis its law can resolve over — and
  # it is now asked of the column that IS the axis.
  - id: measure-declares-axis-kinds
    description: a measure concept must declare at least one column axis — the law resolves per (measure_type x axis)
    target: concept
    where: { concept.class: measure }
    severity: error
    constraint:
      kind: required
      path: grounding.sources[].columns{}.roles.axis

  # CANONICAL IDENTITY — the shape `concept-declares-identity` was RETIRED 2026-10-05 with the slot it
  # policed. It required `concept.identity.kind`; identity is now read off the columns alone
  # (`identity: canonical` / `part`, and `counts` for what one instance is), so there is no
  # concept-level field left to require. What replaces it is not another shape here: the parser
  # already refuses a primary source whose columns declare no identity at all
  # (`_check_identity_is_declared`), which is the same invariant enforced where the fact lives.

  # NOTE: the NO-PROBE MANDATE shape (concept-declares-no-probe) is a SERVING-domain contract, not a
  # universal ontology invariant, so it does NOT live here (keeping this file true for ANY conformant
  # ontology — the shop/tpch examples + self-tests stay green). It is seeded per serving-source as
  # `<source>/ontology/shapes.yaml`, loaded by check_all.sh's `--shapes` step. See
  # docs/HARVEST_RIGHT_FIRST_TIME.md gap #4 + the harvest scaffold.
  # RETIRED 2026-10-07, operator ruling. `enumeration-declares-closure` required `values.closure` —
  # whether a value set is CLOSED (this is all of them) or OPEN (the warehouse may hold one we have not
  # listed). It is retired because the fact has no home, no reader, and its question is already answered
  # better elsewhere:
  #
  #   NO HOME.    The members moved to a register when inline `values.items` was banned, and a register
  #               declares `name, csv, members, grain` — not closure. The old home went with the values
  #               block; the new one never carried it.
  #   NO READER.  Its one consumer in the runtime is `contract_guards.anomaly_checks`, which feeds
  #               `mac.canon.closure_anomaly_check` — retired the same day — and which has ZERO callers.
  #               The only other mention hardcodes `closure="closed"` instead of reading a declaration.
  #   ANSWERED.   "Is there a value out there that is not in our set?" is what
  #               `tools/check_register_membership.py` asks, against the WAREHOUSE, per register:
  #               MISSING / NEW / NULLS / ORPHANED. It ran clean over contoso5's 17 registers on
  #               2026-10-04. Comparing the register to the data is strictly stronger than comparing a
  #               copy of the members inside the concept, which is all closure+items could ever support.
  #
  # So this was a leftover of the inline-values world: a declaration nothing reads, enabling a check a
  # better check replaced. It held 5 of contoso5's concepts in violation for obeying the ruling that
  # removed its subject.

  # FIELD-ANCHORING (v0.1.6, FRAMEWORK §6d): a typed rule's `binds` must name a column of the table the
  # concept grounds to — a RELATIONAL, CROSS-FILE invariant the schema cannot express (columns are
  # single-homed in the Physical layer). A rule cannot claim to govern a field the concept doesn't ground.
  - id: rule-binds-grounded
    description: every contract.rules[].binds must be a column of the grounded table
    target: concept
    severity: error
    constraint:
      kind: rule_binds_grounded

  - id: field-roles-grounded
    description: every grounding.field_roles column (the whitelist) must be a column of the grounded table
    target: concept
    severity: error
    constraint:
      kind: field_roles_grounded

  # JOIN-GROUNDING (A1): every edges[].join_rule "relA.col = relB.col" must resolve BOTH columns against
  # their endpoint relation's grounded columns (the Physical-layer descriptor). A join that names a
  # column the relation does not expose is a broken relation — a RELATIONAL, CROSS-FILE invariant the
  # schema cannot express. Targets the edges file (not concept files).
  - id: join-rule-grounded
    description: every edges[].join_rule column must be a grounded column of its endpoint relation
    target: edges
    severity: error
    constraint:
      kind: join_rule_grounded

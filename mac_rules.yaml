# mac_rules.yaml — the framework's COMMON RULES: behavioural contracts MAC states ONCE.
#
# WHY THIS FILE EXISTS
# --------------------
# MAC ships two kinds of universal statement and had no home for a third:
#
#   mac.schema.json   STRUCTURE   what an artifact must look like
#   mac_shapes.yaml   CONSTRAINT  invariants true of any conformant ontology
#   mac_rules.yaml    BEHAVIOUR   how to ACT, true of any conformant ontology     <- this file
#
# MEASURED, and it is why this exists. <domain>/<dataset> carried the SAME refusal law thirteen times, once per
# measure concept — 13 distinct `when` wordings, 13 `then`, 12 `never`. Every copy individually
# well-formed, so no gate ever saw anything; one (`market`) ended up with a BARE `then` promising an
# evidence-boundary answer it could not produce; and THREE of the thirteen carried no information at
# all beyond the concept's own name.
#
# "A measure with no row for the resolved scope must REFUSE" is not a fact about Gross Stock. It is a
# fact about MEASURES. Restating it per concept is the N-homes defect this framework argues against,
# applied to behaviour instead of to data.
#
# A COMMON RULE IS AN ORDINARY RULE
# ---------------------------------
# Same shape as `contract.rules[]` — id · kind · subject · when · then · never · realized_by. It is
# not a new construct and must not become one: an earlier draft of this file invented `applies_to`,
# `params_from_concept` and `bundle_may_supply` and carried NO when/then/never at all, which is the
# invent-beside-rather-than-reuse habit the framework exists to catch.
#
# ONE addition, and only one: `scope`, naming which concepts the rule reaches. A concept-level rule
# already has `scope`; here it carries a class selector instead of a source name. Nothing else differs.
#
# HOW A BUNDLE USES THIS
# ----------------------
# It does not write the rule. A concept matching `scope` gets the behaviour. What a concept MAY still
# write is a `realized_by` for the SAME canon carrying parameters MAC cannot know — chiefly
# `confusable`, because only the author knows which measure a tired reader would substitute, and an
# empty Gross Stock answered with Ideal Stock is worse than no answer. Those parameters are the
# bundle's contribution; the law is MAC's.
#
# A concept needing to say something DIFFERENT still writes its own full rule. That is an OVERRIDE and
# it is meant to be visible precisely because it is rare.
#
# THE TEST: deleting every `exclusion.no_evidence` rule from every concept in a bundle must not change
# what that bundle refuses. If it does, the common rule is under-specified — or the concept was
# carrying an exception it never declared as one.
metadata:
  spec_version: mac.rules/1
  description: Behavioural contracts that hold for any conformant ontology.

rules:
  - id: mac.aggregate.unit_algebra
    subject: "What may be combined is decided by the UNIT — never declared per pair"
    kind: mac.rule_kind.aggregation
    scope: { concept.class: measure }
    confidence: C
    when:  "two measures are combined — compared, differenced, summed together, or divided"
    then:  "decide from the UNITS. COMPARE and DIFFERENCE require unit(a) == unit(b). SUM of two
            measures requires the same unit AND the same additivity on the folding axis. A RATIO is
            always defined and yields unit(a)/unit(b) — dimensionless when they are equal, which is
            what makes a share meaningful"
    never: "declaring per-pair which measures may be combined, or which are confusable with which — a
            pairwise list grows as the square of the measures and drifts at every edge"
    why: >
      MEASURED on <dataset>, which had no unit algebra and hand-wrote the pairs instead. Seven rules
      carried "never confuse X with Y"; FOUR of them named deliveries as the foil, and the units say
      why that is nonsense — the delivery measure is `vehicles`, Order Intake is `orders`. The three pairs a domain
      owner confirmed as real confusions are exactly the three with equal units (GrossStock/IdealStock
      and IstProd/Prodant both `vehicles`, OrderBook/OrderIntake both `orders`).

      It also validates the derived measures gold already ships: market_share is vehicles/vehicles ->
      dimensionless, bev_share_of_oi is orders/orders -> dimensionless. Both legal, and neither needed
      a declaration to say so.

      A pairwise list needs O(n^2) statements and a human to maintain them. A unit needs one per
      measure and decides every pair.

  - id: mac.resolve.period_reading
    subject: "How a bare period is read — determined by the measure's type, never restated per concept"
    kind: mac.rule_kind.resolution
    scope: { concept.class: measure }
    confidence: C
    when:  "a measure is asked for a bare period (a year, a quarter, a range) with no leaf grain named"
    then:  "read it as the measure's TIME additivity dictates: `additive` -> the period is the SUM of
            its leaf cells over [start, next); `none` -> the period is the single stored cell at its
            END; `average` -> the mean over the window. The measure_type determines this; nothing about
            the period does"
    never: "end-pinning an `additive` measure to its last cell (a Flow read as a level under-reports a
            year by roughly the number of periods in it); SUMming a `none` measure over its cells
            (double-counts everything still standing in each one)"
    why: >
      MEASURED on <dataset>: fifteen rules across four shapes — resolve.period_sum (5),
      aggregate.by_registered_type (8), resolve.stock_period (2), resolve.target_period (1) — each
      spelled out what its own `measure_type` already determines. Every clause after the dash was the
      declaration read back: "SUM the months — <measure> is a Flow, additive over time".

      The vocabulary invited this. `none` said which row to read "is a RESOLUTION question the concept
      answers in its resolve.* rules" — deferring a question that, on the TIME axis, has exactly one
      answer for every measure of a given type. A level read at a point in time IS the period end;
      that is not per-concept knowledge. The deferral belongs only where the answer genuinely varies
      per concept — a non-time axis, such as a reach measure resolving to a matching abstraction level.

  # ── the one that governs the other two, and everything else ──────────────────────────────────────
  # ── the key law: an identifier is for matching, a label is for reading ───────────────────────────
  - id: mac.resolve.join_on_declared_key
    subject: "Join and filter on the DECLARED key — a label column is for display, never for matching"
    kind: mac.rule_kind.resolution
    scope: { concept.class: "*" }
    confidence: C
    when:  "a relation carries an entity as BOTH an identifier column and a human-readable label or
            description column, and a question names that entity"
    then:  "join and filter through the column that `grounding.sources[].key` declares; read the label
            column for display only"
    never: "matching on a label or description string as a join or filter key while the declared key
            column is available — a label is not a stable identifier: it is renamed, translated, cased
            and padded without the key ever changing"
    why: >
      MEASURED on <domain>/<dataset>, 2026-08-19: five dimension concepts — body_type, brand_indicator,
      fuel_type, registration_type, vehicle_segment — each carried a `resolve.by_id` rule saying "join
      through <source>_lm_<x>_id (the surrogate key); use <source>_lm_<x> as the display label", while
      `grounding.sources[].key` on that SAME concept already read `[<source>_lm_<x>_id]`. Each rule restated
      its own file's key declaration and added one fact that is true of every relation in every
      ontology ever written. Five copies of a universal, sitting beside the declaration it repeats.

      This is the N-homes defect in its purest form, and it is worth stating why it survived review:
      each copy was individually correct and individually useful-looking, so no reader of any ONE file
      would object. Only the census across files makes it visible. That is precisely the class of
      defect a common rule removes — not by being cleverer, but by giving the fact one address.

      THE BOUNDARY, so this rule is not over-read: it governs the CHOICE between an identifier column
      and a label column on a relation that carries both. It says nothing about WHICH lookup resolves a
      name to a code, through which view, or under which filter — that is genuine per-concept routing
      and stays in the concept. <dataset>'s `resolve.by_code_not_label` rules survive this rule untouched,
      because they carry a lookup PATH (`geo_class=single_country`, `market_code ==
      <source>_brand_country_code`, `name_norm` as the standardised search key) that no declaration holds.

  # ── the mirror of never_guess: a value you HAVE is not an absence ────────────────────────────────
  - id: mac.guarantee.catalogued_member_is_real
    subject: "A catalogued member is a real value — never drop it as missing, whatever it is called"
    kind: mac.rule_kind.guarantee
    scope: { concept.class: reference }
    confidence: C
    when:  "a value set carries a member whose label reads like an absence — Unspezifiziert, Unknown,
            N/A, Other, Not specified — and a question counts, sums, lists or breaks down that set"
    then:  "include it like any other member; it is a catalogued value with rows behind it, and the
            answer is the population it actually has. Exclude it ONLY when the question explicitly asks
            to leave unclassified rows out, and say so under assumptions when you do"
    never: "silently dropping such a member from a count, a sum or a breakdown; treating a catalogued
            member as missing data, a null, or a placeholder to be cleaned away"
    why: >
      The mirror image of never_guess. That rule bans inventing a value the data does not have; this one
      bans discarding a value the data DOES have because its label sounds like an absence. Both failures
      produce a number nobody can reproduce, and the second is the quieter of the two — a total that is
      simply smaller than the truth, with nothing in the output to say members were removed.

      MEASURED on <domain>/<dataset>, 2026-08-19: four reference concepts — body_type, fuel_type,
      registration_type, vehicle_segment — carried BYTE-IDENTICAL `guarantee.unspecified_is_real` rules.
      Identical `then`, identical `never`, differing only in which concept they sat on. In all four,
      `Unspezifiziert` is a catalogued entry in that concept's own `values.items`, so the rule was
      restating what the value set already says: a member of the list is a member of the list.

      IT IS NOT DERIVABLE FROM THE DECLARATION ALONE, which is why it is a law here rather than a
      deletion there. `values.items` says the member EXISTS. It does not say what to do when a reader
      meets a member called "Unspezifiziert" and decides it means "no data". That decision is behaviour,
      it is the same decision in every ontology, and this is where behaviour that holds everywhere lives.

  # ── how a rule NAMES the model it governs ────────────────────────────────────────────────────────
  - id: mac.authoring.reference_markup
    subject: "A model identifier in a rule's prose is a REFERENCE — write it `{name}`, never bare"
    kind: mac.rule_kind.resolution
    scope: { concept.class: "*" }
    confidence: C
    when:  "a rule's when/then/never/subject names a column, a relation, or a concept of the model"
    then:  "write it backtick-quoted and brace-enclosed — `{market_code}`, `{<dataset>.dim_country_register}`
            — so a reader can tell a reference from an English word, and every such token must resolve:
            a column of the concept's own grounding, or a relation some concept in the bundle grounds"
    never: "naming a model identifier as bare prose, or marking up a token that resolves to nothing"
    why: >
      OPERATOR RULING 2026-08-19. Bare `market_code` is indistinguishable from English, so nothing can
      resolve it, rename it, or hold it against the rule's own `binds:`.

      MEASURED, both failures live on <domain>/<dataset> the day this shipped: 9 of 29 rules named a grounded
      column in prose that `binds:` did not list; and an invented relation planted in rule prose
      (<dataset>.dim_country_TOTAL_FICTION) passed ALL ELEVEN compile phases clean. The grounding block was
      validated; the sentence beside it was not read by anything.

      THE OBJECTION, AND THE ANSWER, recorded because the objection was mine and it was overruled:
      `binds:` already lists a rule's columns, so marking them up puts one fact in two places. The
      answer is that the interceptor checks BOTH directions — a marked reference must resolve, and a
      grounded column named in prose must appear in `binds:`. Two homes that are FORCED to agree are
      not the defect two homes that MAY disagree are. Markup without the check would have been the
      defect; markup with it is a second, cheaper reader of the same fact.

      WHY BACKTICK AND BRACE, not one or the other: backticks alone already mean emphasis throughout
      the corpus ("`role` is a discriminator column"), so they cannot signal a reference; braces alone
      collide with the `{{ rules.<name>.template }}` injection MAC has carried since check_references.py
      grew RULE_INJECT_RE.

      A DECLARED STRETCH, surfaced rather than papered over: `mac.rule_kind` is a CLOSED six-term
      vocabulary and every term describes answering behaviour — resolution, aggregation, default,
      ambiguity, exclusion, guarantee. This rule governs AUTHORING. `resolution` is the closest legal
      term and is used here on the reading that a marker is what makes an identifier resolvable at all;
      a seventh term (`authoring`) may be the honest long-term home. That is a vocabulary change and
      belongs to the operator, so it is named here and not taken.

  # ── where a period's boundary comes from, as opposed to how it folds ─────────────────────────────
  - id: mac.resolve.relative_period_anchor
    subject: "\"Latest\", \"last month\", \"YTD\" anchor to the DATA, never to the clock"
    kind: mac.rule_kind.resolution
    scope: { concept.class: measure }
    confidence: C
    when:  "a question names a period RELATIVE to now — latest, current, last month, last quarter,
            year-to-date, the last N months — rather than an absolute date"
    then:  "resolve the anchor from the measure's OWN data: the maximum of its date column, in the
            relation it grounds, evaluated per measure. `latest` is that maximum; `year-to-date` runs
            from the year start to it; `last complete quarter` is the last quarter that ends at or
            before it"
    never: "taking the anchor from the wall clock, or from a single maximum shared across relations —
            a reader's today is not the warehouse's latest, and relations LAG each other"
    why: >
      Its twin `mac.resolve.period_reading` says how a period FOLDS once its bounds are known. Nothing
      said where the bounds come from, so the most common reading of all — "how are we doing lately" —
      was left to whatever the reader assumed the date was.

      TWO FAILURES, and they are different. THE CLOCK: a model answering "latest" from its own sense of
      today returns an empty result whenever the warehouse is ahead of it or behind it, and an empty
      result reads as "no data" rather than "you pinned a month that does not exist here". Neither
      party is wrong about the date; they are answering different questions.

      THE SHARED MAXIMUM is the subtler one, and it is measured. <domain>/<dataset> records relations lagging
      each other by a full month — one measured DQ finding: a reach fact at 2026-07-31 against the KPI fact at 2026-08-31
      — so one `SELECT MAX(...)` computed for the bundle and applied to every relation returns ZERO
      ROWS from the lagging one, SILENTLY. The bundle's own protosql carries that as a never-clause;
      it is a fact about relations, not about that bundle, and belongs here.

      THE TEST: ask for the same measure as "latest" on two days a month apart, against a warehouse
      that has not loaded in between. The two answers must be identical. If they differ, the anchor
      came from the calendar.

  - id: mac.guarantee.never_guess
    subject: "Never guess — an answer that cannot be established from the data is a refusal"
    kind: mac.rule_kind.guarantee
    scope: { concept.class: "*" }
    confidence: C
    when:  "any question whose answer cannot be established from the grounded data"
    then:  "REFUSE, and say what was missing — the scope that had no row, the name that did not
            resolve, the grain that was not available"
    never: "guessing, estimating, interpolating, or returning a plausible value in place of one the
            data does not support; returning an empty result framed as a real zero"
    why: >
      This is the no-hallucination invariant, stated where a rule can reach it. It was previously
      restated inside every refusal rule as the clause "never guess or estimate" — thirteen times in
      one bundle, and one of those thirteen (`market`) had dropped it, so the rule forbade
      fuzzy-substitution while permitting an outright invention. A law repeated per site is a law that
      goes missing at one of them.

      The two rules above are SPECIALISATIONS of this one: they say what refusing looks like for a
      measure with no row, and for a name that does not resolve. They do not re-derive the ban, and a
      concept must not restate it either.

  - id: mac.exclusion.no_evidence.measure
    subject: "Refuse a measure with no row for the resolved scope — never guess, estimate or zero-fill"
    kind: mac.rule_kind.exclusion
    scope: { concept.class: measure }
    confidence: C
    when:  "the resolved scope has no row for the requested measure, variant and period"
    then:  "REFUSE with an evidence-boundary answer ('<source> has no <measure> information for
            <scope>') — never guess, estimate, or substitute another measure's figure"
    never: "returning an empty result framed as a real zero; substituting another measure's value"
    realized_by:
      udf: mac.canon.refuse_measure_no_row
    why: >
      The evidence boundary is universal: a measure with no row for what was asked has no answer, and
      every way of producing one anyway — a guess, an estimate, a zero, another measure's figure — is
      worse than the refusal, because it looks like an answer.

  - id: mac.exclusion.no_evidence.name
    subject: "Refuse a name that does not resolve to a code — never fuzzy-substitute a near miss"
    kind: mac.rule_kind.exclusion
    scope: { concept.class: reference }
    confidence: C
    when:  "a named entity does not resolve to any code"
    then:  "REFUSE with an evidence-boundary answer ('<source> has no information about <thing>') —
            never guess or fuzzy-substitute a similarly-named one"
    never: "silently substituting a near-miss; inventing a code"
    realized_by:
      udf: mac.canon.refuse_unresolvable_name
      # `code` and `thing` are DERIVED, not attached: the code a name must resolve to IS the
      # concept's `identity.canonical_key`, and the thing named is its label. Measured 2026-08-19 —
      # 4 <dataset> concepts attached `code` as a canon parameter; the two that were right matched
      # canonical_key exactly, and the two that were wrong (brand: "code", country: "market") had the
      # correct value sitting in canonical_key while a regex over the rule prose guessed instead.
      # A parameter that can be read from a declaration must never be attached beside it.
    why: >
      A near-miss substitution is the failure this prevents: answering about the Golf when the question
      said Golf Plus is worse than refusing, because the answer looks right.

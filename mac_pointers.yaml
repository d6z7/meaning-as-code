# ══════════════════════════════════════════════════════════════════════════════════════════════
# TOMBSTONES — A DROP IS A DECLARED EVENT, OR IT IS A SILENT BREAK
# ══════════════════════════════════════════════════════════════════════════════════════════════
# Nothing in this estate can tell a DELETE from a RENAME: both surface as "this name no longer
# resolves", and no baseline or snapshot over bundle declarations exists. A tombstone is the
# DECLARED half of that discriminator — the measured half is the per-object content hash diffed
# across two builds (eg_v_changed).
#
# WITHOUT THIS BLOCK, `eg_v_retired_referenced` — the repoint worklist, the view that answers "the
# presentation layer must update upstream objects so they no longer depend on a deleted one" —
# could never return a row, because nothing ever loaded a tombstone. That is the same defect as
# eg_v_orphan not being able to see its own subject, and it is the half of the operator's original
# question that was still undelivered.
#
# contoso5 has NO tombstones, and its `superseded_by` keys are something else entirely: they sit in
# `data/references/*.yaml` with `direction: superseded_by_identity`, meaning one measured reference
# supersedes another. Not a retirement. The file is read when present and absent otherwise.
# ---------------------------------------------------------------------------------------------
# carved_out -- PLANES THIS REGISTRY DELIBERATELY DOES NOT TRACK, AND WHAT COVERS THEM INSTEAD
# ---------------------------------------------------------------------------------------------
# A carve-out is a THIRD state, and the whole point is that it is not either of the other two:
#
#   out-of-scope  the BUNDLE rules it outside framework scope (mac.project.yaml#conformance)
#   carved-out    the REGISTRY tracked it, could keep tracking it, and chose not to -- because
#                 another mechanism fits the artifact better
#   uncovered     nobody covers it and the registry owes it
#
# Deleting the four rows without this block would have left acceptance in the THIRD state while
# reading like the second, and six months from now the only evidence of a deliberate decision
# would have been an absence. An absence is not a declaration.
carved_out:
  - path: 'acceptance/**'
    decided: '2026-10-04'
    decided_by: operator
    # ONE MECHANISM, because the field is what a reader runs. The plane's driver is gate.py;
    # the two narrower mechanisms for its sub-planes are named in `reason` beside the sub-plane
    # each one judges, which is where a reader looking for them will be.
    covered_by: tools/gate.py
    removed_object_kinds: [generated_property]
    removed_reference_kinds:
      - generated_property_source
      - generated_property_validates_concept
      - generated_property_validates_relation
    reason: >
      THE WHOLE ACCEPTANCE PLANE IS DRIVEN BY OTHER MECHANISMS AND IS NOT HELD TO REFERENTIAL
      STRICTNESS. Operator ruling, 2026-10-04: "acceptance is driven with other mechanisms and
      does not have to be absolutely strict -- ignore anything coming from acceptance, you should
      not even try to track acceptance here." The ruling itself is older; what changed today is
      that it is finally in ONE place. It had been implemented three times and completed none of
      them -- 7 globs in the bundle`s own `conformance.out_of_scope`, one glob here covering only
      `acceptance/*_generated.yaml`, and nothing at all over `board_history/`, `runs/`,
      `*_runs.json`, `questions_dashboard.json`, `intents/` and `sme_needs.json`. So 401 of the
      bundle`s 690 files -- 58% of the file census, 21.5 MB of 45.9 -- were still being censused
      after being ruled out.

      MEASURED, 2026-10-04: the plane cost 61% of a build (build_graph 967 ms -> 389 ms) and
      `kind_census` alone 345 ms -> 44 ms, and it yielded 4 objects and 6 closure rows. The
      census cost was also GROWING on its own: `board_history/` is an append-only archive of one
      snapshot per clean gate run, 30 files and 17 MB, ~1,487 counted nodes added each run, and
      it carried no information the census did not already have -- removing it drops 44,616
      counted nodes to 5,924 and loses not one of the 35 keys, because every one also appears in
      a live file. It made the COMMITTED integrity record churn whenever a gate ran.

      WHY THE EARLIER SCOPING WAS NARROWER, AND WHAT COVERS EACH PART NOW. This entry used to
      read `acceptance/*_generated.yaml` and argued against widening, because `acceptance/**`
      would swallow two planes the carve-out made no claim about and report a debt as a decision.
      Each is now named with its own mechanism rather than hidden:
        the two generated suites   tools/check_suites_current.py re-runs the producer each suite
                                   names in its own `generated_by` and byte-compares. Referential
                                   integrity is the wrong instrument for a generated artifact: a
                                   stale pointer in one is never a fact about the suite, it is one
                                   fact about the PRODUCER not having been re-run, reported once
                                   per pointer. On the contoso5 of 2026-10-01 this registry found
                                   22 separate dangling pointers there, every one true and every
                                   one the same cause. Drift-against-regeneration is the estate`s
                                   existing precedent for generated files --
                                   check_pages_current.py and `mac_resources.py --check` both work
                                   this way.
        standing_failures.yaml     the gate-failure register, and a DEBT rather than a generated
                                   artifact, which is why widening was refused before.
                                   tools/gate_register.py --check is its mechanism and judges it
                                   directly; it was never the pointer registry`s to hold.
        the question corpus        answers/, reference/, oracle/, anchors/ -- already out of scope
                                   by the bundle`s own ruling, quoted in mac.project.yaml:
                                   "corpus testing is outside the framework, because MAC defines
                                   the ontology and not the questions asked of it".
        the run history            board_history/, runs/, *_runs.json, questions_dashboard.json
                                   are gate OUTPUT. tools/gate.py writes them and they are read
                                   as evidence, never as declarations.
    measured_before_removing: >
      THE CARVE-OUT ORPHANS NOTHING, established before the rows came out rather than hoped for
      afterwards.

      Of the four kinds removed with the generated suites: references whose TARGET is a
      `generated_property` = 0, and non-acceptance objects whose upstream closure contains one
      = 0. A pure LEAF -- 112 objects and 271 references pointing OUT at 75 declarations, nothing
      pointing back.

      Of the plane as a whole, re-measured on 2026-10-04 before widening: references from OUTSIDE
      acceptance that target anything which disappears = 0. Dangling stays 0, identity violations
      0, cycles 0. Only 4 objects go (three `*` carriers and one framework_term reached nowhere
      else) because the FIVE `declared_file` objects for acceptance files are created by the
      manifest`s own `resources[].path`, not by the walk -- so the bundle does not forget those
      files exist, it stops reading inside them, and the manifest references to them still
      resolve. That was the real risk here and it is why this was measured at both scopes.

      The plane also carried 228 `framework_term` and 84 `framework_contract_id` references --
      framework vocabulary usage that merely sits in acceptance files, not acceptance testing.
      Losing those from the graph loses no declaration; see the `'*'` object kind, whose
      population had to be DECLARED before any of this was safe.
    reversible: >
      A LEAF IS RE-ADDABLE BY CONSTRUCTION. Deleting this entry restores the plane to the
      population and re-derives its objects and references with no other row touched, which is
      what makes this a scoping decision and not a loss. The removed rows are in git at the
      commit that carries this block, and the previous narrower version of this entry is in its
      history.
tombstones:
  artifact: governance/tombstones.yaml
  spec_version: mac.tombstones/1
  # Required per entry. `superseded_by` MAY be null — a drop with no successor is a legitimate
  # declaration and a different fact from a migration, which is why the field is nullable rather
  # than omitted.
  required: [retired_at, reason]

# ══════════════════════════════════════════════════════════════════════════════════════════════
# LINEAGE — INGESTED, NEVER RE-DERIVED
# ══════════════════════════════════════════════════════════════════════════════════════════════
# The bundle's data chain is already measured and already has ONE home. Three homes for this one
# graph were collapsed into `data/lineage/lineage.json` by operator ruling — "why there are two
# lineage artfifacts? there should be only one --- SSOT", "its one too many !!!" — and
# sdk/project/lineage_graph.py#OWNERSHIP declares a THIRD PRODUCER ILLEGAL.
#
# So this block does not produce lineage. It READS it, and the mapping it needs is DECLARED here
# rather than hardcoded in the loader, for the same reason every pointer kind is: a join written
# in code is a join nobody can audit. The Estate Graph is not a bundle artifact at all (it is
# printed and projected, never written into the bundle), so ingesting cannot make it the fourth
# home.
lineage:
  artifact: data/lineage/lineage.json
  shape: 2                        # `load()` discards any other shape outright
  # Node ids are prefixed; `ref` carries the canonical name, which is the join to object ids.
  node_kinds:
    src: source
    ds: dataset
    con: concept
    lk: register                  # the lineage `lookup` node IS the register descriptor,
                                  # not its .csv — the .csv hangs off it by
                                  # register_self_declaration, so the chain extends through both
  # EVERY lineage edge is written PRODUCER -> CONSUMER, and every dependency edge in this graph
  # means "src depends on dst", so all three invert. Uniformly — which is worth stating, because
  # a reader who assumes one of them points the other way gets the closure backwards.
  edge_kinds:
    feeds:   {invert: true, what: 'a source feeds a dataset, so the DATASET depends on the source'}
    cuts:    {invert: true, what: 'a dataset cuts a register, so the REGISTER depends on the dataset'}
    grounds: {invert: true, what: 'a dataset grounds a concept, so the CONCEPT depends on the dataset'}
    # Declared and not yet seen on this bundle. Listed so a kind appearing later is INGESTED
    # rather than silently dropped, and so a reader can see the vocabulary is closed at six.
    derives_from: {invert: true, what: 'a dataset derived from another dataset'}
    seeded_by:    {invert: true, what: 'a register seeded by a relation'}
    claims:       {invert: true, what: 'a DESCRIPTOR CLAIM, not a measurement — kept distinct so
                                        "the engine says so" stays distinguishable from
                                        "a descriptor says so"'}

# SPELLINGS OF ONE IDEA, recorded so the count is honest: register · register_file · csv ·
# paths.data · paths.register · glob: data/lookups/*.csv · rule: <Concept>.<column>.register.
# Five are covered above (two as one kind). `paths.*` and `glob:` are PROJECTION keys in
# objects.json, not declarations, and belong to a later packet over the projection plane.

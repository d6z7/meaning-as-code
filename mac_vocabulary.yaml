# mac_vocabulary.yaml — the canonical framework vocabulary registry (MAC v0.1.12).
#
# The home of the closed `mac.*` terms an applied ontology references instead of restating in prose.
# A reference of the form `mac.<namespace>[.<term>]` resolves HERE (the framework canon); the leading
# `mac.` is the framework/instance boundary (FRAMEWORK §0: the framework DEFINES, applications APPLY).
# A referential checker resolves `mac.<known-namespace>...` against the namespaces below; a token whose
# namespace is not registered here is not a framework reference (so `mac.schema.json` is just a filename).
#
# A namespace is a `vocabulary` (a closed set of named terms) or a `value_domain` (named members that
# may carry structured attributes — e.g. a law). Examples are DOMAIN-NEUTRAL by rule; an applied
# ontology supplies the domain instances that reference these terms.

metadata:
  registry: mac_vocabulary
  namespace: mac
  version: '0.1.13'
  status: active
  defines: [aggregation_effect, axis_kind, binding_mode, MeasureType, rule_kind, canon, identity_kind]

# ===========================================================================
# mac.aggregation_effect — how a measure may be combined along ONE axis.
# ===========================================================================
aggregation_effect:
  kind: vocabulary
  closed: true
  description: >
    THE CORRECT FOLD of a measure along a single axis. Every term names the OPERATION, so the set
    answers one question in one grammar: "how do I fold this measure along this axis?"

    v0.1.15 REPLACED THE PREVIOUS FOUR. They answered the same question in three different grammars —
    `additive` named a property, `averageable` named a capability, `non_aggregable` named a negated
    capability, and `point_in_time` named a POINT IN TIME rather than any operation at all, leaving a
    reader to infer the fold. Worse, the old set sat beside a second, LOSSY scale
    (mac.schema.json#additivityAxis: additive | non-additive) whose legacy spelling `non_additive` was
    one character from `non_aggregable`, in a different scale, meaning something else. Eight <dataset> rules
    fell into exactly that gap and guarded on a value no register could hold.

    `last`/`point_in_time` MERGED INTO `precomputed`, on the bundles' own evidence: an inventory measure says
    "READ the level at the END of the period" and a reach measure says "READ as stored ... resolve to the
    matching pre-computed abstraction level instead of folding". Both READ a stored row and refuse to
    fold; they differ only in WHICH row, which is a RESOLUTION question and already lives in each
    concept's `resolve.*` rules, never in the fold vocabulary.
  terms:
    additive: "SUM is correct across this axis."
    average:  "SUM is MEANINGLESS across this axis (a total of durations, rates or ratios is not a number anyone wants); the correct fold is a mean / median / percentile. Not a weaker `additive` — the two disagree about whether the sum means anything."
    none:     "NO fold is valid along this axis. If a value is needed at a coarser grain it must already EXIST as a stored row: RESOLVE it, never compute it. Which row that is, is determined for the TIME axis by mac_rules.yaml#mac.resolve.period_reading (a bare period reads its END cell) and needs no per-concept rule. Only a NON-time axis whose answer genuinely varies — a reach measure resolving to a matching abstraction level — needs the concept to say."

# ===========================================================================
# mac.axis_kind — the KIND of an aggregation axis, for additivity purposes.
# An applied ontology maps each concrete dimension to one kind; the additivity LAW is stated over kinds,
# so it is universal (domain-independent).
# ===========================================================================
axis_kind:
  kind: vocabulary
  closed: true
  description: The additivity-relevant classification of an aggregation axis.
  terms:
    time:        "An ordered temporal axis (day, month, quarter). Stocks do not accumulate along it."
    categorical: "A non-temporal entity/dimension axis (product, location, customer). Flows and stocks are additive along it."

# ===========================================================================
# mac.binding_mode — HOW a question binds a dimension: the ROLE a referenced dimension plays in the query.
# This is the categorial answer to "GROUP BY or not". It is a PER-QUESTION classification the interpreter
# assigns to every dimension token (not an intrinsic property a concept declares — its neighbours axis_kind
# and MeasureType are intrinsic; this one types a runtime decision). The grain LAW is stated ONCE over these
# two modes (measure.grain_mandatory), so it is universal: a rule rules over the MODE, never over the
# instance (a specific member, or a specific way a member-set is spelled). Set cardinality is irrelevant —
# a scope resolving to many members is still one restrict binding, not a partition.
# ===========================================================================
binding_mode:
  kind: vocabulary
  closed: true
  description: The role a question binds a dimension with — restrict (a member-set scope) vs partition (a per-member breakdown axis).
  terms:
    restrict:  "A member or member-SET is named as a SCOPE (one value or many, however the set is derived or expanded). It constrains WHERE and does NOT enter GROUP BY; its folded members are disclosed under ASSUMPTIONS, never spread into result rows. Cardinality-agnostic: a set of many members is still one filter."
    partition: "The question asks to SEE the dimension varied PER-MEMBER (break it down / enumerate / rank it / 'per <axis>' / 'by <axis>' / 'each' / 'which <axis>'). It enters GROUP BY, one row per member — the dimension is a breakdown axis, not a filter."

# ===========================================================================
# mac.MeasureType — the additivity class of a measure (the classic additive / semi-additive /
# non-additive / averageable fact taxonomy). Additivity is INTRINSIC to the type and stated ONCE here,
# over axis_kind (4 types × 2 kinds = 8 universal cells). Each cell references a mac.aggregation_effect term.
# An applied ontology's measures reference these members; they never re-encode the matrix.
# ===========================================================================
MeasureType:
  kind: value_domain
  closed: true
  description: How a measure aggregates — defined once, over axis_kind.
  members:
    Flow:
      definition: "A quantity that accrues per period and accumulates over time (e.g. units sold in a period)."
      additivity:
        time:        mac.aggregation_effect.additive
        categorical: mac.aggregation_effect.additive
    Stock:
      definition: "A level read at a point in time; it does not accumulate over time (e.g. inventory on hand)."
      additivity:
        time:        mac.aggregation_effect.none         # a year IS the end-of-period row — resolved, not folded
        categorical: mac.aggregation_effect.additive
    Intensive:
      definition: "A per-entity magnitude that is meaningful only as an average, never a total (e.g. a duration, an age, a rate, a ratio, or a signed deviation). Summing it across a population double-counts or is meaningless; the correct fold on ANY axis is a mean / median / percentile, not a SUM."
      additivity:
        time:        mac.aggregation_effect.average
        categorical: mac.aggregation_effect.average
    Precomputed:
      definition: "A measure whose value EXISTS ONLY at the grains it was computed for — you locate the row matching the requested axis/parameter combination and read it. Nothing is derivable from narrower cells: the source documentation describes one such reach measure as non-additive (a sum or average of the measure is not the measure of the summed or averaged inputs) and computed iteratively. v0.1.15: `precomputed` is a property of the MEASURE, not of an axis — every axis of such a measure is simply `none`, because no fold is valid anywhere. Where the value comes from is a MeasureType fact; whether you may fold is an axis fact."
      additivity:
        time:        mac.aggregation_effect.none
        categorical: mac.aggregation_effect.none
    Target:
      definition: "A planning target, not an observed quantity (e.g. a sales goal); not summable on any axis."
      additivity:
        time:        mac.aggregation_effect.none
        categorical: mac.aggregation_effect.none

# ===========================================================================
# mac.identity_kind — HOW a concept's canonical identity is established. Every concept declares
# `concept.identity.kind: mac.identity_kind.<term>`; `concept.identity.canonical_key` (when one is
# exposed) names the column/expression that IS the identity. Domain-neutral: an applied ontology picks
# the kind that fits. The three "keyless-by-design" kinds (composite, resolved_axis, sme_pending) let a
# concept declare it legitimately has no single-column key — so the contract never forces a fake one.
# ===========================================================================
identity_kind:
  kind: vocabulary
  closed: true
  description: How a concept's canonical identity is established (declared once per concept).
  terms:
    iso:            "A universal external standard code (e.g. an ISO country code). Identity = the standard code; local names/labels are aliases."
    code:           "A closed internal code set (e.g. a fuel or segment code). Identity = the code; surface spellings are aliases."
    namespace_code: "A code that only means something within a scope — identity = (namespace, code); the bare code collides across scopes. Guarded by mac.canon.composite_key_guard."
    fk_name:        "An opaque but stable key carrying a resolved human name (e.g. a model code + name). Identity = the key; the name is a joined attribute, not the identity."
    composite:      "Identity is a TUPLE of columns (a fact grain, or a parent+member pair). Keyless-by-design: no single-column key."
    resolved_axis:  "An axis the serving view PINS or collapses (e.g. reporting role, firmness). Keyless-by-design: not exposed as a filterable key on the default view (grounding columns: [])."
    sme_pending:    "Identity not yet known — carried as '__sme__', never invented; graduates to another kind once an SME rules."

# ===========================================================================
# mac.rule_kind — the closed taxonomy that types every behavioural rule (what the rule governs).
# A typed rule references its kind (kind: mac.rule_kind.<term>) instead of an inline string, so the set
# is enforced and defined once. (`default` could be argued a sub-case of `resolution`, and `guarantee`
# is an inherited fact rather than a directive — kept distinct for clarity; prune at a later revision
# if warranted.)
# ===========================================================================
rule_kind:
  kind: vocabulary
  closed: true
  description: What a behavioural rule governs — the rule's type.
  terms:
    resolution:  "Identity / matching / scoping of an entity from the question (name, code, key, definition)."
    aggregation: "Measure math — additivity, period bounds, grain (how a measure may be summed/read)."
    default:     "What to assume when an axis is unspecified but a safe default exists."
    ambiguity:   "An underspecified REQUIRED dimension — ASK, never guess."
    exclusion:   "What to filter out / never include (pseudo-entries, unmapped rows, stale vintages)."
    guarantee:   "A fact the consumer INHERITS from the serving view (relied on, not re-derived)."

# ===========================================================================
# mac.canon — the canon library: the deterministic, parameterized UDFs a behaviour-bearing slot binds
# to via `realized_by: { udf: mac.canon.<name>, params: {...} }` (v0.1.9; the content-model UDF seam,
# reference_manual/the_content_model.md §4). The logic is single-homed in the executable library
# tools/canon/ and demonstrated runnable in tests/test_canon.py ("a canon that doesn't run is prose in
# a code costume"). Each member names the pattern it serves; an applied ontology references the term and
# supplies only params — it never re-encodes the logic. Coverage, not completeness (AUTHORING A5): this
# is the set built and validated so far; it extends by branch → PR with a witnessing pattern.
# ===========================================================================
# ── THE TWO KINDS OF TEST, and they must never be mixed ─────────────────────────────────────────
# Operator ruling 2026-08-20: "seems to be important finding too. dont loose it ... as we will have
# to split our test center like this".
#
# It came out of a concrete defect. S-GRAIN carried `7 AS key_columns_declared` — a literal, typed
# by the assistant, connected to nothing. His question was the right one: "who is declaring key
# columns? is it ontology or is it you ... who is guaranteeing me that another incarnation of you
# will not declare 4, 6, or 16?" Nobody was. And the rule he drew from it — "these tests must be
# exclusively based on what ontology say" — is correct but has a trap, which is why this exists:
# a test rendered entirely from the ontology AGREES WITH THE ONTOLOGY, so a wrong declaration
# produces a green suite. The resolution is that there are two kinds with opposite obligations.
test_kind:
  kind: vocabulary
  closed: true
  description: >
    Which question a property answers. The two kinds have OPPOSITE rules about where their numbers
    come from, and a property that tries to be both can be trusted for neither.
  terms:
    conformance: >
      DOES THE MODEL DO WHAT IT SAYS? Every value it asserts is READ from a declaration at run time
      and never typed. A typed literal IS the defect here: a later author types a different one and
      the test passes while checking something else. Render the key, the enumeration, the codes —
      and REFUSE if they cannot be resolved, rather than substituting nothing into a PARTITION BY.
    ground_truth: >
      IS WHAT IT SAYS TRUE? Measures the world and compares it against the declaration, so it must
      NOT be generated from the declaration's own claims — its entire purpose is to DISAGREE with
      the descriptor when the descriptor has gone stale. It still READS the declaration, to know
      what to test, but never inherits its assertions; a measured literal is acceptable where it is
      dated and re-checkable. EXAMPLE — a grain property reads the relation's measured key to learn which
      columns identify one figure, then asks the warehouse whether that still holds. It is the
      property that caught v_<source>_kpi.yaml claiming "VERIFIED 2026-08-16 ... 0 multi-row" against a
      warehouse that had reached millions of multi-row cells. A conformance test rendered from that same declaration
      would have confirmed the claim rather than contradicted it — which is the entire distinction
      between the two test kinds.

# ===========================================================================
# mac.test_status — WHAT THE INSTRUMENT DID ABOUT THE PROPERTY.
#
# The third disposition axis, and the twin of the two above it: `outcome_class` records what the
# ENGINE did about a question, `dq_status` what a PERSON did about a defect, and this what the
# INSTRUMENT did about a property. All three are dispositions; none is a channel.
#
# WHERE IT LIVED UNTIL NOW, MEASURED 2026-09-14: `tools/suite_record.py:95`, as a bare Python tuple
# `STATUSES = ("PASS", "FAIL", "ACCEPTED", "FROZEN", "ERROR", "NOT_RUN")`, restated in prose in
# `tools/check_run_records.py`'s BAD_STATUS reject class. Zero occurrences of `test_status` or
# `NOT_RUN` in this file; zero in `mac.schema.json`. So the ONE axis the console actually paints
# — every card on every grading surface resolves to one of these six — had no home in the registry,
# which is the same finding `outcome_class` recorded about itself one block above.
#
# THE GAP THAT ADDS THE SEVENTH MEMBER. A property whose instrument did not deliver a verdict has
# nowhere to go but FAIL, so the board's red means "the test is broken" more often than "the data
# is dirty", and nothing distinguishes them. MEASURED on one applied bundle's tier1 property suite
# (18 results, `acceptance/property_runs.json`): 8 PASS · 1 ACCEPTED · 9 FAIL, and ALL NINE FAILs
# are instrument failures rather than data findings. Eight of the nine examined a population of
# ZERO — five returned no rows at all, each noting "query returned NO ROWS — a property cannot be
# satisfied vacuously", and three returned exactly one row whose own population column read 0 (one
# of those three had excluded millions of rows as not-served, so the sweep was emptied by its own
# filter). The ninth is an instrument failure of a DIFFERENT kind — a non-empty base of over a hundred million
# rows with nulls in the derived columns — and it
# is NOT covered by the new term. Said plainly so the term is not credited with more than it holds.
#
# WHY NEITHER `ERROR` NOR `NOT_RUN` IS THE RIGHT HOME — the absence was proved before the term was
# coined, and both candidates are genuinely occupied:
#   * `ERROR` is THE ENGINE RAISED. `run_suite.py` assigns it only from an `except` clause, with
#     `rows=None` and the exception text in `notes`. Exactly one live example exists across the
#     measured estate — a generated identity property whose note carries the engine's own
#     split-open failure. A vacuous run raised NOTHING. Folding it into ERROR would also corrupt a measured number: `recount` reports
#     `errors` from `tally["ERROR"]`, and `_has_evidence` treats `rows=None` as no-evidence while
#     `rows=[]` IS evidence ("the query ran and returned nothing" — suite_record.py's own comment).
#     A vacuous run has evidence and an ERROR does not, so one status cannot carry both.
#   * `NOT_RUN` is DECLARED, NEVER ATTEMPTED — written by `carry_forward` for an id with no result,
#     and excluded from `examined` as `skipped`. A vacuous property RAN: it compiled, it reached the
#     warehouse, it scanned bytes. Calling that "not run" is false, and it would move eight live
#     red rows into the bucket a reader is correct to ignore, which is the opposite failure.
# So the seventh member is a THIRD non-verdict beside two that were already right, not a repair of
# either.
#
# THE NAME IS THE ESTATE'S OWN, NOT A COINAGE. `run_suite.py:183` already emits "a property cannot
# be satisfied vacuously"; `tools/check_vacuous_assertions.py` is a whole gate named for the
# concept; and the applied suites ALREADY WRITE THE WORD AS IF IT WERE A STATUS — "fails as VACUOUS",
# "the property fails as VACUOUS rather than passing clean", "fails as VACUOUS unless" (five
# occurrences across data_sanity.yaml and retrieval.yaml). The authors have been describing a status
# that did not exist, so it collapsed into FAIL. This block gives the word they were already using
# somewhere to land.
#
# AND THE RULE THE RUNNER HALF-STATES. "A property cannot be satisfied vacuously" is TRUE and the
# runner draws the wrong conclusion from it. The complete rule is: a property over zero subjects
# cannot be satisfied vacuously AND CANNOT BE VIOLATED VACUOUSLY EITHER. `sdk/acceptance/flags.py`
# already states the general form for the flag plane — "a check that could not be decided is
# `unchecked` — never `pass`, never `fail`. An incomplete fact sheet cannot exonerate and cannot
# convict" — and `tools/_plugin.py` states it for the gate plane: "Could not run is the one honest
# answer available, and it is never a finding." This axis is the last plane where that doctrine was
# not expressed.
#
# `gradeable` IS THE FIELD A CONSUMER READS, and the word is `flags.py`'s own: its VERDICTS comment
# says "The first four are gradeable outcomes; the last four mean 'not gradeable'". A surface that
# needs "is this red because the data is dirty?" reads `gradeable`, not a list of status names it
# would have to keep in step by hand. Three of the seven are not gradeable, which is the whole point
# of the block: on the measured tier1 suite that is 9 of 18 results — half the board.
#
# WHY THIS IS VOCABULARY-ONLY AND BUMPS NO SCHEMA — `dq_status`'s precedent above, re-measured for
# this key. `mac.schema.json` carries no `test_status` and no run-record `$def` at all (0 hits for
# both `test_status` and `NOT_RUN`), so there is no enum to restate and nothing to widen; per
# RELEASING.md "When to bump", a change that does not touch `mac.schema.json` does not move
# `schema_version`. Of the closed vocabularies in this file only 3 are ALSO a `mac.schema.json`
# enum — vocabulary-only enforced by a gate is the majority idiom, not an exception to it.
#
# THE SEAM THAT IS NOT YET CLOSED, DISCLOSED RATHER THAN IMPLIED. The enforcing gate ALREADY EXISTS
# — `tools/check_run_records.py`'s BAD_STATUS class refuses a status outside the closed set — but it
# reads `suite_record.STATUSES`, the Python tuple, NOT this block. Until that tuple is replaced by a
# read of this registry, ONE FACT HAS TWO HOMES, which is precisely the drift `check_vocabulary_drift`
# exists to catch and precisely what it cannot see here: that gate matches only qualified
# `mac.<vocab>.<term>` literals, and `STATUSES` is a bare tuple, invisible to it by construction.
# Two consequences, both stated so neither is mistaken for done:
#   1. `VACUOUS` is DECLARED HERE AND EMITTED BY NOTHING. No runner produces it yet; `run_suite.py`
#      still returns FAIL for a zero-row result. This block describes a state the runner must learn
#      to emit — it does not, on its own, turn a single board row from red to grey.
#   2. Adding `VACUOUS` to `suite_record.STATUSES` is a SEPARATE, human-authorised edit. Doing it
#      here as a side effect would make the suite greener without proving one new thing.
# The phasing rule applies, as it did to every member of §5.3 of the 2026-09-13 testing-strategy
# note: no key becomes REQUIRED in the generation it is invented.
# ===========================================================================
test_status:
  kind: vocabulary
  closed: true
  description: >
    The disposition of ONE property run — what the INSTRUMENT did about the claim, never what the
    data turned out to be. Written BARE on a run record's `results[].status` (like its siblings
    `severity` and `family`), referenced as `mac.test_status.<term>`. Every term carries
    `gradeable`: true where the run produced a verdict about the data, false where it did not, so a
    surface can separate "the data is dirty" from "the test is broken" without hard-coding a list of
    names. THREE OF SEVEN ARE NOT GRADEABLE, and a board that paints them like FAIL reports a broken
    instrument as a data finding — measured at 9 of 18 on the suite this block was written against.
    `ACCEPTED` and `VACUOUS` carry a `requires`, for the same reason `dq_status.accepted` does: they
    are the terms that would otherwise be the cheapest way off a red board, so each must carry the
    evidence that it was earned.
  terms:
    PASS:
      gradeable: true
      description: >
        THE INSTRUMENT RAN OVER A NON-EMPTY POPULATION AND THE CLAIM HELD. The population part is
        not decoration: a PASS over zero subjects is the vacuous green this vocabulary's seventh
        term exists to make unsayable.
      requires: []
    FAIL:
      gradeable: true
      description: >
        THE INSTRUMENT RAN AND THE CLAIM DID NOT HOLD — a statement ABOUT THE DATA, which is what
        makes it the one red a reader may act on directly. Today it is also the dumping ground for
        every run that produced no verdict at all, and that is the defect `VACUOUS` removes.
      requires: []
    ACCEPTED:
      gradeable: true
      description: >
        THE CLAIM DID NOT HOLD AND A NAMED RULING TOLERATES IT. Green because the defect is
        tolerated, which is not the same claim as correct — the same distinction `dq_status.accepted`
        draws one plane over. `run_suite.py` stamps the suite's `accepted:` block onto the result,
        so the ruling travels WITH the verdict rather than being looked up beside it.
      requires: [accepted]
    FROZEN:
      gradeable: true
      description: >
        THE CLAIM DID NOT HOLD AND THE FAILURE IS DELIBERATELY PARKED — neither repaired nor ruled
        acceptable. Distinct from ACCEPTED, which asserts someone judged the finding; FROZEN asserts
        only that someone decided not to today. NOTE, MEASURED: the `frozen:` block lives on the
        SUITE and is not copied onto the result, so a FROZEN row carries no on-record evidence of who
        froze it or when — the asymmetry with ACCEPTED is real, and is recorded here rather than
        papered over with a `requires` no writer satisfies.
      requires: []
    ERROR:
      gradeable: false
      description: >
        THE INSTRUMENT RAISED. An OUTAGE, not a judgement: a split that would not open, a connection
        refused, a timeout. Nothing was judged, so it must never be counted as a finding about the
        data — `tools/_plugin.py`'s founding rule ("could not run is the one honest answer available,
        and it is never a finding") and `sdk/connector/base.py`'s `EXIT_COULD_NOT_RUN`, on this axis.
        Carries `rows: null` — NOT `[]` — because an empty grid means the query ran and returned
        nothing, which is evidence, and `null` means nothing was examined.
      requires: [notes]
    NOT_RUN:
      gradeable: false
      description: >
        DECLARED, NEVER ATTEMPTED. The honest default for an id the suite declares and the run did
        not reach, written by `carry_forward` so that a declared property with no result is NOT_RUN
        rather than ABSENT — absence reads as nothing-to-report, which is the state this term was
        invented to end. Excluded from `examined` and counted as `skipped`.
      requires: []
    VACUOUS:
      gradeable: false
      description: >
        THE INSTRUMENT RAN CLEANLY AND HAD NOTHING TO JUDGE. The query compiled, reached the source
        and returned — and the population it examined was ZERO, so the claim was neither satisfied
        nor violated. A property over zero subjects cannot be satisfied vacuously AND CANNOT BE
        VIOLATED VACUOUSLY EITHER; the runner already says the first half in its own note and then
        returns FAIL, which asserts the second. DISTINCT FROM `ERROR` (which raised, and has no
        evidence) and from `NOT_RUN` (which was never attempted): a VACUOUS run has a query, a byte
        count and a measured zero, and every one of those is actionable — it means the scope, the
        filter or the fixture is wrong, and the property is currently testing nothing.
        NOT AN ESCAPE HATCH: `requires` makes the zero NAMEABLE and CHECKABLE rather than asserted,
        because a status that could be written without evidence would be the cheapest way off a red
        board — the `corpus: none` failure mode, one plane over. `examined` names the population
        column the instrument itself reported — the live spellings are all of the form
        `<subject>_examined` or a bare count of the subject — and its value, which MUST be 0. A
        non-zero `examined` with a null verdict column is a DIFFERENT instrument defect and is NOT
        this term (measured live: one property, a non-empty base examined, derived columns null).
      requires: [examined, notes]

# ===========================================================================
# mac.outcome_class — WHAT THE ENGINE DID ABOUT THE QUESTION.
#
# The grading axis the whole estate already reasons in — oracles, dashboards, the console's route
# column — and until now the ONE axis with no home here. It was declared in prose in the integration
# kit's testing plane ("expected: {outcome: COMMIT|ASK|REFUSE|BLOCK}") and nowhere a machine could
# reach, so the population could not be enumerated, and a population that cannot be enumerated cannot
# have a denominator.
#
# MEASURED, THE DAY THIS BLOCK WAS WRITTEN, over every structurally parsed declaration on an
# outcome-carrying key in the applied estate: 16.292 declarations, and they are NOT four spellings.
# COMMIT 13.957 · ASK 4.206 · REFUSE 1.347 · BLOCK 1.223 · DECLINE 1.049 · COMMIT_PENDING 247 ·
# ENUMERATE 119 · MODEL_PROPERTY 74 · DEFER 59 · ENGINE_ERR 3. `DECLINE` is a SYNONYM of `REFUSE`
# carrying more declarations than `REFUSE` has in the bundle that spells it, so searching for one
# finds a fraction of what is declared — the defect this block closes.
#
# THE MEMBERSHIP IS DECIDED FROM THAT MEASUREMENT, NOT FROM THE FOUR-CLASS IDEAL. A closed set that
# omitted a spelling in live use would turn working bundles red, so every measured spelling is
# declared here and carries a `status` saying what it IS — which keeps the four-class grading axis
# identifiable (`status: canonical`) while making the non-canonical tail countable instead of
# invisible. `status` is the field a consumer reads; it is not a second axis of meaning.
# ===========================================================================
outcome_class:
  kind: vocabulary
  closed: true
  description: >
    What the engine DID about a question — the disposition, never the channel it used. The four
    `canonical` terms are the grading axis; every other term is a spelling measured in live use and
    declared so the set can be closed without reddening a working bundle. A term's `status` says
    which: `canonical` (one of the four), `deprecated` (a synonym whose canonical form is named in
    `use`), `provisional` (a genuinely distinct intermediate state, not one of the four), and
    `non_grading` (a real declared disposition that is NOT a judgement about the answer — a metadata
    route, a composer decision, an outage). WHERE these are declared is the gate's business, not this
    block's: tools/check_outcome_class_closure.py carries the outcome-carrying key list, because the
    same key name carries a DIFFERENT axis in different bundles (`oracle_class` holds this vocabulary
    in one bundle's run records and a question-FAMILY code in another's dashboard), so membership
    cannot be judged by key name alone.
  terms:
    COMMIT:
      status: canonical
      description: >
        THE ENGINE ANSWERED. A value was produced, and every declaration it rests on resolved — the
        scope was pinned, the measure was legal at that grain, the names resolved to codes.
    ASK:
      status: canonical
      description: >
        A REQUIRED dimension was underspecified, so the engine asked instead of guessing. The
        question is answerable; it is not yet fully stated. Never a silent default.
    REFUSE:
      status: canonical
      description: >
        THE EVIDENCE IS ABSENT. The question is legal and the engine can state precisely what was
        missing — the scope with no row, the name that did not resolve — and says so rather than
        returning a zero a reader takes for a measurement.
    BLOCK:
      status: canonical
      description: >
        OUTSIDE WHAT THE ONTOLOGY GOVERNS. Not a gap in the data but a question this model does not
        undertake to answer, so answering it would be fabrication rather than retrieval.
    DECLINE:
      status: deprecated
      use: REFUSE
      why: >
        A pure synonym of REFUSE with no distinct meaning anyone has been able to state. It is the
        measured cost of leaving this axis ungoverned, and it is the larger of the two spellings:
        1.049 declarations across 68 files at the moment of closure, against REFUSE's 1.347, so a
        reader searching either word sees well under half the population. NOT MIGRATED HERE — the
        bundle that carries it has no remote, and rewriting a thousand declarations in an
        unrecoverable tree is a separate, human-authorised act. Declared so the debt is countable.
      measured_at_close: 1049
      files_at_close: 68
    COMMIT_PENDING:
      status: provisional
      description: >
        A COMMIT whose validation precondition has not yet passed — the answer is composed but not
        yet cleared to be reported as one. Genuinely distinct from all four canonical terms, which is
        why it is `provisional` rather than `deprecated`: collapsing it into COMMIT would report an
        unvalidated answer as a validated one.
      measured_at_close: 247
    ENUMERATE:
      status: non_grading
      description: >
        A dimension-member LIST — a metadata answer with no measure in it. A route stage, not a
        judgement about an answer's correctness, so it does not belong on the grading axis even
        though it is declared on the same keys.
      measured_at_close: 119
    MODEL_PROPERTY:
      status: non_grading
      description: >
        Routed to a property OF THE MODEL rather than to the warehouse — answered from declarations
        alone. Like ENUMERATE, a route target rather than a grade.
      measured_at_close: 74
    DEFER:
      status: non_grading
      description: >
        The composer declined to compose — it could not build a statement it was willing to stand
        behind, and said so instead of emitting SQL that would fabricate a shape.
      measured_at_close: 59
    ENGINE_ERR:
      status: non_grading
      description: >
        The engine raised. An OUTAGE, not a semantic outcome: nothing was judged, so it must never be
        counted as a refusal the model chose to make.
      measured_at_close: 3
# ===========================================================================
# mac.dq_status — WHAT A HUMAN DECIDED ABOUT A REGISTERED DATA DEFECT.
#
# The twin of outcome_class one plane over: outcome_class records what the ENGINE did about a
# question, dq_status records what a PERSON did about a defect. Both are dispositions, and neither
# is a channel.
#
# MEASURED 2026-09-14, on the register the DQ loop actually runs on (44 entries, 525 lines):
# a register issue's keys are `confidence, current_handling, finding, id, residual_risk, severity,
# sme_owner, table, title`. THERE IS NO STATUS. `metadata.status: open` exists at the REGISTER
# level and says nothing about any one issue. So "which issues are still open" is not a readable
# fact — it is INFERRED by joining the register to impurity_resolution_map.yaml and TREATING
# ABSENCE AS OPEN. Of 44 entries, 22 join and 21 do not (one is unaddressable; see below).
#
# ABSENCE IS NOT A STATE, and this is the exact cost: the 21 unlinked entries are a mixture of
# "deliberately accepted after a ruling", "won't fix", "resolved by something that forgot to say
# so", and "nobody has looked yet" — and the register cannot express which. An issue a named human
# examined and tolerated, and an issue no human has ever read, are THE TWO MOST DIFFERENT THINGS IN
# THE REGISTER, and today they are byte-identical. That is why `accepted` and `wont_fix` REQUIRE a
# `ruled_by` and a `reason`: those two terms are the ones that assert a human acted, so they are the
# two that must carry the evidence that one did. `open` and `resolved` assert no ruling and require
# none — `resolved` is already evidenced by the resolution map's cross-link.
#
# WHY THE VALUES ARE WRITTEN BARE. `status: open`, never `status: mac.dq_status.open`. It sits
# beside `severity: high` and `confidence: C` on the same issue, both of which are bare, and a
# third sibling spelled a fourth way would be the synonym problem this registry exists to prevent.
# The qualified `mac.dq_status.*` form is the REFERENCE form used in prose and across planes.
#
# WHY THIS IS VOCABULARY-ONLY AND BUMPS NO SCHEMA (CONFORMANCE §6 precedent). `mac.schema.json`
# ALREADY PERMITS the key: `$defs/DataQualityRegisterFile.properties.issues.items` declares no
# `additionalProperties: false` — measured, and witnessed by the fact that real bundles already
# carry undeclared `table` (44 issues) and `related` keys through validation today. So the key
# needs no schema change to be legal, and per RELEASING.md "When to bump" a change that does not
# touch mac.schema.json does not move `schema_version`. The measurement that settles WHERE the
# value set lives: of the 10 closed vocabularies in this file, only 3 (aggregation_effect,
# identity_kind, credential_mode) are ALSO restated as a `mac.schema.json` enum — 7 of 10 are
# vocabulary-only and enforced by a gate. This is the majority idiom, not an exception to it.
# The enforcing gate is tools/check_dq_resolution_sync.py, which READS these terms and never
# re-lists them (check_vocabulary_drift).
# ===========================================================================
dq_status:
  kind: vocabulary
  closed: true
  description: >
    The disposition of ONE registered data-quality issue — what a human decided about it, not what
    a pipeline did to it. Written BARE on `issues[].status` (like its siblings `severity` and
    `confidence`), referenced as `mac.dq_status.<term>`. `accepted` and `wont_fix` REQUIRE
    `ruled_by` (the named person or role who ruled — never "the team", never a tool) and `reason`
    (why the defect is real, and why it is being lived with rather than fixed), because those are
    the two terms that CLAIM a human acted. The set is closed so that absence of a status is a
    FINDING rather than a fourth, unnamed meaning.
  terms:
    open:
      description: >
        NOBODY HAS RULED ON IT YET. The honest default and the only one that may be written without
        evidence — it asserts nothing except that the defect is recorded and undispositioned. This
        is the state that absence was silently standing in for, and naming it is the entire point:
        an issue is `open` because someone wrote `open`, not because a join missed.
      requires: []
    accepted:
      description: >
        A NAMED HUMAN EXAMINED IT AND CHOSE TO LIVE WITH IT. The defect is real, it is not being
        fixed, and that is a decision on the record rather than an omission. This is the term that
        makes a FITNESS green legible: a property whose recorded expectation overlaps an accepted
        issue is GREEN BECAUSE THE DEFECT IS TOLERATED, which is not the same claim as correct.
      requires: [ruled_by, reason]
    resolved:
      description: >
        THE DEFECT IS GONE, dissolved by a transform that says so. Evidenced by the cross-link in
        impurity_resolution_map.yaml rather than by a ruling, which is why it requires no
        `ruled_by`: the evidence is structural and already gate-checked. A `resolved` issue still
        named by an acceptance-plane `accepted:` block is a REPORTED drift — the test is being
        excused for a defect that no longer exists.
      requires: []
    wont_fix:
      description: >
        A NAMED HUMAN RULED THAT IT WILL NEVER BE FIXED. Distinct from `accepted`, which tolerates a
        defect that could still be repaired: `wont_fix` closes the question. Carries the same
        evidence burden for the same reason — it asserts a ruling, so it must name who ruled.
      requires: [ruled_by, reason]
# ===========================================================================
# mac.connector — the NAMESPACE, and deliberately nothing else.
# ===========================================================================
connector:
  kind: registry
  closed: false
  description: >
    The `mac.connector.*` NAMESPACE. A `mac.`-prefixed connector id is a framework reference; any
    other namespace is not, by this file's header rule, and needs nothing from MAC. This block
    registers the NAMESPACE ONLY. It lists NO members: which first-party connectors exist is a fact
    about the MAC DISTRIBUTION, not about meaning, and lives in the shipped index
    (sdk/connector/index.json). A member list here would be a vendor product catalogue inside the
    canon — the same list that `$defs/connectorRef` refuses to be an enum of, relocated into the one
    file that defines meaning, and load-bearing, because a third first-party engine would then be a
    canon bump forever. It would also not validate: mac.vocabulary.schema.json closes a member object
    over exactly six keys (definition, additivity, serves, needs_sqlglot, doc, params_from), so the
    packaging keys such a list needs — config_majors, entry_point, status — are all three illegal, and
    an entry_point is a Python module path, a fact about MAC's own wheel layout, written into the file
    that defines meaning.

    AND tools/check_vocabulary_drift.py IS DELIBERATELY NOT PATCHED TO SEE THIS BLOCK. Measured: its
    _vocabularies() at :53-56 collects `kind: vocabulary` (with terms) and `kind: value_domain` (with
    members) and nothing else, so a `registry` is invisible to it — by omission, not by accident.
    Patching it to collect registries would buy a green line and not a check: :68 iterates
    (_ROOT / "tools").rglob("*.py") and :38 _LITERAL matches a dotted mac.NAMESPACE.TERM literal in
    MAC'S OWN PYTHON SOURCE, while connector ids live in mac.project.yaml#runtime.connector, in
    bundles, and in other repos — never in tools/*.py. The gate would then report clean over ZERO
    occurrences, permanently, while the typo it exists to catch (`mac.connector.athna` in a bundle
    manifest) stayed invisible.
    Worse: with the namespace registered and no members, `voc in vocab and term not in vocab[voc]`
    is true of EVERY `mac.connector.*` literal, so any MAC docstring narrating a hypothetical
    `mac.connector.postgres` would become a MAC008 ERROR ON PROSE — the exact false FAIL that gate's
    own docstring says it was designed to avoid. A registry the drift gate openly skips is honest;
    one it counts and structurally cannot see is a green line over nothing. Enforcement of connector
    ids lives entirely in `$defs/connectorRef`'s pattern (every bundle, every run) and in the
    shipped index. This paragraph exists so nobody later "fixes" the omission.

# ===========================================================================
# mac.credential_mode — HOW a credential is obtained. Never what it is.
# ===========================================================================
credential_mode:
  kind: vocabulary
  closed: true
  description: >
    The way a connector OBTAINS its credential, as a closed and BRAND-FREE set. Referenced by
    mac.schema.json#/$defs/credentialMode, which is the schema-side restatement of this set (the
    same idiom $defs/confidence and $defs/status already use); this file is the single home.

    WHY BRAND-FREE: the measured set in sdk/authoring/connection.py:48-68 is
    `aws-chain | profile | secretsmanager | ssm` — four AWS product names doing the work of three
    ideas, which is one cloud's credential chain promoted into the framework's grammar. A connector
    may keep its own spellings as ALIASES and report them MAC003 (fact-restated); the framework does
    not learn them.

    WHY SIX AND NOT FOUR: one resolution mode plus one opaque handle fits password-shaped auth and
    fails exactly where THE MECHANISM IS THE AUTH and there is no secret to fetch — interactive or
    browser SSO, mTLS client certificates, Kerberos/GSSAPI. None of those is ambient, named_profile,
    secret_manager or none, and a set that cannot spell them forces the connector to lie about which
    mode it is in.

    A NEW MEMBER HERE IS A FRAMEWORK RELEASE, not a bundle's choice. That is the price of `closed`,
    and it is the point: the alternative is a per-connector credentials schema, and the moment a
    connector may declare its own credential fields, one of them will be a password field and the
    structural guarantee that there is nowhere to put a secret is gone.
  terms:
    ambient:            "The host environment already carries the identity — an instance/task role, an ambient session, an environment chain. Nothing to fetch and nothing to name, so `ref` must be null or absent."
    named_profile:      "A named local profile selects the identity. `ref` is the profile name — a handle, never a secret."
    secret_manager:     "The credential is fetched at call time from the deployment's secret manager. `ref` is the path/id in that manager; MAC never resolves it and never sees the value."
    interactive:        "The human authenticates at connect time — browser SSO, a device code, an MFA prompt. There is no secret to fetch, so `ref` must be null or absent. Unattended answering cannot use this mode, and a host that needs one will fail loudly rather than hang on a prompt nobody can see."
    client_certificate: "A client certificate (mTLS) is the credential. `ref` locates the certificate material in the deployment's own store; the certificate itself never enters the bundle."
    none:               "No credential is required — the engine is local or open. Distinct from the block being ABSENT only in that it says so out loud; both are legal, and absent is the honest spelling when a connector has no credential concept at all."

canon:
  kind: value_domain
  closed: false                    # extends as patterns surface new deterministic needs (A5)
  description: The deterministic UDFs a concept's realized_by binds to; logic in tools/canon/.
  members:
    composite_key_guard:   { serves: context_dependent_meaning, needs_sqlglot: true,  doc: "reject a parent-scoped code used without its scope columns" }
    # `params_from` names the DECLARATION each parameter is readable from. A binding that attaches
    # one of these is stating a fact that already has a home — MAC003 if it agrees, MAC004 if it does
    # not. Measured 2026-08-19: two <dataset> bindings attached `code` and BOTH disagreed with
    # identity.canonical_key (code='code' vs <brand_code>; code='market' vs iso2), because a regex
    # over rule prose had guessed what the concept already declared.
    refuse_measure_no_row:
      serves: exclusion_no_evidence
      needs_sqlglot: false
      doc: "RENDER canon — a measure has no row for the resolved scope; emit the refusal clauses"
      params_from:
        label: concept.label
        null_is_real: concept.semantics.null_semantics
    resolve_by_register:
      serves: contaminated_code
      needs_sqlglot: false
      doc: "RENDER canon — resolve a NAME to a CODE through a declared register, never through the
            display label. MEASURED on <domain>/<dataset>: four rules said this with different nouns, and each
            existed because the register carries a human-readable column that LOOKS like an identity
            (market_label_raw = HOME for the home country; a product's display name where the search key is
            name_key). params: thing, code, register, search, display_label, scope, fact_join,
            served_view."
    refuse_unresolvable_name:
      serves: exclusion_no_evidence
      needs_sqlglot: false
      doc: "RENDER canon — a name does not resolve to a code; emit the refusal clauses"
      params_from:
        thing: concept.label
        code: concept.identity.canonical_key
    additivity_guard:      { serves: semi_additive_balance,     needs_sqlglot: true,  doc: "reject SUM of a measure across a non-additive axis" }
    axis_default:          { serves: tracking_vintage,          needs_sqlglot: true,  doc: "inject a safe default for an unconstrained orthogonal axis" }
    exclusion_filter:      { serves: impurity_disposition,      needs_sqlglot: true,  doc: "inject an exclusion predicate for reliably-identifiable junk (bake)" }
    snapshot_collapse:
      serves: scd_type_2
      needs_sqlglot: false
      doc: "collapse a versioned relation to current / as-of one row per key; the partition is a
            COMPOSITE column list and the order accepts a tie-break (vintage, then written-at)"
      params_from:
        # READ the cell key from the relation's MEASUREMENT — never retyped into the binding, and
        # since 2026-08-20 never hand-declared either. A partition copied per concept is one chance
        # per copy to drop a column, and dropping `role` folds six reporting perspectives into one
        # arbitrary row, silently. Hand-DECLARING it turned out no safer: the previous home was an
        # `x-` extension outside every gate, and two of its four declarations were false against the
        # warehouse while still reading as VERIFIED. mac_admit_identity.py derives this key and dates
        # it against the source watermark.
        natural_key: 'profile#identity_evidence.key'
    closure_anomaly_check: { serves: explicit_closure,          needs_sqlglot: false, doc: "for a closed value set, the query that finds out-of-set values (else None)" }
    scoped_latest:         { serves: tracking_vintage,          needs_sqlglot: false, doc: "MAX(date) over a scoped subset, not the whole table" }
    hierarchy_rollup:      { serves: recursive_hierarchy,       needs_sqlglot: false, doc: "recursive-CTE subtree: a node and all its descendants" }
    densify:               { serves: absence_semantics,         needs_sqlglot: false, doc: "LEFT JOIN a sparse fact onto the full grid, COALESCE 0 (genuine-zero)" }
    ambiguity_gate:        { serves: competing_definitions,     needs_sqlglot: false, doc: "resolve a single/pinned candidate, else ASK (⊥) — never guess" }
    alias_resolve:         { serves: competing_definitions,     needs_sqlglot: false, doc: "resolve a surface token (scope_relative tier first, then multilingual) to a canonical value code; >1 hit or unknown-in-closed-set -> ASK; never a silent bind/drop" }
    relation_alias_resolve: { serves: competing_definitions,    needs_sqlglot: false, doc: "resolve a surface token against a business edge's relationAliasBlock.multilingual surfaces to that relation (the edge_id) as the routing target; >1 hit or unknown -> ASK; never a silent bind/drop. The token->relation twin of alias_resolve (token->value code)" }
    enum_from_register:    { serves: explicit_closure,          needs_sqlglot: false, doc: "realize a closed enumeration's value set by reading a PINNED register (a lookup artifact) instead of inline values.items — the value domain IS the register's `code` column (params.register names the artifact, params.key_column names the code column, default 'code'). Declarative registry entry (like alias_resolve): a consumer sources the value set from the register; the concept omits items and supplies only the register pointer. The register-sourced twin of an inline closed enumeration." }
    grouping_from_register: { serves: explicit_closure,          needs_sqlglot: false, doc: "realize a grouping's enumerated member sets by reading an EXPLODED register (one row per (group_key, member)) and RE-AGGREGATING it by the group key into nested member arrays, instead of inline members.definitions. The nested-membership twin of enum_from_register (which sources a FLAT value set): params.register names the artifact, params.group_key names the identity column(s) each set is keyed by (a string or a list for a composite key), params.member_col names the column collected into each set's member array, and params.carry lists the per-group scalar columns carried through onto each set (label / count / flags). Declarative registry entry (like alias_resolve / enum_from_register): a consumer re-aggregates the member sets from the register; the concept omits members.definitions and supplies only the register pointer. The register-sourced twin of an inline enumerated grouping." }

# ===========================================================================
# mac.diagnostic_code — THE CLOSED DIAGNOSTIC TAXONOMY. Every finding the compiler can make.
#
# MOVED HERE 2026-08-18, on the operator's observation. It lived as a Python dict in
# tools/mac_diag.py while ALSO being tabulated in CONFORMANCE.md — two hand-maintained homes for a
# taxonomy whose own docstring called it CLOSED. That is precisely the defect check_vocabulary_drift
# was built to catch hours earlier, and the framework was committing it about its own error codes.
#
# The CODE is the contract: its text may be reworded, its meaning may not change without a version
# bump, because suppressions and counts are keyed on it. `severity` is the DEFAULT a check emits at;
# a check may raise or lower it for a specific finding and says why when it does.
# ===========================================================================
diagnostic_code:
  kind: vocabulary
  closed: true
  description: The closed taxonomy of findings the MAC compiler can report.
  terms:
    MAC001:
      kind: undefined-artifact
      severity: error
      group: "what is not defined"
      description: "present in the bundle, carries no MAC definition, not declared out of scope"
    MAC002:
      kind: invalid-artifact
      severity: error
      group: "what is not defined"
      description: "has a MAC definition and does not satisfy it"
    MAC009:
      kind: undeclared-extension
      severity: error
      group: "what is not defined"
      description: "an x- key with no profile entry — CONFORMANCE.md §2: undeclared debt, not license"
    MAC003:
      kind: fact-restated
      severity: warning
      group: "what is defined redundantly"
      description: "one fact stated in more than one home; nothing keeps the copies in step"
    MAC004:
      kind: fact-contradicted
      severity: error
      group: "what is defined redundantly"
      description: "statements of one fact disagree — something downstream is reading the wrong one"
    MAC005:
      kind: capability-unadopted
      severity: warning
      group: "what is offered and not taken"
      description: "MAC offers a mechanism for this and the bundle does not use it"
    MAC006:
      kind: claim-unearned
      severity: warning
      group: "what is claimed without warrant"
      description: "a conformance level or confidence asserted with no evidence behind it"
    MAC010:
      kind: change-unprotocolled
      severity: warning
      group: "what is claimed without warrant"
      description: "an authored or tuned object with no entry in the change record"
    MAC007:
      kind: guard-dead
      severity: error
      group: "what points at nothing"
      description: "a rule or guard testing a value that cannot occur — it can never fire"
    MAC008:
      kind: reference-unresolved
      severity: error
      group: "what points at nothing"
      description: "a reference that resolves to nothing"
    MAC011:
      kind: coverage-missing
      severity: error
      group: "what is not covered"
      description: "a required completeness the bundle does not reach"
    MAC012:
      kind: extension-duplicates-core
      severity: error
      group: "what is not covered"
      description: >-
        an `x-` extension key. Prohibited outright, because it sits BY CONSTRUCTION outside every
        gate MAC has, so nothing can check what it holds. Measured the day x-grain was retired, TWO
        of four declared cell keys were false — the main fact view claimed 0 multi-row against millions,
        and a second fact view claimed 0 against nearly all of its cells. The two that HELD are the two
        that a view enforces: a view that withholds ambiguous cells, and a current-snapshot view whose
        collapse makes the key true by construction (its declared cell count reproduced to within a
        hundred-odd cells). That is the shape of the defect: the declaration is false exactly where nothing makes
        it true, and a field no gate can reach costs nothing to be wrong in. Three mechanical predicates identify the duplicate case — same subject,
        same value shape, same closed domain with non-empty overlap. Where there is NO core
        equivalent the finding is a MAC gap, not a shortcut: say what the wall is and change MAC,
        rather than declaring beside it. Enforced by tools/check_extension_keys.py, which exits
        non-zero, because a check that does not block is not enforcement.

# ===========================================================================
# mac.data_plane_gate — WHY the ontology pipeline is closed. One home for the
# reject codes the guard, the CLI gate and the console page all cite.
# ===========================================================================
data_plane_gate:
  kind: vocabulary
  closed: true
  description: >
    The reject classes of the DATA→ONTOLOGY handoff, as a closed set. A bundle may declare TWO
    pipelines (mac.schema.json#ProjectFile.reproduction.pipelines): a DATA pipeline whose declared
    exit is a named human's sign-off over the issues its own register holds, and an ONTOLOGY
    pipeline that may not start until that exit is reached. Three consumers read the same verdict —
    the PreToolUse guard that refuses a write, the CLI that refuses to start the ontology pipeline,
    and the console page that tells the operator what is blocking — so the code set lives HERE and
    not three times. `not_declared` is the only member that is NOT a block: a bundle that declares
    one pipeline is governed by the operator's unlock marker alone, exactly as before.

    WHY A CODE AND NOT JUST A SENTENCE. The sentence is rendered to a human and will be reworded;
    the code is joined on. A page grouping by sentence re-groups every time the wording improves.

    WHAT THIS SET DELIBERATELY DOES NOT CONTAIN: a member for "too many issues", for "severity too
    high", or for any count a bundle or a framework could declare as a threshold. The gate reads no
    grading field. `severity` is machine-authored (capped at `confidence: I` by CORE.md §4), so a
    gate reading it would grade the machine against its own opinion — and a non-defect parked at
    `high` would block an ontology forever on bookkeeping rather than on data. Measured
    2026-09-18: a live register's entry was edited from `severity: high` to `severity: low` the
    same day a severity-reading gate was proposed, its own inline comment naming the coming gate as
    the reason. Goodhart arrived within hours. The threshold here is per-issue HUMAN COVERAGE, and
    the only way to move it is for a person to name the specific thing.
  terms:
    not_declared:
      description: >
        The bundle declares no `reproduction.pipelines`, so the two-pipeline gate does not apply.
        EXIT 0, and not a block — the legacy affordance (the operator's `.ontology-unlocked`
        marker) governs its ontology plane unchanged. The one member that is a PASS.
      blocks: false
    approval_missing:
      description: >
        Two pipelines are declared and the data pipeline's declared exit does not exist: no
        sign-off file at the path the manifest names. The normal state of a bundle still in the
        data pipeline — the page must not paint it red.
      blocks: true
    approval_unreadable:
      description: >
        The sign-off exists and cannot be parsed. Counts as NO approval (deny — the safe
        direction), and the refusal prints the offending line number so the operator can fix their
        own typo. A file no agent may write is a file only the operator can un-break; that cost is
        disclosed rather than eliminated.
      blocks: true
    approval_unratified:
      description: >
        The sign-off exists but does not ratify: its `status` is not `applied`, its `verdict` is
        not `confirmed`, or its `outcome` is not `ratified`. A draft is not an approval.
      blocks: true
    approval_agent_stamped:
      description: >
        The sign-off's write stamp names an agent (`submitted_via: agent`) or an identity nobody
        verified or declared (`identity_basis: imported`). An agent may write a DESCRIPTION; only a
        human may write a DISPOSITION. Rejecting the honestly-stamped case is what makes the
        dishonest one a lie rather than a shortcut.
      blocks: true
    issue_uncovered:
      description: >
        A registered issue id the sign-off does not name. This is the threshold, and it is why no
        number is invented: the count of uncovered ids must be 0, and it cannot move unless a human
        names the specific thing. No wildcard is permitted — if per-issue naming is too many ids,
        the fix is a coarser REGISTER, never a coarser gate.
      blocks: true
    issue_undispositioned:
      description: >
        A graded DEFECT (`DQ-` id) carrying no terminal `mac.dq_status` term, or one whose term's
        own `requires:` list is unmet. The law is READ from `mac.dq_status`, never restated here.
      blocks: true
    resolved_on_non_defect:
      description: >
        A CATEGORY ERROR, and the one reject class that exists because a disposition can be written
        by a machine. `mac.dq_status.resolved` requires NOTHING — its evidence is structural, the
        cross-link in impurity_resolution_map.yaml — and both the register and that map are
        agent-writable, so a gate reading "status is not open" is satisfiable with no human name
        anywhere. `resolved` means A TRANSFORM DISSOLVED A DEFECT. An `NS-` entry is a relation
        MEASURED AND DELIBERATELY NOT SERVED: it was never a defect and no transform dissolved it,
        so `resolved` cannot be true of it and is refused. The honest disposition of a
        non-promotion is `accepted` or `wont_fix`, both of which name a ruler.

        DISCLOSED GAP, not fixed here: `mac.dq_status` has no term meaning "measured, and it is not
        a defect". Non-promotions are therefore dispositioned with defect-shaped words. Adding a
        term to a closed vocabulary is a framework change with its own gate consequences; this
        member refuses the one spelling that lets a machine clear the register, and names the gap.
      blocks: true
    coverage_dangling:
      description: >
        The sign-off names an id the register no longer holds. Distinct from `issue_uncovered` and
        reported separately, because they are opposite failures — a human approved something that
        has since been renamed or deleted, versus something they never saw.
      blocks: true
    plane_moved:
      description: >
        The sign-off's digest no longer matches the data plane as it stands. The ontology already
        authored is NOT deleted and NOT invalidated — doing that would be the blanket lock's
        mistake in a new costume. Further ontology authoring stops, the plane reads STALE with the
        date of the sign-off it invalidates, and the moved files are named so the diff is the
        review.
      blocks: true
    register_unrun:
      description: >
        Datasets are served and the register holds zero issues. That is a step that did not run,
        not a clean bill of health, so the data plane cannot be approved from it. A gate that
        passes having measured nothing is worse than none (CORE.md §2).
      blocks: true
    no_datasets:
      description: >
        Nothing is served, so there is nothing for an ontology to bind to. Vacuity, refused in the
        other direction.
      blocks: true
    stage_unassigned:
      description: >
        `pipelines` is declared and a `reproduction.stages[]` entry carries no `pipeline`, so a
        half-migrated manifest cannot read as complete.
      blocks: true
    gate_unreachable:
      description: >
        An input could not be read — the manifest, the register, the vocabulary, or the framework
        itself is absent beside the bundle. UNKNOWN => DENY, per the estate's own compile-gate
        rule: unreachable means unknown means refuse. A gate that could not run must never read as
        an open door. On the console this is the one state that is neither green nor red: it says
        the gate could not judge.
      blocks: true

# mac_vocabulary.yaml — the canonical framework vocabulary registry (MAC v0.1.12).
#
# The home of the closed `mac.*` terms an applied ontology references instead of restating in prose.
# A reference of the form `mac.<namespace>[.<term>]` resolves HERE (the framework canon); the leading
# `mac.` is the framework/instance boundary (FRAMEWORK §0: the framework DEFINES, applications APPLY).
# A referential checker resolves `mac.<known-namespace>...` against the namespaces below; a token whose
# namespace is not registered here is not a framework reference (so `mac.schema.json` is just a filename).
#
# A namespace is a `vocabulary` (a closed set of named terms) or a `value_domain` (named members that
# may carry structured attributes — e.g. a law). Examples are DOMAIN-NEUTRAL by rule; an applied
# ontology supplies the domain instances that reference these terms.

metadata:
  registry: mac_vocabulary
  namespace: mac
  version: '0.1.13'
  status: active
  defines: [concept.aggregation_effect, concept.axis, concept.class, binding_mode, concept.column.measure_type, concept.rule, canon,
            concept.column.role, concept.column.identity, dataset.column.role, concept.column.ruling, name_register]

# ===========================================================================
# mac.column_type — WHAT KIND OF VALUE a column holds, physically. The FAMILY, not the warehouse's
# spelling: `integer`, `bigint`, `double` and `decimal(20,5)` are one kind of thing to every question
# that has to decide something about them, and a reader that matches the spellings decides it eleven
# times. Measured across the estate 2026-10-02: 547 declared columns carry 11 distinct spellings.
#
# WHY IT IS DECLARED AT ALL. It was not, and the cost was invisible: `mac_runtime/temporal.py`
# carried `frozenset({"date","timestamp","datetime","timestamptz"})` in code as the only answer to
# "is this column a date", and because no vocabulary existed the fragility census could not even see
# it -- there was nothing to compare the literals against. Two of those four spellings occur nowhere
# in the estate and three that DO occur as numbers (`double`, `bigint`, `decimal(20,5)`) had no home
# at all, so the first reader to ask "is this a number" would have started a second hidden set.
#
# THE SPELLINGS ARE A PAYLOAD, NOT THE TERMS, and that is forced by the data: `decimal(20,5)` and
# `array<string>` are PARAMETRIC, so no closed set of exact strings can hold them. A reader
# normalises a spelling by taking the text before `(` or `<`, which is why the parameter never has
# to be enumerated.
# ===========================================================================
column_type:
  kind: value_domain
  closed: true
  description: >
    The family of value a column holds, with the warehouse spellings that mean it. Closed over
    FAMILIES; open over spellings, which a bundle's descriptors supply and which are normalised
    before matching (the text before `(` or `<`).
  terms:
    text:
      definition: "Characters. A NAME, a code, a label -- something read rather than measured."
      spellings: [string, varchar, char, text, nvarchar, uuid]
    number:
      definition: "A magnitude. Something that can be larger or smaller than another of its kind."
      spellings: [integer, int, bigint, smallint, tinyint, decimal, numeric, double, float, real]
    temporal:
      definition: "A point in time. The only family a date literal may be compared against."
      spellings: [date, timestamp, datetime, timestamptz, time]
    boolean:
      definition: "True or false. Two members, so it is never a magnitude and never a name."
      spellings: [boolean, bool]
    collection:
      definition: >
        Several values in one cell. Never an axis and never an ordering key: GROUP BY over a
        collection groups by the container, which is not a member of anything a question asked
        about.
      spellings: [array, map, struct, row, json]
# ===========================================================================
# mac.name_register — WHICH NAMING REGISTER a `label_of` ruling points at. One thing, several
# names, each belonging to a different register: the world's, the statute book's, the schedule's.
# ===========================================================================
name_register:
  kind: vocabulary
  closed: true
  description: Which register a name belongs to, when one thing carries several names.
  terms:
    common: "The name people use. 'Contoso', 'Germany', 'Monday'."
    legal:  "The name in a trade or statutory register. 'Contoso, Ltd'."
    long:   "The unabbreviated form of a coded name. 'United Kingdom' for GB."
    short:  "The abbreviated form. 'Mon' for Monday, 'Jan' for January."
    code:   "A machine identifier standing for the name. 'GB', 'DE', a numeric key."

# ===========================================================================
# mac.calendar_vocabulary — THE WORDS A CALENDAR USES, DECLARED ONCE SO NOTHING CUTS THEM INTO A
# REGISTER AND NOTHING ENUMERATES THEM IN A BUNDLE.
#
# OPERATOR RULING, 2026-09-30: "the mechanism for days should be default built in and NOT rely in
# any moment on lookups", and then: "remove handling dates and time with lookup tables; remove time
# related lookups datasets; refactor our ontology to use built in recognition for time instead of
# lookups".
#
# WHAT IT REPLACES, measured on the worked bundle the hour before it was written: EIGHT of 25 value
# registers existed only to turn a temporal word into a value — 132 members for `year_month`, 132
# for its short form, 44 for `year_quarter`, 12 and 12 for the month names, 7 and 7 for the
# weekdays, 4 for the quarters. 350 rows of lookup table for facts the Gregorian calendar already
# states, re-cut on every delivery, monitored by a gate, and carried in every prompt.
#
# AND IT REPLACES A WRONG ANSWER, not just a cost. A register turns a NAME into a CODE by matching
# it; a day is not a name. Asked "which stores closed after 2020", the resolver matched the TERM
# `close_date` to the register value `Closed` on a status column at ratio 0.75 and reported it as
# resolved, then looked up `2020-12-31` as a member of Store and refused. Two more rungs of that
# ladder and a question about dates would have been answered by filtering on status.
#
# TWO KINDS OF ENTRY, and the difference is the whole point:
#   `members:` a CLOSED WORD LIST — there are twelve months and seven weekdays, and no delivery
#              can add one. A reader matches a word against it.
#   `shape:`   a LITERAL FORM read by arithmetic, not by matching — `2024-03`, `Q1 2024`,
#              `2020-12-31`. Enumerating these is what produced 132-row registers for a fact that
#              is a regular expression and a calendar.
#
# READ BY: mac-platform/packages/mac-runtime/src/mac_runtime/temporal.py (the built-in calendar,
# which recognises these words and shapes) and meaning-as-code/tools/mac_lookups.py (the cutter,
# which REFUSES to cut a register from a column whose value set is one of them —
# guardrails/data/sources.yaml#refuses.TEMPORAL-AS-LOOKUP).
#
# A FISCAL CALENDAR IS NOT HERE, deliberately. These are the Gregorian words; a fiscal year, a
# 4-4-5 period or a trading calendar is a DECLARATION a bundle makes and a reader reads, never a
# default hidden in a word list.
# ===========================================================================
calendar_vocabulary:
  kind: value_domain
  closed: true
  description: >
    The words and literal forms of the Gregorian calendar. A column whose value set is one of these
    is a calendar, not a register: the built-in reader recognises it and no lookup is cut, carried
    or monitored for it.
  terms:
    month_name:
      definition: The twelve month names in full.
      members: [January, February, March, April, May, June, July, August, September, October,
                November, December]
    month_short:
      definition: The three-letter month abbreviations. `Sept` is admitted beside `Sep` because
        deliveries write both.
      members: [Jan, Feb, Mar, Apr, May, Jun, Jul, Aug, Sep, Sept, Oct, Nov, Dec]
    weekday_name:
      definition: The seven weekday names in full.
      members: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
    weekday_short:
      definition: The three-letter weekday abbreviations.
      members: [Mon, Tue, Tues, Wed, Thu, Thur, Thurs, Fri, Sat, Sun]
    quarter_label:
      definition: A quarter of a year, unqualified by which year.
      members: [Q1, Q2, Q3, Q4]
    iso_date:
      definition: A day. `2020-12-31`, with an optional time this estate's served dates do not
        carry (every date column measured on the worked bundle is midnight).
      shape: YYYY-MM-DD
    year:
      definition: A year as four digits. Half-open over twelve months when compared.
      shape: YYYY
    year_month:
      definition: A month of a named year. `2024-03`, `March 2024`, `Mar 2024`.
      shape: YYYY-MM
    year_quarter:
      definition: A quarter of a named year. `Q1 2024`, `2024-Q1`.
      shape: Qn YYYY

# ===========================================================================
# mac.binding_mode — HOW a question binds a dimension: the ROLE a referenced dimension plays in the query.
# This is the categorial answer to "GROUP BY or not". It is a PER-QUESTION classification the interpreter
# assigns to every dimension token (not an intrinsic property a concept declares — its neighbours axis
# and measure_type are intrinsic; this one types a runtime decision). The grain LAW is stated ONCE over these
# two modes (measure.grain_mandatory), so it is universal: a rule rules over the MODE, never over the
# instance (a specific member, or a specific way a member-set is spelled). Set cardinality is irrelevant —
# a scope resolving to many members is still one restrict binding, not a partition.
# ===========================================================================
binding_mode:
  kind: vocabulary
  closed: true
  description: The role a question binds a dimension with — restrict (a member-set scope) vs partition (a per-member breakdown axis).
  terms:
    restrict:  "A member or member-SET is named as a SCOPE (one value or many, however the set is derived or expanded). It constrains WHERE and does NOT enter GROUP BY; its folded members are disclosed under ASSUMPTIONS, never spread into result rows. Cardinality-agnostic: a set of many members is still one filter."
    partition: "The question asks to SEE the dimension varied PER-MEMBER (break it down / enumerate / rank it / 'per <axis>' / 'by <axis>' / 'each' / 'which <axis>'). It enters GROUP BY, one row per member — the dimension is a breakdown axis, not a filter."

# ===========================================================================
# mac.canon — the canon library: the deterministic, parameterized UDFs a behaviour-bearing slot binds
# to via `realized_by: { udf: mac.canon.<name>, params: {...} }` (v0.1.9; the content-model UDF seam,
# reference_manual/rules_and_canons/the_content_model.md §4). The logic is single-homed in the executable library
# tools/canon/ and demonstrated runnable in tests/test_canon.py ("a canon that doesn't run is prose in
# a code costume"). Each member names the pattern it serves; an applied ontology references the term and
# supplies only params — it never re-encodes the logic. Coverage, not completeness (AUTHORING A5): this
# is the set built and validated so far; it extends by branch → PR with a witnessing pattern.
# ===========================================================================
# ── THE TWO KINDS OF TEST, and they must never be mixed ─────────────────────────────────────────
# Operator ruling 2026-08-20: "seems to be important finding too. dont loose it ... as we will have
# to split our test center like this".
#
# It came out of a concrete defect. S-GRAIN carried `7 AS key_columns_declared` — a literal, typed
# by the assistant, connected to nothing. His question was the right one: "who is declaring key
# columns? is it ontology or is it you ... who is guaranteeing me that another incarnation of you
# will not declare 4, 6, or 16?" Nobody was. And the rule he drew from it — "these tests must be
# exclusively based on what ontology say" — is correct but has a trap, which is why this exists:
# a test rendered entirely from the ontology AGREES WITH THE ONTOLOGY, so a wrong declaration
# produces a green suite. The resolution is that there are two kinds with opposite obligations.
test_kind:
  kind: vocabulary
  closed: true
  description: >
    Which question a property answers. The two kinds have OPPOSITE rules about where their numbers
    come from, and a property that tries to be both can be trusted for neither.
  terms:
    conformance: >
      DOES THE MODEL DO WHAT IT SAYS? Every value it asserts is READ from a declaration at run time
      and never typed. A typed literal IS the defect here: a later author types a different one and
      the test passes while checking something else. Render the key, the enumeration, the codes —
      and REFUSE if they cannot be resolved, rather than substituting nothing into a PARTITION BY.
    ground_truth: >
      IS WHAT IT SAYS TRUE? Measures the world and compares it against the declaration, so it must
      NOT be generated from the declaration's own claims — its entire purpose is to DISAGREE with
      the descriptor when the descriptor has gone stale. It still READS the declaration, to know
      what to test, but never inherits its assertions; a measured literal is acceptable where it is
      dated and re-checkable. EXAMPLE — a grain property reads the relation's measured key to learn which
      columns identify one figure, then asks the warehouse whether that still holds. It is the
      property that caught v_<source>_kpi.yaml claiming "VERIFIED 2026-08-16 ... 0 multi-row" against a
      warehouse that had reached millions of multi-row cells. A conformance test rendered from that same declaration
      would have confirmed the claim rather than contradicted it — which is the entire distinction
      between the two test kinds.

# ===========================================================================
# mac.test_status — WHAT THE INSTRUMENT DID ABOUT THE PROPERTY.
#
# The third disposition axis, and the twin of the two above it: `outcome_class` records what the
# ENGINE did about a question, `dq_status` what a PERSON did about a defect, and this what the
# INSTRUMENT did about a property. All three are dispositions; none is a channel.
#
# WHERE IT LIVED UNTIL NOW, MEASURED 2026-09-14: `tools/suite_record.py:95`, as a bare Python tuple
# `STATUSES = ("PASS", "FAIL", "ACCEPTED", "FROZEN", "ERROR", "NOT_RUN")`, restated in prose in
# `tools/check_run_records.py`'s BAD_STATUS reject class. Zero occurrences of `test_status` or
# `NOT_RUN` in this file; zero in `mac.schema.json`. So the ONE axis the console actually paints
# — every card on every grading surface resolves to one of these six — had no home in the registry,
# which is the same finding `outcome_class` recorded about itself one block above.
#
# THE GAP THAT ADDS THE SEVENTH MEMBER. A property whose instrument did not deliver a verdict has
# nowhere to go but FAIL, so the board's red means "the test is broken" more often than "the data
# is dirty", and nothing distinguishes them. MEASURED on one applied bundle's tier1 property suite
# (18 results, `acceptance/property_runs.json`): 8 PASS · 1 ACCEPTED · 9 FAIL, and ALL NINE FAILs
# are instrument failures rather than data findings. Eight of the nine examined a population of
# ZERO — five returned no rows at all, each noting "query returned NO ROWS — a property cannot be
# satisfied vacuously", and three returned exactly one row whose own population column read 0 (one
# of those three had excluded millions of rows as not-served, so the sweep was emptied by its own
# filter). The ninth is an instrument failure of a DIFFERENT kind — a non-empty base of over a hundred million
# rows with nulls in the derived columns — and it
# is NOT covered by the new term. Said plainly so the term is not credited with more than it holds.
#
# WHY NEITHER `ERROR` NOR `NOT_RUN` IS THE RIGHT HOME — the absence was proved before the term was
# coined, and both candidates are genuinely occupied:
#   * `ERROR` is THE ENGINE RAISED. `run_suite.py` assigns it only from an `except` clause, with
#     `rows=None` and the exception text in `notes`. Exactly one live example exists across the
#     measured estate — a generated identity property whose note carries the engine's own
#     split-open failure. A vacuous run raised NOTHING. Folding it into ERROR would also corrupt a measured number: `recount` reports
#     `errors` from `tally["ERROR"]`, and `_has_evidence` treats `rows=None` as no-evidence while
#     `rows=[]` IS evidence ("the query ran and returned nothing" — suite_record.py's own comment).
#     A vacuous run has evidence and an ERROR does not, so one status cannot carry both.
#   * `NOT_RUN` is DECLARED, NEVER ATTEMPTED — written by `carry_forward` for an id with no result,
#     and excluded from `examined` as `skipped`. A vacuous property RAN: it compiled, it reached the
#     warehouse, it scanned bytes. Calling that "not run" is false, and it would move eight live
#     red rows into the bucket a reader is correct to ignore, which is the opposite failure.
# So the seventh member is a THIRD non-verdict beside two that were already right, not a repair of
# either.
#
# THE NAME IS THE ESTATE'S OWN, NOT A COINAGE. `run_suite.py:183` already emits "a property cannot
# be satisfied vacuously"; `tools/check_vacuous_assertions.py` is a whole gate named for the
# concept; and the applied suites ALREADY WRITE THE WORD AS IF IT WERE A STATUS — "fails as VACUOUS",
# "the property fails as VACUOUS rather than passing clean", "fails as VACUOUS unless" (five
# occurrences across data_sanity.yaml and retrieval.yaml). The authors have been describing a status
# that did not exist, so it collapsed into FAIL. This block gives the word they were already using
# somewhere to land.
#
# AND THE RULE THE RUNNER HALF-STATES. "A property cannot be satisfied vacuously" is TRUE and the
# runner draws the wrong conclusion from it. The complete rule is: a property over zero subjects
# cannot be satisfied vacuously AND CANNOT BE VIOLATED VACUOUSLY EITHER. `sdk/acceptance/flags.py`
# already states the general form for the flag plane — "a check that could not be decided is
# `unchecked` — never `pass`, never `fail`. An incomplete fact sheet cannot exonerate and cannot
# convict" — and `tools/_plugin.py` states it for the gate plane: "Could not run is the one honest
# answer available, and it is never a finding." This axis is the last plane where that doctrine was
# not expressed.
#
# `gradeable` IS THE FIELD A CONSUMER READS, and the word is `flags.py`'s own: its VERDICTS comment
# says "The first four are gradeable outcomes; the last four mean 'not gradeable'". A surface that
# needs "is this red because the data is dirty?" reads `gradeable`, not a list of status names it
# would have to keep in step by hand. Three of the seven are not gradeable, which is the whole point
# of the block: on the measured tier1 suite that is 9 of 18 results — half the board.
#
# WHY THIS IS VOCABULARY-ONLY AND BUMPS NO SCHEMA — `dq_status`'s precedent above, re-measured for
# this key. `mac.schema.json` carries no `test_status` and no run-record `$def` at all (0 hits for
# both `test_status` and `NOT_RUN`), so there is no enum to restate and nothing to widen; per
# RELEASING.md "When to bump", a change that does not touch `mac.schema.json` does not move
# `schema_version`. Of the closed vocabularies in this file only 3 are ALSO a `mac.schema.json`
# enum — vocabulary-only enforced by a gate is the majority idiom, not an exception to it.
#
# THE SEAM THAT IS NOT YET CLOSED, DISCLOSED RATHER THAN IMPLIED. The enforcing gate ALREADY EXISTS
# — `tools/check_run_records.py`'s BAD_STATUS class refuses a status outside the closed set — but it
# reads `suite_record.STATUSES`, the Python tuple, NOT this block. Until that tuple is replaced by a
# read of this registry, ONE FACT HAS TWO HOMES, which is precisely the drift `check_vocabulary_drift`
# exists to catch and precisely what it cannot see here: that gate matches only qualified
# `mac.<vocab>.<term>` literals, and `STATUSES` is a bare tuple, invisible to it by construction.
# Two consequences, both stated so neither is mistaken for done:
#   1. `VACUOUS` is DECLARED HERE AND EMITTED BY NOTHING. No runner produces it yet; `run_suite.py`
#      still returns FAIL for a zero-row result. This block describes a state the runner must learn
#      to emit — it does not, on its own, turn a single board row from red to grey.
#   2. Adding `VACUOUS` to `suite_record.STATUSES` is a SEPARATE, human-authorised edit. Doing it
#      here as a side effect would make the suite greener without proving one new thing.
# The phasing rule applies, as it did to every member of §5.3 of the 2026-09-13 testing-strategy
# note: no key becomes REQUIRED in the generation it is invented.
# ===========================================================================
test_status:
  kind: vocabulary
  closed: true
  description: >
    The disposition of ONE property run — what the INSTRUMENT did about the claim, never what the
    data turned out to be. Written BARE on a run record's `results[].status` (like its siblings
    `severity` and `family`), referenced as `mac.test_status.<term>`. Every term carries
    `gradeable`: true where the run produced a verdict about the data, false where it did not, so a
    surface can separate "the data is dirty" from "the test is broken" without hard-coding a list of
    names. THREE OF SEVEN ARE NOT GRADEABLE, and a board that paints them like FAIL reports a broken
    instrument as a data finding — measured at 9 of 18 on the suite this block was written against.
    `ACCEPTED` and `VACUOUS` carry a `requires`, for the same reason `dq_status.accepted` does: they
    are the terms that would otherwise be the cheapest way off a red board, so each must carry the
    evidence that it was earned.
  terms:
    PASS:
      gradeable: true
      description: >
        THE INSTRUMENT RAN OVER A NON-EMPTY POPULATION AND THE CLAIM HELD. The population part is
        not decoration: a PASS over zero subjects is the vacuous green this vocabulary's seventh
        term exists to make unsayable.
      requires: []
    FAIL:
      gradeable: true
      description: >
        THE INSTRUMENT RAN AND THE CLAIM DID NOT HOLD — a statement ABOUT THE DATA, which is what
        makes it the one red a reader may act on directly. Today it is also the dumping ground for
        every run that produced no verdict at all, and that is the defect `VACUOUS` removes.
      requires: []
    ACCEPTED:
      gradeable: true
      description: >
        THE CLAIM DID NOT HOLD AND A NAMED RULING TOLERATES IT. Green because the defect is
        tolerated, which is not the same claim as correct — the same distinction `dq_status.accepted`
        draws one plane over. `run_suite.py` stamps the suite's `accepted:` block onto the result,
        so the ruling travels WITH the verdict rather than being looked up beside it.
      requires: [accepted]
    FROZEN:
      gradeable: true
      description: >
        THE CLAIM DID NOT HOLD AND THE FAILURE IS DELIBERATELY PARKED — neither repaired nor ruled
        acceptable. Distinct from ACCEPTED, which asserts someone judged the finding; FROZEN asserts
        only that someone decided not to today. NOTE, MEASURED: the `frozen:` block lives on the
        SUITE and is not copied onto the result, so a FROZEN row carries no on-record evidence of who
        froze it or when — the asymmetry with ACCEPTED is real, and is recorded here rather than
        papered over with a `requires` no writer satisfies.
      requires: []
    ERROR:
      gradeable: false
      description: >
        THE INSTRUMENT RAISED. An OUTAGE, not a judgement: a split that would not open, a connection
        refused, a timeout. Nothing was judged, so it must never be counted as a finding about the
        data — `tools/_plugin.py`'s founding rule ("could not run is the one honest answer available,
        and it is never a finding") and `sdk/connector/base.py`'s `EXIT_COULD_NOT_RUN`, on this axis.
        Carries `rows: null` — NOT `[]` — because an empty grid means the query ran and returned
        nothing, which is evidence, and `null` means nothing was examined.
      requires: [notes]
    NOT_RUN:
      gradeable: false
      description: >
        DECLARED, NEVER ATTEMPTED. The honest default for an id the suite declares and the run did
        not reach, written by `carry_forward` so that a declared property with no result is NOT_RUN
        rather than ABSENT — absence reads as nothing-to-report, which is the state this term was
        invented to end. Excluded from `examined` and counted as `skipped`.
      requires: []
    VACUOUS:
      gradeable: false
      description: >
        THE INSTRUMENT RAN CLEANLY AND HAD NOTHING TO JUDGE. The query compiled, reached the source
        and returned — and the population it examined was ZERO, so the claim was neither satisfied
        nor violated. A property over zero subjects cannot be satisfied vacuously AND CANNOT BE
        VIOLATED VACUOUSLY EITHER; the runner already says the first half in its own note and then
        returns FAIL, which asserts the second. DISTINCT FROM `ERROR` (which raised, and has no
        evidence) and from `NOT_RUN` (which was never attempted): a VACUOUS run has a query, a byte
        count and a measured zero, and every one of those is actionable — it means the scope, the
        filter or the fixture is wrong, and the property is currently testing nothing.
        NOT AN ESCAPE HATCH: `requires` makes the zero NAMEABLE and CHECKABLE rather than asserted,
        because a status that could be written without evidence would be the cheapest way off a red
        board — the `corpus: none` failure mode, one plane over. `examined` names the population
        column the instrument itself reported — the live spellings are all of the form
        `<subject>_examined` or a bare count of the subject — and its value, which MUST be 0. A
        non-zero `examined` with a null verdict column is a DIFFERENT instrument defect and is NOT
        this term (measured live: one property, a non-empty base examined, derived columns null).
      requires: [examined, notes]

# ===========================================================================
# mac.outcome_class — WHAT THE ENGINE DID ABOUT THE QUESTION.
#
# The grading axis the whole estate already reasons in — oracles, dashboards, the console's route
# column — and until now the ONE axis with no home here. It was declared in prose in the integration
# kit's testing plane ("expected: {outcome: COMMIT|ASK|REFUSE|BLOCK}") and nowhere a machine could
# reach, so the population could not be enumerated, and a population that cannot be enumerated cannot
# have a denominator.
#
# MEASURED, THE DAY THIS BLOCK WAS WRITTEN, over every structurally parsed declaration on an
# outcome-carrying key in the applied estate: 16.292 declarations, and they are NOT four spellings.
# COMMIT 13.957 · ASK 4.206 · REFUSE 1.347 · BLOCK 1.223 · DECLINE 1.049 · COMMIT_PENDING 247 ·
# ENUMERATE 119 · MODEL_PROPERTY 74 · DEFER 59 · ENGINE_ERR 3. `DECLINE` is a SYNONYM of `REFUSE`
# carrying more declarations than `REFUSE` has in the bundle that spells it, so searching for one
# finds a fraction of what is declared — the defect this block closes.
#
# THE MEMBERSHIP IS DECIDED FROM THAT MEASUREMENT, NOT FROM THE FOUR-CLASS IDEAL. A closed set that
# omitted a spelling in live use would turn working bundles red, so every measured spelling is
# declared here and carries a `status` saying what it IS — which keeps the four-class grading axis
# identifiable (`status: canonical`) while making the non-canonical tail countable instead of
# invisible. `status` is the field a consumer reads; it is not a second axis of meaning.
# ===========================================================================
outcome_class:
  kind: vocabulary
  closed: true
  description: >
    What the engine DID about a question — the disposition, never the channel it used. The four
    `canonical` terms are the grading axis; every other term is a spelling measured in live use and
    declared so the set can be closed without reddening a working bundle. A term's `status` says
    which: `canonical` (one of the four), `deprecated` (a synonym whose canonical form is named in
    `use`), `provisional` (a genuinely distinct intermediate state, not one of the four), and
    `non_grading` (a real declared disposition that is NOT a judgement about the answer — a metadata
    route, a composer decision, an outage). WHERE these are declared is the gate's business, not this
    block's: tools/check_outcome_class_closure.py carries the outcome-carrying key list, because the
    same key name carries a DIFFERENT axis in different bundles (`oracle_class` holds this vocabulary
    in one bundle's run records and a question-FAMILY code in another's dashboard), so membership
    cannot be judged by key name alone.
  terms:
    COMMIT:
      status: canonical
      description: >
        THE ENGINE ANSWERED. A value was produced, and every declaration it rests on resolved — the
        scope was pinned, the measure was legal at that grain, the names resolved to codes.
    ASK:
      status: canonical
      description: >
        A REQUIRED dimension was underspecified, so the engine asked instead of guessing. The
        question is answerable; it is not yet fully stated. Never a silent default.
    REFUSE:
      status: canonical
      description: >
        THE EVIDENCE IS ABSENT. The question is legal and the engine can state precisely what was
        missing — the scope with no row, the name that did not resolve — and says so rather than
        returning a zero a reader takes for a measurement.
    BLOCK:
      status: canonical
      description: >
        OUTSIDE WHAT THE ONTOLOGY GOVERNS. Not a gap in the data but a question this model does not
        undertake to answer, so answering it would be fabrication rather than retrieval.
    DECLINE:
      status: deprecated
      use: REFUSE
      why: >
        A pure synonym of REFUSE with no distinct meaning anyone has been able to state. It is the
        measured cost of leaving this axis ungoverned, and it is the larger of the two spellings:
        1.049 declarations across 68 files at the moment of closure, against REFUSE's 1.347, so a
        reader searching either word sees well under half the population. NOT MIGRATED HERE — the
        bundle that carries it has no remote, and rewriting a thousand declarations in an
        unrecoverable tree is a separate, human-authorised act. Declared so the debt is countable.
      measured_at_close: 1049
      files_at_close: 68
    COMMIT_PENDING:
      status: provisional
      description: >
        A COMMIT whose validation precondition has not yet passed — the answer is composed but not
        yet cleared to be reported as one. Genuinely distinct from all four canonical terms, which is
        why it is `provisional` rather than `deprecated`: collapsing it into COMMIT would report an
        unvalidated answer as a validated one.
      measured_at_close: 247
    ENUMERATE:
      status: non_grading
      description: >
        A dimension-member LIST — a metadata answer with no measure in it. A route stage, not a
        judgement about an answer's correctness, so it does not belong on the grading axis even
        though it is declared on the same keys.
      measured_at_close: 119
    MODEL_PROPERTY:
      status: non_grading
      description: >
        Routed to a property OF THE MODEL rather than to the warehouse — answered from declarations
        alone. Like ENUMERATE, a route target rather than a grade.
      measured_at_close: 74
    DEFER:
      status: non_grading
      description: >
        The composer declined to compose — it could not build a statement it was willing to stand
        behind, and said so instead of emitting SQL that would fabricate a shape.
      measured_at_close: 59
    ENGINE_ERR:
      status: non_grading
      description: >
        The engine raised. An OUTAGE, not a semantic outcome: nothing was judged, so it must never be
        counted as a refusal the model chose to make.
      measured_at_close: 3
# ===========================================================================
# mac.dq_status — WHAT A HUMAN DECIDED ABOUT A REGISTERED DATA DEFECT.
#
# The twin of outcome_class one plane over: outcome_class records what the ENGINE did about a
# question, dq_status records what a PERSON did about a defect. Both are dispositions, and neither
# is a channel.
#
# MEASURED 2026-09-14, on the register the DQ loop actually runs on (44 entries, 525 lines):
# a register issue's keys are `confidence, current_handling, finding, id, residual_risk, severity,
# sme_owner, table, title`. THERE IS NO STATUS. `metadata.status: open` exists at the REGISTER
# level and says nothing about any one issue. So "which issues are still open" is not a readable
# fact — it is INFERRED by joining the register to impurity_resolution_map.yaml and TREATING
# ABSENCE AS OPEN. Of 44 entries, 22 join and 21 do not (one is unaddressable; see below).
#
# ABSENCE IS NOT A STATE, and this is the exact cost: the 21 unlinked entries are a mixture of
# "deliberately accepted after a ruling", "won't fix", "resolved by something that forgot to say
# so", and "nobody has looked yet" — and the register cannot express which. An issue a named human
# examined and tolerated, and an issue no human has ever read, are THE TWO MOST DIFFERENT THINGS IN
# THE REGISTER, and today they are byte-identical. That is why `accepted` and `wont_fix` REQUIRE a
# `ruled_by` and a `reason`: those two terms are the ones that assert a human acted, so they are the
# two that must carry the evidence that one did. `open` and `resolved` assert no ruling and require
# none — `resolved` is already evidenced by the resolution map's cross-link.
#
# WHY THE VALUES ARE WRITTEN BARE. `status: open`, never `status: mac.dq_status.open`. It sits
# beside `severity: high` and `confidence: C` on the same issue, both of which are bare, and a
# third sibling spelled a fourth way would be the synonym problem this registry exists to prevent.
# The qualified `mac.dq_status.*` form is the REFERENCE form used in prose and across planes.
#
# WHY THIS IS VOCABULARY-ONLY AND BUMPS NO SCHEMA (CONFORMANCE §6 precedent). `mac.schema.json`
# ALREADY PERMITS the key: `$defs/DataQualityRegisterFile.properties.issues.items` declares no
# `additionalProperties: false` — measured, and witnessed by the fact that real bundles already
# carry undeclared `table` (44 issues) and `related` keys through validation today. So the key
# needs no schema change to be legal, and per RELEASING.md "When to bump" a change that does not
# touch mac.schema.json does not move `schema_version`. The measurement that settles WHERE the
# value set lives: of the 10 closed vocabularies in this file, only 3 (aggregation_effect,
# concept.identity, credential_mode) are ALSO restated as a `mac.schema.json` enum — 7 of 10 are
# vocabulary-only and enforced by a gate. This is the majority idiom, not an exception to it.
# The enforcing gate is tools/check_dq_resolution_sync.py, which READS these terms and never
# re-lists them (check_vocabulary_drift).
# ===========================================================================
dq_status:
  kind: vocabulary
  closed: true
  description: >
    The disposition of ONE registered data-quality issue — what a human decided about it, not what
    a pipeline did to it. Written BARE on `issues[].status` (like its siblings `severity` and
    `confidence`), referenced as `mac.dq_status.<term>`. `accepted` and `wont_fix` REQUIRE
    `ruled_by` (the named person or role who ruled — never "the team", never a tool) and `reason`
    (why the defect is real, and why it is being lived with rather than fixed), because those are
    the two terms that CLAIM a human acted. The set is closed so that absence of a status is a
    FINDING rather than a fourth, unnamed meaning.
  terms:
    open:
      description: >
        NOBODY HAS RULED ON IT YET. The honest default and the only one that may be written without
        evidence — it asserts nothing except that the defect is recorded and undispositioned. This
        is the state that absence was silently standing in for, and naming it is the entire point:
        an issue is `open` because someone wrote `open`, not because a join missed.
      requires: []
    accepted:
      description: >
        A NAMED HUMAN EXAMINED IT AND CHOSE TO LIVE WITH IT. The defect is real, it is not being
        fixed, and that is a decision on the record rather than an omission. This is the term that
        makes a FITNESS green legible: a property whose recorded expectation overlaps an accepted
        issue is GREEN BECAUSE THE DEFECT IS TOLERATED, which is not the same claim as correct.
      requires: [ruled_by, reason]
    resolved:
      description: >
        THE DEFECT IS GONE, dissolved by a transform that says so. Evidenced by the cross-link in
        impurity_resolution_map.yaml rather than by a ruling, which is why it requires no
        `ruled_by`: the evidence is structural and already gate-checked. A `resolved` issue still
        named by an acceptance-plane `accepted:` block is a REPORTED drift — the test is being
        excused for a defect that no longer exists.
      requires: []
    wont_fix:
      description: >
        A NAMED HUMAN RULED THAT IT WILL NEVER BE FIXED. Distinct from `accepted`, which tolerates a
        defect that could still be repaired: `wont_fix` closes the question. Carries the same
        evidence burden for the same reason — it asserts a ruling, so it must name who ruled.
      requires: [ruled_by, reason]
# ===========================================================================
# mac.connector — the NAMESPACE, and deliberately nothing else.
# ===========================================================================
connector:
  kind: registry
  closed: false
  description: >
    The `mac.connector.*` NAMESPACE. A `mac.`-prefixed connector id is a framework reference; any
    other namespace is not, by this file's header rule, and needs nothing from MAC. This block
    registers the NAMESPACE ONLY. It lists NO members: which first-party connectors exist is a fact
    about the MAC DISTRIBUTION, not about meaning, and lives in the shipped index
    (sdk/connector/index.json). A member list here would be a vendor product catalogue inside the
    canon — the same list that `$defs/connectorRef` refuses to be an enum of, relocated into the one
    file that defines meaning, and load-bearing, because a third first-party engine would then be a
    canon bump forever. It would also not validate: mac.vocabulary.schema.json closes a member object
    over exactly six keys (definition, additivity, serves, needs_sqlglot, doc, params_from), so the
    packaging keys such a list needs — config_majors, entry_point, status — are all three illegal, and
    an entry_point is a Python module path, a fact about MAC's own wheel layout, written into the file
    that defines meaning.

    AND tools/check_vocabulary_drift.py IS DELIBERATELY NOT PATCHED TO SEE THIS BLOCK. Measured: its
    _vocabularies() at :53-56 collects `kind: vocabulary` (with terms) and `kind: value_domain` (with
    members) and nothing else, so a `registry` is invisible to it — by omission, not by accident.
    Patching it to collect registries would buy a green line and not a check: :68 iterates
    (_ROOT / "tools").rglob("*.py") and :38 _LITERAL matches a dotted mac.NAMESPACE.TERM literal in
    MAC'S OWN PYTHON SOURCE, while connector ids live in mac.project.yaml#runtime.connector, in
    bundles, and in other repos — never in tools/*.py. The gate would then report clean over ZERO
    occurrences, permanently, while the typo it exists to catch (`mac.connector.athna` in a bundle
    manifest) stayed invisible.
    Worse: with the namespace registered and no members, `voc in vocab and term not in vocab[voc]`
    is true of EVERY `mac.connector.*` literal, so any MAC docstring narrating a hypothetical
    `mac.connector.postgres` would become a MAC008 ERROR ON PROSE — the exact false FAIL that gate's
    own docstring says it was designed to avoid. A registry the drift gate openly skips is honest;
    one it counts and structurally cannot see is a green line over nothing. Enforcement of connector
    ids lives entirely in `$defs/connectorRef`'s pattern (every bundle, every run) and in the
    shipped index. This paragraph exists so nobody later "fixes" the omission.

# ===========================================================================
# mac.credential_mode — HOW a credential is obtained. Never what it is.
# ===========================================================================
credential_mode:
  kind: vocabulary
  closed: true
  description: >
    The way a connector OBTAINS its credential, as a closed and BRAND-FREE set. Referenced by
    mac.schema.json#/$defs/credentialMode, which is the schema-side restatement of this set (the
    same idiom $defs/confidence and $defs/status already use); this file is the single home.

    WHY BRAND-FREE: the measured set in sdk/authoring/connection.py:48-68 is
    `aws-chain | profile | secretsmanager | ssm` — four AWS product names doing the work of three
    ideas, which is one cloud's credential chain promoted into the framework's grammar. A connector
    may keep its own spellings as ALIASES and report them MAC003 (fact-restated); the framework does
    not learn them.

    WHY SIX AND NOT FOUR: one resolution mode plus one opaque handle fits password-shaped auth and
    fails exactly where THE MECHANISM IS THE AUTH and there is no secret to fetch — interactive or
    browser SSO, mTLS client certificates, Kerberos/GSSAPI. None of those is ambient, named_profile,
    secret_manager or none, and a set that cannot spell them forces the connector to lie about which
    mode it is in.

    A NEW MEMBER HERE IS A FRAMEWORK RELEASE, not a bundle's choice. That is the price of `closed`,
    and it is the point: the alternative is a per-connector credentials schema, and the moment a
    connector may declare its own credential fields, one of them will be a password field and the
    structural guarantee that there is nowhere to put a secret is gone.
  terms:
    ambient:            "The host environment already carries the identity — an instance/task role, an ambient session, an environment chain. Nothing to fetch and nothing to name, so `ref` must be null or absent."
    named_profile:      "A named local profile selects the identity. `ref` is the profile name — a handle, never a secret."
    secret_manager:     "The credential is fetched at call time from the deployment's secret manager. `ref` is the path/id in that manager; MAC never resolves it and never sees the value."
    interactive:        "The human authenticates at connect time — browser SSO, a device code, an MFA prompt. There is no secret to fetch, so `ref` must be null or absent. Unattended answering cannot use this mode, and a host that needs one will fail loudly rather than hang on a prompt nobody can see."
    client_certificate: "A client certificate (mTLS) is the credential. `ref` locates the certificate material in the deployment's own store; the certificate itself never enters the bundle."
    none:               "No credential is required — the engine is local or open. Distinct from the block being ABSENT only in that it says so out loud; both are legal, and absent is the honest spelling when a connector has no credential concept at all."

canon:
  kind: value_domain
  closed: false                    # extends as patterns surface new deterministic needs (A5)
  description: The deterministic UDFs a concept's realized_by binds to; logic in tools/canon/.
  terms:
    composite_key_guard:   { serves: context_dependent_meaning, needs_sqlglot: true,  doc: "reject a parent-scoped code used without its scope columns" }
    # ADDED 2026-09-25. Both had a full canon page -- signature, reference implementation, plug-in,
    # limits -- and a pattern citing them back, and were absent from this list. A concept naming
    # either would have failed reference resolution while the manual documented it in detail.
    # Found by check_canon_documented.py, which compares this list, the pages and the runtime.
    array_membership_guard: { serves: multivalued_bridge,        needs_sqlglot: true,  doc: "reject equality on a MANY-valued column; membership is the only correct test" }
    opaque_code_guard:      { serves: contaminated_code,         needs_sqlglot: true,  doc: "reject reading meaning out of an opaque code's embedded structure; resolve by name instead" }
    # `params_from` names the DECLARATION each parameter is readable from. A binding that attaches
    # one of these is stating a fact that already has a home — MAC003 if it agrees, MAC004 if it does
    # not. Measured 2026-08-19: two <dataset> bindings attached `code` and BOTH disagreed with
    # identity.canonical_key (code='code' vs <brand_code>; code='market' vs iso2), because a regex
    # over rule prose had guessed what the concept already declared.
    refuse_measure_no_row:
      serves: exclusion_no_evidence
      needs_sqlglot: false
      doc: "RENDER canon — a measure has no row for the resolved scope; emit the refusal clauses"
      params_from:
        label: concept.label
    resolve_by_register:
      serves: contaminated_code
      needs_sqlglot: false
      doc: "RENDER canon — resolve a NAME to a CODE through a declared register, never through the
            display label. MEASURED on <domain>/<dataset>: four rules said this with different nouns, and each
            existed because the register carries a human-readable column that LOOKS like an identity
            (market_label_raw = HOME for the home country; a product's display name where the search key is
            name_key). params: thing, code, register, search, display_label, scope, fact_join,
            served_view."
    refuse_unresolvable_name:
      serves: exclusion_no_evidence
      needs_sqlglot: false
      doc: "RENDER canon — a name does not resolve to a code; emit the refusal clauses"
      params_from:
        thing: concept.label
        # The canonical key left `concept.identity.canonical_key` on 2026-10-05; it is the column
        # carrying `identity: canonical`, which sits inside a LIST and so is addressed by this
        # literal rather than a dotted path (check_canon_binding._CANONICAL_COLUMN resolves it).
        code: concept.grounding.columns[identity=canonical]
    # RETIRED 2026-10-07, operator ruling after a five-agent triage of all 23 canons. FOUR, not the
    # five the triage proposed: `exclusion_filter` was reinstated the same hour, because the suite
    # proved it WORKS — `test_transforms_rewrite_bind_and_disclose_on_real_planner_sql` exercises it
    # end to end against rendered planner SQL. The triage's case was that contoso5's only two uses
    # were rewritten as `population_select`, which is true and is an argument about this BUNDLE, not
    # about the canon. Unused is not the same as unimplemented, and retiring a tested, hooked
    # transform because the one bundle in scope has no case for it would destroy working behaviour
    # to tidy a list. The terms are
    # DELETED rather than flagged, and that is the enforcement: `check_references` resolves every
    # `realized_by.udf` against this namespace and an unknown canon is an ERROR, so a binding to a
    # retired canon now refuses at the gate instead of parsing and deciding nothing. Each page stays
    # where it is, marked `status: retired`, because 28 pages link to the five and a moved page is a
    # broken link. Why each one went:
    #   ambiguity_gate — the four *_select canons each construct their own ASK and none calls it; bound, it can only refuse
    #   closure_anomaly_check — needs inline values.items, which this estate bans; check_register_membership does the job
    #   grouping_from_register — resolve_by_register already expresses a grouping; its own page says so
    #   relation_alias_resolve — superseded by path_select, which shipped and is bound
    exclusion_filter:      { serves: impurity_disposition,      needs_sqlglot: true,  doc: "inject an exclusion predicate for reliably-identifiable junk (bake)" }
    additivity_guard:      { serves: semi_additive_balance,     needs_sqlglot: true,  doc: "reject SUM of a measure across a non-additive axis" }
    axis_default:          { serves: tracking_vintage,          needs_sqlglot: true,  doc: "inject a safe default for an unconstrained orthogonal axis" }
    snapshot_collapse:
      serves: scd_type_2
      needs_sqlglot: false
      doc: "collapse a versioned relation to current / as-of one row per key; the partition is a
            COMPOSITE column list and the order accepts a tie-break (vintage, then written-at)"
      params_from:
        # READ the cell key from the relation's MEASUREMENT — never retyped into the binding, and
        # since 2026-08-20 never hand-declared either. A partition copied per concept is one chance
        # per copy to drop a column, and dropping `role` folds six reporting perspectives into one
        # arbitrary row, silently. Hand-DECLARING it turned out no safer: the previous home was an
        # `x-` extension outside every gate, and two of its four declarations were false against the
        # warehouse while still reading as VERIFIED. mac_admit_identity.py derives this key and dates
        # it against the source watermark.
        natural_key: 'profile#identity_evidence.key'
    scoped_latest:         { serves: tracking_vintage,          needs_sqlglot: false, doc: "MAX(date) over a scoped subset, not the whole table" }
    hierarchy_rollup:      { serves: recursive_hierarchy,       needs_sqlglot: false, doc: "recursive-CTE subtree: a node and all its descendants" }
    densify:               { serves: absence_semantics,         needs_sqlglot: false, doc: "LEFT JOIN a sparse fact onto the full grid, COALESCE 0 (genuine-zero)" }
    # ADDED 2026-10-01, operator ruling: "rule act like DB trigger. if the condition is met ...
    # then something should happen ... this must be doable with symbolic language and having null or
    # not null test is good first step".
    #
    # WHAT IT IS FOR. A business state is often a COLUMN COMBINATION, not a stored value: a store is
    # closed WHEN `close_date IS NOT NULL`. That fact has no home on a concept or an edge -- it is a
    # statement about which rows the concept HAS under a given reading, which is a rule. This canon
    # is the body of such a rule: named populations, each a structured predicate, one marked default,
    # and the columns the whole set is a statement ABOUT.
    #
    # WHY IT IS NOT `exclusion_filter`. That one disposes of reliably-identifiable junk and is never
    # overridable -- it is the DOMAIN. A population is a DEFAULT READING, and a question that makes
    # its own statement about the same columns displaces it. Conflating them is how
    # `close_date IS NULL` came to be ANDed onto a question about closed stores: measured on
    # contoso5, 0 rows against a truth of 9.
    #
    # PARAMS: `populations` (name -> predicate, the `all:` form) and `default` (which name applies
    # when the question says nothing; ABSENT is a declaration that the axis has no "unless told
    # otherwise" reading). THE CONDITION IS NOT A PARAM. It is the RULE'S OWN `binds`, and this
    # entry said `about` for the hours between the ruling and the build — corrected 2026-10-01
    # against mac_runtime/canons/population_select.py, whose signature takes `binds`. The
    # correction is the point of the mechanism applied to its own registry: a second list beside
    # `binds` would be a second home for the condition, it would NOT inherit the
    # `rule-binds-grounded` shape that resolves bound columns against the physical layer, and
    # `canonRef.params` being untyped means an `about:` an author wrote would be accepted and
    # SILENTLY IGNORED.
    population_select:
      serves: competing_definitions
      needs_sqlglot: false
      doc: "select WHICH ROWS a concept has: named populations as structured predicates (all: of
        {column, op, value|values} over is_null/is_not_null/eq/ne/in/not_in, every value BOUND —
        never SQL text, which assert_bound_params_only refuses) and one optional `default`. THE
        CONDITION IS THE RULE'S OWN `binds`, not a param: a question constraining a bound column is
        making its own statement about that state, so the default steps aside and the answer
        discloses it. One rule is one AXIS. A name is matched EXACTLY, never fuzzily. The unaskable
        DOMAIN stays on grounding.value_filter; a predicate a question can ask the other side of
        does NOT. The trigger for a business state that is a column combination rather than a
        stored value — `closed` IS `close_date IS NOT NULL`."
    ratio_select:
      serves: competing_definitions
      needs_sqlglot: false
      doc: >
        WHICH DENOMINATOR A NAMED RATIO DIVIDES BY -- the twin of population_select, which says which
        ROWS a concept has. Both map a word a reader says to a declared body, and both were prose.
        `params.ratios` is a name -> {denominator, surfaces} map with an OPTIONAL `default`; the
        numerator is the rule's own `binds`, as it is for a population. A name is matched EXACTLY over
        its declared `surfaces`, case/space/underscore folded and nothing more -- no string distance,
        for the reason population_select records. TWO RATIOS AND NO DEFAULT IS A DECLARATION: a
        question naming neither must ASK, with both names offered, which is the resolution ladder's
        third rung. MEASURED on the worked bundle 2026-10-02: Discount's percentage is over
        GrossRevenue (5.93%) and not NetRevenue (6.30%) on the same money; Margin names TWO --
        margin % over NetRevenue (55.91%) and markup % over SalesCost (126.79%), a factor of 2.27 on
        the same profit. `Intent.denominator` has always carried the choice and the planner has always
        read it, so a model's guess went straight through and nothing declared which was meant.
    path_select:
      serves: competing_definitions
      needs_sqlglot: false
      doc: >
        WHICH RELATION AN ANSWER IS REACHED THROUGH -- the fourth member of the family
        population_select, ratio_select and column_select belong to. Those three map a word a reader
        says to the ROWS a concept has, the FIGURE a ratio divides by, and the COLUMN that answers;
        this one maps it to the EDGE the answer travels. `params.paths` is a name ->
        {via: <edge_id>, surfaces: [...]} map with an OPTIONAL `default`, declared on the concept
        whose key several relations carry. A name is matched EXACTLY over its declared surfaces,
        case/space/underscore folded. NO DEFAULT IS A DECLARATION: a question naming no reading ASKS
        with every reachable one offered. IT NAMES THE LAST HOP, NOT A CHAIN -- the first hop is the
        measure's own edge to its dimension and is forced, so chains would need an entry per measure
        per reading (14 on contoso5 against 3 edges into Country) and cannot be enumerated by pattern,
        because an edge is named for what the relation MEANS -- `net_revenue__by__store` beside
        `order__placed_at__store`. MEASURED on contoso5 2026-10-06, and this canon exists
        because of it: `country_code` is carried by dim_customer, dim_store and dim_location, the
        operator ruled on 2026-09-30 that an unqualified sales question means the STORE's country
        (confidence C), and ALL SEVEN measures took the customer path -- because both candidate paths
        are two hops, ontology/graph.py breaks the tie with unweighted BFS over an adjacency built in
        edges.yaml DECLARATION ORDER, and `net_revenue__by__customer` sits at line 276 against
        `net_revenue__by__store` at 289. Germany 2025 reads +18.07% through the customer and +49.65%
        through the store, because the store path excludes the online channel and online is 40% of
        net revenue. check_plan_replay reported `0 gained` throughout and was right: nothing was lost,
        the answer was wrong. The ruling had no formal home -- 38 edges carry 0 defaults -- so it
        survived only as 1105 chars of Country.default_reading, prose telling the model something the
        planner then overrode. DISCLOSURE IS NOT A PARAMETER: the ruling requires the answer to say
        which path it took, and a flag could be set false. Consulted in planner/joins.resolve_join
        BEFORE find_join_path, so the line-order tie-break keeps deciding only what nobody has ruled
        on. The long form is
        reference_manual/rules_and_canons/competing_definitions/path_select.md
    column_select:
      serves: competing_definitions
      needs_sqlglot: false
      doc: >
        WHICH COLUMN OR JOIN PATH A NAMED READING RESOLVES TO -- the third member of the family
        population_select and ratio_select belong to. Those two map a word a reader says to the ROWS a
        concept has and to the FIGURE a ratio divides by; this one maps it to the COLUMN that answers.
        `params.columns` is a name -> {column, surfaces} map with an OPTIONAL `default`, and the axis
        is the rule's own `binds`, as it is for a population and a ratio. A name is matched EXACTLY
        over its declared surfaces, case/space/underscore folded. NO DEFAULT IS A DECLARATION: a
        question naming neither reading ASKS with both offered. MEASURED on the worked bundle
        2026-10-05: an order's period is `order_date` and not `delivery_date`, which was a prose
        `then` only a model read and which changes the number -- an order counted on its delivery
        date falls in a different month. `axis_default` could not hold it: that canon injects a VALUE
        into a column and nothing selected BETWEEN columns. IT CHOOSES BETWEEN COLUMNS THE CONCEPT
        ITSELF DECLARES, and three rules that look like the same shape are not: "revenue means net"
        chooses between CONCEPTS, "a sales question means the store country" chooses a JOIN PATH, and
        "an unscoped question covers all time" is about the WINDOW and has no alternative column.
    alias_resolve:         { serves: competing_definitions,     needs_sqlglot: false, doc: "resolve a surface token (scope_relative tier first, then multilingual) to a canonical value code; >1 hit or unknown-in-closed-set -> ASK; never a silent bind/drop" }
    enum_from_register:    { serves: explicit_closure,          needs_sqlglot: false, doc: "realize a closed enumeration's value set by reading a PINNED register (a lookup artifact) instead of inline values.items — the value domain IS the register's `code` column (params.register names the artifact, params.key_column names the code column, default 'code'). Declarative registry entry (like alias_resolve): a consumer sources the value set from the register; the concept omits items and supplies only the register pointer. The register-sourced twin of an inline closed enumeration." }

# ===========================================================================
# mac.diagnostic_code — THE CLOSED DIAGNOSTIC TAXONOMY. Every finding the compiler can make.
#
# MOVED HERE 2026-08-18, on the operator's observation. It lived as a Python dict in
# tools/mac_diag.py while ALSO being tabulated in CONFORMANCE.md — two hand-maintained homes for a
# taxonomy whose own docstring called it CLOSED. That is precisely the defect check_vocabulary_drift
# was built to catch hours earlier, and the framework was committing it about its own error codes.
#
# The CODE is the contract: its text may be reworded, its meaning may not change without a version
# bump, because suppressions and counts are keyed on it. `severity` is the DEFAULT a check emits at;
# a check may raise or lower it for a specific finding and says why when it does.
# ===========================================================================
diagnostic_code:
  kind: vocabulary
  closed: true
  description: The closed taxonomy of findings the MAC compiler can report.
  terms:
    MAC001:
      kind: undefined-artifact
      severity: error
      group: "what is not defined"
      description: "present in the bundle, carries no MAC definition, not declared out of scope"
    MAC002:
      kind: invalid-artifact
      severity: error
      group: "what is not defined"
      description: "has a MAC definition and does not satisfy it"
    MAC009:
      kind: undeclared-extension
      severity: error
      group: "what is not defined"
      description: "an x- key with no profile entry — CONFORMANCE.md §2: undeclared debt, not license"
    MAC003:
      kind: fact-restated
      severity: warning
      group: "what is defined redundantly"
      description: "one fact stated in more than one home; nothing keeps the copies in step"
    MAC004:
      kind: fact-contradicted
      severity: error
      group: "what is defined redundantly"
      description: "statements of one fact disagree — something downstream is reading the wrong one"
    MAC005:
      kind: capability-unadopted
      severity: warning
      group: "what is offered and not taken"
      description: "MAC offers a mechanism for this and the bundle does not use it"
    MAC006:
      kind: claim-unearned
      severity: warning
      group: "what is claimed without warrant"
      description: "a conformance level or confidence asserted with no evidence behind it"
    MAC010:
      kind: change-unprotocolled
      severity: warning
      group: "what is claimed without warrant"
      description: "an authored or tuned object with no entry in the change record"
    MAC007:
      kind: guard-dead
      severity: error
      group: "what points at nothing"
      description: "a rule or guard testing a value that cannot occur — it can never fire"
    MAC008:
      kind: reference-unresolved
      severity: error
      group: "what points at nothing"
      description: "a reference that resolves to nothing"
    MAC011:
      kind: coverage-missing
      severity: error
      group: "what is not covered"
      description: "a required completeness the bundle does not reach"
    MAC012:
      kind: extension-duplicates-core
      severity: error
      group: "what is not covered"
      description: >-
        an `x-` extension key. Prohibited outright, because it sits BY CONSTRUCTION outside every
        gate MAC has, so nothing can check what it holds. Measured the day x-grain was retired, TWO
        of four declared cell keys were false — the main fact view claimed 0 multi-row against millions,
        and a second fact view claimed 0 against nearly all of its cells. The two that HELD are the two
        that a view enforces: a view that withholds ambiguous cells, and a current-snapshot view whose
        collapse makes the key true by construction (its declared cell count reproduced to within a
        hundred-odd cells). That is the shape of the defect: the declaration is false exactly where nothing makes
        it true, and a field no gate can reach costs nothing to be wrong in. Three mechanical predicates identify the duplicate case — same subject,
        same value shape, same closed domain with non-empty overlap. Where there is NO core
        equivalent the finding is a MAC gap, not a shortcut: say what the wall is and change MAC,
        rather than declaring beside it. Enforced by tools/check_extension_keys.py, which exits
        non-zero, because a check that does not block is not enforcement.

# ===========================================================================
# mac.data_plane_gate — WHY the ontology pipeline is closed. One home for the
# reject codes the guard, the CLI gate and the console page all cite.
# ===========================================================================
data_plane_gate:
  kind: vocabulary
  closed: true
  description: >
    The reject classes of the DATA→ONTOLOGY handoff, as a closed set. A bundle may declare TWO
    pipelines (mac.schema.json#ProjectFile.reproduction.pipelines): a DATA pipeline whose declared
    exit is ITS OWN REGISTER, FULLY DISPOSITIONED — every registered issue carrying a terminal
    `mac.dq_status` term with that term's own evidence — and an ONTOLOGY pipeline that may not
    start until that exit is reached. Three consumers read the same verdict — the PreToolUse guard
    that refuses a write, the CLI that refuses to start the ontology pipeline, and the console page
    that tells the operator what is blocking — so the code set lives HERE and not three times.

    TWO MEMBERS ARE NOT BLOCKS. `not_declared`: a bundle that declares one pipeline is governed by
    the operator's unlock marker alone, exactly as before. `approval_missing`: RETIRED 2026-09-18,
    when the exit collapsed from a separate sign-off file onto the register it described — read its
    own entry for the reason and for what the collapse costs (PREVENTION drops to ATTRIBUTION).
    Every other `approval_*` member is still a block, because a sign-off file that IS present is
    honoured rather than ignored.

    WHY A CODE AND NOT JUST A SENTENCE. The sentence is rendered to a human and will be reworded;
    the code is joined on. A page grouping by sentence re-groups every time the wording improves.

    WHAT THIS SET DELIBERATELY DOES NOT CONTAIN: a member for "too many issues", for "severity too
    high", or for any count a bundle or a framework could declare as a threshold. The gate reads no
    grading field. `severity` is machine-authored (capped at `confidence: I` by CORE.md §4), so a
    gate reading it would grade the machine against its own opinion — and a non-defect parked at
    `high` would block an ontology forever on bookkeeping rather than on data. Measured
    2026-09-18: a live register's entry was edited from `severity: high` to `severity: low` the
    same day a severity-reading gate was proposed, its own inline comment naming the coming gate as
    the reason. Goodhart arrived within hours. The threshold here is per-issue HUMAN COVERAGE, and
    the only way to move it is for a person to name the specific thing.
  terms:
    not_declared:
      description: >
        The bundle declares no `reproduction.pipelines`, so the two-pipeline gate does not apply.
        EXIT 0, and not a block — the legacy affordance (the operator's `.ontology-unlocked`
        marker) governs its ontology plane unchanged. The one member that is a PASS.
      blocks: false
    approval_missing:
      description: >
        RETIRED 2026-09-18, and kept as a member rather than deleted so a joined-on code does not
        vanish from a closed set and so the reason survives where the code did. It used to mean:
        two pipelines are declared and no sign-off file exists at the path the manifest names.
        WHY IT IS NO LONGER A BLOCK. The separate sign-off file was the BUILD'S design choice, not
        the operator's requirement. The operator's requirement, verbatim, was "we cannot
        automatically proceed with creating ontology as long as we did not approve the
        configuration of datasets in full amount. this means we did not reduce the # of issues to
        the acceptable minimum" — and that reduction is recorded in the REGISTER, one argued
        disposition at a time, which the separate file then duplicated in a LESS informative form:
        one date and one name against N individually-argued dispositions. So the exit collapsed
        onto the register (`issue_undispositioned` is the blocker that carries it) and the operator
        stopped being asked to sign a second artifact saying what the first one already said.
        WHAT THE COLLAPSE COSTS, because it is not nothing: the sign-off was the one artifact an
        agent provably cannot write — the guard denies that path unconditionally, marker or not —
        and the register IS agent-writable. The guarantee therefore drops from PREVENTION to
        ATTRIBUTION: git blame, the `ruled_by` name and the reason text, not a token no agent can
        reach. That is the ceiling this estate had already reached and recorded in its own words,
        DETECTED-AND-BLOCKED, AUTHORIZED OUT-OF-BAND, and a ceremony that buys nothing the operator
        wants is worse than an honest ceiling. See PIPELINES.md §8 gap 11.
        AN APPROVAL FILE THAT IS PRESENT IS STILL HONOURED — every `approval_*` member below stays
        a block — so a bundle that carries one does not silently lose it.
      blocks: false
      retired: '2026-09-18'
    approval_unreadable:
      description: >
        The sign-off exists and cannot be parsed. Counts as NO approval (deny — the safe
        direction), and the refusal prints the offending line number so the operator can fix their
        own typo. A file no agent may write is a file only the operator can un-break; that cost is
        disclosed rather than eliminated.
      blocks: true
    approval_unratified:
      description: >
        The sign-off exists but does not ratify: its `status` is not `applied`, its `verdict` is
        not `confirmed`, or its `outcome` is not `ratified`. A draft is not an approval.
      blocks: true
    approval_agent_stamped:
      description: >
        The sign-off's write stamp names an agent (`submitted_via: agent`) or an identity nobody
        verified or declared (`identity_basis: imported`). An agent may write a DESCRIPTION; only a
        human may write a DISPOSITION. Rejecting the honestly-stamped case is what makes the
        dishonest one a lie rather than a shortcut.
      blocks: true
    issue_uncovered:
      description: >
        A registered issue id the sign-off does not name. This is the threshold, and it is why no
        number is invented: the count of uncovered ids must be 0, and it cannot move unless a human
        names the specific thing. No wildcard is permitted — if per-issue naming is too many ids,
        the fix is a coarser REGISTER, never a coarser gate.
      blocks: true
    issue_undispositioned:
      description: >
        ANY registered issue carrying no terminal `mac.dq_status` term, or one whose term's own
        `requires:` list is unmet. The law is READ from `mac.dq_status`, never restated here.
        THIS IS THE DATA PIPELINE'S EXIT CONDITION since 2026-09-18, and it widened that day from
        graded defects (`DQ-`) to EVERY id. Before, an `NS-` non-promotion needed only to be NAMED
        in a separate sign-off, because acknowledging a disclosure is a different act from
        dispositioning a defect — and the sign-off was where the acknowledgement lived. With the
        sign-off retired (see `approval_missing`) there is nowhere else for an `NS-` entry's
        acknowledgement to be recorded, so it is recorded in the register like everything else: a
        terminal disposition with a namer and a reason. An `open` issue closes the pipeline and is
        named with its id and the denominator.
      blocks: true
    resolved_on_non_defect:
      description: >
        A CATEGORY ERROR, and the one reject class that exists because a disposition can be written
        by a machine. `mac.dq_status.resolved` requires NOTHING — its evidence is structural, the
        cross-link in impurity_resolution_map.yaml — and both the register and that map are
        agent-writable, so a gate reading "status is not open" is satisfiable with no human name
        anywhere. `resolved` means A TRANSFORM DISSOLVED A DEFECT. An `NS-` entry is a relation
        MEASURED AND DELIBERATELY NOT SERVED: it was never a defect and no transform dissolved it,
        so `resolved` cannot be true of it and is refused. The honest disposition of a
        non-promotion is `accepted` or `wont_fix`, both of which name a ruler.

        DISCLOSED GAP, not fixed here: `mac.dq_status` has no term meaning "measured, and it is not
        a defect". Non-promotions are therefore dispositioned with defect-shaped words. Adding a
        term to a closed vocabulary is a framework change with its own gate consequences; this
        member refuses the one spelling that lets a machine clear the register, and names the gap.
      blocks: true
    coverage_dangling:
      description: >
        The sign-off names an id the register no longer holds. Distinct from `issue_uncovered` and
        reported separately, because they are opposite failures — a human approved something that
        has since been renamed or deleted, versus something they never saw.
      blocks: true
    plane_moved:
      description: >
        The sign-off's digest no longer matches the data plane as it stands. The ontology already
        authored is NOT deleted and NOT invalidated — doing that would be the blanket lock's
        mistake in a new costume. Further ontology authoring stops, the plane reads STALE with the
        date of the sign-off it invalidates, and the moved files are named so the diff is the
        review.
      blocks: true
    register_unrun:
      description: >
        Datasets are served and the register holds zero issues. That is a step that did not run,
        not a clean bill of health, so the data plane cannot be approved from it. A gate that
        passes having measured nothing is worse than none (CORE.md §2).
      blocks: true
    no_datasets:
      description: >
        Nothing is served, so there is nothing for an ontology to bind to. Vacuity, refused in the
        other direction.
      blocks: true
    stage_unassigned:
      description: >
        `pipelines` is declared and a `reproduction.stages[]` entry carries no `pipeline`, so a
        half-migrated manifest cannot read as complete.
      blocks: true
    gate_unreachable:
      description: >
        An input could not be read — the manifest, the register, the vocabulary, or the framework
        itself is absent beside the bundle. UNKNOWN => DENY, per the estate's own compile-gate
        rule: unreachable means unknown means refuse. A gate that could not run must never read as
        an open door. On the console this is the one state that is neither green nor red: it says
        the gate could not judge.
      blocks: true

# ==========================================================================
# mac.concept.* — FOLDED. These 9 vocabularies were top-level keys spelled with
# dots (`concept.aggregation_effect:`). The dotted name is still the identity everything
# uses; the nesting is how a person reads it. `tools/mac_vocab.py` returns the dotted form
# from either shape, which is what made this an authoring choice instead of an API change.
# ==========================================================================
concept:

  # ===========================================================================
  # mac.concept.aggregation_effect — how a measure may be combined along ONE axis.
  # ===========================================================================
  aggregation_effect:
    kind: vocabulary
    closed: true
    description: >
      THE CORRECT FOLD of a measure along a single axis. Every term names the OPERATION, so the set
      answers one question in one grammar: "how do I fold this measure along this axis?"

      v0.1.15 REPLACED THE PREVIOUS FOUR. They answered the same question in three different grammars —
      `additive` named a property, `averageable` named a capability, `non_aggregable` named a negated
      capability, and `point_in_time` named a POINT IN TIME rather than any operation at all, leaving a
      reader to infer the fold. Worse, the old set sat beside a second, LOSSY scale
      (mac.schema.json#additivityAxis: additive | non-additive) whose legacy spelling `non_additive` was
      one character from `non_aggregable`, in a different scale, meaning something else. Eight <dataset> rules
      fell into exactly that gap and guarded on a value no register could hold.

      `last`/`point_in_time` MERGED INTO `precomputed`, on the bundles' own evidence: an inventory measure says
      "READ the level at the END of the period" and a reach measure says "READ as stored ... resolve to the
      matching pre-computed abstraction level instead of folding". Both READ a stored row and refuse to
      fold; they differ only in WHICH row, which is a RESOLUTION question and already lives in each
      concept's `resolve.*` rules, never in the fold vocabulary.
    terms:
      additive:
        definition: "SUM is correct across this axis."
        # WHICH OPERATION OF `grammar/query_grammar.yaml#operations` THIS EFFECT PERMITS. Every term's
        # own prose already named it ("SUM is correct", "the correct fold is a mean", "NO fold is
        # valid") and no reader could consult a sentence, so two live call sites decided it instead:
        # `effect == "additive"` in planner/plan.py and canons/additivity_guard.py, which makes
        # `average` a VIOLATION rather than the AVG the term defines. The operation's SQL stays in the
        # grammar, where `contributes.select` already holds it -- this names the operation, never the
        # function, so there is one home for each.
        #
        # A LIST, AND `additive` CARRIES TWO. A first cut wrote one operation per term, which says
        # that an additive measure may only be SUMmed -- and "the average monthly revenue" is a
        # legitimate question about an additive measure. `average` carries only `average`, because
        # that is precisely what the term asserts: the sum does not mean anything. So the list is the
        # set of operations the effect PERMITS, and the question's own operation must be in it.
        folds_with: [sum, average]
      average:
        definition: "SUM is MEANINGLESS across this axis (a total of durations, rates or ratios is not a number anyone wants); the correct fold is a mean / median / percentile. Not a weaker `additive` — the two disagree about whether the sum means anything."
        folds_with: [average]
      none:
        definition: "NO fold is valid along this axis. If a value is needed at a coarser grain it must already EXIST as a stored row: RESOLVE it, never compute it. Which row that is, is determined for the TIME axis by mac_rules.yaml#mac.resolve.period_reading (a bare period reads its END cell) and needs no per-concept rule. Only a NON-time axis whose answer genuinely varies — a reach measure resolving to a matching abstraction level — needs the concept to say."
        # NO `folds_with` IS THE DECLARATION: no operation folds this axis. Stated by ABSENCE rather
        # than by a `none` value, so a reader asking "which operation?" gets no answer instead of an
        # answer that must then be special-cased -- the same shape as a population axis with no default.

  # ===========================================================================
  # mac.concept.axis — the KIND of an aggregation axis, for additivity purposes.
  # An applied ontology maps each concrete dimension to one kind; the additivity LAW is stated over kinds,
  # so it is universal (domain-independent).
  # ===========================================================================
  axis:
    kind: vocabulary
    closed: true
    description: >
      WHETHER A COLUMN IS AN AXIS, and if so the additivity-relevant kind. RENAMED from `axis`
      2026-10-07 (operator: "cant we just call it axis ?"): the VALUE was always the kind, so carrying
      "kind" in the name restated it — the same redundancy `semantics.measure_type` and the prose `grain`
      were carrying. REQUIRED on every declared column from the same date, which is the substantive half
      of the change: absence used to mean two different things that nothing could separate.
    terms:
      time:        "An ordered temporal axis (day, month, quarter). Stocks do not accumulate along it."
      categorical: "A non-temporal entity/dimension axis (product, location, customer). Flows and stocks are additive along it."
      none: >
        NOT AN AXIS. No question groups or filters by it, so there is nothing for the fold law to judge:
        a surrogate row identifier (`line_number`), a housekeeping stamp, the measure payload itself.
        THIS TERM EXISTS SO SILENCE STOPS BEING AMBIGUOUS. Before it, a column with no `axis` could
        mean "not an axis" or "the author did not say", and nothing could tell the two apart — measured
        2026-10-07 on contoso5: 12 surrogate key columns meant the first and 30 declared dimensions meant
        the second, and both read identically. The operator's own test, from the brand-edge ruling of the
        same week: an absence may be a declaration only when nothing else could be meant.
        IT IS NOT `never_axis`, and the two must not be merged. `none` says no one would group by it;
        `rulings.never_axis` says someone WOULD and may not, names the measurement that establishes the
        harm, and makes a query that tries it a REFUSAL THAT CITES THE REASON. A privacy-ruled column is
        therefore `axis: categorical` AND `never_axis:` — what it is, and that you may not.


  # ===========================================================================
  # mac.concept.class — WHAT KIND OF THING A CONCEPT IS. The one genuinely concept-level typology:
  # unlike identity (retired 2026-10-05), no column can express it. `Store/square_metres` and
  # `UnitsSold/quantity` are column-identical, and only a person can say that the floor area is ABOUT
  # a store while the quantity IS units sold.
  #
  # DECLARED HERE FOR THE FIRST TIME, 2026-10-05. The class vocabulary lived ONLY in mac.schema.json,
  # so `check_vocabulary_parity` could not police it — and the two homes had already drifted: the
  # schema admitted SEVEN terms and mac-runtime's `ConceptClass` admitted six. A concept writing the
  # seventh (`meta`) validated and then failed to load.
  #
  # SHRUNK FROM SEVEN TO FOUR, operator ruling 2026-10-05, each removal measured:
  #   `reference` -> RENAMED `entity`. Both named the same thing and `reference` was already taken one
  #       plane down — `mac.concept.column.identity.reference` is a POINTER AT a thing. A class and a
  #       column flag meaning opposite ends of one arrow is the `dimension` collision again.
  #   `meta`      -> DROPPED. In the schema, never in the runtime enum; the meaning plane synthesises
  #       its own concepts as entities. It returns when something reads it.
  # `grouping` WAS PROPOSED FOR REMOVAL AND KEPT, which is worth recording because the first
  # measurement was wrong. `mac_to_graph` lumps entity/grouping into one NODE_CLASSES set, so that
  # reader cannot tell them apart — but it is not the only one: the schema makes `members.over`
  # MANDATORY for a grouping, and console_api draws the CONTAINMENT channel from it (whole->part
  # membership, which FRAMEWORK.md keeps on the concept deliberately instead of in edges.yaml).
  # A term with a required companion field and a renderer is not ballast.
  # What survives is what is READ: `measure` at 11 runtime sites (the COUNT(DISTINCT) vs SUM fork),
  # `event` at one (the fact a filtered count anchors on), `enumeration` at four in the framework
  # (excluded from graph nodes; its register inlined into the manual), `grouping` for containment,
  # `entity` as the default.
  # ===========================================================================
  class:
    kind: vocabulary
    closed: true
    description: What kind of thing a concept is (declared once per concept).
    terms:
      measure:     "A NUMBER a question folds. Its measure column IS the concept, which is what separates it from a thing that merely carries one. Decides COUNT(DISTINCT key) vs SUM(column)."
      event:       "Something that HAPPENED, at a grain of one row per occurrence. The fact a filtered count anchors on when the subject is a dimension."
      enumeration: "A closed value set whose members a register states, so a non-member is answerable without probing. Not a graph node; its register is inlined into the manual."
      grouping:    "A roll-up ABOVE a leaf concept — it GROUPS another concept's members. Declares `members.over: <Concept>` (the schema requires it) and that containment is drawn as the graph's membership channel, never as an edge."
      entity:      "A THING a question slices by, counts, or joins to — a customer, a store, a product, a country. The default: a concept that is not a number, an occurrence, a closed value set, or a roll-up is one of these."

  # ===========================================================================
  # mac.concept.rule — the closed taxonomy that types every behavioural rule (what the rule governs).
  # A typed rule references its kind (kind: mac.concept.rule.<term>) instead of an inline string, so the set
  # is enforced and defined once. (`default` could be argued a sub-case of `resolution`, and `guarantee`
  # is an inherited fact rather than a directive — kept distinct for clarity; prune at a later revision
  # if warranted.)
  # ===========================================================================
  rule:
    kind: vocabulary
    closed: true
    description: What a behavioural rule governs — the rule's type.
    terms:
      resolution:  "Identity / matching / scoping of an entity from the question (name, code, key, definition)."
      aggregation: "Measure math — additivity, period bounds, grain (how a measure may be summed/read)."
      default:     "What to assume when an axis is unspecified but a safe default exists."
      ambiguity:   "An underspecified REQUIRED dimension — ASK, never guess."
      exclusion:   "What to filter out / never include (pseudo-entries, unmapped rows, stale vintages)."
      guarantee:   "A fact the consumer INHERITS from the serving view (relied on, not re-derived)."
  column:

    # ===========================================================================
    # mac.concept.column.role — WHAT A COLUMN IS, analytically: where a query may use it and the guardrail that
    # follows. ONE role per column, and it is DERIVABLE — cardinality, type and reference structure give
    # it, which is why a generator can assign it unaided over a thousand columns without a human.
    #
    # THIS IS THE FRAMEWORK'S, NOT THE APPLICATION'S, and that is a change. Until 2026-09-25 each bundle
    # declared these terms in its own vocabulary.yaml: TWENTY files defined what `dimension` means, seven
    # of them verbatim copies, and eleven generated ones gave all five terms the same placeholder
    # sentence — "generated role, inferred from column type and name" — because there was nothing to
    # point at. Meanwhile the runtime branched on the bare strings ("measure", "attribute", "dimension")
    # in six places and even guessed among three spellings of `period`. The framework already owned the
    # behaviour; it now owns the names.
    #
    # `attribute` IS DELIBERATELY ABSENT. It was never a role: it was four different JUDGEMENTS filed in
    # the slot where types live — another name for the same thing, a different level of the same thing,
    # too identifying to be an axis, and not business content at all. Judgements are authored and cannot
    # be derived, which is exactly why no generator ever assigned it. They live in `mac.concept.column.ruling`.
    # ===========================================================================
    # ===========================================================================
    # mac.concept.column.query_use — WHERE A QUESTION MAY USE A COLUMN. The machine-readable half of
    # `concept.column.role`, whose own description has always said it states "where a query may use
    # it" — in prose only, which no reader could consult.
    #
    # WHY IT EXISTS, measured 2026-10-02. The runtime decided this for itself in TWENTY places by
    # branching on the role spelled as a string literal: `in ("dimension", "period")` for an axis
    # (twice, each with its own inline copy of the `never_axis` guard), `== "measure"` nine times,
    # `== "period"` three, `("dimension", "key")` twice, `== "housekeeping"` once — plus a third
    # mirror of the five names in `grammar_reader._ROLE_WORDS`. This block's own header had already
    # recorded the same defect at SIX sites in September and fixed only half of it: the NAMES moved to
    # the framework, the BEHAVIOUR stayed in the tuples.
    #
    # WHAT IT COST. `square_metres` is declared `field_role.measure` on Store and the planner resolves
    # it two different ways, yet the interpret prompt never mentioned it — because `measure` is not in
    # the tuple at `interpret/vocabulary.py`. Not a missing feature: a list typed into a function body.
    # Three concepts in one bundle carried such columns and all three were invisible, so "what is the
    # average list price?" could not be asked at all. The first attempt at a fix added a SIXTH
    # hand-written prompt block, which also published `units_ever_here` as aggregatable — a
    # `precomputed` column the fold law forbids summing. A patch beside the tuples, getting it wrong.
    #
    # THE TERMS ARE DERIVED, NOT DESIGNED. There are exactly four because the twenty sites ask exactly
    # four questions, and each answer is already stated in its role's own sentence. Aggregatability is
    # NOT among them and must never be added: `concept.column.measure_type` already declares it per
    # column and per axis kind through `additivity`, which is strictly more precise — a role-level
    # boolean is what made `precomputed` look summable.
    # ===========================================================================
    query_use:
      kind: vocabulary
      closed: true
      description: Where a question may use a column — the machine-readable half of concept.column.role.
      terms:
        axis: >
          LEGITIMATE IN A FILTER AND IN A GROUP BY. The column names a thing a question can slice by.
          A per-column `rulings.never_axis` still overrides this with its own measurement: the role
          says the KIND of column may be an axis, the ruling says this ONE may not.
        aggregate: >
          A NUMBER A QUESTION MAY FOLD. HOW it folds is not stated here and must not be: it is
          `concept.column.measure_type` x `concept.axis` -> `aggregation_effect`, read through
          `framework.vocabulary().additivity`. A column carrying this use whose every additivity cell
          is `none` — `precomputed`, `target` — is foldable by nothing, and that is the measure type's
          ruling, not this one's.
        period_binding: >
          THE COLUMN A QUESTION'S PERIOD BINDS TO. Says which date is THE reporting date when a
          relation carries several, so "sales in March" cannot silently pick the wrong one.
        extremum: >
          THE EARLIEST OR LATEST VALUE THE COLUMN HOLDS may be asked for -- `min`/`max`, which is what a
          "when did X first ..." question wants. NOT A FOLD, and that is why it is a separate use rather
          than a corner of `aggregate`: an extremum PICKS one value that exists in the data instead of
          combining several, so it answers to no additivity cell and is meaningful on a column no law
          would let anyone SUM. A date axis therefore admits it while remaining non-aggregatable.
        identity: >
          WHAT THE ROW IS, FOR JOINING AND COUNTING. Filtered on an exact value a register resolved
          to, joined on, and what COUNT(DISTINCT) counts — never matched against a label and never
          aggregated, an identifier that is summed being a number nobody asked for.

    role:
      kind: vocabulary
      closed: true
      description: The analytical role of a column — where a query may use it, and the default guardrail.
      terms:
        key:
          query_use: [identity]
          definition: >
            IDENTITY OR JOIN COLUMN. A name resolves TO it through a register; a query then filters or
            joins on the exact value. Never matched against a label, and never aggregated — an identifier
            that is summed is a number nobody asked for. Example: `CustomerKey`, what COUNT(DISTINCT)
            counts and what the fact joins on.

          constellation: >
            A NAME MUST RESOLVE TO AN EXACT VALUE BEFORE ANYTHING CAN BE FILTERED OR JOINED ON IT.
            Reach for it when the column is what a join lands on or what a distinct count counts —
            and never let it be summed: an identifier that is totalled is a number nobody asked for.
        dimension:
          query_use: [axis, extremum]
          definition: >
            A CATEGORICAL AXIS — legitimate in WHERE and in GROUP BY. Its value domain is either CLOSED
            (a register states every member, so a non-member is answerable without probing) or OPEN (names
            resolve through the ladder: exact, normalized, prefix, fuzzy, then ask). Example: `Gender` —
            `WHERE Gender = 'female'` and `GROUP BY Gender` are both legitimate.

          constellation: >
            A QUESTION WILL LEGITIMATELY BOTH FILTER ON THE COLUMN AND GROUP BY IT. `WHERE gender =
            'female'` and `GROUP BY gender` are both reasonable, which is the test. If only one of
            the two is reasonable, the column is probably a key or a measure wearing a dimension's
            name.
        measure:
          query_use: [aggregate, extremum]
          definition: >
            A NUMERIC PAYLOAD. Folded only as its mac.measure_type and the axis allow — the law is stated
            once there and never restated per concept. Never filtered on directly: a threshold on a
            measure is a HAVING over the aggregate, not a WHERE over the column. Example: `SalesAmount`.

          constellation: >
            ADDING TWO OF ITS VALUES MEANS SOMETHING. That is the whole test and it is not about the
            datatype. The corollary matters as much: a threshold on a measure is a HAVING over the
            aggregate, never a WHERE over the column, so declaring this also declares where a filter
            may not go.
        period:
          query_use: [axis, extremum, period_binding]
          definition: >
            THE COLUMN A QUESTION'S PERIOD BINDS TO. It says which date is THE reporting date when a
            relation carries several, so "sales in March" cannot silently pick the wrong one. Example:
            `OrderDate` on a line that also carries `DeliveryDate`.

          constellation: >
            THE RELATION CARRIES MORE THAN ONE DATE AND "SALES IN MARCH" HAS TO PICK ONE. An order
            line with an order date and a delivery date is the compelling case: both are dates, both
            are plausible, and the question does not say. This names which one is THE reporting date
            so the choice is not made silently.
        housekeeping:
          query_use: []
          definition: >
            PIPELINE BOOKKEEPING, NOT BUSINESS VOCABULARY — validity windows, load stamps, surrogate
            housekeeping. It is not offered to a question, not grouped on, not filtered on, and its
            absence from an answer is correct rather than a gap. Example: `StartDT`/`EndDT`, an SCD-2
            validity window — when the ROW was written, not when anything happened. Grouping sales by it
            is meaningless, and until this term existed it was spelled `attribute`, which reads as
            "a dimension you may not use" rather than "not part of the business at all".
            NAMED FOR THE MODELLING TRADITION that already has a word for these columns, rather than
            for the system that writes them: a load stamp is housekeeping whoever keeps the house.


          constellation: >
            THE COLUMN RECORDS WHEN THE ROW WAS WRITTEN RATHER THAN WHEN ANYTHING HAPPENED. A
            validity window on a versioned dimension is the case: grouping sales by the row's own
            start date is meaningless, but nothing in the data says so, and the column is a
            perfectly good date. Declaring it keeps the column out of a question's reach entirely —
            its absence from an answer is correct rather than a gap.
    # ===========================================================================
    # mac.concept.column.identity — WHAT PART A COLUMN PLAYS IN ITS CONCEPT'S IDENTITY. Per column, and strictly
    # narrower than `mac.concept.identity`, which is per CONCEPT and says how identity is ESTABLISHED
    # (iso · code · namespace_code · fk_name · composite · sme_pending). The two answer
    # different questions and both are needed: the concept says identity is a composite; these say
    # WHICH columns compose it.
    #
    # WHY IT IS SEPARATE, and the mistake it corrects. A draft of the column specification invented
    # `canonical | natural | part | reference` for this slot. `part` duplicated `identity_kind.composite`
    # and `natural` was a category error -- a natural key is a statement about the KIND of identity, not
    # about a column's part in it, so it belongs on the concept and nowhere else. What is genuinely
    # per-column is only the three below.
    # ===========================================================================
    identity:
      kind: vocabulary
      closed: true
      description: What part a column plays in its concept's identity. THE ONLY HOME — there is no concept-level identity block.
      terms:
        canonical:
          definition: >
            THE column that identifies one instance. What `COUNT(DISTINCT …)` counts, and what an answer
            discloses that it counted. Exactly one per concept, and a concept that legitimately has none
            declares `part` on every column of its key tuple instead — several parts and no canonical IS
            the composite — rather than nominating a column that does not identify.
          constellation: >
            EXACTLY ONE COLUMN IS THE THING ITSELF AND NAMES RESOLVE TO IT. The case that compels
            it: a surrogate key every fact points at, with a human-readable code and a name beside
            it that are both 1:1 with it. All three look alike in a profile; only this says which
            one the joins and the counts are about.
        part:
          definition: >
            ONE COLUMN OF A COMPOSITE IDENTITY, which IDENTIFIES NOTHING ALONE. Using it as though it did
            returns a set where a row was expected, and looks like an answer. Declared on every column of
            the tuple, and that is the whole declaration: no canonical column over a key of two or more
            IS the composite, and the concept adds nothing.
          constellation: >
            NO SINGLE COLUMN IDENTIFIES A ROW AND TWO OR MORE TOGETHER DO. A sale line is identified
            by its order and its line number — neither is unique alone, and declaring either as the
            identity would make the grain a lie. Mark each participating column, and the composite
            is what the concept is keyed on.
        reference:
          definition: >
            A POINTER AT ANOTHER CONCEPT'S IDENTITY — this concept's row names a row over there. What it
            points at is named separately; whether every value is PRESENT in the parent is a measurement,
            not a declaration, and a reference with no parent relation in the delivery is recorded AS
            dangling rather than dropped or invented.

          constellation: >
            THE COLUMN HOLDS ANOTHER CONCEPT'S IDENTITY, NOT THIS ONE'S. A customer key on a sale
            identifies a customer; the sale is identified by something else entirely. Without this
            the key reads as part of the sale's own identity, and a count of sales becomes a count
            of customers.

    # ===========================================================================
    # mac.concept.column.ruling — WHAT A PERSON DECIDED ABOUT A COLUMN, beyond what the data can say. Every term
    # here is a JUDGEMENT and none is derivable: that a registered name belongs to the same company, that
    # a postcode identifies people, that one geography level is finer than another. This is why they must
    # not share a slot with `column.role`, which is derived — a slot that accepts both silts up, and
    # `attribute` is what that looks like after two years.
    #
    # A ruling is always ABOUT a column and always carries its reason. `never_axis` additionally requires
    # `evidence` naming the measurement, so the refusal can cite it rather than assert it.
    # ===========================================================================
    ruling:
      kind: vocabulary
      closed: true
      description: An authored judgement about a column, beyond what measurement can establish.
      terms:
        label_of:
          definition: >
            THIS COLUMN IS ANOTHER NAME FOR THE NAMED COLUMN'S THING, NOT ANOTHER THING. The argument
            is the column it labels; `register` says WHICH of that thing's names this one is. Group on the
            named column and DISPLAY this one: a question asking in these words gets answered in them,
            never refused. Example: `Manufacturer` is the trade-register name of `Brand` — "Contoso" is what
            the world calls it, "Contoso, Ltd" is what the register calls it, and they are one company under
            two naming registers. NOT a parent: had the column meant the OWNING company it would be
            one-to-many and this ruling would be wrong. Cardinality cannot tell you which you have.
          constellation: >
            TWO COLUMNS ARE 1:1 AND ONE IS THE OTHER'S NAME. Cardinality is symmetric so the data
            cannot say which direction it runs; a person must. Getting it backwards produces an
            answer with the wrong column as its axis rather than an error.
        finer_than:
          definition: >
            THIS COLUMN DISTINGUISHES MORE MEMBERS than the named column, which it rolls up into. Both are
            legitimate axes and an answer must DISCLOSE which level it used. Example: `SubCategoryName`
            carries 32 values that roll up cleanly into `CategoryName`'s 8 — measured 32 distinct pairs
            over 32 subcategories, so every subcategory has exactly ONE parent and the roll-up cannot
            double-count. THAT CLEAN N:1 IS THE TEST. A pair that merely differs in cardinality may be a
            colliding code space instead — see `scoped_by`, and measure before you rule.
          constellation: >
            TWO DIMENSIONS ARE A HIERARCHY AND THE ROWS SHOW ONLY A CORRELATION. Every sub-category
            sits in exactly one category, so the coarser question is answerable from the finer rows
            and not the reverse — a containment that is a business fact, not a measurable one.
        scoped_by:
          definition: >
            THIS COLUMN'S VALUES ARE ONLY UNIQUE WITHIN THE NAMED COLUMN, so it may not be grouped or
            filtered on alone — the scope column must travel with it. Example: `State` carries 'CO' for
            Corse in France, Como in Italy and Colorado in the United States. measured on a worked bundle: 40 of
            563 state codes are carried by more than one country and 0 collide WITHIN a country, so
            `GROUP BY State` silently merges three unrelated regions into one row that looks like data.
            NOT `finer_than`: nothing here is a level of anything. It is one code space reused per
            parent, which is the composite identity `mac.canon.composite_key_guard` exists to protect.
          constellation: >
            A CODE IS UNIQUE ONLY INSIDE ITS PARENT, AND THE COLLISION IS SILENT. Measured: 40 of
            565 state codes repeat across countries, so grouping on state merges regions and still
            returns a plausible table.
        sort:
          definition: >
            THE ORDER THIS COLUMN'S VALUES ARE PRESENTED IN when the question states none. `asc` is
            alphanumeric / smallest-first and is the reading for a NAME; `desc` is largest-first and is the
            reading for a MAGNITUDE; `none` means this column is never an ordering key. PER COLUMN AND
            NEVER PER CONCEPT -- operator ruling, 2026-10-02: "it must be sort per column and not concept"
            -- because one breakdown legitimately wants `brand asc`, `country_code asc` and
            `net_amount desc` at the same time.
            NOT A FORMATTING PREFERENCE, WHICH IS WHY IT IS A RULING. SQL guarantees NO row order without
            ORDER BY, so an unordered answer is not a reading of the question: it is whatever the engine
            happened to emit, and it changes between runs. MEASURED 2026-10-02 on AGG-15 ("net revenue by
            brand and customer country for 2024"), an 88-row breakdown -- the grader compares the approved
            rows against the capture's first 50, WHICH 50 depended on unordered output, and the question
            passed and failed on alternate runs with the data unchanged. An ordering is also what makes a
            truncated view honest: the first N rows of a descending measure are the N that matter.
            A COLUMN THAT DECLARES NOTHING falls to query_grammar.yaml#projection.default_ordering (an
            aggregate desc, a bare list asc on its slice columns), and `Intent.ordering` -- the reader's
            own words, "top 5 by price" -- outranks both.
          constellation: >
            THE READER WILL SCAN THE ROWS IN ORDER AND NOBODY SAID WHAT THE ORDER IS. SQL promises
            none without ORDER BY, so the answer changes between runs on unchanged data — measured,
            on an 88-row breakdown that passed and failed alternately.
        never_axis:
          definition: >
            THIS COLUMN MUST NOT BE GROUPED ON, for the stated reason, and `evidence` must name the
            measurement that establishes it. A ruling made from a measurement must produce a REFUSAL THAT
            CITES IT, never a silent success. Example: `ZipCode`, which alone singles out 29 193 of
            104 990 served customers and is the dominant identifier in the row.

          constellation: >
            GROUPING BY THE COLUMN WOULD RETURN ONE ROW PER INSTANCE. Measured: 29,193 of 104,990
            postcodes identify a single customer. The query is legal and the result is a customer
            list pretending to be a breakdown.

    # ===========================================================================
    # mac.measure_type — the additivity class of a measure (the classic additive / semi-additive /
    # non-additive / averageable fact taxonomy). Additivity is INTRINSIC to the type and stated ONCE here,
    # over axis (5 types × 2 kinds = 10 universal cells). Each cell references a mac.concept.aggregation_effect term.
    # The count was written as "4 types × 2 kinds = 8" and the table below has listed FIVE members since
    # v0.1.15 — a comment that drifted from its own table and was believed for as long as nobody counted.
    # An applied ontology's measures reference these members; they never re-encode the matrix.
    # ===========================================================================
    measure_type:
      kind: value_domain
      closed: true
      description: How a measure aggregates — defined once, over axis.
      terms:
        flow:
          definition: "A quantity that accrues per period and accumulates over time (e.g. units sold in a period)."
          additivity:
            time:        mac.concept.aggregation_effect.additive
            categorical: mac.concept.aggregation_effect.additive
        stock:
          definition: "A level read at a point in time; it does not accumulate over time (e.g. inventory on hand)."
          additivity:
            time:        mac.concept.aggregation_effect.none         # a year IS the end-of-period row — resolved, not folded
            categorical: mac.concept.aggregation_effect.additive
        intensive:
          definition: "A per-entity magnitude that is meaningful only as an average, never a total (e.g. a duration, an age, a rate, a ratio, or a signed deviation). Summing it across a population double-counts or is meaningless; the correct fold on ANY axis is a mean / median / percentile, not a SUM."
          additivity:
            time:        mac.concept.aggregation_effect.average
            categorical: mac.concept.aggregation_effect.average
        precomputed:
          definition: "A measure whose value EXISTS ONLY at the grains it was computed for — you locate the row matching the requested axis/parameter combination and read it. Nothing is derivable from narrower cells: the source documentation describes one such reach measure as non-additive (a sum or average of the measure is not the measure of the summed or averaged inputs) and computed iteratively. v0.1.15: `precomputed` is a property of the MEASURE, not of an axis — every axis of such a measure is simply `none`, because no fold is valid anywhere. Where the value comes from is a measure_type fact; whether you may fold is an axis fact."
          additivity:
            time:        mac.concept.aggregation_effect.none
            categorical: mac.concept.aggregation_effect.none
        target:
          definition: "A planning target, not an observed quantity (e.g. a sales goal); not summable on any axis."
          additivity:
            time:        mac.concept.aggregation_effect.none
            categorical: mac.concept.aggregation_effect.none

# ==========================================================================
# mac.relation.* — FOLDED. These 1 vocabularies were top-level keys spelled with
# dots (`dataset.column.role:`). The dotted name is still the identity everything
# uses; the nesting is how a person reads it. `tools/mac_vocab.py` returns the dotted form
# from either shape, which is what made this an authoring choice instead of an API change.
# ==========================================================================
dataset:
  column:

    role:
      kind: vocabulary
      closed: true
      description: The physical shape of a column in its relation, independent of its analytical role.
      # `composite_key_part` RETIRED 2026-09-27 by operator ruling. It carried key MEMBERSHIP and no
      # ORDER, so the order of a composite key lived only in the concept plane's `key: [...]` list — a
      # second home for a fact that belongs to the RELATION. And splitting the key across two terms meant
      # a consumer asking "what is this relation's key" had to remember both: mac_to_graph.py and
      # mac_to_shacl.py tested `role == 'primary_key'` and found NO key for the reference bundle's fact
      # table, whose two key columns both carried the other term. Every key column is now `primary_key`,
      # and the order travels as the integer `key_position` on the column.
      terms:
        primary_key: >
          The relation's own identity: one row per distinct value, measured rather than assumed.
        foreign_key: >
          A reference to another relation's identity. Whether every value is PRESENT in the parent is a
          separate measurement — a declared key says the relationship is intended, not that it holds.
        value: >
          A payload column: it carries data, not identity and not a choice of row kind.
        discriminator: >
          A column whose value selects WHICH KIND of row this is — the column a perspective, status or
          type is read from.
        # `audit` AND `delivery_axis` WERE LEGAL IN THE SCHEMA AND ABSENT HERE, which made this closed
        # vocabulary a smaller set than the one bundles are validated against — four terms against the
        # schema's seven, and `tools/check_vocabulary_parity.py` red on the slot since 2026-09-29. Both are
        # in active use and one of them is written by this framework's own tool, so the vocabulary was the
        # incomplete half: `tools/mac_admit_identity.py:393` assigns `delivery_axis`, and three runtime
        # tests declare `{"name": "written_at", "type": "timestamp", "role": "audit"}`. Measured on
        # contoso5: 115 `value`, 23 `primary_key`, 18 `foreign_key`, and none of these two yet — they are
        # declared because the producers exist, not because a bundle has reached them.
        audit: >
          A column recording WHEN THE ROW WAS WRITTEN or by what, rather than anything that happened in the
          business. A load timestamp, a batch id, a validity window on a versioned row. It is physically a
          payload column, and naming it apart is what keeps it out of a question's reach: grouping a measure
          by the row's own write time is meaningless, and nothing in the data says so.
        delivery_axis: >
          A column the DELIVERY partitions or orders by, carried for the pipeline's sake rather than for a
          question. `mac_admit_identity.py` assigns it to a column an SME has ruled is not the relation's
          identity but which the load still keys on — so the key survives as a physical fact without
          claiming to be the concept's identity.

# ==========================================================================
# mac.transform.* — FOLDED. These 1 vocabularies were top-level keys spelled with
# dots (`transform.driven_by:`). The dotted name is still the identity everything
# uses; the nesting is how a person reads it. `tools/mac_vocab.py` returns the dotted form
# from either shape, which is what made this an authoring choice instead of an API change.
# ==========================================================================
transform:
  # ===========================================================================
  # mac.dataset.column.role — WHAT A COLUMN IS PHYSICALLY: its shape in the dataset, independent of
  # what a
  #
  # RENAMED FROM `relation.*` ON 2026-10-05, operator ruling. One object had FOUR names: the schema
  # called the file a `TableFile` with a `table:` block, the vocabulary namespaced it `relation.*`,
  # every concept points at it as `relation:`, and on disk it is `data/sources/` and
  # `data/datasets/`. `dataset` is the word the directory and the operator already use, and
  # `metadata.kind` already names both members — `raw_source` and `served_dataset`. `table` was
  # rejected because `table.type` is `view` on 8 of 16; `relation` because it is relational-algebra
  # vocabulary a reader of `data/` never meets. The concepts' own `grounding.sources[].relation:`
  # key is deliberately NOT renamed: it is written in every concept and changing it is a bundle
  # migration no reader benefits from.
  # question may do with it. A column carries BOTH a storage_role and a column.role and they answer
  # different questions: `CountryCode` is storage `value` and analytically a `dimension`; `StoreKey`
  # is storage `primary_key` and analytically a `key`.
  #
  # DECLARED HERE BECAUSE IT WAS DECLARED NOWHERE. The dataset descriptors have used these five terms
  # all along — 72 columns on contoso alone — and no file in the estate defined them. One of them,
  # `dimension`, collided with the analytical vocabulary and meant something else there.
  # ===========================================================================
  driven_by:
    kind: vocabulary
    closed: true
    description: >
      WHO DECIDED THE SHAPE of one served relation's transform, and therefore who may change it.
      Operator ruling, 2026-09-29: the first version is a 1:1 passthrough IF NO OTHER REGULATION
      APPLIES; where the profiling already shows something, the platform PROPOSES an improvement; and
      an SME or data scientist drives the change after that — including during concept authoring,
      depending on what the concepts need. Three drivers at three moments, not three kinds of file.
      ABSENT IS NOT A FOURTH TERM: a transform carrying no `driven_by` is UNDECLARED — nobody recorded
      who drove it. Every curated transform in the estate is in that state today, and labelling them
      `ruled` would assert a ruling that is on no record; the estate's own three-outcome discipline
      (present / absent / undeclared) rather than a default that flatters the data.
    terms:
      passthrough: >
        The floor. Every column, nothing renamed, derived or dropped — computable from the catalog,
        so no judgement was exercised and none is claimed. Generated by tools/mac_passthrough.py,
        which never touches a .sql that already exists.
      proposed: >
        The platform's own suggestion, made from measurements it already holds — row counts,
        distincts, measured references, duplicate relations, orphans. It is a RECOMMENDATION and not
        a ruling: `because` names the finding that motivated it, and until a person answers that
        finding the proposal stands as the reason this transform has the shape it has.
      ruled: >
        A person decided — an SME or a data scientist — and `because` names what they answered.
        Nothing regenerates a ruled transform.

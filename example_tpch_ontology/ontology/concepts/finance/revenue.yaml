# TPC-H (example) > finance > Revenue — the `measure` class (derived). Synthetic; not real data.

metadata:
  concept: Revenue
  source: TPCH
  version: '1.0'
  schema_version: '0.1.16'
  status: production
  owner: example-team
  confidence: C

concept:
  name: Revenue
  label: Revenue
  class: measure
  identity:
    kind: code
  definition: >
    The monetary value of sales, net of discount: per order line, l_extendedprice × (1 − l_discount).
    "Revenue" without qualification means this net figure. It is COMPUTED (see rules.yaml > net_revenue),
    not a stored column.
  semantics:
    purpose: >
      The headline financial measure — sliced by part, customer, supplier, geography and time; the
      numerator of TPC-H's revenue and market-share queries.
    unit: currency (account currency)
    measure_type: mac.concept.column.measure_type.flow
    additivity: { time: additive, geography: additive, part: additive, customer: additive, supplier: additive }
    axis_kinds:
      time:      mac.concept.axis_kind.time
      geography: mac.concept.axis_kind.categorical
      part:      mac.concept.axis_kind.categorical
      customer:  mac.concept.axis_kind.categorical
      supplier:  mac.concept.axis_kind.categorical
    null_semantics: >
      A line with NULL discount contributes its full extended price (no discount = zero discount), not missing data.

derived_by_rule: net_revenue

grounding:
  kind: sql_table
  schema: tpch
  sources:
  - relation: lineitem
    key:
    - l_orderkey
    columns:
      l_orderkey:
        role: key
        identity: part
      l_linenumber:
        role: key
        identity: part
      l_partkey:
        role: key
        identity: reference
      l_suppkey:
        role: key
        identity: reference
      l_quantity:
        role: measure
        measure:
          type: mac.concept.column.measure_type.flow
          unit: units
      l_extendedprice:
        role: measure
        measure:
          type: mac.concept.column.measure_type.flow
          unit: currency (account currency)
      l_discount:
        role: measure
        measure:
          type: mac.concept.column.measure_type.intensive
          unit: fraction
      l_tax:
        role: measure
        measure:
          type: mac.concept.column.measure_type.intensive
          unit: fraction
      l_returnflag:
        role: dimension
      l_linestatus:
        role: dimension
      l_shipdate:
        role: period
      l_commitdate:
        role: dimension
      l_receiptdate:
        role: dimension
      l_shipmode:
        role: dimension

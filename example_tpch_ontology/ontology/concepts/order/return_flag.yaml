# TPC-H (example) > order > ReturnFlag
# Synthetic example — the `enumeration` class (closed value set). TPC-H is a public benchmark, not real data.

metadata:
  concept: ReturnFlag
  source: TPCH
  version: '1.0'
  schema_version: '0.1.9'
  status: production
  owner: example-team
  confidence: C

concept:
  name: ReturnFlag
  label: Return Flag
  class: enumeration
  identity:
    kind: code
  definition: >
    Whether an order line was returned. The code list the l_returnflag discriminator column carries —
    R for returned; A and N are the two not-returned codes (TPC-H splits not-returned by receipt date).
  semantics:
    purpose: >
      Stable codes + meanings so "returned lines" is one agreed filter (l_returnflag = 'R') rather than
      guessing which letters mean returned.

values:
  closure: closed
  closure_why: "TPC-H's l_returnflag is exactly these three values."
  # v0.1.9 — SAME canon as shop OrderStatus, different params: the reuse the content model claims (one
  # function, many concepts, parameters only). closure_anomaly_check realizes the `closed` flag.
  realized_by:
    udf: mac.canon.closure_anomaly_check
    applied_as: anomaly_check
    params: { table: lineitem, column: l_returnflag, closure: closed, known_values: [R, A, N] }
  items:
    - { code: R, label: Returned,      meaning: "the line was returned",                                    confidence: C }
    - { code: A, label: Not returned,  meaning: "not returned (TPC-H's first not-returned class)",           confidence: C }
    - { code: N, label: Not returned,  meaning: "not returned (TPC-H's second not-returned class)",          confidence: C }

grounding:
  kind: sql_table
  table: lineitem
  schema: tpch
  grounds_column: l_returnflag

governance:
  last_reviewed: 2026-06-18
  change_log:
    - { date: 2026-06-18, change: "Created when tpch moved to Option B: the l_returnflag code-set's meaning moved from the data-plane descriptor into this ontology enumeration.", change_type: CREATION, by: example-team }
    - { date: 2026-06-24, change: "v0.1.9: bound the closed value set to mac.canon.closure_anomaly_check (the content-model UDF seam).", change_type: ADDITION, by: example-team }

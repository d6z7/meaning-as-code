# TPC-H (example) > order > OrderStatus
# Synthetic example — the `enumeration` class (closed value set). TPC-H is a public benchmark, not real data.

metadata:
  concept: OrderStatus
  source: TPCH
  version: '1.0'
  schema_version: '0.1.9'
  status: production
  owner: example-team
  confidence: C

concept:
  name: OrderStatus
  label: Order Status
  class: enumeration
  identity:
    kind: code
  definition: >
    The status of an order, derived in TPC-H from the line-status of its lines: open if all lines are
    still open, fulfilled if all are fulfilled, partial when mixed. The code list the o_orderstatus
    discriminator column carries.
  semantics:
    purpose: >
      Gives the order roll-up status stable codes + meanings so a filter ("open orders") uses one agreed
      vocabulary rather than ad-hoc string matching on a single-letter column.

values:
  closure: closed
  closure_why: "TPC-H defines exactly these three order statuses (a function of the lines' statuses)."
  items:
    - { code: O, label: Open,      meaning: "all of the order's lines are still open (in-flight)", confidence: C }
    - { code: F, label: Fulfilled, meaning: "all of the order's lines are fulfilled",              confidence: C }
    - { code: P, label: Partial,   meaning: "the order's lines are a mix of open and fulfilled",   confidence: C }

grounding:
  kind: sql_table
  table: orders
  schema: tpch
  grounds_column: o_orderstatus

governance:
  last_reviewed: 2026-06-18
  change_log:
    - { date: 2026-06-18, change: "Created when tpch moved to Option B: the o_orderstatus code-set's meaning moved from the data-plane descriptor into this ontology enumeration.", change_type: CREATION, by: example-team }

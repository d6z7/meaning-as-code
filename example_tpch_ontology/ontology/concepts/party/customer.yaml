# TPC-H (example) > party > Customer — the `entity` class. Synthetic; not real data.

metadata:
  concept: Customer
  source: TPCH
  version: '1.0'
  schema_version: '0.1.16'
  status: production
  owner: example-team
  confidence: C

concept:
  name: Customer
  label: Customer
  class: entity
  identity:
    kind: fk_name
  definition: >
    A party that places orders. Identified by c_custkey, located in one Nation (see edges), and
    classified by a market segment. The demand side — orders and revenue attribute to a customer.
  semantics:
    purpose: >
      Attributes orders and revenue to a party, and (through its nation) to geography and market segment.

properties:
  - { name: custKey,     type: integer, required: true,  doc: "c_custkey — identity key" }
  - { name: name,        type: string,  required: false, doc: "c_name" }
  - { name: nationKey,   type: integer, required: true,  doc: "c_nationkey — the customer's nation (from_nation edge)" }
  - { name: mktSegment,  type: string,  required: false, doc: "c_mktsegment — market segment" }

grounding:
  kind: sql_table
  schema: tpch
  sources:
  - relation: customer
    key:
    - c_custkey
    columns:
      c_custkey:
        role: key
        identity: canonical
      c_name:
        role: dimension
      c_nationkey:
        role: key
        identity: reference
      c_acctbal:
        role: measure
        measure:
          type: mac.concept.column.measure_type.stock
          unit: currency (account currency)
      c_mktsegment:
        role: dimension
governance:
  last_reviewed: 2026-06-17
  change_log:
    - { date: 2026-06-17, change: "Created — TPC-H synthetic example.", change_type: CREATION, by: example-team }

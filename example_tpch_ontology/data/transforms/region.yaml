# TPC-H (example) — data plane / TRANSFORMS: how the `region` dataset is made.
# A PASSTHROUGH. TPC-H base tables arrive complete and typed from the generator, so this
# pipeline asserts identity rather than inventing a cleaning step: every served column
# descends 1:1 from its raw counterpart. Declaring it is what gives the dataset LINEAGE —
# without a producer, `region` had none, and the graph showed it unrelated to its input.
metadata:
  pipeline: region
  source: TPCH
  layer: data-transformation
  schema_version: 0.1.14
  status: verified
  owner: example-team
produces:
  relation: tpch.region
  sql_file: data/transforms/region.sql
  grain: one row per r_regionkey
  serves_ontology: ontology/concepts/geography/region.yaml
inputs:
- relation: tpch_raw.region_raw
  kind: raw_source
  role: raw_rows
  descriptor: data/sources/region_raw.yaml
governance:
  owner: example-team
  last_reviewed: '2026-09-12'

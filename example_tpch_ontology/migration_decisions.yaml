# migration_decisions.yaml — the judgements behind this bundle's move to the column standard.
# RATIFIED 2026-09-29 by the modeller from TPC-H's own definitions; every entry says why. `exclude`
# is a ratified narrowing: the concept does not serve the column. Read by
# tools/mac_migrate_concepts.py --decisions; kept so the migration is reproducible and arguable.
Customer.c_custkey:
  role: key
  identity: canonical
  because: the canonical key
Customer.c_nationkey:
  role: key
  identity: reference
  because: names a Nation
Customer.c_name:
  role: dimension
  because: the customer's name
Customer.c_mktsegment:
  role: dimension
  because: the segment; MarketSegment is the enumeration over it
Customer.c_acctbal:
  role: measure
  measure:
    type: stock
    unit: currency (account currency)
  because: a balance is a level, not a flow
Customer.c_phone:
  exclude: true
  because: identifying free text; no finding measures it, so it is not served rather than served unguarded
Customer.c_comment:
  exclude: true
  because: free text
MarketSegment.c_mktsegment:
  role: key
  identity: canonical
  because: the code IS the enumeration's identity
MarketSegment.c_custkey:
  role: key
  identity: reference
  because: the row carrying the code
MarketSegment.c_nationkey:
  exclude: true
  because: not the enumeration's to serve
MarketSegment.c_name:
  exclude: true
  because: not the enumeration's to serve
MarketSegment.c_acctbal:
  exclude: true
  because: not the enumeration's to serve
MarketSegment.c_phone:
  exclude: true
  because: not the enumeration's to serve
MarketSegment.c_comment:
  exclude: true
  because: not the enumeration's to serve

# Canonical edges for the shapes-lab mini-project. Used by A4 (no_predicate_restatement reads the
# edges' join_rule predicates) and as the good case for A1's main() smoke run.
metadata: { layer: edges, source: LAB, schema_version: '0.1.12', status: production }
edges:
  - edge_id: order__of_customer
    level: physical
    type: foreign_key
    endpoints:
      from: { concept: Order,    ref: "concepts/order/order.yaml#concept" }
      to:   { concept: Customer, ref: "concepts/customer/customer.yaml#concept" }
    join_rule: "orders.customer_id = customers.customer_id"

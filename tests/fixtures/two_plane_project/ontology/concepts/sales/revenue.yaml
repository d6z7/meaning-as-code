# Two-plane fixture > sales > Revenue. Synthetic; illustrates the `measure` class.

metadata:
  source: TWO_PLANE
  version: '1.0'
  schema_version: 0.1.18
  confidence: C
  provenance: authored

concept:
  name: Revenue
  class: measure
  definition: >-
    The amount billed on an order, net of nothing. One amount per order.
  # DECLARED BECAUSE THE SHIPPED SCHEMA DEMANDS IT, and the demand is under dispute. mac.schema.json
  # makes `concept.semantics` required on a measure and mac_shapes.yaml requires measure_type, unit
  # and axis_kinds under it -- while the column-first migration moved exactly those facts ONTO the
  # columns, where contoso5 now writes them and nowhere else. Measured 2026-10-05: contoso5 carries
  # 26 shape violations and 7 schema errors of precisely this shape. A FIXTURE IS THE WRONG PLACE TO
  # TAKE A SIDE, so this one conforms to what ships and the disagreement is named here.
  semantics:
    measure_type: mac.concept.column.measure_type.flow
    unit: EUR
    axis_kinds:
      placed_at: mac.concept.axis.time
      customer_id: mac.concept.axis.categorical

grounding:
  kind: sql_table
  schema: two_plane_warehouse
  source:
    # THE KEY IS ONE ORDERED LIST ON THE SOURCE. It was `identity: canonical` on the column until
    # 2026-10-07, which could not state an order -- and the order reaches the SQL.
    relation: orders
    key: [order_id]
    columns:
      # EVERY COLUMN DECLARES `offers:`, AND `{}` IS A STATEMENT: loaded, typed, offered to no
      # question. A key column claims nothing of its own; `role` is DERIVED from `offers` plus the
      # source's key and is never authored. `counts: true` is gone from this column: what one
      # instance IS is `source.counts`, and it is only written where it DIFFERS from the key --
      # here it would have named `order_id` twice.
      order_id:
        offers: {}
      customer_id:
        offers: {}
        references: Customer
      placed_at:
        offers:
          axis: time
          period_binding: true
      amount:
        offers:
          aggregate:
            type: flow
            unit: EUR
  grain: one row per order (order_id)

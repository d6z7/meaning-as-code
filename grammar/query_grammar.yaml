# THE QUERY GRAMMAR — what an operation contributes to SQL, and what it needs declared.
#
# STATUS: PROPOSED. Not ratified. The runtime does not read this file: it is checked AGAINST the
# runtime by tools/check_query_grammar.py, which reds when the two disagree. That is deliberate —
# see QUERY_GRAMMAR.md §5. A declaration nothing reads is the estate's recorded defect (the worked bundle's
# decisions/0005), so this one is born with a reader even though it is not yet an input.
#
# WHAT THIS FILE IS FOR. The operation vocabulary already existed, in two homes that cannot be
# reviewed: a Python `StrEnum` and a prose paragraph in the interpreter's prompt. This is not a
# tenth declaration — it is the same closed vocabulary, written where a person can read it beside
# what it does, and where a gate can check it.
#
# THE MEASURED FINDING THIS FILE RECORDS. The operation is NOT what decides the SQL. Four of the
# nine members change anything at all, and between them they make three decisions. Everything
# else is emergent: from what the subject DECLARES, and from which optional Intent fields the
# interpreter filled. `branches_in_runtime` says, per operation, which it is — and the gate
# proves the answer against the code rather than trusting this comment.

metadata:
  schema: mac.query_grammar/1
  status: PROPOSED
  measured_against: mac-platform @ packages/mac-runtime/src/mac_runtime/planner
  measured_on: '2026-09-23'

# ─────────────────────────────────────────────────────────────────────────────────────────────
# THE SKELETON. Every operation contributes to the same SELECT, and contributes nothing else.
# There is no per-operation code path and no per-question-shape route; an operation that needed
# one would be a defect in this grammar, not a new branch.
# ─────────────────────────────────────────────────────────────────────────────────────────────
skeleton: SELECT … FROM <anchor> JOIN … WHERE … GROUP BY … ORDER BY … LIMIT …

# ─────────────────────────────────────────────────────────────────────────────────────────────
# THE NINE WORDS. `requires` is what must be DECLARED for the operation to be plannable at all —
# the thing that refuses when it is missing. `contributes` is what it adds to the skeleton.
# `branches_in_runtime` is measured: true means some code tests for this operation by name.
# ─────────────────────────────────────────────────────────────────────────────────────────────
operations:

  - name: count
    asks: how many distinct instances
    requires: [identity.canonical_key]
    contributes: {select: COUNT(DISTINCT <canonical_key>)}
    branches_in_runtime: true
    branches: [non_fold_ops]    # lets a non-measure subject past the fold gate
    refuses_when: the subject declares no canonical_key and no rule
    note: >-
      The key does the work, not the word. The worked bundle's decisions/0005 proved the route by giving each
      concept `COUNT(DISTINCT <the key it already declares>)` and planning it unchanged.

  - name: sum
    asks: the total of a number
    requires: [semantics.measure_type, a measure column or a derivation rule]
    contributes: {select: SUM(<measure expression>)}
    branches_in_runtime: false
    emerges_from: the fold law over the subject's declared measure
    refuses_when: nothing declares a number the subject carries

  - name: average
    asks: the mean of a number
    requires: [semantics.measure_type, a measure column or a derivation rule]
    contributes: {select: AVG(<measure expression>)}
    branches_in_runtime: false
    emerges_from: the fold law over the subject's declared measure
    open_question: >-
      A plain mean does not COMPOSE — a breakdown and a grand total disagree. The fold grammar
      says so and names `weighted_mean` as the operator that does. This grammar does not yet say
      which one `average` selects, and the answer belongs in the fold plane, not here.

  - name: min
    asks: the earliest or smallest value a column holds
    requires:
      - a column whose role declares the `extremum` use (mac.concept.column.query_use)
    contributes:
      select: MIN(<column>)
    branches_in_runtime: true
    # NON-FOLDING, AND THAT IS THE POINT. An extremum PICKS a value that exists in the data rather
    # than combining several, so it answers to no additivity cell and carries NO UNIT. Measured
    # 2026-10-02: undeclared here, `grammar_reader.operation_folds` took its conservative branch
    # ("unknown to the grammar -> folds") and the answer read "Store: 2013-12-05 in m2" -- a date
    # with a floor-area unit, because a fold's unit was attached to a date.
    branches: [non_fold_ops]
    refuses_when: >
      the subject names a CONCEPT rather than a column, and that concept declares more than one
      column admitting an extremum -- then it ASKS which, naming them. Measured on STORE-04: with
      the subject left as `Store` the answer was 665.0, MIN(square_metres), for a question asking
      when the first store closed.
    note: >
      WHAT MADE THIS NECESSARY. "When was the first store closed?" has one proper answer, a DATE,
      and no shape here could carry it: the nearest was `rank` + `ordering` + `limit: 1` with the
      date as a SLICE, which answers with a ROW --
      `Contoso Store Rhode Island · 2013-12-05 · 1` against an approved `2013-12-05`. The gap was
      not in `not_expressible` either, so nothing refused and the question was silently answered in
      a different shape, which is the one outcome declared gaps exist to prevent.
  - name: max
    asks: the latest or largest value a column holds
    requires:
      - a column whose role declares the `extremum` use (mac.concept.column.query_use)
    contributes:
      select: MAX(<column>)
    branches_in_runtime: true
    branches: [non_fold_ops]
    refuses_when: as `min` -- a concept declaring several admitting columns is asked about, not guessed
  - name: list
    asks: which members exist
    requires: [a column to list — canonical_key, or a named slice column]
    contributes: {select: SELECT DISTINCT <column>}
    branches_in_runtime: true
    branches: [non_fold_ops, select_distinct]

  - name: rank
    asks: the top or bottom N
    requires: [an aggregate to order by, or a declared column named in `ordering.by`]
    contributes: {order_by: <aggregate|column> <direction>, limit: <limit>}
    branches_in_runtime: false
    emerges_from: Intent.ordering and Intent.limit being populated
    note: >-
      `rank` is a NAME for a shape the skeleton already had. Setting ordering+limit produces the
      same SQL whatever the operation says, which is why the word is not branched on.

  - name: compare
    asks: two or more members side by side
    requires: [a dimension both members share]
    contributes: {group_by: <axis>, where: <axis> IN (<members>)}
    branches_in_runtime: false
    emerges_from: slices plus an IN filter — it desugars, and nothing reads the word
    open_question: >-
      DESUGARING IS NOT OBVIOUSLY RIGHT AND IS RECORDED AS UNSETTLED. "Germany versus France"
      becomes one grouped result with two rows. A reader asking to COMPARE may mean a difference,
      a ratio, or two columns side by side, and none of those is what this produces. Measured on
      the corpus, compare questions plan — that says the SQL is valid, not that it answers.

  - name: ratio
    asks: a share, a percentage, or one figure per another
    requires: [Intent.denominator naming a second subject]
    contributes: {select: "(<numerator>) / NULLIF(<denominator aggregate>, 0)"}
    branches_in_runtime: false
    emerges_from: Intent.denominator being populated
    note: >-
      THE DENOMINATOR IS AGGREGATED THE WAY ITS OWN SUBJECT WOULD BE, not by a second mechanism.
      A measure with a derivation rule contributes that rule's template; a measure with NO rule
      contributes SUM of its declared measure column, which is what a bare total of it emits; a
      countable contributes COUNT(DISTINCT <its canonical_key>). So "per customer" divides by the
      customers a bare "how many customers" would have counted — one definition of a count, never
      two that drift. THE RULE-LESS MEASURE WAS MISSING FROM THIS SENTENCE AND FROM THE RUNTIME
      UNTIL 2026-09-30: every such denominator refused with "declares neither a derivation rule nor
      an identity.canonical_key, so there is no number to divide by", on concepts the same planner
      sums correctly as a numerator (measured on ADV-01 and AGG-12).
      The denominator is also JOINED like any other term, so a denominator with no path refuses
      `no_join_path` naming both ends rather than composing SQL the engine would reject.
      NULLIF guards the zero: a group with no denominator rows has no answer, and NULL is the
      only honest cell.
    was_unread_until: '2026-09-24'
    history: >-
      DECLARED AND READ BY NOTHING for as long as it existed. The field was on the model, the
      prompt asked the model to fill it, the model filled it — and no step of the planner
      mentioned it, so a ratio question planned its NUMERATOR ALONE. Measured on a 70-question
      corpus: "revenue per customer by country" and "average order value by country" compiled to
      the SAME SQL as each other and as a plain total. It refused for a day, which was honest and
      not an answer. Verified on build: average order value now returns 2 341.01, matching an
      INDEPENDENT computation (the mean of per-order totals) exactly, where dividing by the line
      count gives 976.96 — 2.40x out, and plausible.
  - name: define
    asks: what a declaration says
    requires: [the meaning plane — the generated system concepts]
    contributes: {from: <meta_ relation>, where: <identifier> = <name>}
    branches_in_runtime: true
    branches: [non_fold_ops]
    note: >-
      Not a special route. The meaning plane is a bundle like any other, generated rather than
      authored, and `define` reads it with the same skeleton — which is the whole claim.

  - name: exists
    asks: whether any instance is absent, or present
    requires: [identity.canonical_key, an event concept carrying it]
    contributes: {where: <key> NOT IN (SELECT <key> FROM <event> WHERE …)}
    branches_in_runtime: true
    branches: [non_fold_ops, anti_join]
    also: skips the period gate — the period belongs to the subquery, not the outer query

# ─────────────────────────────────────────────────────────────────────────────────────────────
# THE SECOND AXIS. The operation names what was asked; the DECLARATION STATE decides whether it
# can be answered and which SQL comes out. The same operation over the same question is three
# different plans depending only on what the ontology says — which is why an operation-by-shape
# matrix cannot describe this grammar, and why each row below is a refusal a bundle can fix.
# ─────────────────────────────────────────────────────────────────────────────────────────────
declaration_states:
  - state: subject declares a measure column or a rule
    effect: foldable — sum and average are available
  - state: subject declares identity.canonical_key
    effect: countable — COUNT(DISTINCT key), no rule needed
  - state: subject declares neither
    effect: refuse unsupported_intent — nothing declares a number it carries
  - state: an edge joins the subject to every named term
    effect: plannable
  - state: no edge path exists between subject and a named term
    effect: refuse no_join_path — the hop is undeclared, not absent from the data
  - state: a filtered term declares a register or an inline value domain
    effect: the name resolves to a code offline
  - state: a filtered term declares neither
    effect: refuse ontology_gap — no register, so a name cannot become a code
  # ───────────────────────────────────────────────────────────────────────────────────────────
  # A DAY IS NOT A NAME. The three states below are the built-in calendar, and they are stated
  # here because the two above were read as covering EVERY filter: on contoso5, 2026-09-30,
  # "which stores closed after 2020" arrived as {term: close_date, op: gt, value: '2020-12-31'},
  # the resolver fuzzy-matched the TERM to the register value `Closed` on status_annotation at
  # ratio 0.75 and called it resolved, then looked up the DATE as a member of Store and refused
  # "No known Store matches the value '2020-12-31'". Had the value resolved too, a question about
  # dates would have been answered by filtering on status with nothing saying so.
  #
  # Operator ruling the same day: "the mechanism for days should be default built in and NOT rely
  # in any moment on lookups". The worked bundle was carrying EIGHT registers for this — 132 rows
  # for year_month, 132 for its short form, 44 for year_quarter, 12 and 12 for month names, 7 and
  # 7 for weekdays, 4 for quarters: 350 rows of lookup for facts the Gregorian calendar states.
  # Read by mac-runtime/temporal.py.
  # ───────────────────────────────────────────────────────────────────────────────────────────
  - state: a filter's VALUE is a temporal literal (a day, month, quarter or year, absolute or one
      of the ten relative phrases) and the term names a date column the served plane measured
    effect: >-
      the built-in calendar reads it into a half-open range and the OPERATOR IS APPLIED TO THE
      RANGE'S EDGE — `after 2020` is `>= 2021-01-01`, `in 2024` is `>= 2024-01-01 AND < 2025-01-01`.
      No register is consulted and none is required. The answer discloses the range it read.
  - state: the term names no ONE date column — a grain word (date, day, month, quarter, year), or
      no temporal word at all where the VALUE is still a date — and the concept declares several
    effect: >-
      clarify, naming every date column — the resolution ladder's third rung. A concept that
      declares a `period` column has already ruled which date a question means, and that settles it
      without asking; Store declares `open_date` and `close_date` and neither is the period, so
      attributing a closure to an opening is a question only a person can answer. MEASURED: one
      phrasing of "which stores closed after 2020" reached the planner as {term: close_date,
      value: '2020-12-31'} and another as {term: Store, value: '2020'} — the concept as the term —
      so the association cannot depend on the word the model chose, only on what the concept
      declares.
  - state: the operator is `ne` over a literal coarser than a day
    effect: >-
      refuse disjunctive_filter — `not in 2024` is `< 2024-01-01 OR >= 2025-01-01`, and a filter set
      is a conjunction (see not_expressible.disjunctive_filter). A single day is expressible and is
      emitted as `<>`.
  - state: the subject's relation declares a period column
    effect: a period filter binds
  - state: it does not
    effect: refuse ontology_gap — a period that bound to nothing would label a total it did not take

# ─────────────────────────────────────────────────────────────────────────────────────────────
# PROJECTION — which columns come back. There is no `projection` field on the Intent: the columns
# are chosen through `slices`, and on an aggregate that ALSO sets the grain. Written down because
# it is the one part of the grammar with no obvious name, so a reader looking for "how do I show
# the product name instead of its id" finds nothing by searching for it.
# ─────────────────────────────────────────────────────────────────────────────────────────────
projection:
  how: >-
    One `slices` entry per column: {term: <concept>, column: <column>}. Any column the concept
    declares — dimension or attribute. A column named in `ordering.by` is pulled into the SELECT
    too, which is how "top 5 by price, shown by name" needs no new grammar.
  on_list: the slices ARE the projection — SELECT DISTINCT <columns>
  on_aggregate: >-
    the slices are the projection AND the GROUP BY. Naming the key beside the display column
    (ProductKey, ProductName) is the correct form: the key decides the grain and the name rides
    along, functionally dependent on it. Naming the display column ALONE merges any two members
    that share one.
  # ---------------------------------------------------------------------------------------------
  # DEFAULT ORDERING — a list or a breakdown COMES BACK ORDERED, and the order is declared here.
  #
  # Operator ruling, 2026-10-02, verbatim: "in such case where you deliver lists then SORT. if
  # numeric then descending, if string then alfanumeric. dont you dare to hard code this somewhere.
  # this regulation must be part of the framework."
  #
  # WHY IT IS A DECLARATION AND NOT A LINE OF CODE. SQL guarantees NO row order without ORDER BY, so
  # an unordered answer is not a reading of the question -- it is whatever the engine happened to
  # emit, and it changes between runs. Measured 2026-10-02 on AGG-15 ("net revenue by brand and
  # customer country for 2024"), an 88-row breakdown: the grader compares approved rows against the
  # capture's first 50, and WHICH 50 those are depended on unordered output, so the question passed
  # and failed on alternate runs with the data unchanged. An ordering is also what makes a truncated
  # view honest: the first 40 rows of a descending measure are the 40 that matter.
  #
  # IT APPLIES ONLY WHERE THE QUESTION SAYS NOTHING. `Intent.ordering` is the reader's own statement
  # and always wins; this is the "unless told otherwise" reading, in the same sense as a concept's
  # default population.
  default_ordering:
    when: Intent.ordering is absent and the answer carries more than one row
    rule:
      # `id` IS WHAT A READER MATCHES ON. A first cut of the reader matched the `case` PROSE and
      # got it wrong immediately: the list rule's sentence contains the word "aggregate" ("no
      # aggregate — the slices alone"), so it matched the aggregate branch and overwrote it. A rule
      # a machine selects needs a stable key, not a sentence that may be re-worded.
      # `by_aggregate`, NOT `aggregate`: the bare word is a term of
      # `mac.concept.column.query_use`, and a rule id that collides with a closed vocabulary term
      # reads as that term at every call site. `tools/census_vocabulary.py` flagged exactly that --
      # `rule.get("aggregate")` in the planner counted as a string-literal decision against the
      # vocabulary -- and the gate refused the change. A distinct id is clearer and costs nothing.
      - id: by_aggregate
        case: the projection includes an AGGREGATE (a measure column)
        order_by: that aggregate
        direction: desc
        why: >
          A breakdown is read largest-first: the question "by brand and country" is asked to find
          where the money is. Descending puts the answer in the first rows, which is also what makes
          a capped view (the first N rows) the N that matter rather than an arbitrary N.
      - id: by_slices_label
        case: >
          no aggregate — the slices alone (a LIST) — and the column's declared type is any family
          but `number` (mac.column_type)
        # WHICH FAMILIES THIS RULE COVERS, declared rather than left to the reader. The `case`
        # sentence above is for the person reading the file; a reader that parsed it would be
        # matching prose, and the one that matched prose here before got the aggregate rule wrong
        # because the list rule's text contains the word "aggregate". `otherwise` means every family
        # no other rule claims, so a sixth column_type family needs no edit here.
        families: otherwise
        order_by: the slice columns, in projection order
        direction: asc
        why: >
          A name has no magnitude to rank by, so it is ordered alphanumerically and is therefore
          stable, diffable and findable by eye. Ascending on every column in the order they are
          projected, so a multi-column list is grouped the way it is read. A DATE sorts the same
          way and means chronological, which is the reading a list of dates wants.
      - id: by_slices_magnitude
        case: >
          no aggregate — the slices alone (a LIST) — and the column's declared type is the `number`
          family (mac.column_type)
        families: [number]
        order_by: the slice columns, in projection order
        direction: desc
        why: >
          Operator's regulation, 2026-10-02: "in such case where you deliver lists then SORT / if
          numeric then descending / if string then alfanumeric". A number IS a magnitude, so it is
          read largest-first for the same reason an aggregate is -- the first rows are the ones that
          matter, which is what makes a capped view honest.

          THIS RULE IS WHY `by_slices` SPLIT IN TWO. It was one rule with `direction: asc`, and its
          own `why` gave away the assumption: "a list of NAMES has no magnitude to rank by". It was
          written for name columns and applied to every column, so a numeric dimension sorted
          ascending against the regulation. Splitting it here rather than declaring `rulings.sort`
          on each numeric column keeps the regulation in ONE place: a per-column ruling would be
          this universal rule re-typed per column, per bundle, and again for every data source.
    never: >
      This never overrides `Intent.ordering`, and it never adds a LIMIT. Ordering decides the order
      of the rows; how many come back is `Intent.limit`, which is the reader's to state.
  gaps:
    - id: no_display_only_column
      what: a column shown but NOT grouped by
      why: >-
        every slice joins the GROUP BY, so on an aggregate "show this" and "group by this" cannot
        be said apart. Harmless where the column is functionally dependent on the key, and not
        expressible where it is not.
    - id: identity_column_not_suppressible
      what: asking for one column still returns the concept's identity column beside it
      example: a slice on ProductName yields "ProductName, ProductCode AS product"
      why: the identity is appended by the assembler and no field withholds it
      note: >-
        CLOSED 2026-09-29 by the runtime (mac-runtime grammar_reader.CLOSED_GAPS): a LIST that
        names a column of its own subject gets that column alone — "countries where we have
        customers" is SELECT DISTINCT country, 8 rows, where it was country beside every customer
        name, 100,793 rows. A slice on ANOTHER concept still lists the subject beside it
        ("products by category"), which is the design, not the gap. Listed until retired.
    - id: identity_column_duplicated
      what: naming the identity column as a slice emits it TWICE
      example: "SELECT DISTINCT ProductName, ProductCode, ProductCode AS product"
      why: the assembler appends the identity without checking whether a slice already named it
      note: a defect, not a design — unlike the two above, this one is fixable without new grammar

# ─────────────────────────────────────────────────────────────────────────────────────────────
# WHAT THIS GRAMMAR CANNOT SAY. Recorded so the gap is visible rather than discovered.
# ─────────────────────────────────────────────────────────────────────────────────────────────
not_expressible:
  - id: having
    what: a predicate on an AGGREGATE rather than on a row
    example: countries where the average order value exceeds 500
    why: every filter the Intent can carry lands in WHERE; there is no HAVING
    measured: the one corpus question of 70 that no hand-written intent could encode
  - id: correlated_subquery_filter
    what: a filter INSIDE the subquery an anti-join builds
    example: stores in Italy with no sales
    why: exists contributes one subquery and the Intent cannot qualify it
  - id: null_test
    what: a filter testing whether a column IS NULL or IS NOT NULL
    example: how many stores are still open
    why: >-
      FilterOp is a closed set of eight comparison operators and none of them is a null test.
      A value literal cannot stand in: 'NULL' is the four-character string.
    measured: >-
      2026-09-24, contoso. The bundle RULES that operating stores are read from CloseDate IS NULL
      ("because no status code says so") and the planner refuses the question unresolved_term. The
      declaration is correct, machine-readable, and unreachable — the estate's signature defect in
      its purest form, and the first instance found where the unread declaration is a RULE the
      bundle wrote specifically to stop a wrong answer.
  - id: negation_over_nullable
    what: >-
      a negated filter (ne / not_in) that should keep rows where the column is NULL
    example: how many stores are not closed
    why: >-
      NE renders <> and NOT_IN renders NOT IN. Both are SQL three-valued logic, so every NULL row
      is discarded silently. The Intent can SAY "not closed"; it cannot say whether the unstatused
      rows are meant, and they almost always are — an absence is normally the complement being
      asked for.
    measured: >-
      2026-09-24, contoso. "How many stores are not closed" — the planner emits
      `Status <> 'Closed'` and returns 6. The answer is 59. The 59 stores carrying no status are
      exactly the ones the question is about, and `<>` drops all of them. NOT A REFUSAL AND NOT AN
      ERROR: a plausible small number, from valid SQL, with nothing in the result to say so.
    severity: >-
      the worst class in this file — the other gaps refuse, this one answers

  # ---------------------------------------------------------------------------------------------
  # MEASURED 2026-09-24 against 9 568 third-party questions over 171 databases — BIRD dev (1 534),
  # Spider dev (1 034) and Spider train (7 000), by benchmark/encodability.py. Every count below is
  # `sole`: questions this feature ALONE costs, so the numbers are additive and are a roadmap.
  # Reachable today is 74.0 %; closing the first five takes it to 89.4 %.
  # NOT in this list, deliberately: computed measures (CASE WHEN aggregation, column arithmetic,
  # outer joins). Those are absorbed by a DECLARED rule — 4.2 % of the corpus — and are ontology
  # authoring, not a grammar gap.
  # ---------------------------------------------------------------------------------------------
  - id: set_operation
    what: INTERSECT or UNION — two independent row-sets combined on a key
    example: countries where a singer over 40 AND a singer under 30 are from
    why: >-
      one Intent describes one row-set. EXCEPT is NOT in this gap — it is the anti-join the
      `exists` operation already covers.
    measured: 353 questions, the second largest single gap
  - id: disjunctive_filter
    what: OR between predicates in WHERE
    example: staff in Georgia or Utah
    why: Intent.filters is a conjunction; there is no way to express alternation
    measured: 244 questions. Small to fix and there is no design question in it
  - id: multiple_measures
    what: two different aggregates in one answer
    example: the count of orders AND their total value, side by side
    why: Intent carries ONE subject; `denominator` is a second only to divide by
    measured: 208 questions
    note: >-
      CLOSED 2026-09-30 by `Intent.also` (mac-runtime models.MeasureRef), on the operator's ruling:
      "this is absolutely standard question or ask and such situation will repeat multiple times —
      the framework must be able to generate complex queries too ... go and do it right". An answer
      is N AGGREGATES OVER ONE ROW SET: the same FROM, WHERE, GROUP BY and period, one SELECT column
      per measure, each aggregating the way its own subject would. `subject` is the first of them, so
      every reader that knows only about `subject` is unchanged.

      WHAT MADE IT URGENT rather than merely large. "Compare gross vs net revenue by brand" reached
      the planner with the second measure filed as a `denominator`, so the only computable thing was
      a QUOTIENT — 1.06 per brand, a plausible number answering a question nobody asked. The gap was
      not just refusing 208 questions; on this shape it was one fix away from answering them wrongly.

      THE SHAPE IS STILL DETECTED, and deliberately: `EXPRESSED_BY` means "never refuse", and a field
      being ABLE to carry a second measure is not evidence that a given question's intent did. A
      question naming two measures with neither `also` nor a denominator has dropped one in silence,
      and that is what the detector is for. Wiring it as expressed-and-never-refused removed the
      protection, and this repository's own reconciliation test caught it in one run.

      STILL NOT EXPRESSIBLE: arithmetic BETWEEN the columns. "The difference between gross and net"
      is a third measure a bundle declares, not something a question composes here. Listed until the
      entry is retired.
  - id: string_match
    what: LIKE / prefix / substring matching
    example: districts whose name starts with 'Riverside'
    why: FilterOp has eight comparison operators and none matches a pattern
    measured: 205 questions. Note this is resolution's job in MAC — a register resolves a name to a
      code offline — so some of these are a REGISTER gap in the bundle rather than a grammar gap
  - id: derived_table
    what: a CTE or a subquery in FROM
    example: any two-step computation gold SQL writes as WITH
    why: the planner composes one FROM from the anchor and its join path
    measured: >-
      41 sole, but 714 questions mention a subquery SOMEWHERE and only 7 are blocked by that
      alone — subqueries almost always co-occur with another gap, so this is NOT where to start.
      Recorded because the raw count is the misleading one.

# THE QUERY GRAMMAR — what an operation contributes to SQL, and what it needs declared.
#
# STATUS: PROPOSED. Not ratified. The runtime does not read this file: it is checked AGAINST the
# runtime by tools/check_query_grammar.py, which reds when the two disagree. That is deliberate —
# see QUERY_GRAMMAR.md §5. A declaration nothing reads is the estate's recorded defect (the worked bundle's
# decisions/0005), so this one is born with a reader even though it is not yet an input.
#
# WHAT THIS FILE IS FOR. The operation vocabulary already existed, in two homes that cannot be
# reviewed: a Python `StrEnum` and a prose paragraph in the interpreter's prompt. This is not a
# tenth declaration — it is the same closed vocabulary, written where a person can read it beside
# what it does, and where a gate can check it.
#
# THE MEASURED FINDING THIS FILE RECORDS. The operation is NOT what decides the SQL. Four of the
# nine members change anything at all, and between them they make three decisions. Everything
# else is emergent: from what the subject DECLARES, and from which optional Intent fields the
# interpreter filled. `branches_in_runtime` says, per operation, which it is — and the gate
# proves the answer against the code rather than trusting this comment.

metadata:
  schema: mac.query_grammar/1
  status: PROPOSED
  measured_against: mac-platform @ packages/mac-runtime/src/mac_runtime/planner
  measured_on: '2026-09-23'

# ─────────────────────────────────────────────────────────────────────────────────────────────
# THE SKELETON. Every operation contributes to the same SELECT, and contributes nothing else.
# There is no per-operation code path and no per-question-shape route; an operation that needed
# one would be a defect in this grammar, not a new branch.
# ─────────────────────────────────────────────────────────────────────────────────────────────
skeleton: SELECT … FROM <anchor> JOIN … WHERE … GROUP BY … ORDER BY … LIMIT …

# ─────────────────────────────────────────────────────────────────────────────────────────────
# THE NINE WORDS. `requires` is what must be DECLARED for the operation to be plannable at all —
# the thing that refuses when it is missing. `contributes` is what it adds to the skeleton.
# `branches_in_runtime` is measured: true means some code tests for this operation by name.
# ─────────────────────────────────────────────────────────────────────────────────────────────
operations:

  - name: count
    asks: how many distinct instances
    requires: [identity.canonical_key]
    contributes: {select: COUNT(DISTINCT <canonical_key>)}
    branches_in_runtime: true
    branches: [non_fold_ops]    # lets a non-measure subject past the fold gate
    refuses_when: the subject declares no canonical_key and no rule
    note: >-
      The key does the work, not the word. The worked bundle's decisions/0005 proved the route by giving each
      concept `COUNT(DISTINCT <the key it already declares>)` and planning it unchanged.

  - name: sum
    asks: the total of a number
    requires: [semantics.measure_type, a measure column or a derivation rule]
    contributes: {select: SUM(<measure expression>)}
    branches_in_runtime: false
    emerges_from: the fold law over the subject's declared measure
    refuses_when: nothing declares a number the subject carries

  - name: average
    asks: the mean of a number
    requires: [semantics.measure_type, a measure column or a derivation rule]
    contributes: {select: AVG(<measure expression>)}
    branches_in_runtime: false
    emerges_from: the fold law over the subject's declared measure
    open_question: >-
      A plain mean does not COMPOSE — a breakdown and a grand total disagree. The fold grammar
      says so and names `weighted_mean` as the operator that does. This grammar does not yet say
      which one `average` selects, and the answer belongs in the fold plane, not here.

  - name: list
    asks: which members exist
    requires: [a column to list — canonical_key, or a named slice column]
    contributes: {select: SELECT DISTINCT <column>}
    branches_in_runtime: true
    branches: [non_fold_ops, select_distinct]

  - name: rank
    asks: the top or bottom N
    requires: [an aggregate to order by, or a declared column named in `ordering.by`]
    contributes: {order_by: <aggregate|column> <direction>, limit: <limit>}
    branches_in_runtime: false
    emerges_from: Intent.ordering and Intent.limit being populated
    note: >-
      `rank` is a NAME for a shape the skeleton already had. Setting ordering+limit produces the
      same SQL whatever the operation says, which is why the word is not branched on.

  - name: compare
    asks: two or more members side by side
    requires: [a dimension both members share]
    contributes: {group_by: <axis>, where: <axis> IN (<members>)}
    branches_in_runtime: false
    emerges_from: slices plus an IN filter — it desugars, and nothing reads the word
    open_question: >-
      DESUGARING IS NOT OBVIOUSLY RIGHT AND IS RECORDED AS UNSETTLED. "Germany versus France"
      becomes one grouped result with two rows. A reader asking to COMPARE may mean a difference,
      a ratio, or two columns side by side, and none of those is what this produces. Measured on
      the corpus, compare questions plan — that says the SQL is valid, not that it answers.

  - name: ratio
    asks: a share, a percentage, or one figure per another
    requires: [Intent.denominator naming a second subject]
    contributes: {select: "(<numerator>) / NULLIF(<denominator aggregate>, 0)"}
    branches_in_runtime: false
    emerges_from: Intent.denominator being populated
    note: >-
      THE DENOMINATOR IS AGGREGATED THE WAY ITS OWN SUBJECT WOULD BE, not by a second mechanism.
      A measure with a derivation rule contributes that rule's template; a countable contributes
      COUNT(DISTINCT <its canonical_key>). So "per customer" divides by the customers a bare
      "how many customers" would have counted — one definition of a count, never two that drift.
      The denominator is also JOINED like any other term, so a denominator with no path refuses
      `no_join_path` naming both ends rather than composing SQL the engine would reject.
      NULLIF guards the zero: a group with no denominator rows has no answer, and NULL is the
      only honest cell.
    was_unread_until: '2026-09-24'
    history: >-
      DECLARED AND READ BY NOTHING for as long as it existed. The field was on the model, the
      prompt asked the model to fill it, the model filled it — and no step of the planner
      mentioned it, so a ratio question planned its NUMERATOR ALONE. Measured on a 70-question
      corpus: "revenue per customer by country" and "average order value by country" compiled to
      the SAME SQL as each other and as a plain total. It refused for a day, which was honest and
      not an answer. Verified on build: average order value now returns 2 341.01, matching an
      INDEPENDENT computation (the mean of per-order totals) exactly, where dividing by the line
      count gives 976.96 — 2.40x out, and plausible.
  - name: define
    asks: what a declaration says
    requires: [the meaning plane — the generated system concepts]
    contributes: {from: <meta_ relation>, where: <identifier> = <name>}
    branches_in_runtime: true
    branches: [non_fold_ops]
    note: >-
      Not a special route. The meaning plane is a bundle like any other, generated rather than
      authored, and `define` reads it with the same skeleton — which is the whole claim.

  - name: exists
    asks: whether any instance is absent, or present
    requires: [identity.canonical_key, an event concept carrying it]
    contributes: {where: <key> NOT IN (SELECT <key> FROM <event> WHERE …)}
    branches_in_runtime: true
    branches: [non_fold_ops, anti_join]
    also: skips the period gate — the period belongs to the subquery, not the outer query

# ─────────────────────────────────────────────────────────────────────────────────────────────
# THE SECOND AXIS. The operation names what was asked; the DECLARATION STATE decides whether it
# can be answered and which SQL comes out. The same operation over the same question is three
# different plans depending only on what the ontology says — which is why an operation-by-shape
# matrix cannot describe this grammar, and why each row below is a refusal a bundle can fix.
# ─────────────────────────────────────────────────────────────────────────────────────────────
declaration_states:
  - state: subject declares a measure column or a rule
    effect: foldable — sum and average are available
  - state: subject declares identity.canonical_key
    effect: countable — COUNT(DISTINCT key), no rule needed
  - state: subject declares neither
    effect: refuse unsupported_intent — nothing declares a number it carries
  - state: an edge joins the subject to every named term
    effect: plannable
  - state: no edge path exists between subject and a named term
    effect: refuse no_join_path — the hop is undeclared, not absent from the data
  - state: a filtered term declares a register or an inline value domain
    effect: the name resolves to a code offline
  - state: a filtered term declares neither
    effect: refuse ontology_gap — no register, so a name cannot become a code
  - state: the subject's relation declares a period column
    effect: a period filter binds
  - state: it does not
    effect: refuse ontology_gap — a period that bound to nothing would label a total it did not take

# ─────────────────────────────────────────────────────────────────────────────────────────────
# PROJECTION — which columns come back. There is no `projection` field on the Intent: the columns
# are chosen through `slices`, and on an aggregate that ALSO sets the grain. Written down because
# it is the one part of the grammar with no obvious name, so a reader looking for "how do I show
# the product name instead of its id" finds nothing by searching for it.
# ─────────────────────────────────────────────────────────────────────────────────────────────
projection:
  how: >-
    One `slices` entry per column: {term: <concept>, column: <column>}. Any column the concept
    declares — dimension or attribute. A column named in `ordering.by` is pulled into the SELECT
    too, which is how "top 5 by price, shown by name" needs no new grammar.
  on_list: the slices ARE the projection — SELECT DISTINCT <columns>
  on_aggregate: >-
    the slices are the projection AND the GROUP BY. Naming the key beside the display column
    (ProductKey, ProductName) is the correct form: the key decides the grain and the name rides
    along, functionally dependent on it. Naming the display column ALONE merges any two members
    that share one.
  gaps:
    - id: no_display_only_column
      what: a column shown but NOT grouped by
      why: >-
        every slice joins the GROUP BY, so on an aggregate "show this" and "group by this" cannot
        be said apart. Harmless where the column is functionally dependent on the key, and not
        expressible where it is not.
    - id: identity_column_not_suppressible
      what: asking for one column still returns the concept's identity column beside it
      example: a slice on ProductName yields "ProductName, ProductCode AS product"
      why: the identity is appended by the assembler and no field withholds it
    - id: identity_column_duplicated
      what: naming the identity column as a slice emits it TWICE
      example: "SELECT DISTINCT ProductName, ProductCode, ProductCode AS product"
      why: the assembler appends the identity without checking whether a slice already named it
      note: a defect, not a design — unlike the two above, this one is fixable without new grammar

# ─────────────────────────────────────────────────────────────────────────────────────────────
# WHAT THIS GRAMMAR CANNOT SAY. Recorded so the gap is visible rather than discovered.
# ─────────────────────────────────────────────────────────────────────────────────────────────
not_expressible:
  - id: having
    what: a predicate on an AGGREGATE rather than on a row
    example: countries where the average order value exceeds 500
    why: every filter the Intent can carry lands in WHERE; there is no HAVING
    measured: the one corpus question of 70 that no hand-written intent could encode
  - id: correlated_subquery_filter
    what: a filter INSIDE the subquery an anti-join builds
    example: stores in Italy with no sales
    why: exists contributes one subquery and the Intent cannot qualify it
  - id: null_test
    what: a filter testing whether a column IS NULL or IS NOT NULL
    example: how many stores are still open
    why: >-
      FilterOp is a closed set of eight comparison operators and none of them is a null test.
      A value literal cannot stand in: 'NULL' is the four-character string.
    measured: >-
      2026-09-24, contoso. The bundle RULES that operating stores are read from CloseDate IS NULL
      ("because no status code says so") and the planner refuses the question unresolved_term. The
      declaration is correct, machine-readable, and unreachable — the estate's signature defect in
      its purest form, and the first instance found where the unread declaration is a RULE the
      bundle wrote specifically to stop a wrong answer.
  - id: negation_over_nullable
    what: >-
      a negated filter (ne / not_in) that should keep rows where the column is NULL
    example: how many stores are not closed
    why: >-
      NE renders <> and NOT_IN renders NOT IN. Both are SQL three-valued logic, so every NULL row
      is discarded silently. The Intent can SAY "not closed"; it cannot say whether the unstatused
      rows are meant, and they almost always are — an absence is normally the complement being
      asked for.
    measured: >-
      2026-09-24, contoso. "How many stores are not closed" — the planner emits
      `Status <> 'Closed'` and returns 6. The answer is 59. The 59 stores carrying no status are
      exactly the ones the question is about, and `<>` drops all of them. NOT A REFUSAL AND NOT AN
      ERROR: a plausible small number, from valid SQL, with nothing in the result to say so.
    severity: >-
      the worst class in this file — the other gaps refuse, this one answers

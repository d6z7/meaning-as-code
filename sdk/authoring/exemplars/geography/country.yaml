# ACME > geography > Country  (homogenized clean-state)
#
# TO-BE country concept. The raw model stores country as an EAV (dim_acme_raw_country: one row
# per (country × attribute) — acme_country_code, acme_channel_code, attribute, value, acme_country)
# AND identifies a country by a channel-PERSPECTIVE label (market='HOME', not the country's own name).
# The serving dim_country view (data/transforms/dim_country.sql) FLATTENS the EAV to columns and exposes
# a STABLE ISO key (iso2/iso3) so the consumer resolves a country by ISO, never by a name literal.
# This concept describes only that clean, flattened result. THE TEST: an AI must resolve any
# country to its ACME fact rows from THIS FILE ALONE — no EAV pivot, no name guess, no probe.

metadata:
  concept: Country
  source: ACME
  # this version adds the served-versus-catalogued rule ('serve' = present in the sales fact, not the dim_country catalog)
  version: '1.0'
  schema_version: '0.1.13'
  status: draft
  owner: data-platform-team
  confidence: C                 # C confirmed · I inferred · Q needs-SME (whole-file default)

concept:
  name: Country
  label: Country
  class: reference
  identity:
    kind: iso
    canonical_key: iso2
  definition: >
    A country — the leaf of the ACME geography hierarchy. In ACME a country has ONE stable
    identity: its ISO code (iso2 / iso3). The channel-perspective market label (e.g. HOME for the
    retailer's home-country perspective) and the channel-scoped join key (acme_channel_market_code) are
    separate attributes ON the country, not its identity. The raw EAV is flattened to columns by
    the serving view; the consumer filters by iso2/iso3 and never by a country-name string.

# name->iso2 surface register at data/lookups/dim_country.lookup.csv (thin; widening to
# acme_channel_market_code/market is a warehouse follow-on;
# drift: gen_country_lookup.py --check).

# =========================================================================
# THE GROUNDING — points at the SERVING VIEW (flattened dim), never the raw EAV
# =========================================================================
grounding:
  sources:
    - relation: acme.dim_country
      key: acme_channel_market_code
      columns: [acme_channel_market_code, channel_code, iso2, iso3, market, country_name_local]
  # v0.1.7 whitelist: the columns carrying ontology meaning + their analytical role (acme.* vocab,
  # model/_shared/vocabulary.yaml). 'attribute' ⇒ display-only/never-filter; the behavioural specifics
  # (iso2 IS the identity, market is NOT) stay as the typed contract.rules below.
  field_roles:
    acme_channel_market_code: acme.field_role.key
    iso2:                     acme.field_role.key
    iso3:                     acme.field_role.key
    channel_code:             acme.field_role.dimension
    market:                   acme.field_role.dimension
    country_name_local:       acme.field_role.attribute
  grain: >
    ONE ROW PER (acme_channel_market_code). The view PIVOTs the EAV (max(CASE WHEN attribute=… )) to
    one flat row per channel-scoped country key, so every attribute below is a plain column.
  # NOTE: column metadata is single-homed in the Physical layer (tables/dim_country.yaml):
  #   acme_channel_market_code (key) · channel_code (single-char channel, do not substr) ·
  #   iso2 (key, country identity) · iso3 (key) · market (perspective label, not identity,
  #   the home country ≠ its own name) · country_name_local (display only, never a filter key).
  #   No region column — region is a derived, named additive rollup (see geography/region.yaml).

# =========================================================================
# THE CONTRACT — agent-facing binding rules (folds no_probe_guarantee +
# identity_contract + grounding.guarantees; CONCEPT_SPEC v0.5)
# =========================================================================
contract:
  no_probe_guarantee: |
    To answer "what was <measure> for <country> …", an AI needs ONLY:
      1. map the country name to its iso2/iso3;
      2. filter dim_country on that ISO;
      3. attach the sales fact via edges.yaml#sales__of_country.
    NO EAV pivot, NO attr_code_NN selection, NO guessing whether the country is its local name vs 'HOME', NO
    country-name literal anywhere. The view flattened the EAV, picked the canonical ISO, and exposed the perspective
    label separately. If any of that is still needed, THIS FILE is incomplete and must be fixed; do not fall back to
    a probe.
  # eav-pivot + iso-canonicalize + perspective-label-separate transforms (raw defects + how) live in the
  # data-transformation layer
  dissolved_by: data/transforms/dim_country.yaml
  # SOURCE rules only — general rules + structure spec: see query_rules.yaml header.
  applies: [resolve.by_semantic_identity, resolve.never_fabricate]
  rules:
    - id: country.resolve.by_iso_code
      subject: "Resolve a country by ISO code, not its local-language display name"
      kind: mac.rule_kind.resolution
      confidence: C
      scope: ACME
      binds: [iso2, iso3]
      when:  "resolving or filtering a country named in a question"
      then:  "map the name -> iso2 (NL, ES, IT, FR, BE, ...) and filter dim_country.iso2 = '<iso2>' (or iso3); the
              EAV's attr_code_01..attr_code_19 sprawl is collapsed to ONE canonical pair, so iso2/iso3 are the
              identity"
      never: "emitting a country-name string as a SQL literal against this model (country_name_local, e.g.
              'Nederland', is HUMAN-READABLE display only, never a filter key; the home country's own name returns
              0 rows)"

    - id: country.resolve.channel_label_is_not_identity
      subject: "Treat market as a channel-perspective descriptor, not country identity"
      kind: mac.rule_kind.resolution
      confidence: C
      scope: ACME
      binds: [market]
      when:  "deciding whether to filter the 'market' column"
      then:  "treat 'market' (e.g. 'HOME' = the retailer's home-country channel perspective) as a SEPARATE attribute,
              not the country identity; filter it ONLY when the QUESTION is about the perspective itself"
      never: "using 'market' as the country key, or equating the home country with its own name string (returns 0
              rows)"

    - id: country.count.served_not_catalogued
      subject: "Count served countries by the fact join, not the catalog dim"
      kind: mac.rule_kind.resolution
      confidence: C
      scope: ACME
      binds: [iso2, acme_channel_market_code]
      when:  "a question asks which / how many markets or countries the dataset SERVES / covers / carries
              data for — introspection over the served geography (e.g. 'How many markets (countries) does
              the ACME dataset serve?'), or any answer that must distinguish a served market from a merely
              catalogued one"
      then:  "SERVED = PRESENT IN THE SALES FACT PLANE: a country counts as served iff at least one row of
              the fact view acme.v_acme_sales_current joins to it — the served-market count is
              COUNT(DISTINCT c.iso2) FROM acme.v_acme_sales_current k JOIN acme.dim_country c ON
              k.acme_channel_market_code = c.acme_channel_market_code. dim_country ALONE is the CATALOG: it
              lists every country the dimension knows (incl. countries with zero fact rows), so its bare
              distinct-iso2 count is the catalog size, not the served set. 'Market' here is the country
              grain (iso2), the atomic geography; regions (R1, R2, EU27, ...) are channel-relative rollups
              OVER these markets, not additional markets. Disclose the reading (served = appears in the
              fact) in the answer."
      never: "answering a 'does the dataset serve / how many markets does it serve' question with
              COUNT(DISTINCT iso2) FROM acme.dim_country alone (no fact join) — that returns the catalog
              cardinality and overstates the served set (the catalog can be twice the served set);
              nor counting acme_channel_market_code rows (channel-scoped keys fan the same country out per
              channel — always collapse to DISTINCT iso2)"

    - id: country.breakdown.label_unmapped_markets
      subject: "In a per-market breakdown keyed on iso2, surface null-iso2 markets as one labeled bucket, never blank"
      kind: mac.rule_kind.guarantee
      confidence: C
      scope: ACME
      binds: [iso2, acme_channel_market_code]
      when:  "a question breaks a measure down PER market / country (one row per country) keyed on
              dim_country.iso2 — INCLUDING a per-market COMPARISON whose shared axis is the country (iso2 is the
              cross-channel alignment key). The registered supra-national buckets / channel codes (e.g.
              W_NORDICS, W_REST_OF_REGION, W_EXPORT_DIRECT) carry REAL fact value but NULL iso2"
      then:  "KEEP iso2 as the row key (the atomic country grain AND the cross-channel alignment key), and render
              the NULL-iso2 rows as ONE explicitly-labeled bucket — COALESCE(c.iso2, '(unmapped / supra-national
              markets)') (or surface the underlying market codes) — disclosing in ASSUMPTIONS that iso2-less
              markets are grouped as unmapped. The value STAYS in the result so the measure total is complete.
              AGGREGATE AT THE iso2 GRAIN IN ONE SCOPE: JOIN dim_country and GROUP BY c.iso2 in the SAME
              (aggregating) query as the conditional SUM(CASE WHEN <series> THEN value ELSE 0 END), so BOTH
              entities for one market collapse into a SINGLE row. A cross-channel comparison's two entities live
              under DIFFERENT acme_channel_market_code namespaces (web -> W_<MKT>, stores -> R_<MKT>) that map
              to the SAME iso2 — so iso2 must be the GROUP BY grain, resolved BEFORE/DURING the aggregation,
              never after"
      never: "rendering the null-iso2 rows as a BLANK / NULL market cell (an unlabeled row that reads as a data
              error); silently DROPPING them with WHERE iso2 IS NOT NULL (that undercounts the measure — the
              buckets carry real value); or GROUP BY acme_channel_market_code to dodge the null — it is a
              channel-scoped '<channel_code>_<MARKET>' composite (channel_market_code.yaml) that fans one country
              into per-channel rows and MISALIGNS a cross-channel comparison; aggregating the conditional
              SUM on the raw acme_channel_market_code (or ANY channel-scoped fact key) in an inner scope and
              resolving iso2 only in an OUTER projection — the two channels' keys (W_NL vs R_NL) never share a
              group, so the outer iso2 mapping emits the SAME market TWICE (one row per channel, each with the
              other channel 0), never merged"

    - id: country.rollup.region_is_derived
      subject: "Country is the atomic grain; regions are derived, not stored"
      kind: mac.rule_kind.guarantee
      confidence: C
      scope: ACME
      binds: []
      when:  "a question rolls a country up to a region"
      then:  "treat Country as the ATOMIC grain and derive the region per query as a NAMED, ADDITIVE rollup of member
              countries under one channel's definition (see geography/region.yaml)"
      never: "expecting or reading a region column on the country — region is NOT stored here"
  inherited_guarantees: >
    From the serving view (data/transforms/dim_country.yaml), relied on here and not re-derived: the EAV is
    flattened to one flat row per acme_channel_market_code; the attr_code_01..attr_code_19 sprawl is collapsed to
    ONE canonical iso2/iso3 pair (country identity); the channel-perspective label is exposed separately as
    'market' (HOME), not as the identity; country_name_local is retained as a human-readable attribute only.

governance:
  owner: data-platform-team
  last_reviewed: 2026-06-17

# The COLUMN STANDARD, as a bundle: four concepts on the current grammar, copied from contoso5 at
# f23eec8 (2026-09-29). ONE HOME for two jobs — the composer's exemplar (sdk/cli/harvest.py shows
# product.yaml to the model as the shape to imitate) and the round-trip fixture (tests/
# test_column_roundtrip.py here; packages/mac-runtime/tests/test_column_roundtrip.py in the
# platform, on a hermetic copy checked against these bytes). What the composer emits, the reader
# loads — and this is the file both are held to.
spec_version: mac.container/1
metadata:
  project: sdk/authoring/exemplars/bundle
  data_domain: example
  dataset: contoso5
  label: The column standard — exemplar and round-trip fixture
planes:
  ontology: ontology
conformance:
  out_of_scope:
    - path: data/lookups/exemplar_brand.lookup.yaml
      reason: >-
        A REGISTER DESCRIPTOR of the data plane, carried so the `register:` pointer on
        `product.brand` resolves to something a reader can open. This bundle declares only the
        `ontology` plane — it exists to be the column standard's exemplar, not a complete
        two-plane project — so the data-plane shape that would validate this file is not loaded
        here. contoso5 is where that descriptor is held to its definition.

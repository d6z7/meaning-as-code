# guardrails/data-ingestion.yaml — PHASE 1: INGESTING DATA SOURCES.
#
# WHAT THIS TOPIC RULES. One delivery: the LANDING PLANE. What a warehouse already holds, described,
# measured, previewed, cut into registers and rendered for a person to read. It ends before anything
# is transformed.
#
# WHAT IT DOES NOT RULE, and must not be read as ruling: the served plane, the ontology, the
# acceptance plane, the console. UNSPECIFIED IS NOT RULED (see README) — a thing absent from this
# file is allowed, and if that turns out wrong the fix is to write the rule, not to infer it.
#
# WHY IT EXISTS. Measured 2026-09-28: five ingestions of one bundle in a day, each losing a different
# deliverable while reporting itself complete. Not forgetting — RE-INFERENCE. What is not written
# down is re-derived on the next run, and re-derivation is stochastic.

spec_version: mac.guardrail/1
topic: data-ingestion
phase: sources
status: PROPOSED 2026-09-29

# ══════════════════════════════════════════════════════════════════════════════════════════════
# WHAT THIS DELIVERY OWES
#
# One entry per item. `population` is the DENOMINATOR — what the item must cover — so "8 of 8" means
# something and "0 of 0" is reported EMPTY, never complete. `consumers[].reads` names the FIELDS a
# reader wants, which is what makes a reader/producer disagreement checkable: on 2026-09-28 a UI read
# `question.sme_owner` while the producer wrote `ruling.question`, and the pane announced "Every
# condition has been ruled" over seven open questions.
# ══════════════════════════════════════════════════════════════════════════════════════════════
delivers:

  landed_descriptor:
    what: what a landed relation CONTAINS, measured from the warehouse catalog
    path: data/sources/{relation}.yaml
    naming: the landing's own relation name, verbatim — a landing is never renamed
    population: {of: every landed relation, from: the warehouse's landing schema, empty_is: EMPTY}
    lifecycle: re-derived
    producers:
      - {tool: "tools/mac_descriptors.py", role: "measures", args: "--plane sources"}
      - {tool: "tools/mac_profile.py", role: "adds the measured value domains"}
      - {tool: "tools/mac_lookups.py", role: "cuts those domains out into registers"}
    consumers:
      - {tool: sdk/project/project_data.py, role: renders the relation page,
         reads: ["table.name", "table.schema", "columns[].name", "columns[].type", "columns[].role", "columns[].references", "columns[].register"]}
      - {tool: sdk/project/er_model.py, role: draws the ER entity and its crow's feet,
         reads: ["table.name", "columns[].name", "columns[].references.to", "columns[].references.cardinality", "columns[].references.participation"]}
      - {tool: "tools/mac_references.py", role: "takes the measured key", reads: ["columns[].role", "columns[].name"]}
    checkers:
      - {tool: "tools/check_column_planes.py", rejects: [R1, R2, R3]}
      - {tool: "tools/check_profile_plane.py", rejects: [MISNAMED, ORPHAN, STALE_COLUMN, STALE_DOMAIN]}
    transient: [values]          # legal in flight, forbidden at delivery — it belongs in a register

  profile:
    what: the measurement — row counts, distincts, nulls, and the identity evidence behind a key
    path: data/profiles/{relation}.yaml
    naming: the relation's stem, verbatim
    population: {of: every landed relation, from: data/sources/*.yaml, empty_is: EMPTY}
    lifecycle: re-derived
    producers: [{tool: tools/mac_profile.py, role: measures}]
    consumers:
      - {tool: "sdk/project/er_model.py", role: "the MEASURED key on the ER box", reads: ["identity_evidence.key"]}
      - {tool: tools/mac_descriptors.py, role: re-derives a register column's cardinality,
         reads: ["of", "columns[].name", "columns[].distinct"]}
    checkers: [{tool: tools/check_profile_plane.py, rejects: [MISNAMED, ORPHAN, STALE_COLUMN, STALE_DOMAIN]}]

  reference_measurement:
    what: the measured references of one relation, with the evidence behind each verdict
    path: data/references/{relation}.yaml
    naming: the relation's stem, verbatim
    population: {of: every landed relation, from: data/sources/*.yaml, empty_is: EMPTY}
    lifecycle: re-derived
    producers: [{tool: tools/mac_references.py, role: measures, args: "--plane sources"}]
    consumers:
      - {tool: tools/mac_descriptors.py, role: promotes a real identity reference onto the column,
         reads: ["references[].verdict", "references[].parent_key_role", "references[].cardinality", "references[].participation", "references[].from", "references[].to"]}
      - {tool: sdk/project/er_model.py, role: the line's proof channel,
         reads: ["evidence.orphan_rows", "evidence.parent_distinct", "ambiguous_with", "cardinality", "participation"]}
    checkers:
      - {tool: tools/check_physical_references.py,
         rejects: [EVIDENCE_MISSING, ADMISSION_MISSING, ENDPOINT_UNRESOLVED, COLUMN_UNDECLARED,
                   PARTICIPATION_MISSING, VOCABULARY_CLOSED, AMBIGUITY_HIDDEN, DANGLING_INVENTED,
                   ID_COLLISION, UNMEASURED_RELATION]}

  relation_preview:
    what: a seeded sample of one landed relation, for a person to look at
    path: data/samples/{relation}.src.sample.csv
    naming: >-
      the relation's stem plus `.src.` — the two planes share a directory and a 1:1 passthrough
      bundle shares the stem, so the plane must be in the name
    population: {of: every landed relation, from: data/sources/*.yaml, empty_is: EMPTY}
    lifecycle: re-derived
    producers: [{tool: tools/mac_sample.py, role: draws, args: "--plane sources"}]
    consumers: [{tool: sdk/project/objects.py, role: offers the Sample tab, reads: ["«path only»"]}]
    checkers:
      - {tool: tools/check_sample_matches_descriptor.py,
         rejects: [HEADER_DRIFT, RAGGED, ORPHAN, SUFFIX_CROSSED, EMPTY_PREVIEW, MISSING_PREVIEW,
                   UNRECORDED, OUTSIDE_DECLARED_VALUES]}

  register:
    what: a value DOMAIN cut from one column — its members, with a label and a search key
    path: data/lookups/{marker}_{relation}_{column}.lookup.csv
    naming: >-
      marker, relation and column — the register IS its (relation, column). The marker is omitted
      when the relation already carries it. A name keyed on the COLUMN ALONE made two relations
      sharing a column name overwrite one another: measured 2026-09-28, eight domains lost across
      four bundles.
    columns: [«code», label, search_key, source_view, source_schema, confidence, note]
    population: {of: every column whose value domain was measured, from: the profile's domains, empty_is: EMPTY}
    lifecycle: re-derived
    producers: [{tool: tools/mac_lookups.py, role: cuts, args: "--plane sources"}]
    consumers:
      - {tool: tools/mac_descriptors.py, role: re-attaches the column's register pointer,
         reads: ["«header[0]»", "source_view"]}
      - {tool: sdk/project/project_data.py, role: renders the register page,
         reads: ["«header»", "«rows»", "source_view", "source_schema", "note"]}
    checkers:
      - {tool: "tools/check_lookups.py", rejects: [cited-register-missing, source_view-dangling]}
      - {tool: "tools/check_one_register_per_dimension.py", rejects: [two-registers-one-column]}
      - {tool: "tools/check_register_membership.py", rejects: [MISSING, NEW, NULLS, ORPHANED]}

  relation_page:
    what: the page a person opens to read one landed relation
    path: data/sources/{relation}.md
    naming: the descriptor's stem, verbatim
    population: {of: every landed relation, from: data/sources/*.yaml, empty_is: EMPTY}
    lifecycle: re-derived
    producers: [{tool: sdk/project/project_data.py, role: renders}]
    consumers: [{tool: mac-console/console_api.py, role: serves it, reads: ["«whole document»"]}]
    checkers: [{tool: tools/check_pages_current.py, rejects: [STALE]}]

  plane_overview:
    what: one page over ALL of the landing plane — what was landed, how big, what is keyed
    path: data/sources/index.md
    naming: fixed
    population: {of: one page, from: «this artifact», empty_is: EMPTY}
    lifecycle: re-derived
    producers: [{tool: sdk/project/project_data.py, role: renders}]
    consumers: [{tool: mac-console/console_api.py, role: lists and serves it, reads: ["«whole document»"]}]
    checkers: [{tool: tools/check_pages_current.py, rejects: [STALE]}]

  data_quality_register:
    what: what is WRONG on the landing plane and who must rule on it
    path: data/quality/data_quality_register.yaml
    naming: fixed
    population: {of: one register, from: «this artifact», empty_is: EMPTY}
    covers: every landed relation
    lifecycle: re-derived
    producers: [{tool: tools/mac_dq_findings.py, role: raises and merges, preserving any ruling}]
    consumers:
      - {tool: sdk/project/project_data.py, role: renders the DQ pages and the SME questions,
         reads: ["issues[].id", "issues[].title", "issues[].severity", "issues[].status", "issues[].finding", "issues[].needs", "issues[].ruling.question", "issues[].ruling.answers"]}
    checkers: [{tool: tools/check_dq_resolution_sync.py, rejects: [duplicate-id, status-missing, status-unknown]}]

  preview_run_record:
    what: the previews' provenance — which engine cut them, at what limit and order, what was refused
    path: data/samples/samples.run.json
    naming: fixed
    population: {of: one record for the plane, from: «this artifact», empty_is: EMPTY}
    lifecycle: re-derived
    producers: [{tool: tools/mac_sample.py, role: records the draw}]
    consumers:
      - {tool: tools/check_sample_matches_descriptor.py, role: attests each preview's provenance,
         reads: ["samples[].stem", "samples[].derived_from"]}
    checkers: [{tool: tools/check_sample_matches_descriptor.py, rejects: [UNRECORDED, PROPOSAL_PREVIEW]}]

  reference_run_record:
    what: the reference measurement's provenance — the denominators, the admission rule, every pruned pair
    path: data/references/references.run.json
    naming: fixed
    population: {of: one record for the plane, from: «this artifact», empty_is: EMPTY}
    lifecycle: re-derived
    producers: [{tool: tools/mac_references.py, role: records the run}]
    # ONE READER, ONE FIELD, measured 2026-09-29: nothing in the framework opens this at all; the
    # console reads `measured_at` as a clock. The denominators and 857 pruned pairs are read by
    # nothing. Declared so the gap is COUNTED rather than invisible.
    consumers:
      - {tool: "mac-console/ingest_progress.py", role: "the references step's clock", reads: ["measured_at"]}
    checkers: []

# ══════════════════════════════════════════════════════════════════════════════════════════════
# CONVENTIONS THIS TOPIC CLOSES
#
# Each names its OWNER. The spelling is not restated here — a copy is a second home and it does not
# move when the gate moves. Run the owner, read its refusal, use the name it hands you.
# ══════════════════════════════════════════════════════════════════════════════════════════════
conventions:
  - what: the role a data-plane column may carry
    closed: [primary_key, foreign_key, value, discriminator]
    owner: mac_vocabulary.yaml#relation.column.role
    note: >-
      the MEASURED plane's vocabulary. The authored/analytical roles (key, dimension, measure,
      period, housekeeping) are a different vocabulary on a different plane and are NOT ruled here.

  - what: a landed relation's name
    closed: «the warehouse's own»
    owner: the warehouse catalog
    note: a landing is described, never renamed. Renaming belongs to the served plane, not to this one.

  - what: a register's file name
    closed: "{marker}_{relation}_{column}.lookup.csv"
    owner: tools/mac_lookups.py#_stem

  - what: a data-quality finding id
    closed: "DQ-{TYPE}-{SUBJECT}"
    owner: tools/mac_dq_findings.py

# ══════════════════════════════════════════════════════════════════════════════════════════════
# WHAT IS REFUSED
#
# These are BLOCKED AT THE ACTION, by a hook, not reported afterwards by a checker. Every gate in
# this estate reported and none refused: on 2026-09-28 `conformance` printed FAIL and the delivery
# ran to completion, and `mac_artifacts.yaml` was committed unparseable because nothing stood
# between writing it and committing it. A finding after the fact is a record of a mistake.
#
# Each refusal carries WHY and WHAT TO DO INSTEAD, because a block with no way forward is a wall.
# ══════════════════════════════════════════════════════════════════════════════════════════════
refuses:

  - id: UNDECLARED-ARTIFACT
    when: writing a file under data/ that no item in `delivers` claims
    why: >-
      an artifact nobody declared is one nobody reads, checks or regenerates. Measured 2026-09-28:
      the delivery reported 6 of 6 complete with its entire data-quality assessment missing, because
      no checklist item asked about it.
    instead: declare it here, or name it in mac.project.yaml#conformance.out_of_scope with a reason

  - id: INVENTED-VOCABULARY
    when: writing a `mac.<namespace>.<term>` token whose namespace mac_vocabulary.yaml does not declare
    why: >-
      a token no vocabulary declares places no predicate and no resolver will say so. I invented
      `mac.name.served_relation` inside the very file whose job is to stop that, on 2026-09-28 — and
      then wrote it AGAIN into the comment explaining its removal.
    instead: use a declared namespace, or declare the new one in mac_vocabulary.yaml first

  - id: INVENTED-COLUMN-ROLE
    when: writing a data-plane column `role` outside the closed set
    why: the vocabulary is closed, and closed means closed
    instead: use one of primary_key | foreign_key | value | discriminator

  - id: RENAMED-LANDING
    when: writing a landed descriptor whose `table.name` differs from its file stem
    why: >-
      a landing is described, not renamed. The five homes of a relation name must agree, and a
      rename here breaks the four that are checked offline.
    instead: describe the landing under its own name; rename on the served plane if you must

  - id: TRANSIENT-AT-DELIVERY
    when: a delivered landed descriptor still carries `values:` on a column
    why: a member list is a value DOMAIN and its home is a register, not a descriptor
    instead: run tools/mac_lookups.py, which cuts the domain out and leaves `distinct:` + `register:`

  - id: UNPARSEABLE-SPEC
    when: writing any guardrail file that does not parse as YAML
    why: >-
      I committed mac_artifacts.yaml in an unparseable state on 2026-09-29 — the write happened
      before the line that validated it — and every run of the gate after that was a traceback
      rather than a verdict, for four commits.
    instead: parse it before writing it

# ══════════════════════════════════════════════════════════════════════════════════════════════
# THE DIAL
# ══════════════════════════════════════════════════════════════════════════════════════════════
watch:
  record: acceptance/guardrail_runs.json
  written_by: tools/check_guardrails.py
  shows:
    - every item of `delivers`, with have-of-want against its declared population
    - every refusal, with how many times it fired and on what
    - every convention, and whether anything violates it
  console: Quality -> Manifest
  note: >-
    the record is written WHATEVER the verdict. A gate that records only its passes leaves a display
    that goes blank exactly when something is wrong.

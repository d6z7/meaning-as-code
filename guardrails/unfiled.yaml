# guardrails/unfiled.yaml — DELIVERED, AND FILED UNDER NO SUBJECT YET.
#
# These are written by a delivery and belong to a topic that does not exist. They are declared here
# so the bill of materials stays complete — an undeclared artifact reads as a gap in the
# DECLARATION, and these are not that. Each carries `belongs_to`, which is the debt.
#
# THEY ARE HERE BECAUSE I FILED BY THE WRONG CRITERION ONCE ALREADY. I put them in the data topic
# because phase 1 WRITES them. The criterion is what an artifact is ABOUT, not which run emits it.
# Moving each to its own topic is a MOVE, never a copy.

spec_version: mac.guardrail/1
topic: unfiled
status: PROPOSED 2026-09-29

delivers:
  usage_guardrails:
    what: the routing table and per-concept playbooks — the FIRST document an ask-agent must read
    phase: [sources, datasets]
    belongs_to: reference   # move here when that topic exists
    path: references/usage_guardrails.md
    naming: fixed
    population: {of: one page, from: «this artifact», empty_is: EMPTY}
    lifecycle: re-derived
    shape:
      # THE FIRST DOCUMENT AN ASK-AGENT READS, and it is measured EMPTY on one bundle: 30 lines
      # against 645, because `references.py` globs `concepts/*.yaml` flat and that bundle files
      # concepts by domain. Declaring the three sections does not fix that — a section can be
      # present and empty — but it is the floor, and the floor was missing.
      sections:
        - {heading: Routing, required: always}
        - {heading: How to answer, required: always}
        - {heading: Filter traps & known issues, required: always}
    producers: [{tool: sdk/project/references.py, role: aggregates the ontology's own guardrails}]
    consumers:
      - {tool: "mac-console/local_ask.py", role: "the instruction to read it FIRST", reads: ["«whole document»"]}
      - {tool: "mac-chat/guardrails_gate.py", role: "MECHANICALLY denies read_page until it is read", reads: ["«path only»"]}
    # NO CHECKER, and it is measured empty on one bundle: 30 lines against 645 on a second bundle,
    # because references.py globs concepts FLAT and that bundle files them in groups. The first
    # document the agent reads carries no routing there, and nothing says so.
    checkers: []

  lookup_page:
    what: one register's read view — what it holds, where it was cut from, and WHO USES IT
    phase: [sources]
    belongs_to: data   # move here when that topic exists
    path: data/lookups/<register>.lookup.md
    naming: "{register}.lookup.md"
    population: {of: one page per register, from: data/lookups/*.lookup.csv, empty_is: OK}
    lifecycle: re-derived
    shape:
      # `Used by` IS THE SECTION THAT DID NOT EXIST. Operator, 2026-10-02: "i also sugget you write
      # in lookup page whare is the lookup being used / freeze it in the design layout of lookup
      # page". Measured on contoso5 the same day: of 17 registers, 5 declare a column that points at
      # them, 7 more are reached because a concept declares the column they were cut from, and 5 are
      # reached by NOTHING — and the only way to learn which was to run the loader and read its skip
      # report. A register nothing reaches is dead weight; the page now says so on its own face.
      #
      # TWO WAYS OF BEING USED, kept apart on purpose: `declared` is a column carrying `register:`,
      # `by column name` is the undeclared path still reading it. Collapsing them would hide which
      # registers are governed and which merely happen to be found.
      empty_section_says: "_Nothing declared for this section._"
      sections:
        - {heading: Cut from, required: always}
        - {heading: Used by, required: always}
        - {heading: Members, required: always}
    producers:
      - {tool: sdk/project/project_data.py, role: projects every register's page, renders: lookup_documents}
    consumers:
      - {tool: "mac-console Sources browser", role: "the Lookups view", reads: ["«whole page»"]}
    checkers: [tools/check_document_layout.py]

  concept_page:
    what: one concept's read-view page — derived LIVE from its YAML, never read from disk
    phase: [concepts]
    belongs_to: ontology   # move here when that topic exists
    path: «derived — no file»
    naming: n/a
    population: {of: one page, from: ontology/concepts/<stem>.yaml, empty_is: OK}
    lifecycle: derived-on-request
    shape:
      # THE LAYOUT IS THIS LIST, and it is declared here because the renderer kept inventing a new
      # one. Operator, 2026-10-02: "i cannto stand that you every time invent new layout for the
      # same document !?!?!? it is either you define mandatory rules for the layout or crate
      # tempalte that you will only populate." Rules, not a template: a template for this page
      # would have to carry a conditional table, a two-direction join list and the frontmatter,
      # which makes it a second program in a templating language and moves the drift rather than
      # stopping it.
      #
      # `required: always` ON EVERY ONE OF THEM, which is the second ruling of the same day: "i want
      # ALL tabs on the Concept page to ALWAYS be present. if some of them has no content ... then
      # just inform that no content available". Each section used to carry its own `if` and vanish
      # when empty, so the page's SHAPE was a function of the bundle's completeness — a concept with
      # no edges rendered seven sections, one with no grain six, and no two concepts produced the
      # same document. There was nothing to drift FROM, because there was never one layout.
      #
      # It is also the grid-of-blanks ruling one level up: "grid of blanks hints on the error or
      # incompletenes. it is much better then hiding it." A missing section hides exactly what a
      # missing column hides — WHICH fact the bundle lacks.
      empty_section_says: "_No content available — the bundle declares nothing for this section._"
      sections:
        - {heading: Details, required: always}
        - {heading: How to answer, required: always}
        - {heading: Grounded in, required: always}
        - {heading: Grain, required: always}
        - {heading: Fields, required: always}
        - {heading: Axes, required: always}
        - {heading: Relationships, required: always}
        - {heading: Source of record, required: always}
      # NO COLUMN FOR A WHOLE-OBJECT FACT. Operator, having said it several times: "i dont want to
      # have column for somehting that applies for the whole object like grounded-in". The Fields
      # table's `grounded in` column repeated ONE relation on all 10 rows of a single-source
      # concept — the relation `## Grounded in` states once, above. Its slot carries `identity`
      # now, which varies per column. Where a concept IS M:N over relations the relation does vary,
      # and the answer is a sub-heading per relation, never a repeated column.
      # EVERY PER-COLUMN FACT THE CONCEPT YAML DECLARES, measured 2026-10-02 over 112 declared
      # columns: role 112, identity 50, axis_kind 39, measure 14 (type+unit, canonical on 3),
      # rulings 11 (label_of 5, register 5, finer_than 3, never_axis 2, evidence 2, scoped_by 1).
      # The table showed role and identity only, so THREE fact families carrying 64 declarations
      # were invisible on the page that exists to show them -- including the ones that decide an
      # answer (`measure.canonical` picks the column a question folds, `axis_kind` keys the fold
      # law, `never_axis` refuses a grouping outright).
      #
      # COMPOUND FLAGS RENDER AS ONE CELL, dot-separated: `measure` is `flow · USD · canonical`,
      # `rulings` is `label_of brand (legal) · sort desc`. One column per FAMILY rather than per
      # leaf, because a column per leaf would be nine mostly-empty columns and the families are how
      # the YAML groups them.
      # THE PRE-TRANSITION TABLE WAS `column | type | role | grounded in | description | joins →`,
      # and this is that table with three changes, each with a reason:
      #
      #   `grounded in` REMOVED  — a whole-object fact repeated on every row (operator's standing
      #                            rule); the relation is stated once under `## Grounded in`.
      #   `role` FIXED           — it was present and EM-DASHED on every row of every map-form
      #                            concept, because the renderer read only the legacy `field_roles:`
      #                            block. It now reads the column's own `role`.
      #   `identity`, `measure`, `rulings`, `register` ADDED — per-column facts the concept YAML
      #                            declares and NO section of the page showed.
      #
      # `axis kind` IS DELIBERATELY NOT HERE, and a first cut added it. `## Axes` already carries
      # `| axis | axis kind | fold |` per axis, and it did before the transition -- so a column here
      # would have duplicated an existing section. Operator, on finding it: "YOU ARE FUCKING
      # REINVENTING NEW LAYOUT FOR CONCEPT MAIN PAGE ... WHY DONT YOU GO AND LOOK HOW IT LOOKED LIKE
      # BEFORE TRANSITION". Look first; the stale projected `.md` files are that record.
      fields_table_columns:
        - column
        - type
        - role
        - identity
        - measure
        - rulings
        - register
        - description
        - "joins →"
    producers:
      # `renders` NAMES THE ENTRY POINT THAT CAN BE HELD TO THE SHAPE ABOVE: a callable on this
      # producer's own module, taking a bundle root and returning {document: markdown}. Declared on
      # the producer because WHO renders is a producer fact; the module is its `tool:` path.
      - {tool: sdk/project/concept_page_content.py, role: builds the body from the concept YAML,
         renders: documents}
      - {tool: tools/project_concept_page.py, role: the live seam the console calls per request}
    consumers:
      - {tool: "mac-console console_api.h_concept_page", role: "the Page tab", reads: ["«markdown»"]}
    checkers: [tests/test_concept_page_layout.py, tests/test_concept_page_seam.py,
               tools/check_document_layout.py]

  knowledge_page:
    what: one concept's knowledge — what the CONFIGURATION states plus the SME-PROVIDED sources
    phase: [concepts]
    belongs_to: ontology   # move here when that topic exists
    path: «derived — no file»
    naming: n/a
    population: {of: one page, from: ontology/concepts/<stem>.yaml, empty_is: OK}
    lifecycle: derived-on-request
    shape:
      # THE SAME RULING AS `concept_page`, ON THE SECOND DOCUMENT. These five headings were a
      # `SECTIONS` tuple in `sdk/project/knowledge.py` — a layout living in code; moved here
      # verbatim 2026-10-02 (same order, same words, `always` throughout) and now read from here.
      empty_section_says: "_Nothing declared for this section._"
      sections:
        - {heading: What it is, required: always}
        - {heading: What the configuration states, required: always}
        - {heading: Rules that govern it, required: always}
        - {heading: Where its values come from, required: always}
        - {heading: SME sources, required: always}
    producers:
      - {tool: sdk/project/knowledge.py, role: projects the configuration half and the SME half,
         renders: project}
    consumers:
      - {tool: "mac-console", role: "the concept's Knowledge tab", reads: ["«markdown»"]}
    checkers: [tools/check_document_layout.py, tests/test_document_layout.py]

  questions_dashboard:
    what: the question corpus's read view — every oracle-relative verdict, derived once
    phase: [sources, datasets]
    belongs_to: testing   # move here when that topic exists
    path: acceptance/questions_dashboard.json
    naming: fixed
    population: {of: one dashboard, from: «this artifact», empty_is: OK}
    lifecycle: re-derived
    # NOT PRODUCED BY AN INGESTION STAGE. The console shells `sdk.project.questions` on demand; no
    # stage of any delivery writes it, which is why it is `empty_is: OK` here.
    producers: [{tool: sdk/project/questions.py, role: projects the acceptance plane, args: "shelled by the console"}]
    consumers:
      - {tool: "mac-console/ui/src/views/TestingBoardView.jsx", role: "the testing board", reads: ["stats.total", "stats.by_verdict", "questions[].id", "questions[].verdict"]}
    checkers: []

  suite_history_log:
    what: the append-only trend log — one deduped row per (suite, run_at, commit)
    phase: [sources, datasets]
    belongs_to: testing   # move here when that topic exists
    path: acceptance/suite_history.jsonl
    naming: fixed
    population: {of: one log, from: «this artifact», empty_is: EMPTY}
    lifecycle: resumable
    producers:
      - {tool: "tools/run_suite.py", role: "appends this run's row"}
      - {tool: "tools/suite_history.py", role: "merges and appends deduped rows"}
    # THE CONSOLE READS THE .json PROJECTION, NOT THIS. Measured 2026-09-29: contoso4 and contoso5
    # ship the .jsonl and no .json, because only `suite_history.py:main()` writes the projection and
    # the ingestion never takes that path — so the history panel is empty on those bundles by
    # construction. Declared so the missing projection is COUNTED.
    consumers: [{tool: tools/suite_history.py, role: projects it to the .json the console reads, reads: ["suite", "run_at", "commit", "pass", "fail", "total"]}]
    checkers: []

  semantic_diagnostics:
    what: what the model says twice, and what disagrees — restated and contradicting facts
    phase: [sources, datasets]
    belongs_to: ontology   # move here when that topic exists
    path: ontology/diagnostics.json
    naming: fixed
    population: {of: one record, from: «this artifact», empty_is: EMPTY}
    lifecycle: re-derived
    # WRITTEN BY THE PROJECTOR DURING THIS DELIVERY even though it lands on the ontology plane — a
    # landing-only bundle still gets one, carrying zero findings. Declared here because THIS phase
    # writes it; when an `ontology` topic exists it should move, not be copied.
    producers: [{tool: sdk/cli/harvest.py, role: runs the semantic phase and writes it}]
    consumers:
      - {tool: mac-console/ui/src/views/ObjectsView.jsx, role: the diagnostics pane,
         reads: ["stats.facts", "stats.restated", "findings[].severity", "findings[].subject", "findings[].sites[].file"]}
    checkers: []

  ontology_conformance_suite:
    what: the conformance suite RENDERED from the concepts — markers, never literals
    phase: [datasets]
    belongs_to: ontology   # move here when that topic exists
    path: acceptance/ontology_generated.yaml
    naming: fixed
    population: {of: one suite, from: «this artifact», empty_is: OK}
    covers: every concept the ontology declares
    lifecycle: re-derived
    producers: [{tool: tools/mac_generate_ontology_tests.py, role: renders from the concepts}]
    consumers:
      - {tool: "tools/run_suite.py", role: "executes it", reads: ["properties[].id", "properties[].sql", "properties[].assertion"]}
    checkers:
      - {tool: "tools/check_vacuous_assertions.py", rejects: [LITERAL-ONLY, NEVER-ZERO, CONSTANT, ABSENT, UNRESOLVED]}

  standing_failures:
    what: the reds the framework gate runner may carry for THIS bundle — each with an owner, a since, a reason, and what makes it green
    phase: [sources, datasets]
    belongs_to: testing   # move here when that topic exists
    path: acceptance/standing_failures.yaml
    naming: fixed
    population: {of: one register, from: «this artifact», empty_is: OK}
    lifecycle: authored-once
    # WRITTEN BY A PERSON, FROM A REAL RUN, AND NEVER RE-DERIVED: it is the decision to carry a red,
    # not a measurement of one. A red nobody declared is NEWS and the runner exits 1; a declared red
    # that has gone green is STALE and the runner exits 1; a register with no owner, a scope other
    # than bundle:<name>, or a `standing` that disagrees with its own entry count is refused before
    # a single gate runs (exit 2). Repository-level reds live in tools/framework_gate_failures.yaml,
    # never here — one fact, one home, and the scope rule is enforced, not advised.
    producers: [{tool: tools/gate_register.py, role: refuses a malformed register; a person writes the entries}]
    consumers:
      - {tool: tools/run_framework_gates.sh, role: reads it before every run and reconciles every verdict against it at the end,
         reads: ["scope", "standing", "entries.{gate}.kind", "entries.{gate}.class", "entries.{gate}.owner",
                 "entries.{gate}.since", "entries.{gate}.reason", "entries.{gate}.expected"]}
    checkers: [{tool: tools/gate_register.py, role: "--check: spec, scope, owner, dates, standing == entries; --self-test 22/22"}]

  migration_decisions:
    what: the judgements behind a bundle's move to the column standard — per column, a role or an explicit exclusion, each with its because
    phase: [datasets]
    belongs_to: ontology.concepts   # move here when the topic takes authored inputs
    path: migration_decisions.yaml
    naming: fixed
    population: {of: one register, from: «this artifact», empty_is: OK}
    lifecycle: authored-once
    # PROPOSED BY THE TOOL, RATIFIED BY A PERSON. `attribute` was never a role but several judgements
    # in one slot, and a legacy whitelist served every descriptor column while the map form serves what
    # it names — so a migration that guessed would either invent rulings or narrow the served set
    # silently. The tool refuses instead, and this file is where the person answers.
    producers: [{tool: tools/mac_migrate_concepts.py, role: proposes every entry from the descriptor (--propose-decisions); a person ratifies}]
    consumers:
      - {tool: tools/mac_migrate_concepts.py, role: migrates a concept only where every column is decided,
         reads: ["{Concept.column}.role", "{Concept.column}.identity", "{Concept.column}.measure", "{Concept.column}.rulings", "{Concept.column}.exclude"]}
    checkers: [{tool: tools/validate_schema.py, role: "MigrationDecisionsFile: a role from the vocabulary, an identity from the vocabulary, a because on every entry"}]

watch:
  record: acceptance/guardrail_runs.json
  written_by: tools/check_guardrails.py
  console: Quality -> Manifest

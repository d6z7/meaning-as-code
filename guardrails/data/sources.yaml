# guardrails/data/sources.yaml — WHAT IS THERE.
#
# The physical layer, described. What a warehouse already holds, measured, previewed, cut into
# registers and rendered for a person to read — plus the sanity suite that measures it.
#
# THIS IS PHASE 1's FIRST JOB. Operator, 2026-09-29: "while doing data ingestion it should create
# only FULL reference to the pyhsical layer DQ and SME questions." That is three deliverables, not
# one, and they are three files: this one, `data/quality.yaml`, and `sme_questions.yaml`. They are
# approved separately because you can accept the reference and dispute a finding.
#
# IT ENDS BEFORE ANYTHING IS TRANSFORMED. The served plane, its transforms and its lineage belong
# to `data/transformation.yaml`, which consumes this topic's findings and the SME's answers.
#
# UNSPECIFIED IS NOT RULED (see README). Absence from this file is permission, not oversight.

spec_version: mac.guardrail/1
topic: data.sources
status: PROPOSED 2026-09-29

delivers:
  landed_descriptor:
    what: what a landed relation CONTAINS, measured from the warehouse catalog
    phase: [sources]
    path: data/sources/{relation}.yaml
    naming: the landing's own relation name, verbatim — a landing is never renamed
    population:
      # SELF, and the reason is worth stating: the true denominator is the WAREHOUSE, and only the
      # importer — holding a connection — can count it. Offline this asks "is every descriptor
      # complete", never "is every relation described". A population that cannot be counted is
      # reported `n/a` with its reason, never as a pass.
      of: every landed relation
      from: data/sources/*.yaml
      empty_is: EMPTY
    lifecycle: re-derived
    producers:
      - {tool: "tools/mac_descriptors.py", role: "measures", args: "--plane sources"}
      - {tool: "tools/mac_profile.py", role: "adds the measured value domains"}
      - {tool: "tools/mac_lookups.py", role: "cuts those domains out into registers"}
    consumers:
      - {tool: sdk/project/project_data.py, role: renders the relation page,
         reads: ["table.name", "table.schema", "columns[].name", "columns[].type", "columns[].role", "columns[].references", "columns[].register"]}
      - {tool: sdk/project/er_model.py, role: draws the ER entity and its crow's feet,
         reads: ["table.name", "columns[].name", "columns[].references.to", "columns[].references.cardinality", "columns[].references.participation"]}
      - {tool: "tools/mac_references.py", role: "takes the measured key", reads: ["columns[].role", "columns[].name"]}
    checkers:
      - {tool: "tools/check_column_planes.py", rejects: [R1, R2, R3]}
      - {tool: "tools/check_profile_plane.py", rejects: [MISNAMED, ORPHAN, STALE_COLUMN, STALE_DOMAIN]}
    transient: [values]          # legal in flight, forbidden at delivery — it belongs in a register

  profile:
    what: the measurement — row counts, distincts, nulls, and the identity evidence behind a key
    phase: [sources, datasets]
    path: data/profiles/{relation}.yaml
    naming: the relation's stem, verbatim
    population: {of: every landed relation, from: data/sources/*.yaml, empty_is: EMPTY}
    lifecycle: re-derived
    producers: [{tool: tools/mac_profile.py, role: measures}]
    consumers:
      - {tool: "sdk/project/er_model.py", role: "the MEASURED key on the ER box", reads: ["identity_evidence.key"]}
      - {tool: tools/mac_descriptors.py, role: re-derives a register column's cardinality,
         reads: ["of", "columns[].name", "columns[].distinct"]}
    checkers: [{tool: tools/check_profile_plane.py, rejects: [MISNAMED, ORPHAN, STALE_COLUMN, STALE_DOMAIN]}]

  reference_measurement:
    what: the measured references of one relation, with the evidence behind each verdict
    phase: [sources]
    path: data/references/{relation}.yaml
    naming: the relation's stem, verbatim
    population: {of: every landed relation, from: data/sources/*.yaml, empty_is: EMPTY}
    lifecycle: re-derived
    producers: [{tool: tools/mac_references.py, role: measures, args: "--plane sources"}]
    consumers:
      - {tool: tools/mac_descriptors.py, role: promotes a real identity reference onto the column,
         reads: ["references[].verdict", "references[].parent_key_role", "references[].cardinality", "references[].participation", "references[].from", "references[].to"]}
      - {tool: sdk/project/er_model.py, role: the line's proof channel,
         reads: ["evidence.orphan_rows", "evidence.parent_distinct", "ambiguous_with", "cardinality", "participation"]}
    checkers:
      - {tool: tools/check_physical_references.py,
         rejects: [EVIDENCE_MISSING, ADMISSION_MISSING, ENDPOINT_UNRESOLVED, COLUMN_UNDECLARED,
                   PARTICIPATION_MISSING, VOCABULARY_CLOSED, AMBIGUITY_HIDDEN, DANGLING_INVENTED,
                   ID_COLLISION, UNMEASURED_RELATION]}

  reference_run_record:
    what: the reference measurement's provenance — the denominators, the admission rule, every pruned pair
    phase: [sources]
    path: data/references/references.run.json
    naming: fixed
    population: {of: one record for the plane, from: «this artifact», empty_is: EMPTY}
    lifecycle: re-derived
    producers: [{tool: tools/mac_references.py, role: records the run}]
    # ONE READER, ONE FIELD, measured 2026-09-29: nothing in the framework opens this at all; the
    # console reads `measured_at` as a clock. The denominators and 857 pruned pairs are read by
    # nothing. Declared so the gap is COUNTED rather than invisible.
    consumers:
      - {tool: "mac-console/ingest_progress.py", role: "the references step's clock", reads: ["measured_at"]}
    checkers: []

  # ── THE DATA-QUALITY FAMILY ──────────────────────────────────────────────────────────────────
  # Six artifacts, not one. Declaring only the register is how the whole assessment went missing on
  # 2026-09-28 while the delivery reported 6 of 6 complete: no item asked about the pages, so no
  # item could be short. Presence and naming only — whether a finding is CORRECT is a judgement no
  # gate makes.

  relation_preview:
    what: a seeded sample of one landed relation, for a person to look at
    phase: [sources]
    path: data/samples/{relation}.src.sample.csv
    naming: >-
      the relation's stem plus `.src.` — the two planes share a directory and a 1:1 passthrough
      bundle shares the stem, so the plane must be in the name
    population: {of: every landed relation, from: data/sources/*.yaml, empty_is: EMPTY}
    lifecycle: re-derived
    producers: [{tool: tools/mac_sample.py, role: draws, args: "--plane sources"}]
    consumers: [{tool: sdk/project/objects.py, role: offers the Sample tab, reads: ["«path only»"]}]
    checkers:
      - {tool: tools/check_sample_matches_descriptor.py,
         rejects: [HEADER_DRIFT, RAGGED, ORPHAN, SUFFIX_CROSSED, EMPTY_PREVIEW, MISSING_PREVIEW,
                   UNRECORDED, OUTSIDE_DECLARED_VALUES]}

  preview_run_record:
    what: the previews' provenance — which engine cut them, at what limit and order, what was refused
    phase: [sources, datasets]
    path: data/samples/samples.run.json
    naming: fixed
    population: {of: one record for the plane, from: «this artifact», empty_is: EMPTY}
    lifecycle: re-derived
    producers: [{tool: tools/mac_sample.py, role: records the draw}]
    consumers:
      - {tool: tools/check_sample_matches_descriptor.py, role: attests each preview's provenance,
         reads: ["samples[].stem", "samples[].derived_from"]}
    checkers: [{tool: tools/check_sample_matches_descriptor.py, rejects: [UNRECORDED, PROPOSAL_PREVIEW]}]

  register:
    what: one value SET — its members, with a label and a search key — serving every column that carries it
    phase: [sources, datasets]
    path: data/lookups/{marker}_{notion}.lookup.csv
    naming: >-
      marker and the NOTION its attach points agree on, normalised — `contoso5_gender` for
      `customer.Gender` and `dim_customer.gender` alike. Where the attach points call the set
      different things, or where TWO different sets would claim one notion, every claimant falls
      back to `{relation}_{column}` of its cut site, which cannot collide. Both poles have failed
      here: naming by column alone made two relations overwrite one another (eight domains lost
      across four bundles, 2026-09-28), and qualifying every name by its relation produced 48 files
      holding 25 value sets (2026-09-29).
    # THE FIRST FIELD IS STILL THE SOURCE COLUMN'S NAME, not the literal `code`, and that is a
    # SEQUENCED gap rather than an oversight. The operator ruled on 2026-09-29 that a register is a
    # virtual table and its column names are authored and invariant; six of these seven already
    # are. The seventh cannot move until the concept bindings that currently resolve through it are
    # declared — `check_registers_reachable` says plainly that renaming it "breaks a live behaviour
    # with no error". See decisions/PROPOSED-2026-09-29_register-policy.md, step (c).
    columns: [«code», label, search_key, source_view, source_schema, confidence, note]
    population:
      # ONE PER VALUE SET, which is what a register IS (operator, 2026-09-29): "there only one
      # lookup for one thing that can be attached to multiple targets". Not one per column — that
      # denominator is what let contoso5 ship 48 files over 25 domains while the gate read OK.
      of: every distinct value set measured on the plane
      from: data/lookups/*.lookup.csv
      empty_is: EMPTY
    lifecycle: re-derived
    producers: [{tool: tools/mac_lookups.py, role: cuts, args: "--plane sources"}]
    consumers:
      - {tool: tools/mac_descriptors.py, role: re-attaches the register pointer to every attach point,
         reads: ["«the sibling .lookup.yaml attached[]»", "«header[0]»", "source_view"]}
      - {tool: sdk/project/project_data.py, role: renders the register page,
         reads: ["«header»", "«rows»", "source_view", "source_schema", "note"]}
    checkers:
      - {tool: "tools/check_lookups.py", rejects: [cited-register-missing, source_view-dangling]}
      # TWO REJECT CLASSES, BECAUSE P4 HAS TWO HALVES AND ONLY ONE WAS EVER ENFORCED. Its TITLE
      # rules one register per DIMENSION; its BODY rules "refuse to write where a register already
      # covers that source column". The cutter keys on (relation, column), this gate counted the
      # same pair and called it a "domain", and so contoso5 read
      #     registers: 48   distinct domains: 48   DUPLICATED: 0   OK
      # over 48 files holding 25 value sets. Estate-wide, measured 2026-09-29: 213 files, 114
      # sets, 99 redundant copies. A gate is only as true as its denominator.
      - {tool: "tools/check_one_register_per_dimension.py",
         rejects: [two-registers-one-column, one-domain-many-registers]}
      - {tool: "tools/check_register_membership.py", rejects: [MISSING, NEW, NULLS, ORPHANED]}

  register_descriptor:
    what: one register's own shape — what it holds, and EVERY column of this bundle attached to it
    phase: [sources, datasets]
    path: data/lookups/{register}.lookup.yaml
    naming: the register's own stem, verbatim — one descriptor per .lookup.csv
    # A REGISTER IS A VIRTUAL TABLE (operator, 2026-09-29): "it reads like one register is like
    # virtual table. then many rules from the table domain will fit for the register lookup."
    # A relation states its shape in a descriptor, so a register does too — and the fact that
    # became PLURAL when one register began serving many columns is exactly the one that had
    # nowhere to live. `source_view` is written into every ROW of the CSV, a table carrying its
    # lineage in each record; tolerable at one source, wrong at eight.
    #
    # THE SCHEMA TRAVELS WITH EACH ATTACH POINT, because a shared register spans PLANES: the same
    # twelve month names sit on `main.date` and `contoso_served.dim_date`. Applying the owner's
    # schema to all of them resolved half against the wrong catalog — measured the hour this list
    # became plural: `contoso_served.date does not exist`, on a register that was correct.
    keys: [register.name, register.csv, register.members, register.grain, "attached[].relation",
           "attached[].column", "attached[].schema"]
    population:
      of: every register cut on this plane
      from: data/lookups/*.lookup.csv
      empty_is: EMPTY
    lifecycle: re-derived
    producers: [{tool: tools/mac_lookups.py, role: writes one per value set}]
    consumers:
      - {tool: tools/mac_descriptors.py, role: attaches the pointer to every declared column,
         reads: ["attached[].relation", "attached[].column"]}
      - {tool: tools/check_register_membership.py, role: re-measures across every attach point,
         reads: ["attached[].relation", "attached[].column", "attached[].schema"]}
    checkers:
      - {tool: tools/check_one_register_per_dimension.py, rejects: [one-domain-many-registers]}

  register_page:
    what: the browsable page for one value register — its members, with the constants lifted above the table
    phase: [sources, datasets]
    path: data/lookups/{register}.lookup.md
    naming: the register's own stem, verbatim — one page per .lookup.csv
    population: {of: every register cut on this plane, from: data/lookups/*.lookup.csv, empty_is: EMPTY}
    lifecycle: re-derived
    producers: [{tool: sdk/project/project_data.py, role: renders one page per register}]
    consumers: [{tool: sdk/project/objects.py, role: carries it as the register object's doc path, reads: ["«path only»"]}]
    # THE LARGEST UNCHECKED CLASS IN THE DELIVERY — 24 files, 17 % of it. `check_pages_current`
    # covers sources, datasets and transforms and stops. These can go stale, vanish, or desync from
    # their CSV and every gate stays green.
    checkers: []

  # ── THE MEASUREMENT OF THE DELIVERY ITSELF ───────────────────────────────────────────────────

  relation_page:
    what: the page a person opens to read one landed relation
    phase: [sources]
    path: data/sources/{relation}.md
    naming: the descriptor's stem, verbatim
    population: {of: every landed relation, from: data/sources/*.yaml, empty_is: EMPTY}
    lifecycle: re-derived
    # ── THE PAGE'S SHAPE, DECLARED ───────────────────────────────────────────────────────────
    # WHAT A SCHEMA IS FOR YAML, THIS IS FOR MARKDOWN. `validate_schema` holds a descriptor to
    # mac.schema.json; `check_sample_matches_descriptor` holds a preview's header to its
    # descriptor; a PAGE was held to nothing. `check_pages_current` re-renders and byte-compares,
    # which catches a page drifting from its source and CANNOT catch the renderer changing what it
    # emits — the comparator and the renderer are the same code, so they agree by construction.
    #
    # Measured: the cardinality this bundle MEASURES and stores in the descriptor stopped appearing
    # on the page and nothing objected, because no declaration said it should. The decision was
    # inherited from a rationale written about the columns TABLE CELL ("the crow's feet are the
    # diagram's job") — sound for a cell beside a diagram, not sound for a section read on its own.
    #
    # ASSERT LITTLE AND TRUE. A shape rule that cries wolf gets ignored, and is then worse than
    # nothing. These are the two failures that actually happened — a mapping printed as a Python
    # repr, and a measured fact silently dropped. Nothing else is governed.
    shape:
      sections:
        - {heading: Columns, required: always}
        - {heading: Foreign keys, required: when_a_column_has_references}
        - {heading: Registers, required: when_a_column_has_a_register}
      lines:
        Foreign keys: '^- `[^`]+` → `[^`.]+\.[^`]+` \([a-z]+:[a-z]+, [a-z]+:[a-z]+\)$'
        # THE ROLE CELL AND THE REFERENCE CELL MUST AGREE. `role` is a closed SINGLE-value
        # vocabulary, so a column that is both part of the key and a reference can put only one
        # term there — identity wins, and `FK` then had nowhere to appear. Measured 2026-09-29 over
        # contoso5's 32 descriptors: 23 columns carry a reference, 17 printed `FK`, and 6 printed
        # `PK1`/`PK2`/`PK3` alone (fx_rate's three key parts, currencyexchange.Date,
        # orderrows.OrderKey, sales.OrderKey). The arrow was in the cell beside them, so the fact
        # was on the page IMPLICITLY — but once `FK` prints for 17 columns its ABSENCE on the other
        # 6 is read as a fact, and that fact is false.
        #
        # This is a BICONDITIONAL and both halves are on the row, so no cross-reference is needed:
        # the role cell names FK if and only if the reference cell carries an arrow. It therefore
        # also catches the opposite lie — `FK` claimed with an empty reference cell.
        Columns: '^\| `[^`]+` \| [^|]+ \| (?:[^|]*\bFK\b[^|]* \| [^|]*→[^|]*|(?![^|]*\bFK\b)[^|]* \| (?![^|]*→)[^|]*)\|$'
      # WHICH LINES EACH PATTERN JUDGES. `Foreign keys` is a bullet list and takes the `^- `
      # default; `Columns` is a TABLE, and its selector deliberately requires the backtick that
      # opens a column name so the header row and the `|---|` rule are not judged as data.
      line_selectors:
        Columns: '^\| `'
      # the same rules in words, so a refusal is readable by somebody who does not read regex
      line_forms:
        Foreign keys: '- `column` → `relation.column` (child:parent, child:parent)'
        Columns: '| `column` | type | role | reference | — where the role says FK exactly when the reference cell has an arrow'
    producers: [{tool: sdk/project/project_data.py, role: renders}]
    consumers: [{tool: mac-console/console_api.py, role: serves it, reads: ["«whole document»"]}]
    checkers:
      - {tool: tools/check_pages_current.py, rejects: [STALE]}
      - {tool: tools/check_page_shape.py, rejects: [SECTION_MISSING, LINE_MALFORMED, UNGOVERNED_SECTION]}

  plane_overview:
    what: one page over ALL of the landing plane — what was landed, how big, what is keyed
    phase: [sources]
    path: data/sources/index.md
    naming: fixed
    population: {of: one page, from: «this artifact», empty_is: EMPTY}
    lifecycle: re-derived
    producers: [{tool: sdk/project/project_data.py, role: renders}]
    consumers: [{tool: mac-console/console_api.py, role: lists and serves it, reads: ["«whole document»"]}]
    checkers: [{tool: tools/check_pages_current.py, rejects: [STALE]}]

  data_sanity_suite:
    what: the data-sanity properties, PROJECTED from the measured profile — nobody authors these
    phase: [sources, datasets]
    path: acceptance/data_sanity_generated.yaml
    naming: fixed
    population: {of: one suite, from: «this artifact», empty_is: EMPTY}
    covers: every relation of the plane
    lifecycle: re-derived
    producers: [{tool: tools/mac_generate_sanity.py, role: projects from the profile}]
    consumers:
      - {tool: "tools/run_suite.py", role: "executes it", reads: ["properties[].id", "properties[].sql", "properties[].assertion", "properties[].severity"]}
    checkers:
      - {tool: "tools/check_vacuous_assertions.py", rejects: [LITERAL-ONLY, NEVER-ZERO, CONSTANT, ABSENT, WHOLE-RESULT, UNRESOLVED, UNPARSEABLE]}

  suite_run_record:
    what: the current state of a suite — per case, overwritten every run
    phase: [sources, datasets]
    path: acceptance/data_sanity_generated_runs.json | acceptance/delivery_consistency_runs.json | acceptance/register_membership_runs.json | acceptance/manifest_runs.json
    naming: "{suite}_runs.json — the suite it records, never a date"
    population: {of: one record per suite that ran, from: «this artifact», empty_is: EMPTY}
    lifecycle: resumable
    producers:
      - {tool: "tools/suite_record.py", role: "builds"}
      - {tool: "tools/check_delivery_consistency.py", role: "records its own verdict"}
      - {tool: "tools/check_register_membership.py", role: "records its own verdict"}
      - {tool: "tools/check_artifact_conformance.py", role: "records the manifest verdict"}
    consumers:
      - {tool: "tools/mac_dq_findings.py", role: "raises a finding per case that did not pass", reads: ["results[].id", "results[].status", "results[].detail"]}
      - {tool: "mac-console/ui/src/views/DataQualityBoard.jsx", role: "the suite board", reads: ["results[].id", "results[].status", "declared", "examined", "run_at"]}
    checkers:
      - {tool: "tools/check_run_records.py", rejects: [NO_RECORD, NO_COMMIT, NO_DENOMINATOR, HEADER_DISAGREES, SHORT_POPULATION, BAD_STATUS, UNEVALUATED]}

  dated_run_record:
    what: one suite run, append-only — the copy that makes the trend independent of git
    phase: [sources, datasets]
    path: acceptance/runs/{utc}-{suite}.json
    naming: "{UTC}-{suite}.json — the instant it ran, so two runs never collide"
    population: {of: one per run, from: «this artifact», empty_is: EMPTY}
    lifecycle: resumable
    producers: [{tool: tools/suite_record.py, role: writes the dated copy}]
    # READ FOR ITS MTIME ONLY. Its contents are parsed by nothing but an opt-in --replay path.
    consumers: [{tool: mac-console/ingest_progress.py, role: the test step's clock, reads: ["«path only»"]}]
    checkers: []

conventions:
  - what: the role a data-plane column may carry
    closed: [primary_key, foreign_key, value, discriminator]
    owner: mac_vocabulary.yaml#relation.column.role
    note: >-
      the MEASURED plane's vocabulary. The authored/analytical roles (key, dimension, measure,
      period, housekeeping) are a different vocabulary on a different plane and are NOT ruled here.

  - what: a landed relation's name
    closed: «the warehouse's own»
    owner: the warehouse catalog
    note: a landing is described, never renamed. Renaming belongs to the served plane, not to this one.

  - what: how a value in a data-plane column is RESOLVED
    closed: ['«a register: pointer»', 'searchable: like', '«neither»']
    owner: tools/mac_descriptors.py#_searchable
    note: >-
      the operator, 2026-09-29: "not everyting is suitable for lookup. one huge table where the
      search criteria is text cannot be converted into lookup. it should just be declared later to
      be searchebal with like." An open-text column used to carry NOTHING here, which is
      indistinguishable from one nobody had profiled — contoso5 held 16 of them, silent, including
      `dim_customer.customer_name` at 99 200 distinct over 104 990 rows. The rule lives in
      `mac_register_plan.classify` and is IMPORTED rather than restated: a first version of the
      descriptor branch carried its own copy and disagreed within the hour, missing `Occupation`
      (2 571 distinct) and `Company` (1 031) because it tested the ratio and not the count.
      «neither» stays legal and means exactly what it says — measured, and resolvable by nothing
      offline.

  - what: a register's file name
    closed: "{marker}_{notion}.lookup.csv, falling back to {marker}_{relation}_{column} on a clash"
    owner: tools/mac_lookups.py#_assign_names
    note: >-
      the NOTION its attach points agree on, normalised. `_stem` still builds the qualified form
      and is no longer the naming rule on its own: it names the CUT SITE, which is unique, and that
      is what a claimant falls back to when the attach points disagree or when two different value
      sets would claim one notion. The fallback applies to EVERY claimant, never to the later one
      only — qualifying just the loser would leave the winner's name depending on scan order, and
      a bare notion shared by two sets is how `contoso4_state` came to hold the wrong 67 members.

refuses:

  - id: RENAMED-LANDING
    when: writing a landed descriptor that does not name a relation the warehouse actually landed
    why: >-
      a landing is DESCRIBED, not invented. Checking the stem against `table.name` was not enough
      and the feasibility test proved it: `d_customer.yaml` declaring `table.name: d_customer` is
      internally consistent and entirely made up. INTERNAL CONSISTENCY IS NOT CONFORMANCE. On
      2026-09-28 a `d_`/`f_`/`b_` prefix scheme survived being designed, built, measured, committed
      and reported before anything objected.
    instead: describe the landing under its own name; rename on the served plane if you must

  - id: INVENTED-COLUMN-ROLE
    when: writing a data-plane column `role` outside the closed set
    why: the vocabulary is closed, and closed means closed
    instead: use one of primary_key | foreign_key | value | discriminator

  - id: TRANSIENT-AT-DELIVERY
    when: a delivered landed descriptor still carries `values:` on a column
    why: a member list is a value DOMAIN and its home is a register, not a descriptor
    instead: run tools/mac_lookups.py, which cuts the domain out and leaves `distinct:` + `register:`

  # THE OPERATOR RULED THE POLICY, 2026-09-29: "there only one lookup for one thing that can be
  # attached to multiple targets". These two refusals are the write-time half; the gate's
  # `one-domain-many-registers` is the read-time half over what was already delivered.
  - id: DOMAIN-CUT-TWICE
    when: cutting a register for a value set this bundle already holds under another name
    why: >-
      a register IS its members, so two files over one set are one register with two names — and
      which of them answers a question depends on load order. Measured on contoso5 2026-09-28: 48
      files over 25 value sets, the five currency codes stored EIGHT times, while the gate keyed on
      (source_view, column) and read DUPLICATED: 0 over all of it.
    instead: >-
      attach. The column's `register:` pointer is many-to-one already and always was; the cutter
      records the new attach point in the register's `<stem>.lookup.yaml` and writes no second file.
    # ENFORCED BY CONSTRUCTION, which is stronger than a hook that inspects after the fact: the
    # cutter keys `by_set` on the members, so a second file for a set it already holds cannot be
    # written. The propose-time hook could not check this anyway — it is handed one path and its
    # text, never the bundle, so it cannot see the sibling registers.
    enforced_by: tools/mac_lookups.py#by_set
    proven_by: "tools/mac_lookups.py --self-test: three columns, one value set -> ONE register"

  - id: BARE-NOTION-TWO-SETS
    when: naming a register after a notion that a DIFFERENT value set in this bundle also claims
    why: >-
      this is how contoso4 lost a domain: `customer.State` (565 codes) and `store.State` (67 names)
      both derive `state`, one file was written and the loser's members were preserved NOWHERE.
      Set-level identity does not prevent it — two different sets are correctly two registers and

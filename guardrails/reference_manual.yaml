          paragraph before the first section
        owner: operator
        since: 2026-10-04
        why_not_fixed: >-
          THE PAGE DOES SAY WHAT IT IS FOR — in its subtitle: "You have a column, a table or a concept
          in front of you. This says exactly what to write." The open question is whether a SUBTITLE
          satisfies `opens_with: purpose` or only a prose paragraph does, and that is a ruling about the
          declaration, not a defect in this page. `has_purpose` treats `###` as part of the title (which

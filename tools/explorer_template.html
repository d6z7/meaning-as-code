<meta charset="utf-8">
<script>
  /* universal theme selector — the SAME mechanism as ask.html (global localStorage 'mac_theme'), so the
     theme choice carries across the Ask and Explorer views. Sets data-theme before first paint (no flash). */
  (function(){ var t = localStorage.getItem('mac_theme') || ((window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'); document.documentElement.dataset.theme = t; })();
  /* Embedded in the /ask shell iframe? The shell already renders the .macbar, so hide OUR duplicate.
     Standalone (a cmd/ctrl-click'd fresh tab, top-level) keeps its own bar. Set pre-paint (no flash). */
  if (window.top !== window.self) document.documentElement.classList.add('embedded');
  function toggleTheme(){ var c = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = c; localStorage.setItem('mac_theme', c); var b = document.getElementById('themebtn'); if (b) b.textContent = c === 'dark' ? '☀' : '🌙'; }
  addEventListener('DOMContentLoaded', function(){ var b = document.getElementById('themebtn'); if (b) b.textContent = document.documentElement.dataset.theme === 'dark' ? '☀' : '🌙'; });
</script>
<style>

}

  --ink:#e6eaf1; --muted:#9aa6b6; --faint:#6b7686;
  --accent:#6f93ff; --accent-soft:#1d2740;
  --ask:#e6a94a; --ask-bg:#33280f; --commit:#54c483; --commit-bg:#123322;
  --refuse:#ef7365; --refuse-bg:#3a1c18; --invariant:#a891f0; --invariant-bg:#241d3a;
  --other:#9aa6b6; --other-bg:#242a35;
}}
:root[data-theme="dark"]{
  --ground:#12151c; --surface:#1a1f29; --surface-2:#222835; --border:#2c333f;
  --ink:#e6eaf1; --muted:#9aa6b6; --faint:#6b7686;
  --accent:#6f93ff; --accent-soft:#1d2740;
  --ask:#e6a94a; --ask-bg:#33280f; --commit:#54c483; --commit-bg:#123322;
  --refuse:#ef7365; --refuse-bg:#3a1c18; --invariant:#a891f0; --invariant-bg:#241d3a;
  --other:#9aa6b6; --other-bg:#242a35;
}
:root[data-theme="light"]{
  --ground:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f6; --border:#dde2ea;
  --ink:#1a2030; --muted:#5a6576; --faint:#8b95a5;
  --accent:#3563c9; --accent-soft:#e6ecfb;
  --ask:#b9770a; --ask-bg:#fbf1dd; --commit:#2f8a4e; --commit-bg:#e4f4ea;
  --refuse:#c0392b; --refuse-bg:#fbe6e3; --invariant:#6b4fbb; --invariant-bg:#eee8fb;
  --other:#5a6576; --other-bg:#eceff3;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code,.mono{font-family:var(--mono);font-size:.86em}
.tnum{font-variant-numeric:tabular-nums}

/* shared macOS-style menu bar (sticky top line); mirrors ask.html's .macbar */
/* When embedded in the /ask shell iframe the shell owns the bar — hide our duplicate (set by the head script). */
:root.embedded .macbar{display:none}
.macbar{position:sticky;top:0;z-index:1000;height:40px;display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.macbar .mb-left,.macbar .mb-right{display:flex;align-items:center}
.macbar .mb-left{gap:16px}
.macbar .mb-brand{display:flex;align-items:center;gap:7px;font-weight:750;color:var(--ink);font-size:13.5px}
.macbar .mb-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.macbar .mb-tabs{display:inline-flex;align-items:center;gap:3px}
.macbar .mb-tab{padding:4px 12px;border-radius:7px;color:var(--faint);text-decoration:none;font-weight:650;font-size:13px;line-height:1;cursor:pointer;white-space:nowrap}
.macbar .mb-tab:hover{background:var(--ground);color:var(--ink)}
.macbar .mb-tab.active{background:var(--accent-soft);color:var(--accent)}
.macbar .mb-theme{border:1px solid var(--border);background:var(--ground);color:var(--ink);border-radius:6px;width:30px;height:28px;cursor:pointer;font-size:14px}
.wrap{display:grid;grid-template-columns:288px 1fr;min-height:calc(100vh - 40px)}
.rail{background:var(--surface);border-right:1px solid var(--border);position:sticky;top:40px;
  height:calc(100vh - 40px);overflow-y:auto}
.rail-head{padding:18px 18px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;
  background:var(--surface);z-index:2}
.brand{font-weight:750;letter-spacing:-.01em;font-size:16px;display:flex;align-items:center;gap:9px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.tag{color:var(--faint);font-size:11.5px;margin-top:3px;letter-spacing:.02em}
.tabs{display:flex;gap:5px;margin-top:13px}
.tab{flex:1;padding:6px 4px;font-size:12px;font-weight:650;border:1px solid var(--border);
  background:var(--ground);color:var(--muted);border-radius:7px;text-align:center}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.search{width:100%;margin-top:11px;padding:8px 10px;border:1px solid var(--border);border-radius:7px;
  background:var(--ground);color:var(--ink);font-size:13px}

.main{padding:26px 34px 90px;max-width:1120px}

.metaline{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 2px;align-items:center}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;
  font-weight:600;background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.chip.klass{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.mono{font-family:var(--mono);font-weight:500}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:6px;font-size:11px;
  font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.badge.ASK{background:var(--ask-bg);color:var(--ask)} .badge.COMMIT{background:var(--commit-bg);color:var(--commit)}
.badge.REFUSE{background:var(--refuse-bg);color:var(--refuse)} .badge.INVARIANT{background:var(--invariant-bg);color:var(--invariant)}
.badge.OTHER{background:var(--other-bg);color:var(--other)}
.lane-dot{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}
.lane-ASK{background:var(--ask)} .lane-COMMIT{background:var(--commit)}
.lane-REFUSE{background:var(--refuse)} .lane-INVARIANT{background:var(--invariant)} .lane-OTHER{background:var(--other)}

.legend{display:flex;flex-wrap:wrap;gap:16px;padding:12px 17px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);margin:10px 0 4px;box-shadow:var(--shadow)}
.legend .li{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.legend .li b{color:var(--ink);font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:13px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.tile{padding:15px 16px;display:flex;flex-direction:column;gap:10px}
.tile:hover{border-color:var(--accent)}
.tile .tl-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tile .tl-name{font-weight:680;font-size:15.5px;letter-spacing:-.01em;color:var(--ink)}
.tile:hover .tl-name{color:var(--accent)}
.tile .tl-def{font-size:12.5px;color:var(--muted);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lanebar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.lanebar i{display:block;min-width:0}
.tl-foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--faint)}

.panelrow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:860px){.panelrow{grid-template-columns:1fr}}
.pane{padding:15px 17px}
.pane h3{margin:0 0 11px;font-size:13px;font-weight:700;color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;color:var(--ink)}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{text-align:left;font-weight:600;color:var(--faint);font-size:10px;text-transform:uppercase;
  letter-spacing:.05em;padding:6px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
table.tbl td{padding:6px 10px;border-bottom:1px solid var(--border);color:var(--ink);vertical-align:top}
table.tbl tr:last-child td{border-bottom:none}
.scroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-top:4px}
.regcap{font-size:11.5px;color:var(--faint);padding:8px 11px;border-top:1px solid var(--border)}

.constraint{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--refuse);
  border-radius:var(--radius);margin:12px 0;padding:13px 16px;box-shadow:var(--shadow)}
.cst-head{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.cst-assert{font-size:13.5px;line-height:1.55;color:var(--ink);max-width:82ch}
.rule{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--other);
  border-radius:var(--radius);margin:12px 0;box-shadow:var(--shadow)}
.rule.ASK{border-left-color:var(--ask)} .rule.COMMIT{border-left-color:var(--commit)}
.rule.REFUSE{border-left-color:var(--refuse)} .rule.INVARIANT{border-left-color:var(--invariant)}
.rule-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:13px 16px 4px}
.rule-subject{font-weight:650;font-size:14.5px;color:var(--ink);line-height:1.35}
.rule-sub{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:0 16px 2px}
.rule-sub:empty{display:none}
.rule-id{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--faint)}
.rule-body{padding:3px 16px 14px;display:flex;flex-direction:column;gap:8px}
.wtn{display:grid;grid-template-columns:58px 1fr;gap:11px;align-items:start;font-size:13px}
.wtn .lab{font-size:10px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;padding-top:3px;color:var(--faint)}
.wtn .lab.when{color:var(--accent)} .wtn .lab.then{color:var(--commit)} .wtn .lab.never{color:var(--refuse)}
.wtn .val{font-family:var(--mono);font-size:12.2px;line-height:1.55;color:var(--ink);white-space:pre-wrap}
.binds{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px;align-items:center}
.binds .bl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700}
details.prose{margin-top:4px;border-top:1px dashed var(--border);padding-top:9px}
details.prose summary{font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;list-style:none;
  display:flex;align-items:center;gap:7px}
details.prose summary::-webkit-details-marker{display:none}
details.prose summary::before{content:"\25B8";color:var(--faint);font-size:10px;transition:transform .15s}
details.prose[open] summary::before{transform:rotate(90deg)}
details.prose .ptext{font-size:13px;color:var(--muted);line-height:1.58;padding:9px 2px 2px;max-width:76ch}
.prose-why summary{color:var(--accent)}
/* explain-in-plain-english panel — model narration (POST /explain) grounded in the rule's fields + cross-refs;
   deterministic field-level summary is the offline/error fallback */
.prose-explain summary{color:var(--commit)}
.prose-explain summary::after{content:"grounded · on demand";margin-left:8px;font-size:10px;
  font-weight:600;color:var(--faint);letter-spacing:.02em;text-transform:none}
.prose-explain .ptext p{margin:0 0 8px} .prose-explain .ptext p:last-child{margin-bottom:0}
.prose-explain .ptext b{color:var(--ink);font-weight:650}
.xp-hint{color:var(--faint);font-style:italic}
.xp-spin{color:var(--muted)} .xp-spin::before{content:"◌ ";animation:xpspin 1s linear infinite;display:inline-block}
@keyframes xpspin{to{transform:rotate(360deg)}}
.xp-attr{margin-top:9px;padding-top:7px;border-top:1px dashed var(--border);font-size:10.5px;color:var(--faint);letter-spacing:.02em}
.xp-attr.xp-warn{color:var(--ask)}

.matrix-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table.matrix{border-collapse:collapse;font-size:12px;width:100%}
table.matrix th{position:sticky;top:0;background:var(--surface);padding:9px 7px;font-size:10px;
  text-transform:uppercase;letter-spacing:.03em;color:var(--faint);border-bottom:1px solid var(--border);
  white-space:nowrap;text-align:center}
table.matrix th.cn{text-align:left;left:0;position:sticky;z-index:3;min-width:190px}
table.matrix td{padding:8px 7px;text-align:center;border-bottom:1px solid var(--border)}
table.matrix td.cn{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:600;z-index:1}
table.matrix td.cn a{color:var(--ink)}
table.matrix tr:hover td{background:var(--surface-2)}
table.matrix tr:hover td.cn{background:var(--surface-2)}
.fill{width:12px;height:12px;border-radius:3px;display:inline-block;background:var(--commit)}
.fill.empty{background:transparent;border:1px solid var(--border);opacity:.5}
.grp-sep td{background:var(--surface-2);font-size:10px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--faint);font-weight:700;text-align:left;padding:6px 10px}

.policy{margin:4px 0}
.prow{display:grid;grid-template-columns:220px 96px 1fr;gap:14px;padding:12px 15px;border:1px solid var(--border);
  border-radius:var(--radius);background:var(--surface);margin-bottom:9px;align-items:start;box-shadow:var(--shadow)}
@media(max-width:760px){.prow{grid-template-columns:1fr;gap:8px}}
.prow .slot{font-family:var(--mono);font-size:12px;color:var(--ink);font-weight:600;word-break:break-word}
.prow .om{color:var(--muted);font-size:12.5px;line-height:1.5}
.prow .gr{font-size:11px;color:var(--faint);margin-top:5px;font-family:var(--mono)}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:var(--radius);
  padding:12px 15px;margin:12px 0;line-height:1.6}
.themebtn{position:fixed;top:14px;right:18px;z-index:20;background:var(--surface);border:1px solid var(--border);
  color:var(--muted);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;box-shadow:var(--shadow)}
.empty{color:var(--faint);font-size:13px;font-style:italic}
.filelink{font-family:var(--mono);font-size:11.5px;color:var(--faint)}

/* concept-class visual identity (distinct hue family from the warm decision lanes) */
:root{ --cls-entity:#4256c7; --cls-measure:#0e8f9e; --cls-reference:#5c76a8;
  --cls-enumeration:#a06a2c; --cls-grouping:#8a4f9e; }
@media (prefers-color-scheme:dark){:root{ --cls-entity:#8493f2; --cls-measure:#3ec2d0;
  --cls-reference:#93a8d6; --cls-enumeration:#d29a54; --cls-grouping:#c58fe0; }}
:root[data-theme="dark"]{ --cls-entity:#8493f2; --cls-measure:#3ec2d0; --cls-reference:#93a8d6;
  --cls-enumeration:#d29a54; --cls-grouping:#c58fe0; }
:root[data-theme="light"]{ --cls-entity:#4256c7; --cls-measure:#0e8f9e; --cls-reference:#5c76a8;
  --cls-enumeration:#a06a2c; --cls-grouping:#8a4f9e; }
.chip.klass{background:transparent;border:1px solid var(--border);color:var(--muted);gap:5px}
.chip.klass .cg{font-size:11px;line-height:1}
.chip.klass.entity{color:var(--cls-entity);border-color:color-mix(in srgb,var(--cls-entity) 45%,transparent)}
.chip.klass.measure{color:var(--cls-measure);border-color:color-mix(in srgb,var(--cls-measure) 45%,transparent)}
.chip.klass.reference{color:var(--cls-reference);border-color:color-mix(in srgb,var(--cls-reference) 45%,transparent)}
.chip.klass.enumeration{color:var(--cls-enumeration);border-color:color-mix(in srgb,var(--cls-enumeration) 45%,transparent)}
.chip.klass.grouping{color:var(--cls-grouping);border-color:color-mix(in srgb,var(--cls-grouping) 45%,transparent)}
.ni-l{display:flex;align-items:center;gap:8px;min-width:0}
.ni-l .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cdot{width:8px;height:8px;border-radius:2px;flex:none}

/* relationship graph */
.graphwrap{position:relative;border:1px solid var(--border);border-radius:var(--radius);
  background:radial-gradient(120% 120% at 30% 15%,var(--surface),var(--ground));box-shadow:var(--shadow);
  overflow:hidden;margin-top:6px}
.graphwrap svg{display:block;width:100%;height:clamp(480px,78vh,1200px);touch-action:none;user-select:none}
.graphhint{position:absolute;top:11px;right:15px;font-size:11px;color:var(--faint);pointer-events:none}
.glink{stroke-linecap:round}
.glink.fk{stroke:var(--muted);stroke-width:1.7}
.glink.hierarchy{stroke:var(--accent);stroke-width:1.8;stroke-dasharray:5 4}
.glink.coground{stroke:var(--border);stroke-width:1.1}

.gnode{cursor:pointer}
.gnode circle{stroke:var(--surface);stroke-width:2}
.gnode.entity circle{fill:var(--cls-entity)} .gnode.measure circle{fill:var(--cls-measure)}
.gnode.reference circle{fill:var(--cls-reference)} .gnode.enumeration circle{fill:var(--cls-enumeration)}
.gnode.grouping circle{fill:var(--cls-grouping)}
.gnode text{font-size:10.5px;fill:var(--ink);font-family:var(--sans);paint-order:stroke;
  stroke:var(--surface);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.gnode.dim{opacity:.16}
.gnode.hot circle{stroke:var(--accent);stroke-width:3}
.legend svg{vertical-align:middle}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== data plane: relations browsed as first-class objects (the same way as concepts) ===== */
.tabs{flex-wrap:wrap}
.tab{flex:1 1 42px}
.badge.BLOCK{background:var(--invariant-bg);color:var(--invariant)}
.rolechip{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.03em;
  border-radius:5px;padding:1px 6px;line-height:1.6;border:1px solid var(--border);color:var(--muted)}
.rolechip.pk{color:var(--cls-entity);border-color:color-mix(in srgb,var(--cls-entity) 45%,transparent)}
.rolechip.fk{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.rolechip.discriminator{color:var(--cls-enumeration);border-color:color-mix(in srgb,var(--cls-enumeration) 45%,transparent)}
.statusdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--commit)}
.statusdot.target,.statusdot.draft{background:var(--ask)}
.statusdot.register{background:var(--cls-grouping)}
.rel-badges{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:8px 0 2px}
.tl-name.mono,.title.mono{font-family:var(--mono)}
.mvnote{background:var(--refuse-bg);border:1px solid color-mix(in srgb,var(--refuse) 30%,transparent);
  border-radius:var(--radius);padding:11px 15px;margin:14px 0 2px;font-size:12.5px;color:var(--ink);line-height:1.55}
.mvnote b{color:var(--refuse)}
.lineage{display:flex;flex-direction:column;margin:4px 0}
.lin-step{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--border)}
.lin-step:last-child{border-bottom:none}
.lin-step .li-id{font-family:var(--mono);font-size:11.5px;color:var(--accent);min-width:160px;flex:none}
.lin-step .li-body{font-size:12.5px;color:var(--muted);line-height:1.5}
.lin-in{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;
  padding:3px 9px;border:1px solid var(--border);border-radius:6px;margin:0 7px 7px 0;color:var(--ink)}
.lin-in.raw{color:var(--muted);border-style:dashed}

/* source-authored operator manual (Manual tab) */
.doc{max-width:82ch}
.doc h2{font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);
  margin:32px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--border);font-weight:750}
.doc h2:first-child{margin-top:4px}
.doc h3{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:700}
.doc p{margin:10px 0;line-height:1.62}
.doc strong{color:var(--ink);font-weight:700}
.doc blockquote{margin:8px 0 15px;padding:3px 15px;border-left:3px solid var(--accent-soft);color:var(--muted);font-size:13.5px;line-height:1.55}
.doc blockquote strong{color:var(--ink)}
.doc pre{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;overflow-x:auto;box-shadow:var(--shadow);margin:12px 0}
.doc pre code{background:none;border:none;padding:0;font-size:12.4px;line-height:1.6;white-space:pre;color:var(--ink)}
.doc code{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:1px 5px}
.doc ul{margin:10px 0;padding-left:22px}.doc li{margin:5px 0;line-height:1.55}
.doc hr{border:none;border-top:1px solid var(--border);margin:26px 0}
.doc table{border-collapse:collapse;width:100%;margin:14px 0;font-size:12.5px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.doc thead th{background:var(--surface-2);text-align:left;padding:8px 11px;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--border)}
.doc td{padding:8px 11px;border-bottom:1px solid var(--border);vertical-align:top}
.doc tbody tr:last-child td{border-bottom:none}
.doc td code{white-space:nowrap}
.tablewrap{overflow-x:auto}
.lane-tok{font-family:var(--mono);font-size:.85em;font-weight:700;padding:0 4px;border-radius:4px;white-space:nowrap}
.lane-tok.COMMIT{color:var(--commit);background:var(--commit-bg)}
.lane-tok.ASK{color:var(--ask);background:var(--ask-bg)}
.lane-tok.REFUSE{color:var(--refuse);background:var(--refuse-bg)}
.lane-tok.BLOCK{color:var(--invariant);background:var(--invariant-bg)}

/* graph: data-plane nodes (relations = squares) + cross-plane binding edges */
.gmodes{display:inline-flex;gap:4px;margin-left:auto}
.gmode{font-size:12px;font-weight:650;padding:5px 11px;border:1px solid var(--border);border-radius:7px;color:var(--muted);background:var(--surface)}
.gmode:hover{color:var(--ink);text-decoration:none}
.gmode.active{background:var(--accent);border-color:var(--accent);color:#fff}
.gnode.rel rect{stroke:var(--surface);stroke-width:2}
.gnode.rel.fact rect{fill:var(--accent)}
.gnode.rel.measure-view rect{fill:var(--cls-measure)}
.gnode.rel.dimension rect{fill:var(--cls-entity)}
.gnode.rel.region-view rect{fill:var(--cls-reference)}
.gnode.rel.view rect{fill:var(--muted)}
.gnode.rel.registers rect{fill:var(--cls-grouping)}
.gnode.hot rect{stroke:var(--accent);stroke-width:3}
.glink.binding{stroke:var(--commit);stroke-width:1.5;stroke-dasharray:2 4}
.glink.orel{stroke:var(--accent);stroke-width:1.8}
.graphwrap svg{cursor:grab}
.graphctl{position:absolute;top:11px;left:15px;display:flex;flex-wrap:wrap;gap:6px;z-index:2;max-width:calc(100% - 30px)}
.gbtn{font-size:11.5px;font-weight:600;padding:5px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--muted);box-shadow:var(--shadow)}
.gbtn:hover{color:var(--ink);text-decoration:none}
.gbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.main.wide{max-width:none}
.garrow{fill:var(--muted);stroke:none}
.garrow.hierarchy{fill:var(--accent)}
.garrow.binding{fill:var(--commit)}
.garrow.orel{fill:var(--accent)}
.glink.dim,.gnode.dim{}
.gnode.focus circle,.gnode.focus rect{stroke:var(--accent);stroke-width:3.5}
/* focus header + connects-to panel */
.focushdr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0 2px;padding:9px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius)}
.fh-label{font-weight:700;color:var(--ink)}
.fh-count{color:var(--faint);font-size:12px;margin-left:auto}
.fh-depth{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.gchip{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 8px;border:1px solid var(--border);border-radius:5px;color:var(--muted)}
.gchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.connects{display:flex;flex-direction:column;gap:13px}
.nbr-k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700;margin-bottom:6px}
.nbr-row{display:flex;flex-wrap:wrap;gap:7px}
.nbr{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:7px;background:var(--surface);padding:3px 3px 3px 10px}
.nbr:hover{border-color:var(--accent)}
.nbr-focus{font-size:12.5px;color:var(--ink);cursor:pointer}
.nbr-focus:hover{color:var(--accent);text-decoration:none}
.nbr-open{font-size:12px;color:var(--faint);padding:1px 7px;border-left:1px solid var(--border);margin-left:7px}
.nbr-open:hover{color:var(--accent);text-decoration:none}
/* graph edge labels (relationship name + cardinality) */
.glabel{font-size:9.5px;fill:var(--muted);font-family:var(--sans);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round;pointer-events:none;text-anchor:middle}
.gcard{font-size:9px;fill:var(--faint);font-family:var(--mono);font-weight:700;paint-order:stroke;stroke:var(--surface);stroke-width:3px;pointer-events:none;text-anchor:middle}
/* ER plane: table boxes + crow's-foot */
.erbox{fill:var(--surface);stroke:var(--border);stroke-width:1.2}
.gnode.hot .erbox,.gnode.focus .erbox{stroke:var(--accent);stroke-width:2.4}
.erhead.fact{fill:var(--accent)}.erhead.measure-view{fill:var(--cls-measure)}.erhead.dimension{fill:var(--cls-entity)}
.erhead.region-view{fill:var(--cls-reference)}.erhead.view{fill:var(--muted)}.erhead.registers{fill:var(--cls-grouping)}
.erttl{font-size:10.5px;font-weight:700;fill:#fff;font-family:var(--mono);pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.5);stroke-width:2.2px}
.ercol{font-size:9.5px;fill:var(--ink);font-family:var(--mono);pointer-events:none}
.ercol.pk{fill:var(--cls-entity);font-weight:700}.ercol.fk{fill:var(--accent)}.ercol.more{fill:var(--faint);font-style:italic}
.erm{stroke:var(--muted);fill:none;stroke-width:1.3}
.erkey{font-size:9px;fill:var(--faint);font-family:var(--mono);paint-order:stroke;stroke:var(--surface);stroke-width:3px;pointer-events:none;text-anchor:middle}
/* graph search: pulse-ring the matched node(s); non-matches reuse the existing .gnode.dim / .glink.dim opacity */
@keyframes gpulse{0%{stroke-width:3}45%{stroke-width:8.5}100%{stroke-width:3}}
.gnode.ghit circle,.gnode.ghit rect{stroke:var(--accent);animation:gpulse .55s ease-out 2}
@media(prefers-reduced-motion:reduce){.gnode.ghit circle,.gnode.ghit rect{animation:none;stroke:var(--accent)}}
/* interactive legend — facet filters (node categories + edge kinds on the graph; concept classes on the map) */
.li.off{opacity:.35;text-decoration:line-through}
.legend .li[data-nodecat],.legend .li[data-edgekind],.legend .li[data-clearfilters],
.legend .li[data-mapclass],.legend .li[data-mapclearfilters]{cursor:pointer;user-select:none}
.legend .li[data-nodecat]:hover,.legend .li[data-edgekind]:hover,.legend .li[data-clearfilters]:hover,
.legend .li[data-mapclass]:hover,.legend .li[data-mapclearfilters]:hover{color:var(--ink)}
path.glink{fill:none;stroke-linejoin:round}   /* ER FK connectors are elbow <path>s, not <line>s — a path with no fill:none would render as a black blob */

/* register preview: complete + vertically scrollable, with a sticky header so columns stay labelled */
.scroll.regscroll{max-height:360px;overflow-y:auto}
table.tbl.reg thead th{position:sticky;top:0;background:var(--surface);z-index:1}

/* dedicated framed panel — a config-object (rules.yaml / query_rules.yaml) shown alongside the concepts */
.frame{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);margin:28px 0 10px;overflow:hidden}
.frame-hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:13px 18px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.frame-ttl{font-weight:750;font-size:14.5px;color:var(--ink);letter-spacing:-.01em}
.frame-sub{font-size:12px;color:var(--muted)}
.frame-src{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:600;text-transform:none;letter-spacing:0}
.frame-bd{padding:6px 18px 18px}
.frame-bd .sec:first-child{margin-top:14px}
.xref{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:11px 15px;margin:14px 0 2px}
.xref .xr-n{font-weight:750;color:var(--ink);font-variant-numeric:tabular-nums}

/* derived measures — the root rules.yaml registry (ratios / variances over base concepts) */
.derived{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--cls-measure);
  border-radius:var(--radius);margin:12px 0;box-shadow:var(--shadow);padding:13px 16px}
.derived .d-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.derived .d-name{font-family:var(--mono);font-weight:700;font-size:14.5px;color:var(--cls-measure)}
.derived .d-id{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.derived .d-over{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:9px 0 4px;font-size:12.5px}
.derived .d-over .ol{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700}
.derived .d-over .arr{color:var(--faint)}
.derived .d-logic{font-size:13px;color:var(--muted);line-height:1.55;margin:6px 0 2px;max-width:82ch}
.derived pre.d-sql{white-space:pre-wrap;font-family:var(--mono);font-size:12px;line-height:1.5;margin:0;color:var(--ink)}
</style>

<!-- shared macOS-style menu bar: source (left) · Ask|Explorer · theme (right). Sticky top line — the rail and
     main scroll beneath it. Mirrors ask.html's .macbar so the two views read as one app. -->
<div class="macbar">
  <div class="mb-left">
    <span class="mb-brand"><span class="mb-dot"></span><span id="mb-source">Explorer</span></span>
    <span class="mb-tabs">
      <a class="mb-tab" id="tabAsk" href="" title="Ask a natural-language question of this ontology">Ask</a>
      <span class="mb-tab active" title="You are here">Explorer</span>
    </span>
  </div>
  <div class="mb-right">
    <button class="mb-theme" id="themebtn" type="button" title="Toggle light / dark" onclick="toggleTheme()">🌙</button>
  </div>
</div>
<div class="wrap">
  <aside class="rail">
    <div class="rail-head">
      <div class="brand"><span class="dot"></span><span id="brandname">Ontology Explorer</span></div>
      <div class="tag" id="railtag">semantic model · drill-down</div>
      <div class="tabs">
        <a class="tab" data-tab="graph" href="#graph">Graph</a>
        <a class="tab" data-tab="map" href="#map">Concepts</a>
        <a class="tab" data-tab="edges" id="tab-edges" href="#edges">Edges</a>
        <a class="tab" data-tab="data" id="tab-data" href="#data">Data</a>
        <a class="tab" data-tab="slots" href="#slots">Slots</a>
        <a class="tab" data-tab="decisions" href="#decisions">Decisions</a>
        <a class="tab" data-tab="manual" id="tab-manual" href="#manual">Manual</a>
      </div>
      <input class="search" id="search" type="search" placeholder="Filter concepts / relations…" autocomplete="off">
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
window.MAC_MODEL = /*__MODEL_JSON__*/null;
// Ask <-> Explorer view toggle (mirrors ask.html). "Ask" opens the generic /ask page for THIS source —
// relative when served over http (ask.html shares this origin), else the file:// origin that
// mac_to_explorer.py injects for /*__ASK_BASE__*/ via --ask-base. Empty base under file:// -> Ask stays hidden.
(function(){
  var ASK_BASE = "/*__ASK_BASE__*/".trim();
  var SERVED = location.protocol.indexOf("http") === 0;
  var meta = (window.MAC_MODEL && window.MAC_MODEL.meta) || {};
  var src = meta.source || "";
  var sEl = document.getElementById("mb-source"); if (sEl && src) sEl.textContent = src;   // menubar app-name = source
  var q = src ? ("?src=" + encodeURIComponent(src)) : "";
  var href = SERVED ? ("ask.html" + q) : (ASK_BASE ? (ASK_BASE.replace(/\/+$/, "") + "/ask.html" + q) : "");
  var a = document.getElementById("tabAsk");                                                // the Ask menu item (link out)
  if (a) { if (href) a.setAttribute("href", href); else a.style.display = "none"; }         // hide when /ask isn't reachable
})();
(function(){
"use strict";
var M = window.MAC_MODEL;
var LANES = ["ASK","COMMIT","REFUSE","INVARIANT","OTHER"];
var laneColor = {ASK:"var(--ask)",COMMIT:"var(--commit)",REFUSE:"var(--refuse)",INVARIANT:"var(--invariant)",OTHER:"var(--other)"};
var DOMAINS = (M.domains && M.domains.length) ? M.domains : [];
var CLASSES = ["entity","measure","reference","enumeration","grouping"];
var CLASS_GLYPH = {entity:"◆",measure:"Σ",reference:"▭",enumeration:"☰",grouping:"⬗"};
var REL_GROUPS = ["fact","measure view","dimension","region view","view","registers"];
var ROLE_ABBR = {primary_key:"PK",foreign_key:"FK",value:"val",discriminator:"disc",dimension:"dim",attribute:"attr",measure:"msr",key:"key"};
var graphAnim = null;
var graphMode = "both";
var graphLayout = "force";   // "force" (physics/settle) | "flow" (layered, follows edge direction)
var flowDir = "lr";          // flow orientation: "lr" (left→right) | "tb" (top→bottom)
var erStraight = false;      // ER FK connectors: false = elbow (orthogonal) | true = straight
var graphFrozen = true;   // default: settle once + auto-fit (calm, framed). ▶ Physics opts into the live force sim
var graphFocusOn = false, graphFocus = null, focusDepth = 1, focusHist = [];
var erCompact = true;   // ER opens as compact title-only boxes (toggle to show columns)
// ---- persistence: remember plane / ER-mode / theme / node positions across reloads (localStorage) ----
var graphPos={};                                            // { mode : { nodeId : {x,y} } } — hand-dragged layouts, per plane
var GPKEY="macexplorer_"+((M.meta&&M.meta.source)||"x");
function loadPrefs(){ try{ return JSON.parse(localStorage.getItem(GPKEY))||{}; }catch(e){ return {}; } }
function savePrefs(){ try{ localStorage.setItem(GPKEY, JSON.stringify({graphMode:graphMode, graphLayout:graphLayout, flowDir:flowDir, erStraight:erStraight, erCompact:erCompact, theme:(document.documentElement.getAttribute("data-theme")||""), pos:graphPos})); }catch(e){} }
var PREFS=loadPrefs();
if(PREFS.graphMode) graphMode=PREFS.graphMode;
if(PREFS.graphLayout) graphLayout=PREFS.graphLayout;
if(PREFS.flowDir) flowDir=PREFS.flowDir;
if(typeof PREFS.erStraight==="boolean") erStraight=PREFS.erStraight;
if(typeof PREFS.erCompact==="boolean") erCompact=PREFS.erCompact;
/* theme is UNIVERSAL now (global 'mac_theme', set pre-paint by the head script) — no longer per-source here */
if(PREFS.pos && typeof PREFS.pos==="object") graphPos=PREFS.pos;
var graphSearchFn=null;   // registered inside initGraph; #search calls it on the graph tab (grey + frame + pulse)
var graphHideCat={};    // node category (concept class OR relation group) -> true = hidden
var graphHideKinds={};  // edge kind (fk|hierarchy|coground|binding) -> true = hidden
var mapHideClass={};    // Concepts tab: concept class -> true = hidden (legend-glyph facet filter over the tile grid)
function relColor(g){return {"fact":"var(--accent)","measure view":"var(--cls-measure)","dimension":"var(--cls-entity)","region view":"var(--cls-reference)","view":"var(--muted)","registers":"var(--cls-grouping)"}[g]||"var(--muted)";}
function slug(g){return String(g||"").replace(/\s+/g,"-");}
function trunc(s){s=String(s||"");return s.length>22?s.slice(0,21)+"…":s;}
function relLeaf(rel){rel=String(rel||"");if(rel.indexOf("/")>=0||/\.ya?ml$/.test(rel)){rel=rel.split("/").pop().replace(/\.ya?ml$/,"");}return rel.split(".").pop();}
function relById(leaf){return (M.relations||[]).filter(function(r){return r.leaf===leaf||r.name===leaf;})[0];}
function relLink(rel){var leaf=relLeaf(rel);return relById(leaf)?'<a href="#r/'+encodeURIComponent(leaf)+'">'+esc(rel)+'</a>':esc(rel);}
function classChip(k){var g=CLASS_GLYPH[k]||"•"; return '<span class="chip klass '+esc(k)+'"><span class="cg">'+g+'</span>'+esc(k)+'</span>';}
function classDot(k){return '<span class="lane-dot" style="background:var(--cls-'+esc(k)+')"></span>';}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function byId(id){return M.concepts.filter(function(c){return c.id===id;})[0];}
function ruleLanes(c){var t={ASK:0,COMMIT:0,REFUSE:0,INVARIANT:0,OTHER:0};c.rules.forEach(function(r){t[r.decision]++;});return t;}
function laneBar(t){
  var parts = LANES.filter(function(l){return t[l];}).map(function(l){
    return '<i style="flex:'+t[l]+';background:'+laneColor[l]+'" title="'+l+': '+t[l]+'"></i>';}).join("");
  return '<div class="lanebar">'+(parts||'<i style="flex:1"></i>')+'</div>';
}
function edgesFor(id){return M.edges.filter(function(e){return e.from===id||e.to===id;});}

var state = {tab:"map", concept:null, relation:null, q:""};

/* ---------- rail ---------- */
function railConcepts(){
  var groups={}; M.concepts.forEach(function(c){(groups[c.domain]=groups[c.domain]||[]).push(c);});
  var q=state.q.toLowerCase(), html="";
  DOMAINS.filter(function(d){return groups[d];}).forEach(function(d){
    var items=groups[d].filter(function(c){return !q||c.label.toLowerCase().indexOf(q)>=0||c.id.toLowerCase().indexOf(q)>=0||(c.definition||"").toLowerCase().indexOf(q)>=0;});
    if(!items.length) return;
    html+='<div class="nav-group">'+d.replace(/_/g," ")+'</div>';
    items.forEach(function(c){
      html+='<a class="nav-item'+(state.concept===c.id?" active":"")+'" href="#c/'+encodeURIComponent(c.id)+'"><span class="ni-l"><span class="cdot" style="background:var(--cls-'+esc(c.klass)+')"></span><span class="lbl">'+esc(c.label)+'</span></span><span class="rc tnum">'+c.rules.length+'</span></a>';
    });
  });
  return html;
}
function railRelations(){
  var rels=M.relations||[], q=state.q.toLowerCase(), html="";
  var groups={}; rels.forEach(function(r){(groups[r.group]=groups[r.group]||[]).push(r);});
  REL_GROUPS.filter(function(g){return groups[g];}).forEach(function(g){
    var items=groups[g].filter(function(r){return !q||r.name.toLowerCase().indexOf(q)>=0;});
    if(!items.length) return;
    html+='<div class="nav-group">'+esc(g)+'</div>';
    items.forEach(function(r){
      html+='<a class="nav-item'+(state.relation===r.leaf?" active":"")+'" href="#r/'+encodeURIComponent(r.leaf)+'"><span class="ni-l"><span class="statusdot '+esc(r.status)+'"></span><span class="lbl mono">'+esc(r.name)+'</span></span><span class="rc tnum">'+(r.columns?r.columns.length:0)+'</span></a>';
    });
  });
  return html;
}
function renderRail(){
  var html = state.tab==="data" ? railRelations() : railConcepts();
  document.getElementById("nav").innerHTML = html||'<div class="nav-group">no match</div>';
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(t){
    t.classList.toggle("active", t.getAttribute("data-tab")===state.tab);});
}

/* ---------- concepts (map) ---------- */
function viewMap(){
  var q=state.q.toLowerCase();
  var clsCount={}; M.concepts.forEach(function(c){clsCount[c.klass]=(clsCount[c.klass]||0)+1;});
  var cs=M.concepts.filter(function(c){
    return !mapHideClass[c.klass] && (!q||c.label.toLowerCase().indexOf(q)>=0||c.id.toLowerCase().indexOf(q)>=0||(c.definition||"").toLowerCase().indexOf(q)>=0);});
  var L=M.lanes;
  var legend='<div class="legend">'
    +'<div class="li"><span class="lane-dot lane-ASK"></span>ASK <b>'+L.ASK+'</b></div>'
    +'<div class="li"><span class="lane-dot lane-COMMIT"></span>COMMIT <b>'+L.COMMIT+'</b></div>'
    +'<div class="li"><span class="lane-dot lane-REFUSE"></span>REFUSE <b>'+L.REFUSE+'</b></div>'
    +'<div class="li"><span class="lane-dot lane-INVARIANT"></span>INVARIANT <b>'+L.INVARIANT+'</b></div>'

/* ---------- plain-English explainers (Option A: narrate the rule's OWN fields, no model call) ---------- */
function joinList(a){a=a||[];if(a.length===0)return"";if(a.length===1)return a[0];
  return a.slice(0,-1).join(", ")+" and "+a[a.length-1];}
// render_kind -> how the measure is actually computed, in plain words. Unknown kinds degrade to "".
var RENDER_KIND_EN={
  sql_expression:"It is calculated on demand by injecting a SQL expression into the query at run time",
  derived_set:"It is calculated as a set-membership test injected into the query at run time",
  snapshot_filter:"It is calculated by filtering rows to a point-in-time snapshot",
  sql_view:"It is read from a pre-built gold-layer SQL view rather than recomputed each time",
  spec_only:"It has no fixed SQL form — an agent generates the query from the description"
};
// A derived measure (root rules.yaml): narrate over / render_kind / conditions / validated_against.
// The authored `logic` is already shown on the card face, so this panel translates the MACHINE metadata to English.
function explainDerived(m){
  var ps=[], name=m.derives||m.id;
  var overLabels=(m.over||[]).map(function(t){var c=byId(t);return esc(c?c.label:t);});
  var lead="<b>"+esc(name)+"</b>"+((m.id&&m.derives)?' (rule <span class="mono">'+esc(m.id)+"</span>)":"")
    +" is a value the ontology derives"+(overLabels.length?" over "+joinList(overLabels):"")+".";
  ps.push(lead);
  if(RENDER_KIND_EN[m.render_kind]) ps.push(RENDER_KIND_EN[m.render_kind]+".");
  if(m.conditions&&m.conditions.length)
    ps.push((m.conditions.length===1?"One condition":m.conditions.length+" conditions")
      +" must hold for the result to be valid — see <b>Conditions</b> below.");
  if(m.validated_against&&m.validated_against.length)
    ps.push("It has been validated against "+joinList(m.validated_against.map(esc))+".");
  if(m.confidence) ps.push("Authoring confidence: grade <b>"+esc(m.confidence)+"</b>.");
  return ps.map(function(p){return "<p>"+p+"</p>";}).join("");
}
// A when/then/never rule (concept contract or query_rules): lead with what its decision lane MEANS operationally.
var LANE_EN={
  ASK:"This is an <b>ASK</b> rule — when its trigger arises the engine must stop and ask the user rather than guess.",
  COMMIT:"This is a <b>COMMIT</b> rule — the engine applies it automatically, no question asked.",
  REFUSE:"This is a <b>REFUSE</b> rule — it blocks a query the ontology treats as unanswerable or wrong.",
  INVARIANT:"This is an <b>INVARIANT</b> — a guarantee the ontology holds to at all times."
};
function explainRuleNL(r){
  var ps=[];
  if(LANE_EN[r.decision]) ps.push(LANE_EN[r.decision]);
  if(r.when) ps.push("<b>It fires when:</b> "+esc(r.when));
  if(r.then) ps.push("<b>Then it:</b> "+esc(r.then));
  if(r.never) ps.push("<b>It never:</b> "+esc(r.never));
  if(r.binds&&r.binds.length) ps.push("<b>It binds to:</b> "+joinList(r.binds.map(esc))+".");
  if(ps.length===0) return "";
  return ps.map(function(p){return "<p>"+p+"</p>";}).join("");
}
/* ---------- on-demand NL explanation (POST /explain), GROUNDED by a bundle built from THIS model ----------
   When a runtime server is on this origin, the panel resolves the rule's cross-references from MAC_MODEL,
   POSTs that bundle to /explain, and the model narrates it. The deterministic field-level summary above is
   kept as the OFFLINE / error fallback, so the panel always shows something useful (no server -> no blank). */
var XP_SERVED = location.protocol.indexOf("http")===0;   // a runtime server shares this origin
var XP_BUNDLES = {};                                     // panel id -> resolved grounding bundle
var XP_N = 0, XP_RULES = null;
function xpAllRules(){                                    // flat id-index across contract / query / derived rules
  if(XP_RULES) return XP_RULES;
  XP_RULES=[];
  (M.general_rules||[]).forEach(function(r){ XP_RULES.push({id:r.id, kind:"query"}); });
  (M.concepts||[]).forEach(function(c){ (c.rules||[]).forEach(function(r){ XP_RULES.push({id:r.id, kind:"contract", on:c.id}); }); });
  (M.derived_measures||[]).forEach(function(m){ XP_RULES.push({id:m.id, kind:"derived"}); });
  return XP_RULES;
}
// referenced rules = other rules whose id is NAMED in this rule's own text (a Never clause routing to
// region.resolve.named_definition, a hand-off, a forbidden sibling). Deterministic substring match on the id.
function xpRefs(selfId, text){
  text=String(text||"");
  return xpAllRules().filter(function(x){ return x.id && x.id!==selfId && text.indexOf(x.id)>=0; })
    .map(function(x){ return {id:x.id, kind:x.kind, on:x.on||null}; });
}
function xpConcept(id){ var c=byId(id); return c?{id:c.id, label:c.label, klass:c.klass, definition:c.definition||""}:{token:id, in_model:false}; }
function xpDerivedBundle(m){
  var text=[m.logic,(m.conditions||[]).join(" ")].join(" ");
  var sib=(M.derived_measures||[]).filter(function(d){ return d.id!==m.id && (d.over||[]).some(function(o){ return (m.over||[]).indexOf(o)>=0; }); })
            .map(function(d){ return {id:d.id, derives:d.derives}; });
  return { source:(M.meta&&M.meta.source)||"", rule_kind:"derived_measure",
    rule:{id:m.id, derives:m.derives, over:m.over, render_kind:m.render_kind, logic:m.logic,
          conditions:m.conditions, validated_against:m.validated_against, confidence:m.confidence},
    reads_concepts:(m.over||[]).map(xpConcept), sibling_measures_over_same_concept:sib,
    referenced_rules:xpRefs(m.id, text) };
}
function xpRuleBundle(r){
  var text=[r.when,r.then,r.never,r.purpose].join(" ");
  return { source:(M.meta&&M.meta.source)||"", rule_kind:"decision_rule",
    rule:{id:r.id, subject:r.subject, decision:r.decision, when:r.when, then:r.then, never:r.never,
          binds:r.binds, confidence:r.confidence, scope:r.scope, purpose:r.purpose},
    binds_concepts:(r.binds||[]).map(xpConcept), referenced_rules:xpRefs(r.id, text) };
}
function xpHash(s){ var h=5381,i=s.length; while(i) h=(h*33)^s.charCodeAt(--i); return (h>>>0).toString(36); }
function xpKey(b){ return "macxp_"+(b.source||"x")+"_"+((b.rule&&b.rule.id)||"")+"_"+xpHash(JSON.stringify(b.rule)); }
// SAFE mini-markdown: escape FIRST (no raw HTML survives), then **bold** / *italic* / paragraph + line breaks.
function xpMd(t){ var e=esc(String(t||"")).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*]+)\*/g,"$1<i>$2</i>");
  return e.split(/\n{2,}/).map(function(p){ return "<p>"+p.replace(/\n/g,"<br>")+"</p>"; }).join(""); }
function explainPanel(kind, item){
  var fallback = kind==="derived" ? explainDerived(item) : explainRuleNL(item);
  if(!fallback && !XP_SERVED) return "";
  var id="xp"+(XP_N++);
  XP_BUNDLES[id] = kind==="derived" ? xpDerivedBundle(item) : xpRuleBundle(item);
  var body = XP_SERVED ? '<div class="xp-hint">Open to generate a plain-English explanation from this rule and its cross-references.</div>' : fallback;
  return '<details class="prose prose-explain" data-xp="'+id+'"><summary>Explain — in plain English</summary>'
    +'<div class="ptext" id="xpbody-'+id+'" data-fallback="'+encodeURIComponent(fallback||"")+'">'+body+'</div></details>';
}
function xpRender(body, nl, model, cached){
  body.innerHTML = xpMd(nl) + '<div class="xp-attr">generated'+(model?" · "+esc(model):"")+(cached?" · cached":"")
    +" · grounded in this rule's fields + cross-references</div>";
}
function xpFallback(body, why){
  var fb=decodeURIComponent(body.getAttribute("data-fallback")||"");
  body.removeAttribute("data-loaded");                                  // allow a retry on next open
  body.innerHTML = (fb||"<p>No field-level summary available.</p>")
    +'<div class="xp-attr xp-warn">model unavailable — showing field-level summary'+(why?" ("+esc(why)+")":"")+"</div>";
}
// toggle does NOT bubble -> capture-phase listener; lazy-generates on first open, caches per rule-content hash.
document.addEventListener("toggle", function(ev){
  var d=ev.target; if(!d.matches||!d.matches("details.prose-explain[data-xp]")||!d.open) return;
  var id=d.getAttribute("data-xp"), body=document.getElementById("xpbody-"+id);
  if(!body || body.getAttribute("data-loaded") || !XP_SERVED) return;
  var bundle=XP_BUNDLES[id]; if(!bundle) return;
  var cache=null; try{ cache=JSON.parse(localStorage.getItem(xpKey(bundle))||"null"); }catch(e){}
  if(cache && cache.nl){ xpRender(body, cache.nl, cache.model, true); body.setAttribute("data-loaded","1"); return; }
  body.setAttribute("data-loaded","1");
  body.innerHTML='<div class="xp-spin">Generating explanation…</div>';
  fetch("/explain",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({bundle:bundle})})
    .then(function(res){ return res.json(); })
    .then(function(j){
      if(j && j.nl){ xpRender(body, j.nl, j.model, false); try{ localStorage.setItem(xpKey(bundle), JSON.stringify({nl:j.nl, model:j.model})); }catch(e){} }
      else xpFallback(body, (j&&j.error)||"no explanation returned"); })
    .catch(function(err){ xpFallback(body, String(err&&err.message||err)); });
}, true);

/* ---------- derived-measure card (root rules.yaml) ---------- */
function overToken(t){

           : '<span class="chip mono" title="measure code">'+esc(t)+'</span>';

function derivedCard(m){

  var cond="";
  if(m.conditions && m.conditions.length) cond='<details class="prose"><summary>Conditions — '+m.conditions.length+'</summary><div class="ptext"><ul style="margin:4px 0;padding-left:18px">'+m.conditions.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul></div></details>';
  var va=(m.validated_against&&m.validated_against.length)?'<div class="d-over"><span class="ol">validated against</span>'+m.validated_against.map(function(v){return relLink(v);}).join('<span class="arr">·</span>')+'</div>':'';
  return '<div class="derived">'
    +'<div class="d-top"><span class="d-name">Σ '+esc(m.derives||m.id)+'</span>'
    +(m.derives?'<span class="d-id">'+esc(m.id)+'</span>':'')

/* ---------- rule card ---------- */

/* ---------- source-authored manual (Manual tab) ---------- */
function mdInline(s){
  s=s.replace(/`([^`]+)`/g,function(_,c){return "<code>"+c+"</code>";});
  s=s.replace(/\*\*([^*]+)\*\*/g,function(_,c){return "<strong>"+c+"</strong>";});
  return s;
}
function mdRender(md){
  var lines=String(md).replace(/\r\n/g,"\n").split("\n"), out=[], i=0;
  function cells(row){return row.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(function(c){return c.trim();});}
  while(i<lines.length){
    var ln=lines[i];
    if(/^```/.test(ln)){var buf=[];i++;while(i<lines.length&&!/^```/.test(lines[i])){buf.push(lines[i]);i++;}i++;out.push("<pre><code>"+esc(buf.join("\n"))+"</code></pre>");continue;}
    if(ln.indexOf("|")>=0 && i+1<lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1]) && lines[i+1].indexOf("-")>=0){
      var th=cells(ln).map(function(c){return "<th>"+mdInline(esc(c))+"</th>";}).join(""); i+=2; var body=[];
      while(i<lines.length && lines[i].indexOf("|")>=0 && lines[i].trim()!==""){
        body.push("<tr>"+cells(lines[i]).map(function(c){return "<td>"+mdInline(esc(c))+"</td>";}).join("")+"</tr>"); i++;
      }
      out.push('<div class="tablewrap"><table><thead><tr>'+th+"</tr></thead><tbody>"+body.join("")+"</tbody></table></div>"); continue;
    }
    if(/^###\s+/.test(ln)){out.push("<h3>"+mdInline(esc(ln.replace(/^###\s+/,"")))+"</h3>");i++;continue;}
    if(/^##\s+/.test(ln)){out.push("<h2>"+mdInline(esc(ln.replace(/^##\s+/,"")))+"</h2>");i++;continue;}
    if(/^#\s+/.test(ln)){out.push("<h2>"+mdInline(esc(ln.replace(/^#\s+/,"")))+"</h2>");i++;continue;}
    if(/^---\s*$/.test(ln)){out.push("<hr>");i++;continue;}
    if(/^>\s?/.test(ln)){var q=[];while(i<lines.length&&/^>\s?/.test(lines[i])){q.push(lines[i].replace(/^>\s?/,""));i++;}out.push("<blockquote>"+mdInline(esc(q.join(" ")))+"</blockquote>");continue;}
    if(/^[-*]\s+/.test(ln)){var items=[];while(i<lines.length&&/^[-*]\s+/.test(lines[i])){items.push(esc(lines[i].replace(/^[-*]\s+/,"")));i++;}out.push("<ul>"+items.map(function(x){return "<li>"+mdInline(x)+"</li>";}).join("")+"</ul>");continue;}
    if(ln.trim()===""){i++;continue;}
    var para=[];
    while(i<lines.length && lines[i].trim()!=="" && !/^(#{1,3}\s|>|```|[-*]\s|---\s*$)/.test(lines[i]) && lines[i].indexOf("|")<0){para.push(lines[i]);i++;}
    if(para.length) out.push("<p>"+mdInline(esc(para.join(" ")))+"</p>"); else i++;
  }
  return out.join("\n");
}
function colorizeLanes(root){
  var RX=/\b(COMMIT|ASK|REFUSE|BLOCK)\b/, walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null), nodes=[], n;
  while((n=walker.nextNode())){var p=n.parentNode;if(!p)continue;var tag=p.nodeName;
    if(tag==="CODE"||tag==="PRE"||tag==="A"||(p.classList&&p.classList.contains("lane-tok")))continue;
    if(RX.test(n.nodeValue))nodes.push(n);}
  nodes.forEach(function(node){
    var parts=node.nodeValue.split(/\b(COMMIT|ASK|REFUSE|BLOCK)\b/), frag=document.createDocumentFragment();
    parts.forEach(function(part){
      if(part==="COMMIT"||part==="ASK"||part==="REFUSE"||part==="BLOCK"){
        var s=document.createElement("span");s.className="lane-tok "+part;s.textContent=part;frag.appendChild(s);
      } else if(part){frag.appendChild(document.createTextNode(part));}
    });
    node.parentNode.replaceChild(frag,node);
  });
}
function viewManual(){
  if(!M.manual || !M.manual.markdown) return '<p class="empty">No manual authored for this source.</p>';
  return '<div class="crumb"><b>Manual</b><span class="sep">·</span>how a question is asked — the ontology as a CLI</div>'
    +'<div class="doc">'+mdRender(M.manual.markdown)+'</div>'

/* ---------- render / route ---------- */
function render(){
  if(graphAnim){cancelAnimationFrame(graphAnim);graphAnim=null;}
  if(state.tab!=="graph") graphSearchFn=null;   // drop the graph-search closure when off the graph tab
  var main=document.getElementById("main"), html;
  if(state.tab==="graph") html=viewGraph();
  else if(state.tab==="edges") html=viewEdges();
  else if(state.tab==="slots") html=viewSlots();
  else if(state.tab==="decisions") html=viewDecisions();
  else if(state.tab==="data") html=state.relation?viewRelation(state.relation):viewData();
  else if(state.tab==="manual") html=viewManual();
  else if(state.concept) html=viewConcept(state.concept);
  else html=viewMap();
  main.innerHTML=html;
  main.classList.toggle("wide", state.tab==="graph");   // graph uses the full screen width
  main.scrollTop=0; window.scrollTo(0,0);
  renderRail();
  if(state.tab==="graph") initGraph();
  if(state.tab==="manual") colorizeLanes(main);
}
function route(){
  var h=decodeURIComponent(location.hash.replace(/^#/,""));
  state.concept=null; state.relation=null;
  if(h.indexOf("c/")===0){state.tab="map";state.concept=h.slice(2);}
  else if(h.indexOf("r/")===0){state.tab="data";state.relation=h.slice(2);}
  else if(h==="data"){state.tab="data";}
  else if(h==="manual"){state.tab="manual";}
  else if(h==="map"){state.tab="map";}
  else if(h==="slots"||h==="decisions"||h==="graph"||h==="edges"){state.tab=h;}
  else {state.tab="graph";}   // empty / unknown hash → the relationship graph is the home page
  render();
}
window.addEventListener("hashchange",route);

  if(!(M.edges&&M.edges.length)){var te=document.getElementById("tab-edges"); if(te) te.style.display="none";}
  if(!(M.relations&&M.relations.length)){var td=document.getElementById("tab-data"); if(td) td.style.display="none";}
  if(!(M.manual&&M.manual.markdown)){var tm=document.getElementById("tab-manual"); if(tm) tm.style.display="none";}
})();

/* theme toggle — now the UNIVERSAL toggleTheme() (head script), wired via the button's onclick; see ask.html */

/* search */
document.getElementById("search").addEventListener("input",function(e){
  state.q=e.target.value;
  if(state.tab==="graph"){ if(graphSearchFn) graphSearchFn(state.q); renderRail(); }  // graph: grey non-matches + frame the hit, no SVG re-init
  else if(state.tab==="map" && !state.concept) render();     // map grid filters live
  else if(state.tab==="data" && !state.relation) render();   // data grid filters live
  else if(state.tab==="edges") render();                     // edges table filters live
  else renderRail();                                         // detail views: just filter the rail
});

/* graph controls (plane toggle + focus navigation) — delegated on #main, which persists */
document.getElementById("main").addEventListener("click",function(e){
  var t=e.target; if(t&&t.nodeType===3) t=t.parentNode;   // a click can land on a text node — walk up to the element
  if(!t||!t.closest) return;
  var mc=t.closest("[data-mapclass]");   // Concepts tab: legend-glyph facet filter over the tile grid
  if(mc){ e.preventDefault(); var _mc=mc.getAttribute("data-mapclass"); if(mapHideClass[_mc]) delete mapHideClass[_mc]; else mapHideClass[_mc]=true; render(); return; }
  var mcf=t.closest("[data-mapclearfilters]");
  if(mcf){ e.preventDefault(); mapHideClass={}; render(); return; }
  var gm=t.closest(".gmode");
  if(gm){ e.preventDefault(); graphMode=gm.getAttribute("data-mode"); graphFocus=null; focusHist=[]; savePrefs(); render(); return; }
  var nf=t.closest("[data-focus]");
  if(nf){ e.preventDefault(); focusNode(nf.getAttribute("data-focus")); return; }
  var dt=t.closest("[data-gfocus-toggle]");
  if(dt){ e.preventDefault(); graphFocusOn=!graphFocusOn; if(!graphFocusOn){graphFocus=null;focusHist=[];} render(); return; }
  var dd=t.closest("[data-gfocus-depth]");
  if(dd){ e.preventDefault(); focusDepth=+dd.getAttribute("data-gfocus-depth")||1; render(); return; }
  var bk=t.closest("[data-gfocus-back]");
  if(bk){ e.preventDefault(); if(focusHist.length){ graphFocus=focusHist.pop(); render(); } return; }
  var cl=t.closest("[data-gfocus-clear]");
  if(cl){ e.preventDefault(); graphFocus=null; render(); return; }
  var nc=t.closest("[data-nodecat]");
  if(nc){ e.preventDefault(); var _nc=nc.getAttribute("data-nodecat"); if(graphHideCat[_nc]) delete graphHideCat[_nc]; else graphHideCat[_nc]=true; render(); return; }
  var ek=t.closest("[data-edgekind]");
  if(ek){ e.preventDefault(); var _ek=ek.getAttribute("data-edgekind"); if(graphHideKinds[_ek]) delete graphHideKinds[_ek]; else graphHideKinds[_ek]=true; render(); return; }
  var cf=t.closest("[data-clearfilters]");
  if(cf){ e.preventDefault(); graphHideCat={}; graphHideKinds={}; render(); return; }
  var ec=t.closest("[data-ercols]");
  if(ec){ e.preventDefault(); erCompact=!erCompact; savePrefs(); render(); return; }
  var ly=t.closest("[data-layout]");
  if(ly){ e.preventDefault(); graphLayout=ly.getAttribute("data-layout"); if(graphPos[graphMode]) delete graphPos[graphMode]; savePrefs(); render(); return; }
  var fd=t.closest("[data-flowdir]");
  if(fd){ e.preventDefault(); flowDir=(flowDir==="lr")?"tb":"lr"; savePrefs(); render(); return; }
  var es=t.closest("[data-erstraight]");
  if(es){ e.preventDefault(); erStraight=!erStraight; savePrefs(); render(); return; }
});

route();
})();
</script>

# mac_artifacts.yaml — THE ARTIFACT REGISTRY. One entry per artifact KIND, four properties each.
#
# WHY IT EXISTS, and the measurement that argued for it. On 2026-09-28 the estate declared a SHAPE for
# 27 artifact kinds, a NAME rule for ONE, and a producer for NONE. Every defect that day fell exactly
# in the undeclared gap: not one shape was violated, while four naming/producer faults and two
# vocabulary faults were — an invented `d_`/`f_`/`b_` prefix scheme against a CLOSED role table, two
# lineage producers disagreeing about the same column, an ER diagram and a page reading different
# files, and a register filename that discarded its relation and silently overwrote eight value
# domains. The operator: "the same content MUST follow naming convention and formal
# language/vocabulary/grammar".
#
# SHAPE IS REFERENCED, NOT COPIED. mac.schema.json is already the single home for shape and is not
# scattered; restating it here would create the second home this file exists to remove. What WAS
# scattered — a name rule living inside one gate, a producer implied by a stage's `produces`, a
# transient key documented nowhere — is declared here and nowhere else.
#
# `producers` IS A LIST WITH A ROLE EACH, on the operator's ruling: "if they do different thing over
# same artifact - then why not". Three tools legitimately write a source descriptor — one MEASURES it,
# one ADDS the value domains it profiled, one SLIMS those domains into a register. That is one owner
# and two declared collaborators, not a conflict. What is forbidden is an UNDECLARED writer, and two
# writers claiming the same role.
#
# `transient` IS A KEY LEGAL IN FLIGHT AND FORBIDDEN AT DELIVERY. DOMAIN-HOMED generalised.
spec_version: mac.artifacts/1

kinds:

# EVERY ITEM CARRIES ITS DENOMINATOR. `population.of` is the set the artifact must cover and
# `population.from` is where that set is counted — so "8 of 8" means something and "0 of 0" is
# reported EMPTY, never complete. The rule is the estate's, from mac_import's checklist header:
# "a green tick over an unstated population says nothing". The two kinds that had NO denominator
# until 2026-09-29 are `register` and `data_quality_register`, and the second is why a delivery
# reported 6 of 6 and 9 of 9 with its entire data-quality assessment missing.

  landed_descriptor:
    what: what a landed relation CONTAINS, measured from the warehouse catalog
    phase: [sources]
    lifecycle: re-derived
    population:
      of: every landed relation
      from: data/sources/*.yaml    # SELF — the true denominator is the warehouse,
                                   # and only the importer, holding a connection, can
                                   # count it. Offline this asks 'is every descriptor
                                   # complete', never 'is every relation described'.
      empty_is: EMPTY          # 0 of 0 is never a pass
    path: data/sources/{relation}.yaml
    name: the landing's own relation name, verbatim — a landing is not renamed
    shape: mac.schema.json#/$defs/TableFile
    vocabulary: [mac.relation.column.role]
    transient: [values]
    producers:
      - {tool: "tools/mac_descriptors.py", role: "measures", args: "--plane sources"}
      - {tool: "tools/mac_profile.py", role: "adds the measured value domains"}
      - {tool: "tools/mac_lookups.py", role: "cuts those domains into registers and removes them"}

  served_descriptor:
    what: what a served relation LEAVES — the promotion's contract
    phase: [datasets]
    lifecycle: re-derived
    population:
      of: every served relation
      from: data/datasets/*.yaml    # SELF — the true denominator is the warehouse,
                                   # and only the importer, holding a connection, can
                                   # count it. Offline this asks 'is every descriptor
                                   # complete', never 'is every relation described'.
      empty_is: EMPTY          # 0 of 0 is never a pass
    path: data/datasets/{relation}.yaml
    # THE SPELLING IS NOT RESTATED HERE. `check_served_name_distinct` publishes the convention in
    # its own refusal, derived from the bundle — copying it into this file would be a second home
    # that does not move when the gate moves. This line used to name a vocabulary token under a
    # `name` namespace that `mac_vocabulary.yaml` does not declare, and `check_vocabulary_tokens`
    # was failing on it — in the file whose job is to stop exactly that. (Writing the dead token
    # out again HERE, to explain its removal, made the gate fail a second time: a reference in a
    # comment is still a reference, and the gate is right to say so.)
    name: the CLOSED role table — tools/check_served_name_distinct.py owns the spelling
    shape: mac.schema.json#/$defs/TableFile
    vocabulary: [mac.relation.column.role]
    transient: [values]
    producers:
      - {tool: "tools/mac_descriptors.py", role: "measures", args: "--plane datasets"}
      - {tool: "tools/mac_profile.py", role: "adds the measured value domains"}
      - {tool: "tools/mac_lookups.py", role: "cuts those domains into registers and removes them"}

  profile:
    what: the measurement plane — row counts, distincts, nulls, identity evidence
    phase: [sources, datasets]
    lifecycle: re-derived
    population:
      of: every relation of the plane
      from: data/{plane}/*.yaml
      empty_is: EMPTY          # 0 of 0 is never a pass
    path: data/profiles/{relation}.yaml
    name: the relation's stem, verbatim
    shape: mac.schema.json#/$defs/ProfileFile
    producers:
      - {tool: "tools/mac_profile.py", role: "measures"}

  reference_measurement:
    what: the measured references of ONE relation, with evidence and cardinality
    phase: [sources, datasets]
    lifecycle: re-derived
    population:
      of: every relation of the plane
      from: data/{plane}/*.yaml
      empty_is: EMPTY          # 0 of 0 is never a pass
    # ALTERNATION — the notation this file ALREADY uses for relation_preview, not a second
    # `{_optional}` syntax invented here. The conformance gate caught exactly that on its first
    # run: I wrote `data/references{_served}/` meaning "either directory", nothing understood it,
    # and all 16 files read as misnamed in every bundle. A registry that invents notation inside
    # itself is the fault it exists to catch.
    path: data/references/{relation}.yaml | data/references_served/{relation}.yaml
    name: the relation's stem, verbatim
    shape: mac.schema.json#/$defs/ReferenceFile
    producers:
      - {tool: "tools/mac_references.py", role: "measures"}

  register:
    # FOUR WRITERS, MEASURED 2026-09-29 — the registry declared one. Only the first is in the
    # delivery pipeline; `cut_missing_registers` is an out-of-band repair and states the opposite
    # lifecycle in its own docstring ("It never overwrites a file that exists -- a hand-corrected
    # register must survive a re-cut"). That is a genuine conflict with `lifecycle: re-derived`
    # and it is recorded here rather than resolved by whichever tool happens to run last.
    what: a value DOMAIN cut from one column, with a label and a search key
    phase: [sources, datasets]
    lifecycle: re-derived
    population:
      of: the artifact itself — ONE file
      from: «this artifact»
      empty_is: EMPTY
    covers: every column whose value domain was measured   # what the ONE file must account for; its checker owns this
    path: data/lookups/{marker}_{relation}_{column}.lookup.csv
    name: >-
      marker, relation and column — the register IS its (relation, column). The marker is omitted when
      the relation already carries it. A name keyed on the column ALONE made two relations sharing a
      column name overwrite one another: measured 2026-09-28, eight domains lost across four bundles.
    columns: [«code», label, search_key, source_view, source_schema, confidence, note]
    producers:
      - {tool: "tools/mac_lookups.py", role: "cuts from the domains the profile measured"}
      - {tool: "sdk/authoring/materialize.py", role: "profiles a live dim view for a name/code pair"}
      - {tool: "tools/cut_missing_registers.py", role: "fills a domain that has no register"}
      - {tool: "«a person»", role: "authors a per-register build script"}

  relation_preview:
    what: a seeded sample of one relation, for a reviewer to check a declaration against rows
    phase: [sources, datasets]
    lifecycle: re-derived
    population:
      of: every relation of the plane
      from: data/{plane}/*.yaml
      empty_is: EMPTY          # 0 of 0 is never a pass
    path: data/samples/{relation}.sample.csv | data/samples/{relation}.src.sample.csv
    name: >-
      the served preview is `{relation}.sample.csv`; the landed one carries `.src.` — the two planes
      share a directory and a 1:1 passthrough bundle shares the stem, so the plane must be in the name
    producers:
      - {tool: "tools/mac_sample.py", role: "draws"}

  column_lineage:
    what: where every served column came from — a source column, or an expression
    phase: [datasets]
    lifecycle: re-derived
    population:
      of: the artifact itself — ONE file
      from: «this artifact»
      empty_is: EMPTY
    covers: every served relation, and every served COLUMN   # what the ONE file must account for; its checker owns this
    path: data/lineage/lineage.json
    name: fixed
    shape: mac.schema.json#/$defs/LineageFile
    # TWO PRODUCERS WITH DISJOINT OWNERSHIP, declared in sdk/project/lineage_graph.py#OWNERSHIP and
    # enforced by its `merge()`: each replaces only the node kinds and edge kinds it owns, so
    # re-measuring a warehouse cannot delete a bundle's ontology chain. This entry previously named
    # `mac_lineage.py` twice — once for `flows()`, which is an ADAPTER on the producer and not a
    # writer — and omitted the projector entirely.
    producers:
      - {tool: "tools/mac_lineage.py", role: "measures the warehouse: relation edges and column origins"}
      - {tool: "sdk/project/lineage_graph.py", role: "folds in registers, concepts and the orphan register"}

  relation_page:
    what: the page a person opens to read one relation
    phase: [sources, datasets]
    lifecycle: re-derived
    population:
      of: every relation of the plane
      from: data/{plane}/*.yaml
      empty_is: EMPTY          # 0 of 0 is never a pass
    path: data/{plane}/{relation}.md
    name: the descriptor's stem, verbatim
    producers:
      - {tool: "sdk/project/project_data.py", role: "renders"}

  plane_overview:
    what: one page over ALL of a plane's relations — what was landed, how big, what is keyed
    phase: [sources, datasets]
    lifecycle: re-derived
    population:
      of: one page per plane, and each delivery owes its own
      from: «this artifact»
      empty_is: EMPTY          # 0 of 0 is never a pass
    covers: every relation of the plane
    path: data/{plane}/index.md
    name: fixed
    producers:
      - {tool: "sdk/project/project_data.py", role: "renders"}

  transform_sql:
    what: the AUTHORED statement that produces one served relation
    phase: [datasets]
    lifecycle: authored-once
    population:
      of: every served relation
      from: data/datasets/*.yaml
      empty_is: EMPTY          # 0 of 0 is never a pass
    path: data/transforms/{relation}.sql
    name: the served relation it produces
    producers:
      - {tool: "«a person»", role: "authors"}

  transform_descriptor:
    what: what a transform consumes and produces, measured from the catalog
    phase: [datasets]
    lifecycle: re-derived
    population:
      of: every served relation
      from: data/datasets/*.yaml
      empty_is: EMPTY          # 0 of 0 is never a pass
    path: data/transforms/{relation}.yaml
    name: the served relation it produces
    shape: mac.schema.json#/$defs/TransformFile
    producers:
      - {tool: "tools/mac_transforms.py", role: "measures"}

  data_quality_register:
    what: what is WRONG and who must rule on it — raised, never ruled, by a tool
    phase: [sources, datasets]
    lifecycle: re-derived
    population:
      of: the artifact itself — ONE file
      from: «this artifact»
      empty_is: EMPTY
    covers: every relation of BOTH planes   # what the ONE file must account for; its checker owns this
    path: data/quality/data_quality_register.yaml
    name: fixed
    shape: mac.schema.json#/$defs/DataQualityRegisterFile
    producers:
      - {tool: "tools/mac_dq_findings.py", role: "raises and merges"}

  # ══ the classes the registry had never declared — census of 2026-09-29 ═════════════════════

  register_build_script:
    what: a bundle-local script that cuts ONE register from the warehouse — the register family's second door
    phase: [sources, datasets]
    lifecycle: authored-once
    population:
      of: no population — a bundle writes one only where the generic cut cannot reach
      from: «none»
      empty_is: OK             # the only kind for which absence is the normal state
    path: data/lookups/{stem}.py
    origin: authored
    name: the register it builds, with the marker the bundle uses
    producers:
      - {tool: "«a person»", role: "authors"}
    consumers:
      # NOTHING READS ITS CONTENT FOR MEANING, and that is the honest declaration. The two gates
      # below read it as raw text hunting for escapes and secrets; the producer-census matches its
      # FILENAME inside a reproduction command, never the file. Its real consumer is a person.
      - {tool: "tools/check_artifact_has_producer.py", role: "accepts its name as proof the family has a producer", reads: ["«path only»"]}
      - {tool: "tools/check_bundle_isolation.py", role: "scans for a path escaping the bundle", reads: ["«raw text»"]}
      - {tool: "sdk/gate/check_bundle_secrets.py", role: "scans for a secret or infra handle", reads: ["«raw text»"]}
    checkers:
      - {tool: "tools/check_bundle_isolation.py", rejects: [ESCAPES, NAMES_ANOTHER_BUNDLE, BREACH]}
      - {tool: "sdk/gate/check_bundle_secrets.py", rejects: [secret, infra-handle]}

  dq_dashboard:
    what: the DQ register joined to the resolution map — the only structured artifact the console's quality page reads
    phase: [sources, datasets]
    lifecycle: re-derived
    population:
      of: the artifact itself — ONE file
      from: «this artifact»
      empty_is: EMPTY
    covers: every finding in the data-quality register   # what the ONE file must account for; its checker owns this
    path: data/quality/dq_dashboard.json
    origin: derived
    name: fixed
    producers:
      - {tool: "sdk/project/project_data.py", role: "projects register x resolution map"}
    consumers:
      - {tool: "sdk/project/objects.py", role: "groups finding ids per raw table for the Quality tab", reads: ["findings[].table", "findings[].id"]}
      - {tool: "tools/project_objects.py", role: "declares it a seam input and reports absence rather than swallowing it", reads: ["«path only»"]}
      - {tool: "mac-console/ui/src/views/ObjectsView.jsx", role: "renders the DQ overview", reads: ["stats.total", "stats.resolved", "stats.partial", "stats.gap", "stats.unreconciled", "stats.by_severity", "stats.by_status", "findings[].id", "findings[].title", "findings[].severity", "findings[].status", "findings[].table", "findings[].impurity_class", "findings[].coverage", "findings[].resolving_transforms", "findings[].guarantee", "findings[].evidence"]}
      - {tool: "mac-console/ui/src/views/DataQualityBoard.jsx", role: "the register-closure and worklist tabs", reads: ["findings", "stats.by_status", "findings[].status", "findings[].resolving_transforms", "findings[].guarantee"]}
      - {tool: "mac-console/ui/src/views/ConceptCatalogPane.jsx", role: "shows the defects a concept's transforms treat", reads: ["findings[].resolving_transforms", "findings[].id", "findings[].impurity_class"]}
    checkers:
      - {tool: "tools/check_projection_field_parity.py", rejects: [dropped, stale, phantom]}

  impurity_resolution_map:
    what: the cross-link from a registered defect to the transform that dissolves it, with the guarantee that transform establishes
    phase: [datasets]
    lifecycle: authored-once
    population:
      of: the artifact itself — ONE file
      from: «this artifact»
      empty_is: EMPTY
    covers: every finding a transform claims to treat   # what the ONE file must account for; its checker owns this
    path: data/quality/impurity_resolution_map.yaml
    origin: authored
    name: fixed
    shape: mac.schema.json#/$defs/ImpurityResolutionMapFile
    producers:
      - {tool: "«a person»", role: "authors"}
    consumers:
      - {tool: "sdk/project/project_data.py", role: "joins each issue to its resolution across dashboard", reads: ["resolutions[].finding_id", "resolutions[].coverage", "resolutions[].impurity_class", "resolutions[].resolving_transforms", "resolutions[].guarantee", "resolutions[].evidence"]}
      - {tool: "sdk/project/objects.py", role: "builds the TREATS panel on every dataset page", reads: ["resolutions[].finding_id", "resolutions[].coverage", "resolutions[].guarantee", "resolutions[].resolving_transforms"]}
      - {tool: "sdk/project/references.py", role: "renders filter traps and known issues", reads: ["resolutions[].finding_id"]}
      - {tool: "mac-console/console_api.py", role: "GET /quality/{d}/{ds}/register — linked / not-linked counts with denominators", reads: ["metadata.generated", "resolutions[].finding_id", "resolutions[].resolving_transforms", "resolutions[].coverage"]}
    checkers:
      - {tool: "tools/check_dq_resolution_sync.py", rejects: [duplicate-id, status-missing, status-unknown, ruling-missing, accepted-dq-id-dangling, resolution-dangling, resolution-transform-missing, coverage-invalid, resolves-unregistered, resolves-unlinked, impurity-unregistered]}

  sme_thread_log:
    what: the trilateral SME conversation per question — comments, disposition and the action taken, both planes in one file
    phase: [sources, datasets]
    lifecycle: authored-once
    population:
      of: the artifact itself — ONE file
      from: «this artifact»
      empty_is: EMPTY
    covers: every SME question the register raises   # what the ONE file must account for; its checker owns this
    path: data/quality/sme_threads.json
    origin: authored
    name: fixed
    producers:
      - {tool: "mac-console/console_api.py", role: "appends comments and rulings"}
    consumers:
      - {tool: "mac-console/console_api.py", role: "serves one plane's threads", reads: ["data", "ontology", "{qid}.comments", "{qid}.status", "{qid}.action"]}
      - {tool: "mac-console/ui/src/views/DataQualityBoard.jsx", role: "fetches threads and folds a new comment in", reads: ["threads", "{qid}.comments", "{qid}.status"]}
      - {tool: "mac-console/ui/src/components/sme/SMEThread.jsx", role: "renders each question as a thread", reads: ["{qid}.status", "{qid}.comments", "{qid}.action", "comments[].author", "comments[].role", "comments[].text", "comments[].timestamp"]}
    # NO CHECKER, NO SCHEMA, NO ROUTE IN validate_schema — and it is a store the operator's
    # 2026-09-22 ruling created, competing with governance/sme-questions.yaml whose own design is
    # mutant-tested. Reconciling two operator rulings is out of scope here (O3, RULED separate).
    checkers: []

  reference_run_record:
    what: the reference measurement's provenance — the global denominators, the admission rule, and every pruned pair with its reason
    phase: [sources, datasets]
    lifecycle: re-derived
    population:
      of: the artifact itself — ONE file
      from: «this artifact»
      empty_is: EMPTY
    covers: one record per plane that was measured   # what the ONE file must account for; its checker owns this
    path: data/references/references.run.json | data/references_served/references.run.json
    origin: derived
    name: fixed per plane
    producers:
      - {tool: "tools/mac_references.py", role: "records the run"}
    consumers:
      # ONE READER, ONE FIELD. Measured 2026-09-29: nothing in the framework opens these at all;
      # the console reads `measured_at` as a clock. The denominators, the verdicts, the admission
      # rule and 857 pruned pairs — the facts the producer's own docstring says live here BECAUSE
      # they are global and bulky — are read by nothing.
      - {tool: "mac-console/ingest_progress.py", role: "the references step's clock", reads: ["measured_at"]}
    checkers: []

  preview_run_record:
    what: the previews' provenance — which engine cut them, at what limit and order, and which relations were refused
    phase: [sources, datasets]
    lifecycle: re-derived
    population:
      of: the artifact itself — ONE file
      from: «this artifact»
      empty_is: EMPTY
    covers: one record per plane that was previewed   # what the ONE file must account for; its checker owns this
    path: data/samples/samples.run.json
    origin: derived
    name: fixed
    producers:
      - {tool: "tools/mac_sample.py", role: "records the relation draw"}
    consumers:
      # TWO FIELDS OF MANY. `engine`, `limit`, `order`, `refused[]` and every `sha256` are read by
      # nothing, though the producer argues at length that `engine` and `limit` are why it exists.
      - {tool: "tools/check_sample_matches_descriptor.py", role: "attests each preview's provenance", reads: ["samples[].stem", "samples[].derived_from"]}
    checkers:
      - {tool: "tools/check_sample_matches_descriptor.py", rejects: [UNRECORDED, PROPOSAL_PREVIEW]}

  object_index:
    what: the object-centric read model the console navigates by — one object per relation, concept and register with its view tabs
    phase: [sources, datasets]
    lifecycle: re-derived
    population:
      of: the artifact itself — ONE file
      from: «this artifact»
      empty_is: EMPTY
    covers: every addressable object of every plane   # what the ONE file must account for; its checker owns this
    path: objects.json
    origin: derived
    name: fixed
    producers:
      - {tool: "sdk/project/objects.py", role: "builds and writes the index"}
    consumers:
      - {tool: "tools/check_edge_joins_its_grounding.py", role: "proves an edge's join_rule touches its grounding", reads: ["objects[].kind", "objects[].name", "objects[].grounds[].id"]}
      - {tool: "tools/mac_import.py", role: "probes whether the ER projection produced entities", reads: ["er_model.entities", "er_model_served.entities"]}
      - {tool: "sdk/cli/publish.py", role: "packs it into the published container", reads: ["«path only»"]}
      - {tool: "mac-console/console_api.py", role: "the /objects seam's fallback when a live derivation is unavailable", reads: ["objects", "counts"]}
      - {tool: "mac-console/ui/src/views/ObjectsView.jsx", role: "drives every nav group", reads: ["objects[].id", "objects[].kind", "objects[].plane", "objects[].title", "objects[].relation", "objects[].views", "objects[].paths", "objects[].grounds", "objects[].quality", "objects[].lineage"]}
      - {tool: "mac-console/ui/src/views/ConceptCatalogPane.jsx", role: "assembles the concept catalogue", reads: ["objects[].kind", "objects[].id", "objects[].name", "objects[].grounds"]}
    checkers:
      - {tool: "tools/check_seam_contract.py", rejects: [an input whose corruption does not change the payload, an undeclared read]}

  bundle_index_page:
    what: the bundle's front page — the data-plane map and the resolution scoreboard
    phase: [sources, datasets]
    lifecycle: re-derived
    population:
      of: the artifact itself — ONE file
      from: «this artifact»
      empty_is: EMPTY
    covers: the bundle   # what the ONE file must account for; its checker owns this
    path: index.md
    origin: derived
    name: fixed
    producers:
      - {tool: "sdk/project/project_data.py", role: "renders"}
    consumers:
      - {tool: "mac-console/console_api.py", role: "lists and serves it with a projected_at stamp", reads: ["«whole file»", "«file mtime»"]}
      - {tool: "mac-console/ui/src/views/ObjectsView.jsx", role: "renders the markdown with an as-of", reads: ["«whole file»", "frontmatter.type", "frontmatter.title"]}
      - {tool: "mac-console/ingest_progress.py", role: "with objects.json", reads: ["«path only»"]}
    # NO CONTENT CHECKER. `check_pages_current` re-renders and byte-compares only
    # sources/datasets/transforms; the root index is outside its population, so nothing in the
    # estate can tell a stale one from a current one.
    checkers: []

  compile_verdict:
    what: the persisted whole-bundle compile record — the verdict, every code in the closed taxonomy whether it fired or not, and every witness
    phase: [sources, datasets]
    lifecycle: re-derived
    population:
      of: the artifact itself — ONE file
      from: «this artifact»
      empty_is: EMPTY
    covers: every code in the closed diagnostic taxonomy   # what the ONE file must account for; its checker owns this
    path: compile.json
    origin: derived
    name: fixed
    producers:
      - {tool: "tools/mac_compile.py", role: "compiles and writes"}
      - {tool: "sdk/cli/harvest.py", role: "runs it as the projection gate and stamps the override"}
    consumers:
      - {tool: "sdk/project/objects.py", role: "emits the compile object even when the verdict is DOES_NOT_COMPILE", reads: ["«path only»"]}
      - {tool: "sdk/project/ontology_quality.py", role: "reads the answerability verdict rather than recomputing it", reads: ["diagnostics[].source", "diagnostics[].witnesses[].detail", "diagnostics[].note"]}
      - {tool: "sdk/container/save.py", role: "carries the admission into the sealed version", reads: ["gate.override"]}
      - {tool: "mac-console/ui/src/views/ObjectsView.jsx", role: "renders the compiler report", reads: ["verdict", "summary.errors", "summary.by_severity", "codes", "checks", "gate", "diagnostics[].code", "diagnostics[].severity", "diagnostics[].summary", "diagnostics[].witnesses[].file", "diagnostics[].witnesses[].line", "diagnostics[].witnesses[].detail"]}
    checkers:
      - {tool: "tools/check_mac_public.py", rejects: [a local path leaking into a committed record]}

  resource_description:
    what: the bundle's own resource description — what components exist, how the planes lie, what is derived, and the grammar and tree hash it was judged under
    phase: [sources, datasets]
    lifecycle: re-derived
    population:
      of: the artifact itself — ONE file
      from: «this artifact»
      empty_is: EMPTY
    covers: every artifact family the bundle holds   # what the ONE file must account for; its checker owns this
    path: "{stem}.mac"
    origin: derived
    name: the bundle's own label
    producers:
      - {tool: "tools/mac_resources.py", role: "derives and stamps"}
    consumers:
      - {tool: "tools/mac_resources.py", role: "--check re-derives and refuses on any difference", reads: ["identity.tree_hash", "identity.grammar_id", "counts"]}
      - {tool: "sdk/container/loader.py", role: "resolves the container from a picked description", reads: ["«path only»"]}
      - {tool: "tools/check_vocabulary_tokens.py", role: "holds every mac.* token in it to the vocabulary", reads: ["«raw text", "every mac.* token»"]}
      - {tool: "mac-console/console_api.py", role: "marks a directory openable and resolves the container by identity", reads: ["identity.tree_hash", "identity.container", "metadata.project", "metadata.data_domain", "metadata.dataset"]}
    checkers:
      - {tool: "tools/mac_resources.py", rejects: [no description, two descriptions, tree_hash drift, grammar_id drift, counts drift]}
      - {tool: "tools/check_vocabulary_tokens.py", rejects: [namespace-not-declared, closed-vocabulary-violated, namespace-not-snake_case]}

  decision_record:
    what: an ADR — the authored rationale the descriptors are only the consequence of, and what a governance sign-off must cite
    phase: [sources, datasets, ontology, tuning]
    lifecycle: authored-once
    population:
      of: no population — a decision exists when one was taken
      from: «none»
      empty_is: OK
    path: decisions/{stem}.md
    origin: authored
    name: the decision's own slug, with its status and date
    producers:
      - {tool: "«a person»", role: "authors"}
    consumers:
      - {tool: "sdk/project/objects.py", role: "indexes each record so the reasoning is navigable", reads: ["«first H1 as the title»", "«filename»"]}
      - {tool: "tools/check_data_plane_approved.py", role: "the sign-off must cite a record that EXISTS", reads: ["«path only»"]}
      - {tool: "mac-console/ui/src/views/ObjectsView.jsx", role: "renders the record in the doc pane", reads: ["«whole file»"]}
    checkers:
      - {tool: "tools/check_data_plane_approved.py", rejects: [approval_unratified]}
